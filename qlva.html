];

// Xuất Excel báo cáo tháng nhiều sheet, dựng thẳng từ đúng object `baoCao` đã hiển thị trên màn
// hình (cùng 1 lần tính tinhBaoCaoKy, không tính lại) — đảm bảo số dòng từng sheet danh sách
// luôn khớp đúng số trên sheet "Tổng hợp báo cáo" và trên báo cáo đang xem. Mọi sheet đều bật
// wrap text + đóng băng dòng tiêu đề mặc định cho dễ nhìn.
// dsKyGop: chỉ truyền khi xuất báo cáo TỔNG HỢP NHIỀU KỲ (TongHopNhieuKyModal) — mảng các kỳ
// {id, tenKy} thật đã gộp vào báo cáo này, để biết "bị can khởi tố mới TRONG (các) kỳ này" đúng
// cho khối C7-C24. Không truyền (mặc định) = báo cáo 1 kỳ, tự dùng đúng [ky].
async function xuatBaoCaoThangExcel(ky, baoCao, kyTruoc = null, dsKyGop = null) {
  const wb = new ExcelJS.Workbook();
  const dsKyTrongBaoCao = dsKyGop || [ky];
  const kyIdSetTrongBaoCao = new Set(dsKyTrongBaoCao.map(k => k.id));
  const dsKyTenTrongBaoCao = dsKyTrongBaoCao.map(k => k.tenKy);

  // ---- Fetch bị can + danh mục tội danh + kỳ báo cáo + kỳ khởi tố riêng từng bị can song song ----
  const _vuIdsChoBaoCao = collectVuIdsFromBaoCao(baoCao);
  const [biCanByVu, danhMucSnap, kySnap, bcKyKhoiToMap] = await Promise.all([
    fetchBiCanTheoVuIds(_vuIdsChoBaoCao),
    db.collection("danhMucToiDanh").orderBy("thuTuHienThi", "asc").get(),
    db.collection("kybaocao").get(),
    fetchKyKhoiToBiCan(_vuIdsChoBaoCao),
  ]);
  const danhMuc = danhMucSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  const kyById = new Map(kySnap.docs.map(d => [d.id, d.data().tenKy || d.id]));
  const tenKyBaoCao = v => kyById.get(v._log?.kyThongKe) || v._log?.kyThongKe || "(chưa gán)";
  const tenKyBcRieng = bc => kyById.get(bcKyKhoiToMap.get(bc.id)) || bcKyKhoiToMap.get(bc.id) || "(chưa gán)";

  // ---- Gom danh sách vụ theo loại để dùng cho nhiều sheet sau ----
  const vuMoiMap = new Map();   // vụ "vào" trong kỳ (khởi tố mới / chuyển đến / trả về)
  const vuTonMap = new Map();   // vụ đang tồn hiện tại
  const vuGQMap  = new Map();   // vụ "ra" trong kỳ (giải quyết / chuyển đi / trả đi)
  for (const gd of THU_TU_GIAI_DOAN) {
    const d = baoCao[gd].ds;
    [...(d.khoiToTrucTiep||[]),...(d.tachVu||[]),...(d.chuyenDen||[]),...(d.traVe||[])]
      .forEach(v => { if (!vuMoiMap.has(v.id)) vuMoiMap.set(v.id, {...v, _gdMoi: gd}); });
    (d.tonHienTai||[]).forEach(v => { if (!vuTonMap.has(v.id)) vuTonMap.set(v.id, {...v, _gd: gd}); });
    [...(d.chuyenDi||[]),...(d.traDi||[]),...(d.nhapVu||[]),
     ...HOAN_THANH_TRUONG_TONG.flatMap(ht => d.hoanThanh[ht]||[])]
      .forEach(v => { if (!vuGQMap.has(v.id)) vuGQMap.set(v.id, {...v, _gd: gd}); });
  }

  // ---- Helpers flat: 1 dòng/bị can — thông tin vụ lặp lại cùng dòng với bị can ----
  // Vụ 0 BC → 1 dòng trống cột BC; vụ N BC → N dòng
  // Layout cột cố định (để B10 COUNTIFS dùng chữ cột nhất quán qua mọi DS sheet):
  //   A(1): Đếm vụ | B(2): Mã ĐL vụ | C-K(3-11): VU_H (9 cột) | L-AF(12-32): BC_H (21 cột)
  //   AG(33+): Extra headers (Kỳ TK, Nguồn, Ngày SK...) — vị trí thay đổi theo từng sheet
  // Các cột BC dùng cho COUNTIFS: V=Mã ĐL BC, W=Loại KTBC, X=Pháp nhân, Y=Nhóm tuổi, Z=Trình độ,
  //   AA=Giới tính nữ, AB=Dân tộc KK, T=Đảng viên(x), AC=Giữ chức vụ, AD=Quốc tịch NN, AE=Tái phạm,
  //   AF=Kỳ TK của RIÊNG bị can này (khác cột "Kỳ TK" cấp vụ ở extraHeaders — 1 vụ có thể có bị
  //   can bổ sung thêm ở kỳ khác hẳn kỳ khởi tố vụ, xem fetchKyKhoiToBiCan/tinhBieu10 C7)
  const VU_H = ["Mã vụ","Tên vụ","KSV chính","ĐTV/CBĐT","Điều luật","Hạn ĐT vụ",
                "Số QĐ KTVA","Ngày QĐ KTVA","Mức độ NT"];
  const VU_W = [16,30,18,18,26,13, 14,13,14];
  const BC_H = ["STT BC","Họ tên BC","Năm sinh","Dân tộc","Địa chỉ","Tội danh","Biện pháp","Hạn TG","Đảng viên",
                "Ngày KTBC","Mã ĐL BC","Loại KTBC","Pháp nhân","Nhóm tuổi","Trình độ",
                "Giới tính nữ","Dân tộc KK","Giữ chức vụ","Quốc tịch NN","Tái phạm","Kỳ TK BC"];
  const BC_W = [7,20,9,10,22,28,10,13,9,  13,24,10,10,10,14,  12,12,12,14,10, 16];
  const BC_EMPTY = ["","(Chưa có BC)","","","","","","","",  "","","","","","",  "","","","","", ""];
  const NHAN_MUC_DO_NT = {
    it_nghiem_trong:"Ít nghiêm trọng", nghiem_trong:"Nghiêm trọng",
    rat_nghiem_trong:"Rất nghiêm trọng", dac_biet_nghiem_trong:"Đặc biệt nghiêm trọng",
  };
  function vuBaseRow(vu) {
    return [
      hienThiMa(vu), vu.tenVu, vu.ksvChinh||"", vu.dtvCbdt||"", vu.dieuLuat||"",
      fmtDate(vu.hanDieuTra),
      vu.soQdKtva||"", fmtDate(vu.ngayQdKtva),
      NHAN_MUC_DO_NT[vu.mucDoNghiemTrong] || "",
    ];
  }
  function bcCellsRow(bc, stt, vu) {
    const namKTVA = vu?.ngayQdKtva
      ? new Date(vu.ngayQdKtva.seconds ? vu.ngayQdKtva.seconds*1000 : vu.ngayQdKtva).getFullYear()
      : new Date().getFullYear();
    const laPH = bc.loaiBiCan === "phap_nhan";
    const nhomTuoi = laPH ? "" : (tinhNhomTuoi(bc.namSinh, namKTVA) || "");
    return [
      stt, bc.hoTen, bc.namSinh||"", bc.danToc||"", bc.diaChi||"",
      (bc.toiDanh||[]).filter(Boolean).join("; ")||"",
      bc.bienPhapNganChan==="giam"?"Tạm giam":"Tại ngoại",
      fmtDate(bc.hanTamGiam), bc.dangVien==="co"?"x":"",
      fmtDate(bc.ngayKhoiTo),                                             // U: Ngày KTBC
      _tkGetDL(bc),                                                        // V: Mã ĐL BC (criteria cho COUNTIFS B10)
      bc.loaiKhoiTo || "",                                                 // W: Loại KTBC (ban_dau/bo_sung)
      laPH ? "phap_nhan" : "",                                             // X: Pháp nhân
      nhomTuoi,                                                            // Y: Nhóm tuổi
      laPH ? "" : (bc.trinhDo || ""),                                     // Z: Trình độ
      laPH ? "" : (bc.gioiTinh === "nu" ? "nữ" : ""),                    // AA: Giới tính nữ
      laPH ? "" : (bc.danToc && bc.danToc !== "Kinh" ? "có" : ""),       // AB: Dân tộc KK
      laPH ? "" : (bc.dangVienGiuChucVu ? "có" : ""),                    // AC: Giữ chức vụ
      laPH ? "" : (bc.quocTich && bc.quocTich !== "Việt Nam" ? "có" : ""), // AD: Quốc tịch NN
      laPH ? "" : (bc.taiPham && bc.taiPham !== "khong" ? "có" : ""),    // AE: Tái phạm
      tenKyBcRieng(bc),                                                    // AF: Kỳ TK riêng của BC này
    ];
  }
  function buildFlatVuBc(vuArr, extraFn = () => []) {
    const rows = [];
    for (const vu of vuArr) {
      const base = [...vuBaseRow(vu), ...extraFn(vu)];
      const bcArr = biCanByVu[vu.id] || [];
      if (bcArr.length === 0) { rows.push([...base, ...BC_EMPTY]); }
      else { bcArr.forEach((bc, i) => rows.push([...base, ...bcCellsRow(bc, i+1, vu)])); }
    }
    return rows;
  }

  // ---- Thống kê tội danh trong kỳ (pivot: tội chính → vụ/BC mới/tồn/GQ) ----
  // Chuẩn hoá điều luật y hệt tinhBieu10 để TK tội danh và B10 nhóm giống nhau
  const _tkDMByTen = new Map(danhMuc.map(d => [d.tenToiDanh.toLowerCase(), d.dieuLuat]));
  const _tkNormDL = (dl) => (dl || "").replace(/\bBLHS\s+2015\b/g, "BLHS 2025");
  const _tkGetDL = (bc) => _tkNormDL(
    bc.dieuLuatBC?.[0] ||
    _tkDMByTen.get((bc.toiDanh?.[0] || "").toLowerCase()) ||
    bc.toiDanh?.[0] ||
    ""
  ) || "(Chưa xác định)";
  const _tkGetDLVu = (vu) => {
    const parts = (vu.dieuLuat || "").split(";").map(s => s.trim()).filter(Boolean);
    return parts.length > 0 ? (_tkNormDL(_tkDMByTen.get(parts[0].toLowerCase()) || parts[0])) : "(Chưa xác định)";
  };

  function tkTD_add(stats, vuMap, cat, gdField) {
    for (const [, vu] of vuMap) {
      const bcList_vu = biCanByVu[vu.id] || [];
      if (bcList_vu.length === 0) {
        const td = _tkGetDLVu(vu);
        if (!stats[td]) stats[td] = {vuM:0,bcM:0,tgM:0, vuT:0,bcT:0,tgT:0, vuG:0,bcG:0};
        stats[td][`vu${cat}`]++; stats[td][`bc${cat}`]++;
      } else {
        // Tội danh chính của vụ: BC ban_dau (hoặc BC đầu tiên) — đồng nhất với vuPrimaryDL trong B10
        const bcChinh_tk = bcList_vu.find(bc => bc.loaiKhoiTo === "ban_dau") || bcList_vu[0];
        const tdVu = _tkGetDL(bcChinh_tk);
        if (!stats[tdVu]) stats[tdVu] = {vuM:0,bcM:0,tgM:0, vuT:0,bcT:0,tgT:0, vuG:0,bcG:0};
        stats[tdVu][`vu${cat}`]++;
        for (const bc of bcList_vu) {
          const tdBc = _tkGetDL(bc);
          if (!stats[tdBc]) stats[tdBc] = {vuM:0,bcM:0,tgM:0, vuT:0,bcT:0,tgT:0, vuG:0,bcG:0};
          stats[tdBc][`bc${cat}`]++;
          if (cat==="M" && bc.bienPhapNganChan==="giam") stats[tdBc].tgM++;
          if (cat==="T" && bc.bienPhapNganChan==="giam") stats[tdBc].tgT++;
        }
      }
    }
  }
  const tdStats = {};
  tkTD_add(tdStats, vuMoiMap, "M", "_gdMoi");
  tkTD_add(tdStats, vuTonMap,  "T", "_gd");
  tkTD_add(tdStats, vuGQMap,   "G", "_gd");
  const tkTDRows = Object.entries(tdStats)
    .sort((a,b) => (b[1].bcM+b[1].bcT) - (a[1].bcM+a[1].bcT))
    .map(([td,s]) => [td, s.vuM, s.bcM, s.tgM, s.bcM-s.tgM, s.vuT, s.bcT, s.tgT, s.bcT-s.tgT, s.vuG, s.bcG]);

  // ---- Sheet 1: Biểu B10 (72 cột + phụ, động theo điều luật thực tế trong kỳ) ----
  const { rows: b10Rows, canhBao: b10CanhBao, vuChuaDL: b10VuChuaDL } = tinhBieu10(ky, kyTruoc, baoCao, biCanByVu, danhMuc, bcKyKhoiToMap, kyIdSetTrongBaoCao);
  // Dòng Tổng
  const b10Tong = Array(B10_HEADER_CHI_TIET.length - 2).fill(0);
  for (const row of b10Rows) { row.vals.forEach((v, i) => { b10Tong[i] = (b10Tong[i] || 0) + v; }); }

  const wsB10 = wb.addWorksheet("Biểu B10");
  wsB10.views = [{ state: "frozen", xSplit: 3, ySplit: 2 }];
  // Cột A (mới): Mã ĐL — khóa tra cứu cho SUMIF ở các cột "Vụ", cùng chuẩn với cột "Mã ĐL vụ" của sheets danh sách
  // Cột B: Số điều (hiển thị), Cột C: Tên tội danh, Cột D+: giá trị B10 (vals[0..87])
  wsB10.addRow(["Mã ĐL", ...B10_HEADER_NHOM]).font = { bold: true };
  wsB10.addRow(["",       ...B10_HEADER_CHI_TIET]).font = { bold: true };
  // Helper: "Điều 173 BLHS 2025" → "173"
  const extractSoDieu = (d) => { const m = (d||"").match(/Điều\s+(\d+[a-zA-Z]*)/i); return m ? m[1] : (d||""); };
  // Helper: chỉ số cột 0-based → chữ cái Excel (A=0, Z=25, AA=26, ...)
  const b10Col = (i) => {
    let s = ""; let n = i + 1;
    while (n > 0) { n--; s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26); }
    return s;
  };
  // B10_FORMULA: mọi cột có công thức, nhận r (số dòng Excel) → trả về chuỗi công thức
  // Helpers: mkSfVu = SUMIF VỤ (cột A×B); mkCfBc = COUNTIFS BC (cột V + extra); mkCfBcM = multi-sheet
  function mkSfVu(sn, r) { return `SUMIF('${sn}'!$B:$B,$A${r},'${sn}'!$A:$A)`; }
  function mkCfBc(sn, r, ...extra) {
    let f = `COUNTIFS('${sn}'!$V:$V,$A${r}`;
    for (let i = 0; i < extra.length; i += 2) f += `,'${sn}'!$${extra[i]}:$${extra[i]},"${extra[i+1]}"`;
    return f + `)`;
  }
  function mkCfBcM(sheets, r, ...extra) { return sheets.map(sn => mkCfBc(sn, r, ...extra)).join("+") || "0"; }
  // mkCfBcKy: giống mkCfBcM nhưng OR thêm theo cột AF (Kỳ TK riêng của BC) khớp BẤT KỲ kỳ nào
  // trong dsKyTen (thường chỉ 1 kỳ; báo cáo tổng hợp nhiều kỳ thì nhiều) — dùng cho khối C7-C24
  // ĐT khởi tố BC, xem lý do bỏ tiêu chí loaiKhoiTo ở tinhBieu10.
  function mkCfBcKy(sheets, r, dsKyTen, ...extra) {
    const parts = [];
    for (const sn of sheets) for (const kt of dsKyTen) parts.push(mkCfBc(sn, r, "AF", kt, ...extra));
    return parts.join("+") || "0";
  }
  // Nhóm DS sheets theo vai trò — dùng cho B10 và TK tội danh
  const DT_VAO = ["DS khởi tố ĐT","DS phục hồi ĐT","DS vụ tách ĐT","DS trả về ĐT"];
  const TT_VAO = ["DS khởi tố TT","DS phục hồi TT","DS vụ tách TT","DS chuyển đến TT","DS trả về TT"];
  const XX_VAO = ["DS khởi tố XX","DS phục hồi XX","DS vụ tách XX","DS chuyển đến XX"];
  const DT_KTO = ["DS khởi tố ĐT","DS phục hồi ĐT"];   // khoiToTrucTiep ĐT (cho C7-C24)
  const ALL_VAO = [...DT_VAO, ...TT_VAO, ...XX_VAO];
  const ALL_TON = ["DS tồn ĐT","DS tồn TT","DS tồn XX"];
  const ALL_RA = [
    "DS ĐT chuyển TT","DS đã xét xử ĐT","DS chuyển đi ĐT","DS tạm đình chỉ ĐT","DS đình chỉ ĐT","DS án huỷ ĐT","DS nhập vụ ĐT",
    "DS TT chuyển XX","DS TT trả ĐT","DS đã xét xử TT","DS chuyển đi TT","DS tạm đình chỉ TT","DS đình chỉ TT","DS án huỷ TT","DS nhập vụ TT",
    "DS XX trả TT","DS đã xét xử XX","DS chuyển đi XX","DS tạm đình chỉ XX","DS đình chỉ XX","DS án huỷ XX","DS nhập vụ XX",
  ];
  const B10_FORMULA = {
    // ── VỤ-level SUMIF (SUMIF cột A × cột B Mã ĐL vụ) ──
    7:  r => `${mkSfVu("DS khởi tố ĐT",r)}+${mkSfVu("DS phục hồi ĐT",r)}`,  // C6 ĐT khởi tố vụ
    26: r => mkSfVu("DS chuyển đến TT",r),   // C25 ĐT → TT vụ
    29: r => mkSfVu("DS đình chỉ ĐT",r),     // C28 ĐT đình chỉ vụ
    32: r => mkSfVu("DS tạm đình chỉ ĐT",r), // C31 ĐT TĐC vụ
    41: r => mkSfVu("DS chuyển đến XX",r),   // C36 TT truy tố vụ
    58: r => mkSfVu("DS đình chỉ TT",r),     // C53 TT đình chỉ vụ
    61: r => mkSfVu("DS tạm đình chỉ TT",r), // C56 TT TĐC vụ
    63: r => mkSfVu("DS trả về ĐT",r),       // C58 TT trả ĐT vụ
    72: r => mkSfVu("DS đã xét xử XX",r),    // C63 XX xét xử vụ
    75: r => mkSfVu("DS đình chỉ XX",r),     // C66 XX đình chỉ vụ
    78: r => mkSfVu("DS tạm đình chỉ XX",r), // C69 XX TĐC vụ
    80: r => mkSfVu("DS trả về TT",r),       // C71 XX trả TT vụ
    82: r => mkSfVu("DS án huỷ ĐT",r),
    84: r => mkSfVu("DS án huỷ TT",r),
    86: r => mkSfVu("DS án huỷ XX",r),
    // ── Mức độ NT VỤ SUMIFS (cột K) × cột B Mã ĐL vụ — chỉ DS TT chuyển XX ──
    44: r => `SUMIFS('DS TT chuyển XX'!$A:$A,'DS TT chuyển XX'!$B:$B,$A${r},'DS TT chuyển XX'!$K:$K,"Ít nghiêm trọng")`,
    45: r => `SUMIFS('DS TT chuyển XX'!$A:$A,'DS TT chuyển XX'!$B:$B,$A${r},'DS TT chuyển XX'!$K:$K,"Nghiêm trọng")`,
    46: r => `SUMIFS('DS TT chuyển XX'!$A:$A,'DS TT chuyển XX'!$B:$B,$A${r},'DS TT chuyển XX'!$K:$K,"Rất nghiêm trọng")`,
    47: r => `SUMIFS('DS TT chuyển XX'!$A:$A,'DS TT chuyển XX'!$B:$B,$A${r},'DS TT chuyển XX'!$K:$K,"Đặc biệt nghiêm trọng")`,
    // ── BC-level COUNTIFS (cột V=Mã ĐL BC + criteria phụ) ──
    // Cột criteria BC: W=Loại KTBC, X=Pháp nhân, Y=Nhóm tuổi, Z=Trình độ,
    //   AA=Giới tính nữ, AB=Dân tộc KK, T=Đảng viên(x), AC=Giữ chức vụ, AD=Quốc tịch NN, AE=Tái phạm,
    //   AF=Kỳ TK riêng BC (dùng cho C7-C24 — xem mkCfBcKy, KHÔNG dùng W/loaiKhoiTo nữa)
    // ĐT
    6:  r => mkCfBcM(DT_VAO, r, "X","phap_nhan"),              // C5 pháp nhân ĐT mới
    8:  r => mkCfBcKy(DT_KTO, r, dsKyTenTrongBaoCao),                // C7 ĐT khởi tố BC mới trong kỳ
    9:  r => mkCfBcKy(DT_KTO, r, dsKyTenTrongBaoCao,"X","phap_nhan"),// C8 pháp nhân trong C7
    10: r => mkCfBcKy(DT_KTO, r, dsKyTenTrongBaoCao,"Y","14_16"),    // C9-C13 tuổi
    11: r => mkCfBcKy(DT_KTO, r, dsKyTenTrongBaoCao,"Y","16_18"),
    12: r => mkCfBcKy(DT_KTO, r, dsKyTenTrongBaoCao,"Y","18_30"),
    13: r => mkCfBcKy(DT_KTO, r, dsKyTenTrongBaoCao,"Y","30_70"),
    14: r => mkCfBcKy(DT_KTO, r, dsKyTenTrongBaoCao,"Y",">70"),
    15: r => mkCfBcKy(DT_KTO, r, dsKyTenTrongBaoCao,"Z","khong_biet_chu"),  // C14-C18 trình độ
    16: r => mkCfBcKy(DT_KTO, r, dsKyTenTrongBaoCao,"Z","tieu_hoc"),
    17: r => mkCfBcKy(DT_KTO, r, dsKyTenTrongBaoCao,"Z","thcs"),
    18: r => mkCfBcKy(DT_KTO, r, dsKyTenTrongBaoCao,"Z","thpt"),
    19: r => mkCfBcKy(DT_KTO, r, dsKyTenTrongBaoCao,"Z","dh_tro_len"),
    20: r => mkCfBcKy(DT_KTO, r, dsKyTenTrongBaoCao,"AA","nữ"),      // C19 giới tính nữ
    21: r => mkCfBcKy(DT_KTO, r, dsKyTenTrongBaoCao,"AB","có"),      // C20 dân tộc KK
    22: r => mkCfBcKy(DT_KTO, r, dsKyTenTrongBaoCao,"T","x"),        // C21 đảng viên
    23: r => mkCfBcKy(DT_KTO, r, dsKyTenTrongBaoCao,"AC","có"),      // C22 giữ chức vụ
    24: r => mkCfBcKy(DT_KTO, r, dsKyTenTrongBaoCao,"AD","có"),      // C23 quốc tịch NN
    25: r => mkCfBcKy(DT_KTO, r, dsKyTenTrongBaoCao,"AE","có"),      // C24 tái phạm
    27: r => mkCfBcM(["DS ĐT chuyển TT"], r),                  // C26 ĐT→TT BC
    28: r => mkCfBcM(["DS ĐT chuyển TT"], r, "X","phap_nhan"), // C27
    30: r => mkCfBcM(["DS đình chỉ ĐT"], r),                   // C29 đình chỉ BC
    31: r => mkCfBcM(["DS đình chỉ ĐT"], r, "X","phap_nhan"),  // C30
    33: r => mkCfBcM(["DS tạm đình chỉ ĐT"], r),               // C32 TĐC BC
    // TT
    40: r => mkCfBcM(TT_VAO, r, "X","phap_nhan"),              // C35 pháp nhân TT mới
    42: r => mkCfBcM(["DS TT chuyển XX"], r),                  // C37 TT→XX BC
    43: r => mkCfBcM(["DS TT chuyển XX"], r, "X","phap_nhan"), // C38
    48: r => mkCfBcM(["DS TT chuyển XX"], r, "Y","14_16"),     // C43-C47 tuổi TT truy tố BC
    49: r => mkCfBcM(["DS TT chuyển XX"], r, "Y","16_18"),
    50: r => mkCfBcM(["DS TT chuyển XX"], r, "Y","18_30"),
    51: r => mkCfBcM(["DS TT chuyển XX"], r, "Y","30_70"),
    52: r => mkCfBcM(["DS TT chuyển XX"], r, "Y",">70"),
    53: r => mkCfBcM(["DS TT chuyển XX"], r, "AA","nữ"),       // C48
    54: r => mkCfBcM(["DS TT chuyển XX"], r, "AB","có"),       // C49 dân tộc KK
    55: r => mkCfBcM(["DS TT chuyển XX"], r, "T","x"),         // C50 đảng viên
    56: r => mkCfBcM(["DS TT chuyển XX"], r, "AC","có"),       // C51 giữ chức vụ
    57: r => mkCfBcM(["DS TT chuyển XX"], r, "AD","có"),       // C52 quốc tịch NN
    59: r => mkCfBcM(["DS đình chỉ TT"], r),                   // C54 đình chỉ TT BC
    60: r => mkCfBcM(["DS đình chỉ TT"], r, "X","phap_nhan"),
    62: r => mkCfBcM(["DS tạm đình chỉ TT"], r),              // C57 TĐC TT BC
    64: r => mkCfBcM(["DS TT trả ĐT"], r),                    // C59 TT trả ĐT BC
    // XX
    71: r => mkCfBcM(XX_VAO, r, "X","phap_nhan"),             // C62 pháp nhân XX mới
    73: r => mkCfBcM(["DS đã xét xử XX"], r),                 // C64 XX xét xử BC
    74: r => mkCfBcM(["DS đã xét xử XX"], r, "X","phap_nhan"),
    76: r => mkCfBcM(["DS đình chỉ XX"], r),                  // C67 đình chỉ XX BC
    77: r => mkCfBcM(["DS đình chỉ XX"], r, "X","phap_nhan"),
    79: r => mkCfBcM(["DS tạm đình chỉ XX"], r),              // C70 TĐC XX BC
    81: r => mkCfBcM(["DS XX trả TT"], r),                    // C72 XX trả TT BC
    83: r => mkCfBcM(["DS án huỷ ĐT"], r),
    85: r => mkCfBcM(["DS án huỷ TT"], r),
    87: r => mkCfBcM(["DS án huỷ XX"], r),
  };
  const B10_R0 = 3; // dòng Excel đầu tiên chứa data (1-2 là header)
  b10Rows.forEach((row, idx) => {
    const r = B10_R0 + idx;
    const cells = [row.D, extractSoDieu(row.D), row.tenToiDanh];
    for (let k = 0; k < 88; k++) {
      const fml = B10_FORMULA[k] ? B10_FORMULA[k](r) : null;
      cells.push(fml ? { formula: fml, result: row.vals[k] } : row.vals[k]);
    }
    wsB10.addRow(cells);
  });
  // Dòng Tổng: SUM formula trên toàn bộ cột data (tự cập nhật khi Excel recalc)
  const b10LastR = B10_R0 + b10Rows.length - 1;
  const tongCells = ["", "TỔNG", ""];
  for (let k = 0; k < 88; k++) {
    const col = b10Col(k + 3); // k+3: bù 3 cột A/B/C header
    tongCells.push({ formula: `SUM(${col}${B10_R0}:${col}${b10LastR})`, result: b10Tong[k] });
  }
  const tongRow = wsB10.addRow(tongCells);
  tongRow.font = { bold: true };
  tongRow.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFFDE68A" } };
  // Style: wrap + độ rộng
  wsB10.getColumn(1).width = 26;  // Mã ĐL (narrow nhưng đủ hiện code đầy đủ)
  wsB10.getColumn(2).width = 12;  // Số điều
  wsB10.getColumn(3).width = 32;  // Tên tội danh
  for (let c = 4; c <= B10_HEADER_CHI_TIET.length + 1; c++) wsB10.getColumn(c).width = 8;
  wsB10.eachRow(row => { row.eachCell(cell => { cell.alignment = { wrapText: true, vertical: "top" }; }); });
  // Cột Mã ĐL: chữ nhạt + nhỏ — chỉ dùng làm criteria key cho SUMIF, không phải số liệu
  wsB10.getColumn(1).eachCell((cell, ri) => {
    if (ri > 2) cell.font = { color: { argb: "FF9CA3AF" }, size: 8 };
  });
  // Màu xanh nhạt: cột tồn kỳ trước/kỳ này (+1 cột so với trước vì thêm cột Mã ĐL)
  const phuCols = [4,5,6,7, 4+34, 5+34, 6+34, 7+34, 4+34+31, 5+34+31, 6+34+31, 7+34+31];
  // Màu vàng nhạt: cột SUMIF (công thức tham chiếu sheet khác — có thể click-trace trong Excel)
  const sumifCols = Object.keys(B10_FORMULA).map(k => parseInt(k) + 4); // k+3 (offset) +1 (1-indexed ExcelJS)
  wsB10.eachRow((row, ri) => {
    if (ri <= 2) return;
    phuCols.forEach(ci => {
      row.getCell(ci).fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFF0FDF4" } };
    });
    sumifCols.forEach(ci => {
      row.getCell(ci).fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFFFFBEB" } };
    });
  });

  // Cảnh báo + bảng chẩn đoán vụ chưa có điều luật (nếu có) — ghi ở cuối sheet B10
  const coVuChuaDL = THU_TU_GIAI_DOAN.some(gd => (b10VuChuaDL[gd] || []).length > 0);
  if (b10CanhBao.length || coVuChuaDL) {
    wsB10.addRow([]);
    const warnHeader = wsB10.addRow(["⚠ Vụ chưa xác định được điều luật — không đếm vào B10 (cần bổ sung):"]);
    warnHeader.font = { bold: true, color: { argb: "FFDC2626" } };
    // Tiêu đề bảng chẩn đoán
    const diagHeader = wsB10.addRow(["Giai đoạn", "Mã vụ", "Tên vụ", "Điều luật hiện có", "Tội danh BC 1"]);
    diagHeader.font = { bold: true };
    diagHeader.eachCell(cell => {
      cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFFEF2F2" } };
    });
    for (const gd of THU_TU_GIAI_DOAN) {
      for (const vu of (b10VuChuaDL[gd] || [])) {
        const bcs = biCanByVu[vu.id] || [];
        const toiDanhBC1 = bcs.length > 0 ? (bcs[0].toiDanh?.[0] || "") : "";
        const r = wsB10.addRow([
          NHAN_GIAI_DOAN[gd], hienThiMa(vu), vu.tenVu || "(chưa đặt tên)",
          vu.dieuLuat || "(trống)", toiDanhBC1,
        ]);
        r.eachCell(cell => {
          cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFFEF2F2" } };
        });
      }
    }
    if (!coVuChuaDL && b10CanhBao.length) {
      b10CanhBao.forEach(msg => {
        const r = wsB10.addRow([msg]);
        r.font = { color: { argb: "FFDC2626" } };
      });
    }
  }

  // ---- Sheet 2: Thống kê tội danh (pivot tổng hợp, công thức từ DS sheets) ----
  // Cột A = Mã ĐL (criteria key, cùng chuẩn với Mã ĐL vụ/BC trong DS sheets)
  // SUMIF: cột A (TK) → cột B (DS sheets, Mã ĐL vụ) → đếm cột A (Đếm vụ)
  // COUNTIFS: cột A (TK) → cột V (DS sheets, Mã ĐL BC)
  {
    const wsTK = wb.addWorksheet("TK tội danh");
    wsTK.views = [{ state: "frozen", ySplit: 1 }];
    wsTK.columns = [
      { width: 32 },                                    // A: Mã ĐL
      { width: 9 }, { width: 9 }, { width: 9 }, { width: 9 }, // B-E: Vụ/BC/TG/TN mới
      { width: 9 }, { width: 9 }, { width: 9 }, { width: 9 }, // F-I: Vụ/BC/TG/TN tồn
      { width: 9 }, { width: 9 },                       // J-K: Vụ/BC GQ
    ];
    const tkHdr = wsTK.addRow(["Mã ĐL / Tội danh","Vụ mới","BC mới","TG mới","TN mới","Vụ tồn","BC tồn","TG tồn","TN tồn","Vụ GQ","BC GQ"]);
    tkHdr.eachCell(cell => {
      cell.font = { bold: true };
      cell.alignment = { wrapText: true, vertical: "top" };
      cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFE2E8F0" } };
    });
    const TK_R0 = 2;
    tkTDRows.forEach(([td, vuM, bcM, tgM, tnM, vuT, bcT, tgT, tnT, vuG, bcG], idx) => {
      const r = TK_R0 + idx;
      wsTK.addRow([
        td,
        { formula: ALL_VAO.map(sn => mkSfVu(sn, r)).join("+"), result: vuM },          // B: Vụ mới
        { formula: mkCfBcM(ALL_VAO, r), result: bcM },                                  // C: BC mới
        { formula: mkCfBcM(ALL_VAO, r, "R","Tạm giam"), result: tgM },                 // D: TG mới
        { formula: `C${r}-D${r}`, result: tnM },                                        // E: TN mới
        { formula: ALL_TON.map(sn => mkSfVu(sn, r)).join("+"), result: vuT },           // F: Vụ tồn
        { formula: mkCfBcM(ALL_TON, r), result: bcT },                                  // G: BC tồn
        { formula: mkCfBcM(ALL_TON, r, "R","Tạm giam"), result: tgT },                 // H: TG tồn
        { formula: `G${r}-H${r}`, result: tnT },                                        // I: TN tồn
        { formula: ALL_RA.map(sn => mkSfVu(sn, r)).join("+"), result: vuG },            // J: Vụ GQ
        { formula: mkCfBcM(ALL_RA, r), result: bcG },                                   // K: BC GQ
      ]);
    });
  }

  // ---- Sheet 2: Tổng hợp báo cáo (khớp đúng bảng hiển thị trên màn hình) ----
  // 2026-07-15: mỗi giai đoạn tách 2 cột Vụ/BC (trước chỉ có 1 cột/giai đoạn, không có tổng BC ở
  // bất kỳ dòng "số mới"/"giải quyết" nào — chỉ 3 dòng tồn có tách riêng "— Vụ"/"— Bị can" theo
  // HÀNG, không phải cột). Và audit lại toàn bộ: MỌI ô có DS sheet tương ứng đều chuyển sang công
  // thức SUM/COUNTIF trên chính sheet đó (không còn đọc số JS xuất thẳng từ baoCao nữa, đúng yêu
  // cầu "toàn bộ biểu báo cáo lấy dữ liệu = công thức Excel") — CHỈ còn 2 cặp dòng thật sự không
  // thể sheet-hoá vì bản chất là snapshot tại 1 thời điểm, không phải 1 danh sách sự kiện trong kỳ:
  // "Tồn đầu kỳ" (snapshot tonCuoiKy/tonCuoiBiCan của KỲ TRƯỚC lúc chốt) và "Tồn cuối kỳ" (snapshot
  // của CHÍNH kỳ này lúc chốt) — 2 dòng này giữ nguyên JS, có ghi chú rõ lý do trong nhãn dòng.
  // "Số tồn hiện tại" KHÔNG phải snapshot (luôn tính live tại thời điểm xuất) nên CÓ sheet tương
  // ứng ("DS tồn ĐT/TT/XX") — trước đây bị bỏ sót, giờ đã chuyển sang công thức.
  const _thGs = (gd) => gd === "dieu_tra" ? "ĐT" : gd === "truy_to" ? "TT" : "XX";
  const _thSumA = (sn) => `SUM('${sn}'!$A:$A)`;
  const THVao = {
    dieu_tra: DT_VAO, truy_to: TT_VAO, xet_xu: XX_VAO,
  };
  // demBcSheet: đếm dòng BỊ CAN THẬT trong 1 sheet (cột M = Họ tên BC — loại bỏ dòng giả
  // "(Chưa có BC)" của vụ 0 bị can, xem BC_EMPTY).
  const demBcSheet = (sn) => `COUNTIF('${sn}'!$M:$M,"<>(Chưa có BC)")`;
  const demBcSheetM = (sheets) => sheets.map(demBcSheet).join("+") || "0";
  // demBcSheetKy: giống trên nhưng CHỈ đếm BC có cột "Kỳ TK BC" (AF) khớp kỳ đang tính báo cáo —
  // dùng riêng cho khối ĐT "mới" (Điều tra là giai đoạn duy nhất bị can bổ sung được vào vụ đã có
  // sẵn — "Thêm bị can" — nên phải lọc đúng kỳ của chính sự kiện khoi_to_bican, không tính cả BC
  // bổ sung sau vào kỳ vụ mới. Xem lý do đầy đủ ở tinhBieu10 khối C7-C24, cùng 1 nguyên tắc).
  const demBcSheetKy = (sheets, dsKyTen) => {
    const parts = [];
    for (const sn of sheets) for (const kt of dsKyTen) parts.push(`COUNTIFS('${sn}'!$AF:$AF,"${kt}")`);
    return parts.join("+") || "0";
  };
  // Bản JS song song — cache "result" cho ô có formula (Excel chưa recalc vẫn hiện đúng số).
  const bcCountVuArr = (vuArr) => vuArr.reduce((s, vu) => s + (biCanByVu[vu.id] || []).length, 0);
  const bcCountVuArrKy = (vuArr) => {
    let n = 0;
    for (const vu of vuArr) for (const bc of (biCanByVu[vu.id] || []))
      if (kyIdSetTrongBaoCao.has(bcKyKhoiToMap.get(bc.id))) n++;
    return n;
  };
  // Nguồn (cột AH của "DS khởi tố {gs}", xem addSheetVuKy) — SUMIF/COUNTIF theo nhãn Nguồn.
  const sfVuNguon = (sn, nl) => `SUMIF('${sn}'!$AH:$AH,"${nl}",'${sn}'!$A:$A)`;
  const cfBcNguon = (sn, nl) => `COUNTIF('${sn}'!$AH:$AH,"${nl}")`;
  const cfBcNguonKy = (sn, nl, dsKyTen) => dsKyTen.map(kt => `COUNTIFS('${sn}'!$AH:$AH,"${nl}",'${sn}'!$AF:$AF,"${kt}")`).join("+") || "0";
  // _thRow: 1 dòng — dataFn(gd) trả {vu, bc} (mỗi cái số thường hoặc {formula,result}) — bung
  // thành 6 cột lần lượt ĐT-Vụ/ĐT-BC/TT-Vụ/TT-BC/XX-Vụ/XX-BC.
  const _thRow = (nhan, dataFn) => {
    const cells = [nhan];
    for (const gd of THU_TU_GIAI_DOAN) { const { vu, bc } = dataFn(gd); cells.push(vu, bc); }
    return cells;
  };
  const _thBlank = (nhan) => [nhan, "", "", "", "", "", ""];
  // rowNguon: 3 dòng Án khởi tố mới/Tin báo/Án nơi khác — cùng 1 khuôn, chỉ khác nguonKey.
  const rowNguon = (nhan, nguonKey) => {
    const nl = NHAN_NGUON[nguonKey];
    return _thRow(nhan, gd => {
      const sn = `DS khởi tố ${_thGs(gd)}`;
      const vuArr = (baoCao[gd].ds.khoiToTrucTiep || []).filter(v => v.nguon === nguonKey);
      return {
        vu: { formula: sfVuNguon(sn, nl), result: baoCao[gd].soMoi[nguonKey] ?? 0 },
        bc: gd === "dieu_tra"
          ? { formula: cfBcNguonKy(sn, nl, dsKyTenTrongBaoCao), result: bcCountVuArrKy(vuArr) }
          : { formula: cfBcNguon(sn, nl), result: bcCountVuArr(vuArr) },
      };
    });
  };
  // rowHoanThanh: 5 dòng Đã xét xử/Chuyển đi/Tạm đình chỉ/Đình chỉ/Án huỷ — cùng 1 khuôn.
  const rowHoanThanh = (nhan, sheetLabel, htKey) => _thRow(nhan, gd => {
    const sn = `DS ${sheetLabel} ${_thGs(gd)}`;
    const vuArr = baoCao[gd].ds.hoanThanh?.[htKey] || [];
    return {
      vu: { formula: _thSumA(sn), result: baoCao[gd].hoanThanhTheoGD[htKey] },
      bc: { formula: demBcSheetM([sn]), result: bcCountVuArr(vuArr) },
    };
  });

  const tongHopHang = [
    // ── Tồn đầu kỳ: KHÔNG có DS sheet — là snapshot tonCuoiKy/tonCuoiBiCan của KỲ TRƯỚC tại
    // thời điểm chốt kỳ đó, không phải 1 danh sách sự kiện của KỲ NÀY để đếm lại. Giữ JS.
    _thRow("Tồn đầu kỳ (snapshot chốt kỳ trước)", gd => ({ vu: baoCao[gd].tonDauKy, bc: baoCao[gd].tonDauBiCan ?? 0 })),
    _thBlank("Số mới"),
    rowNguon("— Án khởi tố mới", "an_khoi_to_moi"),
    rowNguon("— Tin báo khởi tố lên", "tin_bao_khoi_to_len"),
    rowNguon("— Án nơi khác chuyển đến", "an_noi_khac_chuyen_den"),
    // Phục hồi: mỗi GĐ có DS sheet riêng, không cần lọc Nguồn (sheet đã 100% phục hồi).
    _thRow("— Phục hồi điều tra", gd => {
      const sn = `DS phục hồi ${_thGs(gd)}`;
      const vuArr = (baoCao[gd].ds.khoiToTrucTiep || []).filter(v => v.nguon === "phuc_hoi_dieu_tra");
      return {
        vu: { formula: _thSumA(sn), result: baoCao[gd].soMoi.phuc_hoi_dieu_tra ?? 0 },
        bc: gd === "dieu_tra"
          ? { formula: demBcSheetKy([sn], dsKyTenTrongBaoCao), result: bcCountVuArrKy(vuArr) }
          : { formula: demBcSheetM([sn]), result: bcCountVuArr(vuArr) },
      };
    }),
    // Chuyển đến từ GĐ trước (ĐT không có, luôn 0 — không phải thiếu sheet mà là định nghĩa).
    _thRow("— Chuyển đến từ giai đoạn trước", gd => {
      if (gd === "dieu_tra") return { vu: 0, bc: 0 };
      const sn = `DS chuyển đến ${_thGs(gd)}`;
      const vuArr = baoCao[gd].ds.chuyenDen || [];
      return {
        vu: { formula: _thSumA(sn), result: baoCao[gd].soMoi.chuyenDenTu ?? 0 },
        bc: { formula: demBcSheetM([sn]), result: bcCountVuArr(vuArr) },
      };
    }),
    // Trả về từ GĐ sau (XX không có, luôn 0 — định nghĩa, không phải thiếu sheet).
    _thRow("— Trả về từ giai đoạn sau", gd => {
      if (gd === "xet_xu") return { vu: 0, bc: 0 };
      const sn = `DS trả về ${_thGs(gd)}`;
      const vuArr = baoCao[gd].ds.traVe || [];
      return {
        vu: { formula: _thSumA(sn), result: baoCao[gd].soMoi.traVeTu ?? 0 },
        bc: { formula: demBcSheetM([sn]), result: bcCountVuArr(vuArr) },
      };
    }),
    // Khởi tạo trực tiếp = DS khởi tố + DS phục hồi — BC lọc kỳ riêng cho ĐT (xem rowNguon).
    _thRow("— Khởi tạo trực tiếp tại giai đoạn này", gd => {
      const gs = _thGs(gd);
      const sheets = [`DS khởi tố ${gs}`, `DS phục hồi ${gs}`];
      const vuArr = baoCao[gd].ds.khoiToTrucTiep || [];
      return {
        vu: { formula: sheets.map(_thSumA).join("+"), result: baoCao[gd].soMoi.khoiTaoTrucTiep ?? 0 },
        bc: gd === "dieu_tra"
          ? { formula: demBcSheetKy(sheets, dsKyTenTrongBaoCao), result: bcCountVuArrKy(vuArr) }
          : { formula: demBcSheetM(sheets), result: bcCountVuArr(vuArr) },
      };
    }),
    _thRow("— Vụ tách ra (tách trong kỳ này)", gd => {
      const sn = `DS vụ tách ${_thGs(gd)}`;
      const vuArr = baoCao[gd].ds.tachVu || [];
      return {
        vu: { formula: _thSumA(sn), result: baoCao[gd].soMoi.tachVu ?? 0 },
        bc: { formula: demBcSheetM([sn]), result: bcCountVuArr(vuArr) },
      };
    }),
    // Tổng số mới = SUM tất cả VÀO sheets — BC = (khởi tố+phục hồi, lọc kỳ nếu ĐT) + phần còn lại.
    _thRow("Tổng số mới", gd => {
      const gs = _thGs(gd);
      const khoiToSheets = [`DS khởi tố ${gs}`, `DS phục hồi ${gs}`];
      const khacSheets = [
        `DS vụ tách ${gs}`,
        ...(gd !== "dieu_tra" ? [`DS chuyển đến ${gs}`] : []),
        ...(gd !== "xet_xu" ? [`DS trả về ${gs}`] : []),
      ];
      const khoiToArr = baoCao[gd].ds.khoiToTrucTiep || [];
      const khacArr = [...(baoCao[gd].ds.tachVu||[]), ...(baoCao[gd].ds.chuyenDen||[]), ...(baoCao[gd].ds.traVe||[])];
      const khoiToBcF = gd === "dieu_tra" ? demBcSheetKy(khoiToSheets, dsKyTenTrongBaoCao) : demBcSheetM(khoiToSheets);
      const khoiToBcR = gd === "dieu_tra" ? bcCountVuArrKy(khoiToArr) : bcCountVuArr(khoiToArr);
      return {
        vu: { formula: THVao[gd].map(_thSumA).join("+"), result: baoCao[gd].soMoi.tong },
        bc: { formula: `${khoiToBcF}+${demBcSheetM(khacSheets)}`, result: khoiToBcR + bcCountVuArr(khacArr) },
      };
    }),
    _thBlank("Đã giải quyết / ra khỏi giai đoạn"),
    // Chuyển GĐ tiến (XX không chuyển tiếp — định nghĩa, không phải thiếu sheet).
    _thRow("— Chuyển giai đoạn (kết thúc giai đoạn này)", gd => {
      const vuArr = baoCao[gd].ds.chuyenDi || [];
      if (gd === "xet_xu") return { vu: baoCao[gd].chuyenDi || 0, bc: bcCountVuArr(vuArr) };
      const gs = _thGs(gd); const gsNext = gd === "dieu_tra" ? "TT" : "XX";
      const sn = `DS ${gs} chuyển ${gsNext}`;
      return {
        vu: { formula: _thSumA(sn), result: baoCao[gd].chuyenDi },
        bc: { formula: demBcSheetM([sn]), result: bcCountVuArr(vuArr) },
      };
    }),
    // Trả hồ sơ (ĐT không trả lại — định nghĩa, không phải thiếu sheet).
    _thRow("— Trả hồ sơ (ra khỏi giai đoạn này)", gd => {
      const vuArr = baoCao[gd].ds.traDi || [];
      if (gd === "dieu_tra") return { vu: baoCao[gd].traDi || 0, bc: bcCountVuArr(vuArr) };
      const gs = _thGs(gd); const gsPrev = gd === "truy_to" ? "ĐT" : "TT";
      const sn = `DS ${gs} trả ${gsPrev}`;
      return {
        vu: { formula: _thSumA(sn), result: baoCao[gd].traDi },
        bc: { formula: demBcSheetM([sn]), result: bcCountVuArr(vuArr) },
      };
    }),
    rowHoanThanh("— Đã xét xử", "đã xét xử", "da_xet_xu"),
    rowHoanThanh("— Chuyển đi", "chuyển đi", "chuyen_di"),
    rowHoanThanh("— Tạm đình chỉ", "tạm đình chỉ", "tam_dinh_chi"),
    rowHoanThanh("— Đình chỉ", "đình chỉ", "dinh_chi"),
    rowHoanThanh("— Án huỷ", "án huỷ", "an_huy"),
    _thRow("— Nhập vào vụ khác", gd => {
      const sn = `DS nhập vụ ${_thGs(gd)}`;
      const vuArr = baoCao[gd].ds.nhapVu || [];
      return {
        vu: { formula: _thSumA(sn), result: baoCao[gd].soNhapVu },
        bc: { formula: demBcSheetM([sn]), result: bcCountVuArr(vuArr) },
      };
    }),
    // ── Tồn cuối kỳ: snapshot chốt CHÍNH KỲ NÀY (không phải danh sách sự kiện) — giữ JS.
    _thRow("Tồn cuối kỳ (snapshot chốt kỳ này)", gd => ({ vu: baoCao[gd].tonCuoiKy, bc: baoCao[gd].tonCuoiBiCanKy ?? 0 })),
    _thBlank("Số tồn hiện tại (tại thời điểm xuất — không phải snapshot, luôn live)"),
    // Có DS sheet ("DS tồn ĐT/TT/XX") — trước đây bị bỏ sót, đọc JS trực tiếp dù có sheet sẵn.
    _thRow("— Số tồn hiện tại", gd => {
      const sn = `DS tồn ${_thGs(gd)}`;
      const vuArr = baoCao[gd].ds.tonHienTai || [];
      return {
        vu: { formula: _thSumA(sn), result: baoCao[gd].soVuTon },
        bc: { formula: demBcSheetM([sn]), result: bcCountVuArr(vuArr) },
      };
    }),
  ];
  themSheetDanhSach(wb, "Tổng hợp báo cáo",
    ["", "ĐT - Vụ", "ĐT - BC", "TT - Vụ", "TT - BC", "XX - Vụ", "XX - BC"],
    tongHopHang, [46, 10, 10, 10, 10, 10, 10]);

  // ---- Sheets chi tiết — mỗi loại sự kiện × mỗi giai đoạn là 1 sheet riêng ----
  // Cấu trúc: VÀO (khởi tố/phục hồi/tách/chuyển đến/trả về) + RA (xét xử/chuyển đi/TĐC/ĐC/huỷ/nhập) + TỒN
  // QUAN TRỌNG: 1 vụ N bị can = N rows. Dùng SUM(cột "Đếm vụ") — KHÔNG dùng COUNTA toàn sheet —
  // để đếm số vụ; = 1 ở row BC đầu tiên của mỗi vụ, rỗng ở các row BC tiếp theo.
  // Cột "Mã ĐL vụ": điều luật chính của vụ theo chuẩn B10 — dùng làm criteria cho SUMIF ở sheet Biểu B10.
  // Cùng logic với tinhBieu10.vuPrimaryDL: BC có loaiKhoiTo="ban_dau" → lấy getDL(bc) đó làm tội chính.
  const vuPrimaryDL_xuat = (vu) => {
    const bcs = biCanByVu[vu.id] || [];
    if (!bcs.length) return _tkGetDLVu(vu);
    const bcChinh = bcs.find(bc => bc.loaiKhoiTo === "ban_dau") || bcs[0];
    return _tkGetDL(bcChinh);
  };
  function addSheetVu(tenSheet, vuArr, extraHeaders, extraFn) {
    extraHeaders = extraHeaders || [];
    extraFn = extraFn || (() => []);
    const rows = [];
    for (const vu of vuArr) {
      const vuPart = vuBaseRow(vu);
      const extraPart = extraFn(vu);
      const maDLVu = vuPrimaryDL_xuat(vu);  // criteria key cho SUMIF trong Biểu B10
      const bcArr = biCanByVu[vu.id] || [];
      if (bcArr.length === 0) {
        // Thứ tự: A=đếm, B=maDL, C-K=VU_H, L-AE=BC_H, AF+=extraHeaders (cố định BC để B10 COUNTIFS dùng đúng cột)
        rows.push([1, maDLVu, ...vuPart, ...BC_EMPTY, ...extraPart]);
      } else {
        bcArr.forEach((bc, i) => rows.push([i === 0 ? 1 : "", maDLVu, ...vuPart, ...bcCellsRow(bc, i + 1, vu), ...extraPart]));
      }
    }
    themSheetDanhSach(wb, tenSheet,
      ["Đếm vụ", "Mã ĐL vụ", ...VU_H, ...BC_H, ...extraHeaders],
      rows,
      [8, 24, ...VU_W, ...BC_W, ...extraHeaders.map(() => 12)], 0);
  }
  const GD_VIET_TAT = { dieu_tra: "ĐT", truy_to: "TT", xet_xu: "XX" };
  const _ngaySK  = v => [fmtDate(v._log?.ngaySuKien)];
  const _ngaySoQD = v => [fmtDate(v._log?.ngaySuKien), v._log?.soQuyetDinh || ""];
  // addSheetVuKy: giống addSheetVu nhưng tự prepend cột "Kỳ TK" — dùng cho mọi sheet VÀO/RA
  // (trừ DS tồn vì tồn là live, không gắn với 1 kỳ cụ thể)
  function addSheetVuKy(tenSheet, vuArr, extraHeaders, extraFn) {
    const h = ["Kỳ TK", ...(extraHeaders || [])];
    const f = v => [tenKyBaoCao(v), ...((extraFn || (() => []))(v))];
    addSheetVu(tenSheet, vuArr, h, f);
  }

  // ---- Sheet "Cân đối số liệu" — kiểm chứng cân bằng kế toán mỗi giai đoạn ----
  // Công thức: Tồn đầu + Vào - Ra = Tồn cuối (chốt)
  // Chênh lệch ≠ 0 → có sự kiện log chưa gán kỳ (kyThongKe=null) hoặc lỗi dữ liệu
  {
    const VAO_SHEETS_GD = {
      dieu_tra: ["DS khởi tố ĐT","DS phục hồi ĐT","DS vụ tách ĐT","DS trả về ĐT"],
      truy_to:  ["DS khởi tố TT","DS phục hồi TT","DS vụ tách TT","DS chuyển đến TT","DS trả về TT"],
      xet_xu:   ["DS khởi tố XX","DS phục hồi XX","DS vụ tách XX","DS chuyển đến XX"],
    };
    const RA_SHEETS_GD = {
      dieu_tra: ["DS ĐT chuyển TT","DS đã xét xử ĐT","DS chuyển đi ĐT","DS tạm đình chỉ ĐT","DS đình chỉ ĐT","DS án huỷ ĐT","DS nhập vụ ĐT"],
      truy_to:  ["DS TT chuyển XX","DS TT trả ĐT","DS đã xét xử TT","DS chuyển đi TT","DS tạm đình chỉ TT","DS đình chỉ TT","DS án huỷ TT","DS nhập vụ TT"],
      xet_xu:   ["DS XX trả TT","DS đã xét xử XX","DS chuyển đi XX","DS tạm đình chỉ XX","DS đình chỉ XX","DS án huỷ XX","DS nhập vụ XX"],
    };
    const GD_TEN_DU = { dieu_tra: "Điều tra", truy_to: "Truy tố", xet_xu: "Xét xử" };
    const wsCd = wb.addWorksheet("Cân đối số liệu");
    wsCd.views = [{ state: "frozen", xSplit: 1, ySplit: 2 }];
    const cdH1 = wsCd.addRow(["Giai đoạn","Tồn đầu kỳ","Vào kỳ","Ra kỳ","Tồn cuối (tính)","Tồn cuối (chốt)","Chênh lệch"]);
    cdH1.font = { bold: true };
    cdH1.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFE2E8F0" } };
    const cdH2 = wsCd.addRow(["","Snapshot kỳ trước","=Σ SUM(DS vào...)","=Σ SUM(DS ra...)","=Đầu+Vào−Ra","Snapshot lúc chốt","=Tính−Chốt (nên=0)"]);
    cdH2.font = { size: 9, color: { argb: "FF6B7280" } };
    THU_TU_GIAI_DOAN.forEach((gd, idx) => {
      const rowNum = 3 + idx;
      const vaoF = VAO_SHEETS_GD[gd].map(s => `SUM('${s}'!$A:$A)`).join("+");
      const raF  = RA_SHEETS_GD[gd].map(s => `SUM('${s}'!$A:$A)`).join("+");
      const vaoR = baoCao[gd].soMoi?.tong || 0;
      const raHT = baoCao[gd].hoanThanhTheoGD || {};
      const raR  = (baoCao[gd].chuyenDi||0) + (baoCao[gd].traDi||0)
        + (raHT.da_xet_xu||0) + (raHT.chuyen_di||0) + (raHT.tam_dinh_chi||0)
        + (raHT.dinh_chi||0) + (raHT.an_huy||0) + (baoCao[gd].soNhapVu||0);
      const tonDau  = baoCao[gd].tonDauKy  || 0;
      const tonChot = baoCao[gd].tonCuoiKy || 0;
      const chenhLech = tonDau + vaoR - raR - tonChot;
      const cdRow = wsCd.addRow([
        GD_TEN_DU[gd],
        tonDau,
        { formula: vaoF, result: vaoR },
        { formula: raF,  result: raR  },
        { formula: `B${rowNum}+C${rowNum}-D${rowNum}`, result: tonDau + vaoR - raR },
        tonChot,
        { formula: `E${rowNum}-F${rowNum}`, result: chenhLech },
      ]);
      cdRow.getCell(7).fill = { type: "pattern", pattern: "solid",
        fgColor: { argb: chenhLech !== 0 ? "FFFECACA" : "FFD1FAE5" } };
      cdRow.getCell(7).font = { bold: chenhLech !== 0,
        color: { argb: chenhLech !== 0 ? "FFB91C1C" : "FF065F46" } };
      for (let c = 2; c <= 7; c++) cdRow.getCell(c).alignment = { horizontal: "center" };
    });
    [24,14,24,32,18,18,20].forEach((w, i) => wsCd.getColumn(i + 1).width = w);
    wsCd.addRow([]);
    [
      ["Ghi chú:"],
      ["• Chênh lệch ≠ 0 → có sự kiện log chưa gán kỳ (kyThongKe=null). Xem Nhật ký thao tác → lọc 'Chưa gán kỳ'."],
      ["• 'DS ĐT chuyển TT' = cùng dữ liệu 'DS chuyển đến TT', từ góc nhìn giai đoạn nguồn (để tính đủ RA của ĐT)."],
      ["• 'Tồn cuối (chốt)' = snapshot lúc chốt kỳ; 'Tồn cuối (tính)' = tính từ log kỳ này — hai cột nên bằng nhau."],
    ].forEach(r => { const nr = wsCd.addRow(r); nr.font = { size: 9, color: { argb: "FF6B7280" } }; });
  }

  for (const gd of THU_TU_GIAI_DOAN) {
    const gs = GD_VIET_TAT[gd];  // "ĐT" / "TT" / "XX"
    const d  = baoCao[gd].ds;

    // ── VÀO giai đoạn ──
    // Khởi tố trực tiếp (bao gồm tin báo, không bao gồm phục hồi)
    addSheetVuKy(`DS khởi tố ${gs}`,
      (d.khoiToTrucTiep||[]).filter(v => v.nguon !== "phuc_hoi_dieu_tra"),
      ["Nguồn", "Ngày SK"],
      v => [NHAN_NGUON[v.nguon] || v.nguon || "Khởi tố mới", fmtDate(v._log?.ngaySuKien)]);

    // Phục hồi điều tra/truy tố/xét xử
    addSheetVuKy(`DS phục hồi ${gs}`,
      (d.khoiToTrucTiep||[]).filter(v => v.nguon === "phuc_hoi_dieu_tra"),
      ["Ngày phục hồi"], _ngaySK);

    // Vụ tách ra trong kỳ, đếm vụ tách = số dòng (mỗi dòng là 1 vụ mới xuất hiện)
    addSheetVuKy(`DS vụ tách ${gs}`, d.tachVu||[], ["Ngày tách"], _ngaySK);

    // Chuyển đến từ giai đoạn trước (ĐT là giai đoạn đầu, không có chuyển đến)
    if (gd !== "dieu_tra") {
      addSheetVuKy(`DS chuyển đến ${gs}`, d.chuyenDen||[], ["Ngày chuyển", "Số QĐ"], _ngaySoQD);
    }

    // Trả hồ sơ trở về (XX là giai đoạn cuối, không bị trả về)
    // ĐT = viện trả DTBS; TT = toà trả TTBS
    if (gd !== "xet_xu") {
      addSheetVuKy(`DS trả về ${gs}`, d.traVe||[], ["Ngày trả", "Số QĐ"], _ngaySoQD);
    }

    // ── RA: chuyển giai đoạn tiến (từ giai đoạn này lên giai đoạn tiếp theo) ──
    // Lưu ý: cùng dữ liệu với "DS chuyển đến {gsNext}" nhưng từ góc nhìn giai đoạn nguồn —
    // cần thiết để cân đối RA của giai đoạn này mà không phải tra cứu sheet giai đoạn khác.
    if (gd !== "xet_xu") {
      const gsNext = gd === "dieu_tra" ? "TT" : "XX";
      addSheetVuKy(`DS ${gs} chuyển ${gsNext}`, d.chuyenDi||[], ["Ngày chuyển", "Số QĐ"], _ngaySoQD);
    }
    // ── RA: trả hồ sơ (từ giai đoạn này về giai đoạn trước) ──
    // Lưu ý: cùng dữ liệu với "DS trả về {gsPrev}" nhưng từ góc nhìn giai đoạn nguồn.
    if (gd !== "dieu_tra") {
      const gsPrev = gd === "truy_to" ? "ĐT" : "TT";
      addSheetVuKy(`DS ${gs} trả ${gsPrev}`, d.traDi||[], ["Ngày trả", "Số QĐ"], _ngaySoQD);
    }

    // ── RA: hoàn thành (kết thúc thụ lý) ──
    addSheetVuKy(`DS đã xét xử ${gs}`,
      d.hoanThanh?.da_xet_xu||[], ["Ngày XXT", "Số bản án"], _ngaySoQD);

    addSheetVuKy(`DS chuyển đi ${gs}`,
      d.hoanThanh?.chuyen_di||[], ["Ngày CĐ", "Số QĐ"], _ngaySoQD);

    addSheetVuKy(`DS tạm đình chỉ ${gs}`,
      d.hoanThanh?.tam_dinh_chi||[], ["Ngày TĐC", "Số QĐ TĐC"], _ngaySoQD);

    addSheetVuKy(`DS đình chỉ ${gs}`,
      d.hoanThanh?.dinh_chi||[], ["Ngày ĐC", "Số QĐ ĐC"], _ngaySoQD);

    addSheetVuKy(`DS án huỷ ${gs}`,
      d.hoanThanh?.an_huy||[], ["Ngày huỷ", "Số QĐ"], _ngaySoQD);

    // Nhập vụ — đếm vụ nhập = số dòng (mỗi dòng là 1 vụ bị nhập vào vụ khác)
    addSheetVuKy(`DS nhập vụ ${gs}`, d.nhapVu||[],
      ["Ngày nhập", "Mã vụ đích"],
      v => [fmtDate(v._log?.ngaySuKien), v._log?.vuNhapVao || ""]);

    // ── TỒN cuối kỳ (live tại thời điểm xuất) — không có kỳ TK vì là trạng thái hiện tại ──
    addSheetVu(`DS tồn ${gs}`, d.tonHienTai||[]);
  }

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `QLVA_BaoCao_${ky.tenKy.replace(/[\/\s]/g, "_")}_${toInputDateNhanh(new Date())}.xlsx`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function KyChiTietModal({ ky, kyTruoc, onDong }) {
  const [dangTai, setDangTai] = useState(true);
  const [baoCao, setBaoCao] = useState(null);
  const [loi, setLoi] = useState("");
  const [dangXuat, setDangXuat] = useState(false);
  const [loiXuat, setLoiXuat] = useState("");

  useEffect(() => {
    let huy = false;
    tinhBaoCaoKy(ky, kyTruoc)
      .then(bc => { if (!huy) { setBaoCao(bc); setDangTai(false); } })
      .catch(err => { console.error(err); if (!huy) { setLoi("Lỗi khi tính báo cáo: " + err.message); setDangTai(false); } });
    return () => { huy = true; };
  }, [ky.id]);

  const bamXuatExcel = async () => {
    setDangXuat(true);
    setLoiXuat("");
    try {
      await xuatBaoCaoThangExcel(ky, baoCao, kyTruoc);
    } catch (err) {
      console.error(err);
      setLoiXuat("Lỗi khi xuất Excel: " + err.message);
    } finally {
      setDangXuat(false);

      await xuatBaoCaoThangExcel({ tenKy: `Tong hop ${tenGop}` }, baoCao, dsKyChon[0]?.kyTruoc || null,

// Tìm kỳ trước = dòng ngay BÊN DƯỚI trong listBaoCaoDesc (luôn sorted desc từ Firestore).
// Không dùng so sánh timestamp để tránh bug khi data có format không đồng nhất.
function timKyTruoc(ky, listBaoCaoDesc) {
  if (!ky) return null;
  const idx = listBaoCaoDesc.findIndex(k => k.id === ky.id);
  return (idx >= 0 && idx + 1 < listBaoCaoDesc.length) ? listBaoCaoDesc[idx + 1] : null;
}

function KyBaoCaoModule() {
  const [list, setList] = useState([]);
  const [dangTai, setDangTai] = useState(true);
  const [hienMoKy, setHienMoKy] = useState(false);

  const [dangTinhLai, setDangTinhLai] = useState(null);
  const [thongBaoTinhLai, setThongBaoTinhLai] = useState(null);
  const [kyChonTongHop, setKyChonTongHop] = useState(new Set());
  const [hienTongHop, setHienTongHop] = useState(false);

    () => localStorage.getItem("qlva_ky_sapxep") !== "asc"

  const doiSapXep = () => {

    const tenChieu = moi ? "Mới nhất trên (mặc định)" : "Cũ nhất trên";

    setSapXepDesc(moi);

  const toggleChonTongHop = (id) => setKyChonTongHop(s => {
    const moi = new Set(s);
    moi.has(id) ? moi.delete(id) : moi.add(id);

  const bamTinhLai = async (ky, kyTruoc) => {
    setDangTinhLai(ky.id);

    }

  useEffect(() => {
    return db.collection("kybaocao").orderBy("ngayBatDau", "desc").onSnapshot(

            🚧 Đang xây dựng

        <div className="flex items-center gap-2">

                    {!isLuuTru && <td className="p-3">{fmtDate(ky.ngayChot)}</td>}

                      <td className="p-3">

            {hienMoKy && <MoKyMoiForm onDong={() => setHienMoKy(false)} onXong={() => setHienMoKy(false)} />}

function mauCanhBaoHan(han) {
  if (!han) return "";
  const d = han.toDate ? han.toDate() : new Date(han);
  if (isNaN(d)) return "";
  const conLai = Math.ceil((d - new Date()) / 86400000);
  if (conLai < 0) return "text-red-600 font-medium";
  if (conLai <= 15) return "text-amber-600 font-medium";
  return "";
}

  const [ksv, setKsv] = useState("tat_ca");
  const [selectedId, setSelectedId] = useState(null); // vụ đang chọn — hiện chi tiết ở panel phải

  // Lấy danh sách kỳ, đặt mặc định = kỳ đang mở (hoặc kỳ gần nhất nếu không có kỳ mở).
  // Gồm cả kỳ lưu trữ án cũ (loai: "luu_tru") để chọn lọc — vụ án cũ nhập lại qua Import Excel
  // hoặc gán tay vào kỳ lưu trữ vẫn cần xem/lọc được ở đây như mọi kỳ khác.
  useEffect(() => {
    return db.collection("kybaocao").orderBy("ngayBatDau", "desc").onSnapshot(
      snap => {
        const ks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        setDsKy(ks);
        setLocKy(prev => {
          if (prev !== null) return prev; // giữ lựa chọn đã có
          const mo = ks.find(k => k.trangThai === "dang_mo");
          return mo ? mo.id : (ks[0]?.id || "tat_ca");
        });
      },
      () => setDsKy([])
    );
  }, []);

  // Đọc thẳng từ vuan — ngayQuyetDinh và kyHoanThanh được lưu sẵn khi tạo sự kiện hoan_thanh
  // (dữ liệu cũ chưa có field này sẽ được backfill qua nút "Cập nhật index" ở module Cài đặt).
  // Lọc theo kỳ NGAY TẠI FIRESTORE khi đã chọn 1 kỳ cụ thể (khác "Tất cả") — trước đây tải TOÀN
  // BỘ vụ của hình thức này (tích luỹ không giới hạn qua nhiều năm) rồi mới lọc kỳ phía client,
  // càng nhiều án đã giải quyết càng chậm/tốn băng thông dù người dùng chỉ đang xem 1 kỳ. Đợi
  // locKy khởi tạo xong (khác null, xem effect lấy danh sách kỳ ở trên) mới chạy query để khỏi
  // tải 1 lần không lọc kỳ ngay lúc mount rồi tải lại ngay sau đó. Cần composite index
  // trangThai+kyHoanThanh trên collection vuan (xem firestore.indexes.json).
  useEffect(() => {
    if (locKy === null) return;
    setDangTai(true);
    let q = db.collection("vuan").where("trangThai", "==", hinhThuc);
    if (locKy !== "tat_ca") q = q.where("kyHoanThanh", "==", locKy);
    const unsub = q.onSnapshot(
      snap => {
        const rows = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => {
            const ta = a.ngayQuyetDinh?.toMillis?.() ?? (a.ngayQuyetDinh ? new Date(a.ngayQuyetDinh).getTime() : 0);
            const tb = b.ngayQuyetDinh?.toMillis?.() ?? (b.ngayQuyetDinh ? new Date(b.ngayQuyetDinh).getTime() : 0);
            return tb - ta;
          });
        setList(rows);
        setDangTai(false);
      },
      err => { console.error(err); setDangTai(false); }
    );
    return () => unsub();
  }, [hinhThuc, locKy]);

  const dsKsv = useMemo(() => [...new Set(list.map(v => v.ksvChinh).filter(Boolean))].sort(), [list]);

  const listHienThi = useMemo(() => {
    // Kỳ đã lọc sẵn tại Firestore (xem effect tải `list` ở trên) — chỉ còn lọc KSV/từ khoá phía client.
    let rows = list;
    if (ksv !== "tat_ca") rows = rows.filter(v => v.ksvChinh === ksv);
    const k = tuKhoa.trim().toLowerCase();
    if (k) {
      rows = rows.filter(v =>
        (hienThiMa(v) || "").toLowerCase().includes(k)
        || (v.tenVu || "").toLowerCase().includes(k)
        || (v.dieuLuat || "").toLowerCase().includes(k)
        || (v.ksvChinh || "").toLowerCase().includes(k)
        || (v.ksvHoTro || []).some(t => (t || "").toLowerCase().includes(k))
        || (v.ghiChu || "").toLowerCase().includes(k)
        || (v.soQdKtva || "").toLowerCase().includes(k)
      );
    }
    return rows;
  }, [list, ksv, tuKhoa]);

  const tenKyDangChon = dsKy.find(k => k.id === locKy)?.tenKy;

  // Bố cục 2 cột giống hệt module Danh sách vụ án (DanhSachPanel + ChiTietPanel dùng chung) —
  // panel trái flex-1 là danh sách chính, panel phải cố định 420px hiện chi tiết + mọi hành động
  // (kể cả Sửa thông tin/Xóa vụ án) khi bấm vào 1 dòng, thay vì chỉ có 1 nút "Sửa thông tin" đơn
  // lẻ như bản trước — dùng lại nguyên `ChiTietPanel`, không viết lại logic hiển thị chi tiết.
  return (
    <div className="h-full flex flex-col">
      <div className="flex items-center justify-between mb-4 gap-4">
        <h2 className="text-lg font-semibold whitespace-nowrap">Án đã giải quyết</h2>
        <div className="flex items-center gap-2 flex-1 justify-end">
          <input value={tuKhoa} onChange={e => setTuKhoa(e.target.value)}
                 placeholder="Tìm theo mã vụ, tên vụ, tội danh/điều luật, số QĐ KTVA hoặc kiểm sát viên..."
                 className="w-full max-w-md text-sm border border-slate-300 rounded-lg px-3 py-1.5 bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-300" />
          <select value={ksv} onChange={e => setKsv(e.target.value)}
                  className="text-sm border border-slate-300 rounded-lg px-3 py-1.5 bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-300">
            <option value="tat_ca">Tất cả KSV</option>
            {dsKsv.map(k => <option key={k} value={k}>{k}</option>)}
          </select>
          <span className="text-sm text-slate-500 whitespace-nowrap">Lọc theo kỳ:</span>
          <select value={locKy || "tat_ca"} onChange={e => setLocKy(e.target.value)}
                  className="text-sm border border-slate-300 rounded-lg px-3 py-1.5 bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-300">
            <option value="tat_ca">Tất cả</option>
            {dsKy.map(k => (
              <option key={k.id} value={k.id}>
                {k.tenKy}
                {k.loai === "luu_tru" ? " [Lưu trữ]" : k.trangThai === "dang_mo" ? " (đang mở)" : ""}
              </option>
            ))}
          </select>
        </div>
      </div>
      <div className="flex gap-1 mb-4 w-fit bg-slate-100 rounded-lg p-1">
        {TAB_DA_GIAI_QUYET.map(([v, l]) => (
          <button key={v} onClick={() => setHinhThuc(v)}
                  className={`text-sm px-4 py-1.5 rounded-md ${hinhThuc === v ? "bg-white shadow text-slate-800" : "text-slate-500"}`}>
            {l}
          </button>
        ))}
      </div>

      <div className="flex-1 flex gap-4 min-h-0">
        <div className="flex-1 min-w-0 bg-white border border-slate-200 rounded-xl flex flex-col min-h-0">
          {dangTai && <div className="p-4 text-sm text-slate-400">Đang tải...</div>}
          {!dangTai && listHienThi.length === 0 && (
            <div className="p-4 text-sm text-slate-400">
              {tuKhoa.trim()
                ? "Không có vụ nào khớp từ khoá tìm kiếm."
                : locKy && locKy !== "tat_ca"
                  ? `Không có vụ nào ở hình thức này trong ${tenKyDangChon || "kỳ đã chọn"}.`
                  : "Chưa có vụ nào ở hình thức này."}
            </div>
          )}
          {listHienThi.length > 0 && (
            <div className="flex-1 overflow-auto">
              <table className="w-full text-sm border-collapse">
                <thead className="bg-slate-100 text-slate-500 text-xs sticky top-0 z-10">
                  <tr>
                    <th className="text-left px-3 py-2 border-b border-slate-200 font-medium">Mã vụ</th>
                    <th className="text-left px-3 py-2 border-b border-slate-200 font-medium">Tên vụ</th>
                    <th className="text-left px-3 py-2 border-b border-slate-200 font-medium">KSV chính</th>
                    <th className="text-left px-3 py-2 border-b border-slate-200 font-medium">Giai đoạn khi giải quyết</th>
                    <th className="text-left px-3 py-2 border-b border-slate-200 font-medium">Số QĐ KTVA</th>
                    <th className="text-left px-3 py-2 border-b border-slate-200 font-medium">Ngày KTVA</th>
                    <th className="text-left px-3 py-2 border-b border-slate-200 font-medium">Số QĐ giải quyết</th>
                    <th className="text-left px-3 py-2 border-b border-slate-200 font-medium">Ngày giải quyết</th>
                    {hinhThuc === "chuyen_di" && <th className="text-left px-3 py-2 border-b border-slate-200 font-medium">Nơi chuyển đến</th>}
                  </tr>
                </thead>
                <tbody>
                  {listHienThi.map((v, i) => (
                    <tr key={v.id} onClick={() => setSelectedId(v.id)}
                        className={`cursor-pointer border-b border-l-4 border-slate-100 ${
                          selectedId === v.id ? "bg-indigo-50 border-l-indigo-500"
                            : i % 2 === 0 ? "bg-white border-l-transparent hover:bg-slate-50" : "bg-slate-50/70 border-l-transparent hover:bg-slate-100"
                        }`}>
                      <td className="p-3 text-xs text-slate-500 whitespace-nowrap">{hienThiMa(v)}</td>
                      <td className="p-3 font-medium text-slate-800">{v.tenVu}</td>
                      <td className="p-3">{v.ksvChinh || "—"}</td>
                      <td className="p-3"><Badge mau={MAU_GIAI_DOAN[v.coQuanThuLy]}>{NHAN_GIAI_DOAN[v.coQuanThuLy] || v.coQuanThuLy}</Badge></td>
                      <td className="p-3 text-xs whitespace-nowrap">{v.soQdKtva || "—"}</td>
                      <td className="p-3 text-xs whitespace-nowrap">{fmtDate(v.ngayQdKtva)}</td>
                      <td className="p-3 text-xs whitespace-nowrap">{v[FIELD_SO_QD_HOAN_THANH[hinhThuc]] || "—"}</td>
                      <td className={`p-3 text-xs whitespace-nowrap ${v.ngayQuyetDinhUocTinh ? "text-red-600 font-medium" : ""}`}
                          title={v.ngayQuyetDinhUocTinh ? "Ngày ước tính (= Ngày QĐ KTVA + 4 tháng) do import thiếu dữ liệu — cần cập nhật lại ngày thật." : ""}>
                        {fmtDate(v.ngayQuyetDinh)}{v.ngayQuyetDinhUocTinh ? " ⚠" : ""}
                      </td>
                      {hinhThuc === "chuyen_di" && <td className="p-3 text-xs">{v.noiChuyenDen || "—"}</td>}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
          <div className="text-xs text-slate-400 px-3 py-2 border-t border-slate-100">
            {listHienThi.length} vụ ở hình thức "{NHAN_TRANG_THAI[hinhThuc]}"
            {locKy && locKy !== "tat_ca" ? ` trong ${tenKyDangChon}` : " (tất cả kỳ)"}.
          </div>
        </div>
        <ChiTietPanel vuAnId={selectedId} onDoiSelected={setSelectedId} />
      </div>
    </div>
  );
}

// ====================================================================
// MODULE: GIAO NHẬN HỒ SƠ
// Dùng với đầu đọc mã QR không dây (giả lập bàn phím — gõ chuỗi mã vụ + Enter). Không hỏi kỳ
// báo cáo (giống "Sửa thông tin" — đây là log hành chính lưu vết ai giữ hồ sơ, không phải sự
// kiện nghiệp vụ làm đổi giai đoạn/trạng thái, không ảnh hưởng số liệu báo cáo kỳ).
// ====================================================================
function fmtNgayGio(d) {
  if (!d) return "—";
  const dt = d.toDate ? d.toDate() : (d instanceof Date ? d : new Date(d));
  if (isNaN(dt)) return "—";
  const date = `${String(dt.getDate()).padStart(2,"0")}/${String(dt.getMonth()+1).padStart(2,"0")}/${dt.getFullYear()}`;
  const time = `${String(dt.getHours()).padStart(2,"0")}:${String(dt.getMinutes()).padStart(2,"0")}`;
  return `${date} ${time}`;
}

function DongGiaoNhan({ stt, dong, dsCanBo, khoaSua, onSua, onXoa }) {
  const [dangSua, setDangSua] = useState(false);
  const [ksv, setKsv] = useState(dong.nguoiGiao || "");
  const [dtv, setDtv] = useState(dong.nguoiNhan || "");
  const [nguoiNhanThucTe, setNguoiNhanThucTe] = useState(dong.nguoiNhanThucTe || "");
  const [vuAnDeSua, setVuAnDeSua] = useState(null); // null=đóng, "loading"=đang tải, object=sẵn sàng mở form

  const luu = async () => {
    await onSua(dong.id, { nguoiGiao: ksv.trim(), nguoiNhan: dtv.trim(), nguoiNhanThucTe: nguoiNhanThucTe.trim() });
    setDangSua(false);
  };

  // Bấm vào bất kỳ đâu trên dòng (không chỉ đúng chữ "Sửa" nhỏ) là vào chế độ sửa ngay — thao
  // tác giao nhận diễn ra nhanh, đầu đọc QR quét liên tục, không nên bắt rê chuột chính xác vào
  // 1 link nhỏ mới sửa được. Nạp lại giá trị hiện tại của dòng phòng khi dữ liệu đã đổi từ lần
  // sửa trước (`onSnapshot` ở module cha có thể cập nhật `dong` trong lúc dòng đang đóng).
  const batDauSua = () => {
    if (khoaSua || dangSua) return;
    setKsv(dong.nguoiGiao || ""); setDtv(dong.nguoiNhan || ""); setNguoiNhanThucTe(dong.nguoiNhanThucTe || "");
    setDangSua(true);
  };

  // Sửa thông tin vụ án đầy đủ (KSV/ĐTV/đơn vị/điều luật/ghi chú...) ngay từ màn giao nhận — rất
  // nhiều hồ sơ lúc nhập ban đầu (import/tạo tay) chưa đủ thông tin, chỉ khi thực tế cầm hồ sơ lúc
  // giao/nhận mới biết rõ để bổ sung. KHÁC với sửa các trường của DÒNG giao nhận ở trên (KSV/ĐTV/
  // người nhận thực tế chỉ là snapshot lưu trên sự kiện log) — đây sửa thẳng vào chính `vuan`,
  // dùng lại nguyên `SuaVuAnForm` đã có ở panel chi tiết Danh sách vụ án để khỏi trùng logic. Luôn
  // cho phép kể cả khi phiên đã khoá (`khoaSua`) — khoá phiên chỉ chặn sửa dòng log, không liên
  // quan gì tới việc sửa thông tin vụ án.
  const moSuaThongTinVuAn = async (e) => {
    e.stopPropagation();
    setVuAnDeSua("loading");
    try {
      const doc = await db.collection("vuan").doc(dong.maVuAn).get();
      if (!doc.exists) {
        addToast(`Không tìm thấy vụ án ${dong.maVuAn} (có thể đã bị xoá).`, "error");
        setVuAnDeSua(null);
        return;
      }
      setVuAnDeSua({ id: doc.id, ...doc.data() });
    } catch (err) {
      console.error(err);
      addToast("Lỗi khi tải thông tin vụ án: " + err.message, "error");
      setVuAnDeSua(null);
    }
  };

  return (
    <>
      <tr className={`border-t border-slate-100 ${!khoaSua && !dangSua ? "cursor-pointer hover:bg-indigo-50/40" : ""}`}
          onClick={!khoaSua && !dangSua ? batDauSua : undefined}>
        <td className="p-3 text-slate-400">{stt}</td>
        <td className="p-3 text-xs text-slate-500 whitespace-nowrap">{dong.maVuAn}</td>
        <td className="p-3">
          <div className="font-medium text-slate-800">{dong.tenVu || "—"}</div>
          <div className="text-xs text-slate-400 mt-0.5">
            QĐ KTVA: {dong.soQdKtva || "—"} — {fmtDate(dong.ngayQdKtva)}
          </div>
          <button onClick={moSuaThongTinVuAn} disabled={vuAnDeSua === "loading"}
                  className="text-xs text-indigo-600 hover:text-indigo-700 hover:underline mt-1 disabled:opacity-50">
            {vuAnDeSua === "loading" ? "Đang tải..." : "✎ Sửa thông tin vụ án"}
          </button>
        </td>
        {dangSua ? (
          <>
            <td className="p-2" onClick={e => e.stopPropagation()}>
              <input value={ksv} onChange={e => setKsv(e.target.value)} list="ds-canbo-gnhs" className={oInput} autoFocus />
            </td>
            <td className="p-2" onClick={e => e.stopPropagation()}>
              <input value={dtv} onChange={e => setDtv(e.target.value)} list="ds-canbo-gnhs" className={oInput} />
            </td>
            <td className="p-2" onClick={e => e.stopPropagation()}>
              <input value={nguoiNhanThucTe} onChange={e => setNguoiNhanThucTe(e.target.value)} list="ds-canbo-gnhs" className={oInput} placeholder="Ghi rõ nếu khác ĐTV" />
            </td>
          </>
        ) : (
          <>
            <td className="p-3">{dong.nguoiGiao || "—"}</td>
            <td className="p-3">{dong.nguoiNhan || "—"}</td>
            <td className="p-3">{dong.nguoiNhanThucTe || <span className="text-slate-300">—</span>}</td>
          </>
        )}
        <td className="p-3 text-xs text-slate-400 whitespace-nowrap">{fmtNgayGio(dong.thoiDiemGhi)}</td>
        {!khoaSua && (
          <td className="p-3 whitespace-nowrap" onClick={e => e.stopPropagation()}>
            {dangSua ? (
              <>
                <button onClick={luu} className="text-indigo-600 hover:text-indigo-700 font-medium mr-2">Lưu</button>
                <button onClick={() => setDangSua(false)} className="text-red-400 hover:text-red-600">Huỷ</button>
              </>
            ) : (
              <>
                <button onClick={batDauSua} className="text-indigo-600 hover:text-indigo-700 font-medium mr-2">Sửa</button>
                <button onClick={() => onXoa(dong.id)} className="text-red-500 hover:text-red-700">Xoá</button>
              </>
            )}
          </td>
        )}
      </tr>
      {vuAnDeSua && vuAnDeSua !== "loading" && (
        <SuaVuAnForm vuAn={vuAnDeSua} onDong={() => setVuAnDeSua(null)} onXong={() => setVuAnDeSua(null)} />
      )}
    </>
  );
}

// Render qua portal vào #qr-print-root (đã dùng chung cho In mã QR) — xem chú thích @media
// print ở <head>: #root bị ẩn hẳn khi in, #qr-print-root thì không nên nội dung in ở đây luôn
// đứng vững dù #root có dài tới đâu.
function BienBanGiaoNhanIn({ phien, dsQuet, onDong }) {

        <div className="text-center mb-6">
          <div className="text-lg font-bold uppercase">Biên bản giao nhận hồ sơ</div>
          <div className="text-sm text-slate-500 mt-1">
            {phien.loaiGiaoDich === "giao" ? "Giao hồ sơ" : "Nhận hồ sơ"} — Lập lúc {fmtNgayGio(phien.thoiDiemLuu || phien.thoiDiemBatDau)}

        </div>
        <table className="w-full text-sm border border-slate-800 border-collapse table-fixed">

            <tr>

              <th className="border border-slate-800 p-2 w-24">Mã vụ</th>
              <th className="border border-slate-800 p-2">Tên vụ</th>
              <th className="border border-slate-800 p-2 w-24">KSV</th>
              <th className="border border-slate-800 p-2 w-24">ĐTV</th>
              <th className="border border-slate-800 p-2 w-32">Người nhận thực tế / Ký tên</th>
            </tr>
          </thead>
          <tbody>
            {dsInDung.map((d, i) => (
              <tr key={d.id}>
                <td className="border border-slate-800 p-2 text-center align-top">{i + 1}</td>
                <td className="border border-slate-800 p-2 align-top text-xs break-words">{d.maVuAn}</td>
                <td className="border border-slate-800 p-2 align-top">
                  <div>{d.tenVu}</div>
                  <div className="text-xs text-slate-500 mt-0.5">QĐ KTVA: {d.soQdKtva || "—"} — {fmtDate(d.ngayQdKtva)}</div>
