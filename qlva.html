const TEN_SHEET_DANH_SACH_AN = "Danh sách án";

function timTuNhan(nhanMap, text) {
  if (text == null || String(text).trim() === "") return null;
  const t = String(text).trim().toLowerCase();
  const hit = Object.entries(nhanMap).find(([, nhan]) => nhan.trim().toLowerCase() === t);
  return hit ? hit[0] : null;
}

// Đọc sheet "Danh sách án" — đúng mẫu 1 dòng/bị can (thông tin vụ lặp lại từng dòng, vụ 0 bị
// can vẫn 1 dòng với ô Họ tên BC ghi "(Chưa có BC)") như các sheet DS mới/DS tồn... trong Xuất
// Excel báo cáo tháng, cộng thêm các cột bắt buộc để tạo được vụ án hoàn chỉnh (Giai đoạn/Trạng
// thái/QĐ KTVA...) mà bản báo cáo không cần mang theo. Header ở đúng dòng 1 (giống hệt file xuất
// ra), dữ liệu từ dòng 2 — khác quy ước "header dòng 2" của mẫu DSAT/DSBCT cũ đã bỏ.
function parseWorkbookDanhSachAn(wb) {
  const warnings = [];
  if (!wb.SheetNames.includes(TEN_SHEET_DANH_SACH_AN)) {
    warnings.push(`Không tìm thấy sheet "${TEN_SHEET_DANH_SACH_AN}".`);
    return { vuAnList: [], warnings };
  }
  const ws = wb.Sheets[TEN_SHEET_DANH_SACH_AN];
  // range: 1 nghĩa là bỏ qua đúng 1 dòng đầu (dòng 1 = header), đọc từ dòng 2 trở xuống — đã
  // kiểm chứng lại bằng SheetJS thật, không phải chỗ hay sai.
  const rawRows = XLSX.utils.sheet_to_json(ws, { header: 1, range: 1, defval: null });
  // Một dòng được coi là "có dữ liệu" nếu có Tên vụ HOẶC Ngày QĐ KTVA — KHÔNG bắt buộc "Mã vụ"
  // (cột A) nữa (2026-07-13). Trước đây bắt buộc cột A khiến việc import án nguồn từ NGOÀI hệ
  // thống (chưa hề có mã vụ, đúng nhu cầu tính năng này) đọc ra 0 dòng dù dữ liệu hợp lệ đầy đủ.
  const rows = rawRows.filter(r => r && ((r[1] != null && String(r[1]).trim() !== "") || r[8] != null));
  if (rows.length === 0) {
    if (rawRows.length === 0) {
      warnings.push(
        `Sheet "${TEN_SHEET_DANH_SACH_AN}" không có dòng nào từ DÒNG 2 trở xuống (hệ thống luôn ` +
        `bỏ qua dòng 1, coi là hàng tiêu đề). Kiểm tra lại: dữ liệu có đang nằm nhầm ở DÒNG 1 ` +
        `không (bị hiểu nhầm là tiêu đề nên bị bỏ qua), hay dòng 2 đang thật sự còn trống?`
      );
    } else {
      warnings.push(
        `Đọc được ${rawRows.length} dòng từ dòng 2 trở xuống, nhưng không dòng nào có "Tên vụ" ` +
        `hay "Ngày QĐ KTVA" — kiểm tra lại 2 cột đó có bị để trống, hoặc dữ liệu có bị lệch sang ` +
        `cột khác (VD do lỡ chèn/xoá nhầm 1 cột) không.`
      );
    }
    return { vuAnList: [], warnings };
  }

  // Nhóm các dòng thuộc cùng 1 vụ (nhiều bị can = nhiều dòng): ưu tiên "Mã vụ" (cột A) nếu có —
  // đúng hành vi cũ, cho vụ đã có mã sẵn (từ hệ thống khác/đã cấp trước). Nếu "Mã vụ" bỏ trống
  // (án nguồn ngoài hệ thống, CHƯA có mã) thì nhóm theo cặp "Số QĐ KTVA" + "Ngày QĐ KTVA" — đúng
  // nghiệp vụ: các dòng cùng Số/Ngày QĐ KTVA là nhiều bị can của CÙNG 1 vụ. Vụ nhóm theo QĐ KTVA
  // sẽ được tự sinh mã hệ thống mới (`maNoiSinh`, qua `sinhNhieuMaVuAn`) lúc ghi vào CSDL — y hệt
  // cách `ThemVuAnForm` cấp mã cho vụ tạo tay, không cần "Mã vụ" ở cột A mới tạo được vụ.
  const vuMap = new Map();
  rows.forEach((r, idx) => {
    const soDong = idx + 2;
    const maVu = (r[0] != null ? String(r[0]).trim() : "");
    const soQdKtva = (r[7] || "").toString().trim();
    const ngayQdKtva = parseExcelDate(r[8]);
    let groupKey;
    if (maVu) groupKey = `MA::${maVu.toLowerCase()}`;
    else if (ngayQdKtva) groupKey = `QD::${soQdKtva.toLowerCase()}::${fmtDate(ngayQdKtva)}`;
    else groupKey = `LOI::${idx}`; // không có cả Mã vụ lẫn Ngày QĐ KTVA — không gộp nhầm với dòng khác

    if (!vuMap.has(groupKey)) {
      const giaiDoan = timTuNhan(NHAN_GIAI_DOAN, r[2]);
      if (!giaiDoan) warnings.push(`Dòng ${soDong}: không nhận diện được Giai đoạn "${r[2] ?? ""}" — mặc định Điều tra.`);
      const trangThai = timTuNhan(NHAN_TRANG_THAI, r[3]) || "dang_giai_quyet";
      const nguon = timTuNhan(NHAN_NGUON, r[6]) || "an_khoi_to_moi";
      let ngayQuyetDinh = parseExcelDate(r[4]);
      const tenVu = (r[1] || "").toString().trim();
      const ksvChinh = (r[9] || "").toString().trim();

      // Bắt buộc tối thiểu: Số QĐ KTVA + Ngày QĐ KTVA + KSV chính — đủ để nhập nhanh 1 vụ mới
      // phát sinh, các thông tin còn thiếu khác (Tên vụ, Điều luật, đơn vị thụ lý...) bổ sung
      // sau qua nút "Sửa thông tin vụ án" (ở cả panel chi tiết Danh sách vụ án lẫn màn Giao nhận
      // hồ sơ). Tên vụ KHÔNG còn bắt buộc — nếu bỏ trống, tự đặt tên tạm từ bị can đầu tiên (xem
      // đoạn điền tên tạm cuối hàm), giống quy ước "Họ tên BC đại diện + và đồng phạm" của mẫu
      // DSAT cũ, thay vì để trống "(chưa đặt tên)" khó nhận biết trên danh sách.
      const thieu = [];
      if (!soQdKtva) thieu.push("thiếu Số QĐ KTVA");
      if (!ngayQdKtva) thieu.push("thiếu/sai Ngày QĐ KTVA (bắt buộc để nhóm bị can + tự sinh mã vụ)");
      if (!ksvChinh) thieu.push("thiếu KSV chính");

      // Vụ đã có kết quả (Trạng thái khác "Đang giải quyết") nhưng thiếu Ngày quyết định — dữ
      // liệu cũ hay thiếu khoản này (theo yêu cầu người dùng 2026-07-13) — KHÔNG chặn import nữa,
      // tạm dùng ngày ước tính = Ngày QĐ KTVA + 4 tháng, kèm ghi rõ trong ghi chú của vụ để cán bộ
      // biết mà cập nhật lại ngày thật sau. Chỉ áp dụng được khi đã có Ngày QĐ KTVA (nếu thiếu cả
      // 2 thì vụ vẫn bị chặn ở nhánh "thiếu/sai Ngày QĐ KTVA" phía trên, không có gì để cộng thêm).
      let ghiChuTuDong = "";
      let ngayQuyetDinhUocTinh = false;
      if (trangThai !== "dang_giai_quyet" && !ngayQuyetDinh && ngayQdKtva) {
        ngayQuyetDinh = new Date(ngayQdKtva);
        ngayQuyetDinh.setMonth(ngayQuyetDinh.getMonth() + 4);
        ngayQuyetDinhUocTinh = true;
        ghiChuTuDong = `⚠ Ngày quyết định là NGÀY ƯỚC TÍNH (= Ngày QĐ KTVA + 4 tháng, do dữ liệu nguồn thiếu) — cần cập nhật lại ngày thật khi có.`;
        warnings.push(`Dòng ${soDong}: thiếu Ngày quyết định (Trạng thái "${r[3]}") — tạm dùng ngày ước tính ${fmtDate(ngayQuyetDinh)} (= Ngày QĐ KTVA + 4 tháng), cần cập nhật lại sau.`);
      }

      vuMap.set(groupKey, {
        maVu, tenVu, coQuanThuLy: giaiDoan || "dieu_tra", trangThai,
        ngayQuyetDinh, ngayQuyetDinhUocTinh, soQuyetDinh: (r[5] || "").toString().trim(), nguon,
        soQdKtva, ngayQdKtva, ghiChu: ghiChuTuDong,
        ksvChinh, dtvCbdt: (r[10] || "").toString().trim(),
        dieuLuat: (r[11] || "").toString().trim(), hanDieuTra: parseExcelDate(r[12]),
        biCanList: [], _loi: thieu.length ? thieu.join("; ") : null,
      });
    }

    const hoTenBC = (r[14] || "").toString().trim();
    if (hoTenBC && hoTenBC !== "(Chưa có BC)") {
      const gioiTinhRaw = (r[16] || "").toString().trim().toLowerCase();
      const bienPhapRaw = (r[20] || "").toString().trim().toLowerCase();
      const hanTG = parseExcelDate(r[21]);
      let bienPhap = "tai_ngoai";
      if (bienPhapRaw.includes("tạm giam")) bienPhap = "giam";
      else if (!bienPhapRaw && hanTG) bienPhap = "giam";
      vuMap.get(groupKey).biCanList.push({
        hoTen: hoTenBC,
        namSinh: typeof r[15] === "number" ? r[15] : (r[15] ? Number(r[15]) || null : null),
        gioiTinh: gioiTinhRaw === "nữ" || gioiTinhRaw === "nu" ? "nu" : "nam",
        danToc: (r[17] || "").toString().trim() || "Kinh",
        diaChi: (r[18] || "").toString().trim(),
        toiDanh: (r[19] || "").toString().trim(),
        bienPhapNganChan: bienPhap, hanTamGiam: bienPhap === "giam" ? hanTG : null,
        dangVien: (r[22] != null && String(r[22]).trim() !== "") ? "co" : "khong",
      });
    }
  });

  // Tên vụ bỏ trống nhưng đã có bị can → tự đặt tên tạm từ bị can đầu tiên (không tính vào lỗi,
  // chỉ là tên hiển thị tạm — người dùng bổ sung tên chính thức sau nếu cần).
  vuMap.forEach(v => {
    if (!v.tenVu && v.biCanList.length > 0) {
      v.tenVu = v.biCanList[0].hoTen + (v.biCanList.length > 1 ? " và đồng phạm" : "");
    }
  });

  return { vuAnList: Array.from(vuMap.values()), warnings };
}

// Sinh hàng loạt mã vụ án hệ thống (maNoiSinh) cho các vụ mới, gom theo tháng QĐ KTVA để chỉ
// cần 1 transaction/tháng thay vì 1 transaction/vụ như sinhMaVuAnMoi — tránh chậm khi import
// nhiều vụ cùng lúc. Mutate thẳng từng vụ trong dsVu, gắn field _maNoiSinh.
async function sinhNhieuMaVuAn(dsVu) {
  const nhom = new Map();
  dsVu.forEach(v => {
    const d = v.ngayQdKtva instanceof Date && !isNaN(v.ngayQdKtva) ? v.ngayQdKtva : new Date();
    const yymm = String(d.getFullYear()).slice(-2) + String(d.getMonth() + 1).padStart(2, "0");
    if (!nhom.has(yymm)) nhom.set(yymm, []);
    nhom.get(yymm).push(v);
  });
  for (const [yymm, list] of nhom) {
    const counterRef = db.collection("boDemMaVu").doc(yymm);
    const soBatDau = await db.runTransaction(async (tx) => {
      const snap = await tx.get(counterRef);
      const hienTai = snap.exists ? (snap.data().soHienTai || 0) : 0;
      tx.set(counterRef, { soHienTai: hienTai + list.length }, { merge: true });
      return hienTai;
    });
    list.forEach((v, i) => { v._maNoiSinh = `QLVA_E01.53_${yymm}_${pad4(soBatDau + i + 1)}`; });
  }
}

function ImportExcelModule() {
  const [fileName, setFileName] = useState("");
  const [ketQuaDoc, setKetQuaDoc] = useState(null); // { moi[], trung[], loi[], warnings[] }
  const [status, setStatus] = useState("idle"); // idle | parsing | checking | ready | writing | done | error
  const [progress, setProgress] = useState(0);
  const [errorMsg, setErrorMsg] = useState("");
  const [hienModalKy, setHienModalKy] = useState(false);
  const [ketQuaGhi, setKetQuaGhi] = useState(null);

  const onFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setFileName(file.name);
    setStatus("parsing");
    setErrorMsg("");
    setKetQuaDoc(null);
    setKetQuaGhi(null);
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type: "array", cellDates: true });
        const { vuAnList, warnings } = parseWorkbookDanhSachAn(wb);
        if (vuAnList.length === 0 && warnings.length === 0) warnings.push("Sheet không có dòng dữ liệu nào.");
        setStatus("checking");

        // Đối chiếu Firestore để nhận diện vụ trùng theo mã vụ án -> Số/Ngày QĐ KTVA.
        const vuSnap = await db.collection("vuan").get();
        const byMa = new Map();
        const byQdNgay = new Map();
        vuSnap.docs.forEach(d => {
          const v = d.data();
          if (v.maNganhCap) byMa.set(String(v.maNganhCap).trim().toLowerCase(), d.id);
          if (v.maNoiSinh) byMa.set(String(v.maNoiSinh).trim().toLowerCase(), d.id);
          if (v.soQdKtva && v.ngayQdKtva) {
            byQdNgay.set(`${String(v.soQdKtva).trim().toLowerCase()}__${fmtDate(v.ngayQdKtva)}`, d.id);
          }
        });

        const moi = [], trung = [], loi = [];
        vuAnList.forEach(v => {
          if (v._loi) { loi.push(v); return; }
          if (v.maVu) {
            const idTrungMa = byMa.get(v.maVu.toLowerCase());
            if (idTrungMa) { trung.push({ ...v, _lyDoTrung: `Trùng mã vụ với vụ đã có (${idTrungMa})` }); return; }
          }
          if (v.soQdKtva && v.ngayQdKtva) {
            const idTrungQd = byQdNgay.get(`${v.soQdKtva.trim().toLowerCase()}__${fmtDate(v.ngayQdKtva)}`);
            if (idTrungQd) { trung.push({ ...v, _lyDoTrung: `Trùng Số/Ngày QĐ KTVA với vụ đã có (${idTrungQd})` }); return; }
          }
          moi.push(v);
        });

        setKetQuaDoc({ moi, trung, loi, warnings });
        setStatus("ready");
      } catch (err) {
        console.error(err);
        setErrorMsg(`Không đọc được file. Kiểm tra lại đây có đúng sheet "${TEN_SHEET_DANH_SACH_AN}" và đúng cấu trúc cột mẫu không.`);
        setStatus("error");
      }
    };
    reader.readAsArrayBuffer(file);
  };

  const ghiVaoCoSoDuLieu = async (kyId) => {
    if (!ketQuaDoc || ketQuaDoc.moi.length === 0) return;
    setStatus("writing");
    setProgress(0);
    try {
      const dsMoi = ketQuaDoc.moi;
      await sinhNhieuMaVuAn(dsMoi);

      const now = new Date();
      const nguoiThucHien = auth.currentUser?.email || "";
      const ghiChuNhap = "Nhập qua Import Excel (Danh sách án).";
      const total = dsMoi.reduce((s, v) => s + 1 + v.biCanList.length, 0);
      let done = 0;
      let batch = db.batch();
      let ops = 0;
      const commitNeu = async () => { if (ops >= 400) { await batch.commit(); batch = db.batch(); ops = 0; } };

      for (const v of dsMoi) {
        const maNoiSinh = v._maNoiSinh;
        const vuData = {
          maNoiSinh, maNganhCap: v.maVu || null, tenVu: v.tenVu,
          coQuanThuLy: v.coQuanThuLy, trangThai: v.trangThai,
          nguon: v.nguon, nguonChiTiet: "",
          soQdKtva: v.soQdKtva, ngayQdKtva: v.ngayQdKtva, hanDieuTra: v.hanDieuTra,
          ksvChinh: v.ksvChinh, ksvHoTro: [], dtvCbdt: v.dtvCbdt, donViThuLy: "",
          dieuLuat: v.dieuLuat, vuanToiDanh: [], vuanDieuLuat: [],
          mucDoNghiemTrong: "nghiem_trong",
          noiChuyenDen: "", nhapVaoVu: null, vuGoc: null, soDemTach: 0,
          anDiem: false, uyQuyenXetXu: "", phienToaRutKN: false, ghiChu: v.ghiChu || "",
          soKetLuanDieuTra: "", soCaoTrang: "", soBanAn: "",
          soQuyetDinhChuyenDi: "", soQuyetDinhTamDinhChi: "", soQuyetDinhDinhChi: "", soQuyetDinhAnHuy: "",
          ngayTao: now, nguoiTao: nguoiThucHien, ngayCapNhat: now, nguoiCapNhatCuoi: nguoiThucHien,
          nguonNhapLieu: "import_excel",
        };
        if (v.trangThai !== "dang_giai_quyet") {
          vuData.ngayQuyetDinh = v.ngayQuyetDinh;
          vuData.kyHoanThanh = kyId;
          // Đánh dấu để "Án đã giải quyết" hiện đỏ + "Sửa thông tin vụ án" biết mà xoá cờ này khi
          // người dùng đã sửa lại ngày thật — xem AnDaGiaiQuyetModule/SuaVuAnForm.
          if (v.ngayQuyetDinhUocTinh) vuData.ngayQuyetDinhUocTinh = true;
          const field = fieldSoQuyetDinhTrenVuAn(v.trangThai);
          if (field) vuData[field] = v.soQuyetDinh || "";
        }
        batch.set(db.collection("vuan").doc(maNoiSinh), vuData);
        ops++; done++;

        batch.set(db.collection("lichsuChuyenGiaiDoan").doc(), taoSuKien({
          maVuAn: maNoiSinh, loaiSuKien: "khoi_to_vu", denGiaiDoan: v.coQuanThuLy,
          ngaySuKien: v.ngayQdKtva, kyThongKe: kyId, ghiChu: ghiChuNhap,
          nguoiThucHien, thoiDiemGhi: now,
        }));
        ops++;

        if (v.trangThai !== "dang_giai_quyet") {
          batch.set(db.collection("lichsuChuyenGiaiDoan").doc(), taoSuKien({
            maVuAn: maNoiSinh, loaiSuKien: "hoan_thanh", hinhThucHoanThanh: v.trangThai,
            soQuyetDinh: v.soQuyetDinh || "", ngaySuKien: v.ngayQuyetDinh || v.ngayQdKtva,
            kyThongKe: kyId, ghiChu: v.ghiChu ? `${ghiChuNhap} ${v.ghiChu}` : ghiChuNhap,
            nguoiThucHien, thoiDiemGhi: now,
          }));
          ops++;
        }
        await commitNeu();

        // Tính loaiKhoiTo đúng cho từng bị can: "ban_dau" = ngày khởi tố sớm nhất, còn lại "bo_sung"
        const ngayKhoiToList = v.biCanList.map(bc =>
          bc.ngayKhoiTo ? (bc.ngayKhoiTo instanceof Date ? bc.ngayKhoiTo : new Date(bc.ngayKhoiTo)) : null
        );
        const loaiKhoiToList = tinhLoaiKhoiToTheoNgay(ngayKhoiToList);

        for (let i = 0; i < v.biCanList.length; i++) {
          const bc = v.biCanList[i];
          const bcRef = db.collection("bican").doc();
          batch.set(bcRef, {
            maVuAn: maNoiSinh, hoTen: bc.hoTen, namSinh: bc.namSinh,
            gioiTinh: bc.gioiTinh, toiDanh: bc.toiDanh ? [bc.toiDanh] : [""], dieuLuatBC: [""],
            dangVien: bc.dangVien, dangVienGiuChucVu: false,
            danToc: bc.danToc, quocTich: "Việt Nam", trinhDo: "", taiPham: "khong",
            loaiBiCan: "ca_nhan", tenPhapNhan: "", maSoThue: "",
            diaChi: bc.diaChi, bienPhapNganChan: bc.bienPhapNganChan, hanTamGiam: bc.hanTamGiam,
            ngayKhoiTo: v.ngayQdKtva, loaiKhoiTo: loaiKhoiToList[i], kyThongKeKhoiTo: kyId,
            ngayTao: now, nguoiTao: nguoiThucHien, nguonNhapLieu: "import_excel",
          });
          ops++; done++;
          batch.set(db.collection("lichsuChuyenGiaiDoan").doc(), taoSuKien({
            maVuAn: maNoiSinh, loaiSuKien: "khoi_to_bican", maBiCan: bcRef.id,
            ngaySuKien: v.ngayQdKtva, kyThongKe: kyId, ghiChu: ghiChuNhap,
            nguoiThucHien, thoiDiemGhi: now,
          }));
          ops++;
          await commitNeu();
          if (done % 20 === 0) setProgress(Math.round(done / total * 100));
        }
      }
      if (ops > 0) await batch.commit();

      setProgress(100);
      setKetQuaGhi({ soVu: dsMoi.length, soBiCan: dsMoi.reduce((s, v) => s + v.biCanList.length, 0) });
      setStatus("done");
    } catch (err) {
      console.error(err);
      setErrorMsg("Lỗi khi ghi vào Firestore: " + err.message);
      setStatus("error");
    }
  };

  return (
    <div className="max-w-3xl">
      <h2 className="text-lg font-semibold mb-1">Import dữ liệu từ Excel</h2>
      <p className="text-sm text-slate-500 mb-6">
        Tải lên file Excel có sheet <code className="bg-slate-100 px-1 rounded">{TEN_SHEET_DANH_SACH_AN}</code> —
        đúng mẫu "Danh sách án" mà hệ thống xuất ra ở Kỳ báo cáo (1 dòng/bị can, vụ nhiều bị can
        lặp lại nhiều dòng). Cột "Mã vụ" (cột A) có thể để TRỐNG nếu là án nguồn từ ngoài hệ
        thống chưa có mã — hệ thống tự cấp mã hệ thống mới cho vụ đó, và nhóm các dòng cùng 1 vụ
        theo Số + Ngày QĐ KTVA giống nhau thay vì theo mã (nên với vụ chưa có mã, Số/Ngày QĐ KTVA
        phải giống hệt nhau trên mọi dòng bị can của vụ đó). <b>Chỉ bắt buộc 3 cột: Số QĐ KTVA,
        Ngày QĐ KTVA, KSV chính</b> — các thông tin khác (Tên vụ, Điều luật, đơn vị thụ lý...) để
        trống được, bổ sung sau qua nút "Sửa thông tin vụ án" (Tên vụ để trống sẽ tự đặt tạm theo
        tên bị can đầu tiên). Vụ đã có Trạng thái kết quả (VD Tạm đình chỉ) mà thiếu "Ngày quyết
        định" cũng KHÔNG bị chặn — hệ thống tự tạm dùng ngày ước tính (= Ngày QĐ KTVA + 4 tháng)
        và ghi rõ trong ghi chú của vụ để cập nhật lại ngày thật sau. Hệ thống tự nhận diện vụ đã
        có trong hệ thống (theo mã vụ nếu có điền, hoặc theo Số + Ngày QĐ KTVA) để bỏ qua, tránh
        ghi trùng/lỗi xung đột — chỉ những vụ thật sự mới mới được đưa vào xem trước và cho phép
        ghi vào hệ thống.
      </p>

      {status !== "writing" && status !== "done" && (
        <label className="block border-2 border-dashed border-indigo-300 rounded-xl p-8 text-center cursor-pointer hover:bg-indigo-50/50 transition mb-4">
          <input type="file" accept=".xlsx,.xls" className="hidden" onChange={onFile} />
          <div className="text-indigo-600 font-medium mb-1">Chọn file Excel...</div>
          <div className="text-xs text-slate-400">{fileName || "Chưa chọn file"}</div>
        </label>
      )}

      {(status === "parsing" || status === "checking") && (
        <div className="text-sm text-slate-500">
          {status === "parsing" ? "Đang đọc file..." : "Đang đối chiếu với dữ liệu đã có trong hệ thống..."}
        </div>
      )}

      {status === "error" && (
        <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-4">{errorMsg}</div>
      )}

      {status === "ready" && ketQuaDoc && (
        <div>
          {ketQuaDoc.warnings.length > 0 && (
            <div className="bg-amber-50 border border-amber-200 text-amber-800 text-sm rounded-lg p-3 mb-4">
              {ketQuaDoc.warnings.map((w,i) => <div key={i}>⚠ {w}</div>)}
            </div>
          )}
          <div className="grid grid-cols-3 gap-4 mb-4">
            <div className="bg-white border border-slate-200 rounded-xl p-4">
              <div className="text-2xl font-semibold text-emerald-600">{ketQuaDoc.moi.length}</div>
              <div className="text-xs text-slate-500">vụ mới — sẽ được import</div>
            </div>
            <div className="bg-white border border-slate-200 rounded-xl p-4">
              <div className="text-2xl font-semibold text-slate-400">{ketQuaDoc.trung.length}</div>
              <div className="text-xs text-slate-500">vụ trùng — sẽ bỏ qua</div>
            </div>
            <div className="bg-white border border-slate-200 rounded-xl p-4">
              <div className="text-2xl font-semibold text-red-500">{ketQuaDoc.loi.length}</div>
              <div className="text-xs text-slate-500">vụ thiếu dữ liệu — sẽ bỏ qua</div>
            </div>
          </div>

          {ketQuaDoc.moi.length > 0 && (
            <>
              <div className="text-sm font-medium text-slate-600 mb-2">Xem trước vụ mới (tối đa 8 dòng)</div>
              <div className="border border-slate-200 rounded-xl overflow-hidden mb-6">
                <table className="w-full text-xs">
                  <thead className="bg-slate-50 text-slate-500">
                    <tr>
                      <th className="text-left p-2">Mã vụ</th>
                      <th className="text-left p-2">Tên vụ</th>
                      <th className="text-left p-2">Giai đoạn</th>
                      <th className="text-left p-2">Trạng thái</th>
                      <th className="text-left p-2">Ngày QĐ KTVA</th>
                      <th className="text-left p-2">Số BC</th>
                    </tr>
                  </thead>
                  <tbody>
                    {ketQuaDoc.moi.slice(0,8).map((v,i) => (
                      <tr key={i} className="border-t border-slate-100">
                        <td className="p-2">{v.maVu || <span className="text-slate-400 italic">(tự sinh mã)</span>}</td>
                        <td className="p-2">{v.tenVu}</td>
                        <td className="p-2">{NHAN_GIAI_DOAN[v.coQuanThuLy]}</td>
                        <td className="p-2">{NHAN_TRANG_THAI[v.trangThai]}</td>
                        <td className="p-2">{fmtDate(v.ngayQdKtva)}</td>
                        <td className="p-2">{v.biCanList.length}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </>
          )}

          {ketQuaDoc.trung.length > 0 && (
            <details className="mb-4">
              <summary className="text-sm font-medium text-slate-600 cursor-pointer">
                {ketQuaDoc.trung.length} vụ trùng sẽ bị bỏ qua — bấm để xem
              </summary>
              <div className="border border-slate-200 rounded-xl overflow-hidden mt-2">
                <table className="w-full text-xs">
                  <tbody>
                    {ketQuaDoc.trung.map((v,i) => (
                      <tr key={i} className="border-t border-slate-100">
                        <td className="p-2 text-slate-500 whitespace-nowrap">{v.maVu}</td>
                        <td className="p-2">{v.tenVu}</td>
                        <td className="p-2 text-slate-400">{v._lyDoTrung}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </details>
          )}

          {ketQuaDoc.loi.length > 0 && (
            <details className="mb-4">
              <summary className="text-sm font-medium text-red-600 cursor-pointer">
                {ketQuaDoc.loi.length} vụ thiếu dữ liệu bắt buộc — bấm để xem, sửa lại file rồi tải lên lại
              </summary>
              <div className="border border-red-200 rounded-xl overflow-hidden mt-2">
                <table className="w-full text-xs">
                  <tbody>
                    {ketQuaDoc.loi.map((v,i) => (
                      <tr key={i} className="border-t border-red-100">
                        <td className="p-2 text-slate-500 whitespace-nowrap">{v.maVu}</td>
                        <td className="p-2">{v.tenVu || "(chưa có tên)"}</td>
                        <td className="p-2 text-red-500">{v._loi}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </details>
          )}

          <div className="bg-slate-50 border border-slate-200 rounded-lg p-3 text-xs text-slate-500 mb-4">
            Vụ mới sẽ được cấp mã hệ thống riêng (giống tạo tay qua "Thêm vụ án"), mã trong file được
            giữ lại làm mã tham chiếu (Mã ngành cấp). Hệ thống tự ghi đầy đủ nhật ký "Khởi tố vụ/bị can"
            {ketQuaDoc.moi.some(v => v.trangThai !== "dang_giai_quyet") ? ` và "Hoàn thành" (vụ đã có trạng thái giải quyết trong file)` : ""} —
            không cần chạy công cụ "Dựng lại lịch sử" bên dưới cho dữ liệu import bằng mẫu này.
          </div>

          <button onClick={() => setHienModalKy(true)} disabled={ketQuaDoc.moi.length === 0}
                  className="bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg px-4 py-2 text-sm font-medium disabled:opacity-50">
            Ghi {ketQuaDoc.moi.length} vụ mới vào hệ thống
          </button>
        </div>
      )}

      {status === "writing" && (
        <div>
          <div className="text-sm text-slate-600 mb-2">Đang ghi vào hệ thống... {progress}%</div>
          <div className="w-full bg-slate-200 rounded-full h-2">
            <div className="bg-indigo-600 h-2 rounded-full transition-all" style={{width: progress + "%"}}></div>
          </div>
        </div>
      )}

      {status === "done" && ketQuaGhi && (
        <div className="bg-green-50 border border-green-200 text-green-700 text-sm rounded-lg p-4">
          ✓ Đã nhập {ketQuaGhi.soVu} vụ án mới ({ketQuaGhi.soBiCan} bị can) vào hệ thống, kèm đầy đủ nhật ký.
          Anh có thể chuyển sang module "Danh sách vụ án" để xem lại.
        </div>
      )}

      <ModalXacNhanKy open={hienModalKy}
        onXacNhan={(kyId) => { setHienModalKy(false); ghiVaoCoSoDuLieu(kyId); }}
        onHuy={() => setHienModalKy(false)} />

      <BackfillNgayQuyetDinhTool />
      <DungLaiLichSuTool />
      <SeedDanhMucTool />
      <BackfillDieuLuatBCTool />
      <BackfillLoaiKhoiToTool />
      <TaiTaoTonTheoTDTool />
    </div>
  );
}

// ====================================================================
// MODAL DÙNG CHUNG: XÁC NHẬN KỲ BÁO CÁO
// Mọi thao tác nghiệp vụ ghi log đều đi qua modal này để hỏi "tính vào kỳ nào" —
// mặc định kỳ đang mở, cho đổi sang kỳ khác. Chưa có module Kỳ báo cáo nên nếu
// Firestore chưa có bản ghi kybaocao nào thì vẫn cho tiếp tục với kyThongKe = null.
// ====================================================================
function ModalXacNhanKy({ open, onXacNhan, onHuy }) {
  const [danhSachKy, setDanhSachKy] = useState([]);
  const [dangTai, setDangTai] = useState(true);
  const [kyChon, setKyChon] = useState("");

  useEffect(() => {
    if (!open) return;
    setDangTai(true);
    db.collection("kybaocao").orderBy("ngayBatDau", "desc").get()
      .then(snap => {
        const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        setDanhSachKy(list);
        const dangMo = list.find(k => k.trangThai === "dang_mo" && k.loai !== "luu_tru");
        const fallback = list.find(k => k.loai !== "luu_tru");
        setKyChon(dangMo ? dangMo.id : (fallback ? fallback.id : (list[0] ? list[0].id : "")));
      })
      .catch(err => console.error(err))
      .finally(() => setDangTai(false));
  }, [open]);

  if (!open) return null;

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
      <div className="bg-white rounded-xl shadow-lg p-6 w-[420px]">
        <div className="text-base font-semibold mb-1">Tính vào kỳ báo cáo nào?</div>
        <div className="text-xs text-slate-500 mb-4">Có thể sửa lại sau, hệ thống lưu lịch sử sửa kỳ.</div>
        {dangTai && <div className="text-sm text-slate-400 mb-4">Đang tải danh sách kỳ...</div>}
        {!dangTai && danhSachKy.length === 0 && (
          <div className="bg-amber-50 border border-amber-200 text-amber-800 text-xs rounded-lg p-3 mb-4">
            Chưa có kỳ báo cáo nào trong hệ thống (module Kỳ báo cáo chưa xây dựng). Thao tác vẫn
            được lưu nhưng chưa gán vào kỳ nào — gán lại sau khi có module Kỳ báo cáo.
          </div>
        )}
        {!dangTai && danhSachKy.length > 0 && (() => {
          const kyChonObj = danhSachKy.find(k => k.id === kyChon);
          return (
            <>
              <select value={kyChon} onChange={e => setKyChon(e.target.value)}
                      className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mb-2">
                {danhSachKy.map(k => (
                  <option key={k.id} value={k.id}>
                    {k.tenKy}
                    {k.loai === "luu_tru" ? " [Lưu trữ]" : k.trangThai === "dang_mo" ? " (đang mở)" : " ✓ đã chốt"}
                  </option>
                ))}
              </select>
              {kyChonObj?.loai === "luu_tru" && (
                <div className="bg-teal-50 border border-teal-200 text-teal-800 text-xs rounded-lg px-3 py-2 mb-3">
                  Kỳ lưu trữ — sự kiện này <b>không tính vào số liệu báo cáo</b> tháng nào.
                </div>
              )}
              {kyChonObj?.trangThai === "da_chot" && kyChonObj?.loai !== "luu_tru" && (
                <div className="bg-amber-50 border border-amber-200 text-amber-800 text-xs rounded-lg px-3 py-2 mb-3">
                  ⚠️ Kỳ này đã chốt — sau khi xác nhận, vào <b>Kỳ báo cáo</b> → bấm <b>"Tính lại số liệu"</b> cho kỳ này để báo cáo cập nhật đúng.
                </div>
              )}
            </>
          );
        })()}
        <div className="flex justify-end gap-2">
          <button onClick={onHuy} className="px-4 py-2 text-sm rounded-lg text-red-600 hover:bg-red-50">Huỷ</button>
          <button onClick={() => onXacNhan(kyChon || null)}
                  className="px-4 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium">
            Xác nhận
          </button>
        </div>
      </div>
    </div>
  );
}

// ====================================================================
// CÁC MODAL HÀNH ĐỘNG NGHIỆP VỤ TRÊN 1 VỤ ÁN
// Mỗi modal: điền form -> ModalXacNhanKy -> ghi Firestore. Dùng chung useHanhDongVuAn.
// ====================================================================
function KhungModalHanhDong({ tieuDe, rong, rongnhat, children }) {
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-40">
      <div className={`bg-white rounded-xl shadow-lg p-6 ${rongnhat ? "w-[760px]" : rong ? "w-[520px]" : "w-[420px]"} max-w-[95vw] max-h-[90vh] overflow-y-auto`}>
        <div className="text-base font-semibold mb-4">{tieuDe}</div>
        {children}
      </div>
    </div>
  );
}

// Số quyết định gắn với việc chuyển giai đoạn phụ thuộc giai đoạn ĐẾN: Điều tra->Truy tố là số
// kết luận điều tra (viện dựa vào đó truy tố), Truy tố->Xét xử là số cáo trạng (viện truy tố
// bằng cáo trạng, chuyển hồ sơ sang toà). Không có nhãn cho trường hợp khác vì hệ thống chỉ có
// 3 giai đoạn tuần tự, chuyển tiến luôn đúng 1 trong 2 case này.
function nhanSoQuyetDinhChuyen(denGiaiDoan) {
  if (denGiaiDoan === "truy_to") return "Số kết luận điều tra";
  if (denGiaiDoan === "xet_xu") return "Số cáo trạng";
  return "Số quyết định";
}

function ChuyenGiaiDoanModal({ vuAn, onDong, onXong }) {
  const hd = useHanhDongVuAn();
  const [ngay, setNgay] = useState("");
  const [soQuyetDinh, setSoQuyetDinh] = useState("");
  const [ghiChu, setGhiChu] = useState("");
  const denGiaiDoan = giaiDoanKeTiep(vuAn.coQuanThuLy);
  const nhanSo = nhanSoQuyetDinhChuyen(denGiaiDoan);

  const luu = () => {
    if (!ngay) { hd.setLoi("Cần nhập ngày chuyển giai đoạn."); return; }
    hd.batDauXacNhanKy(async (kyId) => {
      const now = new Date();
      const nguoiThucHien = auth.currentUser?.email || "";
      const capNhatVuAn = { coQuanThuLy: denGiaiDoan, ngayCapNhat: now, nguoiCapNhatCuoi: nguoiThucHien };
      if (denGiaiDoan === "truy_to") capNhatVuAn.soKetLuanDieuTra = soQuyetDinh.trim();
      if (denGiaiDoan === "xet_xu") capNhatVuAn.soCaoTrang = soQuyetDinh.trim();
      const batch = db.batch();
      batch.update(db.collection("vuan").doc(vuAn.id), capNhatVuAn);
      batch.set(db.collection("lichsuChuyenGiaiDoan").doc(), taoSuKien({
        maVuAn: vuAn.id, loaiSuKien: "chuyen_giai_doan", tuGiaiDoan: vuAn.coQuanThuLy, denGiaiDoan,
        soQuyetDinh: soQuyetDinh.trim(),
        ngaySuKien: fromInputDate(ngay), kyThongKe: kyId, ghiChu, nguoiThucHien, thoiDiemGhi: now,
      }));
      await batch.commit();
      onXong();
    });
  };

  return (
    <KhungModalHanhDong tieuDe={`Chuyển giai đoạn: ${NHAN_GIAI_DOAN[vuAn.coQuanThuLy]} → ${NHAN_GIAI_DOAN[denGiaiDoan]}`}>
      {hd.loi && <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-4">{hd.loi}</div>}
      <label className="text-xs text-slate-500 block mb-1">Ngày chuyển giai đoạn</label>
      <NhapNgay value={ngay} onChange={e => setNgay(e.target.value)} className={oInput + " mb-3"} />
      <label className="text-xs text-slate-500 block mb-1">{nhanSo}</label>
      <input value={soQuyetDinh} onChange={e => setSoQuyetDinh(e.target.value)} className={oInput + " mb-3"} />
      <label className="text-xs text-slate-500 block mb-1">Ghi chú</label>
      <textarea value={ghiChu} onChange={e => setGhiChu(e.target.value)} rows={2} className={oInput + " mb-4"} />
      <div className="flex justify-end gap-2">
        <button onClick={onDong} className="px-4 py-2 text-sm rounded-lg text-red-600 hover:bg-red-50">Huỷ</button>
        <button onClick={luu} disabled={hd.dangLuu || hd.hienModalKy}
                className="px-4 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium disabled:opacity-50">
          {hd.dangLuu ? <span className="flex items-center gap-1.5"><Spinner />Đang lưu...</span> : "Xác nhận"}
        </button>
      </div>
      <ModalXacNhanKy open={hd.hienModalKy} onHuy={hd.onHuyKy} onXacNhan={hd.onXacNhanKy} />
    </KhungModalHanhDong>
  );
}

const TUY_CHON_HOAN_THANH = [
  ["da_xet_xu", "Đã xét xử"], ["chuyen_di", "Chuyển đi"], ["tam_dinh_chi", "Tạm đình chỉ"],
  ["dinh_chi", "Đình chỉ"], ["an_huy", "Án huỷ"],
];

const NHAN_SO_QUYET_DINH_HOAN_THANH = {
  da_xet_xu: "Số bản án", chuyen_di: "Số quyết định chuyển đi",
  tam_dinh_chi: "Số quyết định tạm đình chỉ", dinh_chi: "Số quyết định đình chỉ",
  an_huy: "Số bản án / quyết định huỷ án",
};
// Field lưu trên vuan cho từng hình thức hoàn thành — index nhanh để module Án đã giải quyết
// hiện cột "Số QĐ giải quyết" mà không cần query lại log mỗi lần mở (giống ngayQuyetDinh/
// kyHoanThanh ở trên). "da_xet_xu" giữ tên field cũ soBanAn cho tương thích ngược.
const FIELD_SO_QD_HOAN_THANH = {
  da_xet_xu: "soBanAn", chuyen_di: "soQuyetDinhChuyenDi",
  tam_dinh_chi: "soQuyetDinhTamDinhChi", dinh_chi: "soQuyetDinhDinhChi",
  an_huy: "soQuyetDinhAnHuy",
};
function fieldSoQuyetDinhTrenVuAn(hinhThuc) {
  return FIELD_SO_QD_HOAN_THANH[hinhThuc] || null;
}

function HoanThanhVuAnModal({ vuAnId, onDong, onXong }) {
  const hd = useHanhDongVuAn();
  const [vuAn, setVuAn] = useState(null);
  const [biCanList, setBiCanList] = useState(null);
  const [hinhThuc, setHinhThuc] = useState("da_xet_xu");
  const [ngay, setNgay] = useState("");
  const [soQuyetDinh, setSoQuyetDinh] = useState("");
  const [noiChuyenDen, setNoiChuyenDen] = useState("");
  const [ghiChu, setGhiChu] = useState("");
  // { [bcId]: "chuyen_han" | "o_lai" | "sao_chep" } — mặc định TẤT CẢ "chuyen_han" (áp hình thức
  // lên toàn vụ, không tách) — đổi 1 vài bị can sang "o_lai" (không thuộc diện, ở lại vụ gốc
  // đang giải quyết) hoặc "sao_chep" (thuộc diện NHƯNG vẫn còn hành vi khác ở vụ gốc, hiếm dùng)
  // là lúc hệ thống tự tách 1 phần.
  const [trangThaiBiCan, setTrangThaiBiCan] = useState({});

  useEffect(() => {
    Promise.all([
      db.collection("vuan").doc(vuAnId).get(),
      db.collection("bican").where("maVuAn", "==", vuAnId).get(),
    ]).then(([vuSnap, bcSnap]) => {
      if (!vuSnap.exists) { hd.setLoi("Không tìm thấy vụ án."); return; }
      setVuAn({ id: vuSnap.id, ...vuSnap.data() });
      const bc = bcSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      setBiCanList(bc);
      setTrangThaiBiCan(Object.fromEntries(bc.map(b => [b.id, "chuyen_han"])));
    }).catch(err => { console.error(err); hd.setLoi("Lỗi khi tải dữ liệu vụ án: " + err.message); });
  }, [vuAnId]);

  if (!vuAn || !biCanList) {
    return (
      <KhungModalHanhDong tieuDe="Hoàn thành vụ án" rong>
        <div className="text-sm text-slate-400">Đang tải dữ liệu vụ án...</div>
        <div className="flex justify-end mt-4"><button onClick={onDong} className="px-4 py-2 text-sm rounded-lg text-red-600 hover:bg-red-50">Đóng</button></div>
      </KhungModalHanhDong>
    );
  }

  const idsChuyenHan = new Set(Object.keys(trangThaiBiCan).filter(id => trangThaiBiCan[id] === "chuyen_han"));
  const idsSaoChep = new Set(Object.keys(trangThaiBiCan).filter(id => trangThaiBiCan[id] === "sao_chep"));
  const idsOLai = new Set(Object.keys(trangThaiBiCan).filter(id => trangThaiBiCan[id] === "o_lai"));
  const laTdcDc = hinhThuc === "tam_dinh_chi" || hinhThuc === "dinh_chi";
  const laMotPhan = laTdcDc && biCanList.length > 0 && idsOLai.size > 0 && (idsChuyenHan.size + idsSaoChep.size) > 0;

  const doiTrangThaiBiCan = (id, gia) => setTrangThaiBiCan(s => ({ ...s, [id]: gia }));

  const luu = () => {
    if (!ngay) { hd.setLoi("Cần nhập ngày quyết định."); return; }
    if (hinhThuc === "chuyen_di" && !noiChuyenDen.trim()) { hd.setLoi("Cần nhập nơi chuyển đến."); return; }
    if (laTdcDc && biCanList.length > 0 && idsChuyenHan.size + idsSaoChep.size === 0) { hd.setLoi("Cần chọn ít nhất 1 bị can thuộc diện."); return; }

    hd.batDauXacNhanKy(async (kyId) => {
      const now = new Date();
      const nguoiThucHien = auth.currentUser?.email || "";
      const ngaySuKien = fromInputDate(ngay);

      const fieldVuAn = fieldSoQuyetDinhTrenVuAn(hinhThuc);

      if (!laMotPhan) {
        const batch = db.batch();
        batch.update(db.collection("vuan").doc(vuAn.id), {
          trangThai: hinhThuc, noiChuyenDen: hinhThuc === "chuyen_di" ? noiChuyenDen.trim() : "",
          ...(fieldVuAn ? { [fieldVuAn]: soQuyetDinh.trim() } : {}),
          // Index nhanh cho module Án đã giải quyết — không cần query log mỗi lần mở
          ngayQuyetDinh: ngaySuKien, kyHoanThanh: kyId,
          ngayCapNhat: now, nguoiCapNhatCuoi: nguoiThucHien,
        });
        batch.set(db.collection("lichsuChuyenGiaiDoan").doc(), taoSuKien({
          maVuAn: vuAn.id, loaiSuKien: "hoan_thanh", hinhThucHoanThanh: hinhThuc,
          soQuyetDinh: soQuyetDinh.trim(),
          ngaySuKien, kyThongKe: kyId, ghiChu, nguoiThucHien, thoiDiemGhi: now,
        }));
        await batch.commit();
      } else {
        const { maVuMoi, batch } = await tachVuAn({
          vuGoc: vuAn, biCanTachIds: idsChuyenHan, biCanSaoChepIds: idsSaoChep, biCanList,
          trangThaiVuMoi: hinhThuc, nguoiThucHien,
        });
        batch.update(db.collection("vuan").doc(maVuMoi), {
          ...(fieldVuAn ? { [fieldVuAn]: soQuyetDinh.trim() } : {}),
          ngayQuyetDinh: ngaySuKien, kyHoanThanh: kyId,
        });
        batch.set(db.collection("lichsuChuyenGiaiDoan").doc(), taoSuKien({
          maVuAn: vuAn.id, loaiSuKien: "tach_vu", vuTachRa: maVuMoi, denGiaiDoan: vuAn.coQuanThuLy,
          lyDoTach: hinhThuc === "tam_dinh_chi" ? "de_tam_dinh_chi" : "de_dinh_chi",
          ngaySuKien, kyThongKe: kyId, ghiChu, nguoiThucHien, thoiDiemGhi: now,
        }));
        batch.set(db.collection("lichsuChuyenGiaiDoan").doc(), taoSuKien({
          maVuAn: maVuMoi, loaiSuKien: "hoan_thanh", hinhThucHoanThanh: hinhThuc,
          soQuyetDinh: soQuyetDinh.trim(),
          ngaySuKien, kyThongKe: kyId, ghiChu, nguoiThucHien, thoiDiemGhi: now,
        }));
        await batch.commit();
        xoaBiCanCache(vuAn.id);
      }
      onXong();
    });
  };

  return (
    <KhungModalHanhDong tieuDe="Hoàn thành vụ án" rong>
      {hd.loi && <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-4">{hd.loi}</div>}
      <label className="text-xs text-slate-500 block mb-1">Hình thức</label>
      <div className="grid grid-cols-3 gap-2 mb-3">
        {TUY_CHON_HOAN_THANH.map(([v, l]) => (
          <button key={v} onClick={() => setHinhThuc(v)}
                  className={`text-xs rounded-lg py-2 border ${hinhThuc === v ? "bg-indigo-600 text-white border-indigo-600" : "border-slate-200 text-slate-600 hover:bg-slate-50"}`}>
            {l}
          </button>
        ))}
      </div>
      {hinhThuc === "chuyen_di" && (
        <>
          <label className="text-xs text-slate-500 block mb-1">Nơi chuyển đến</label>
          <input value={noiChuyenDen} onChange={e => setNoiChuyenDen(e.target.value)} className={oInput + " mb-3"} />
        </>
      )}
      {laTdcDc && biCanList.length > 0 && (

function TachVuAnModal({ vuAnId, onDong, onXong }) {
  const hd = useHanhDongVuAn();
  const [vuAn, setVuAn] = useState(null);
  const [biCanList, setBiCanList] = useState(null);
  const [trangThaiBiCan, setTrangThaiBiCan] = useState({});
  const [lyDo, setLyDo] = useState("khac_toi_danh");
  const [ngay, setNgay] = useState("");
  const [soQuyetDinh, setSoQuyetDinh] = useState("");
  const [ghiChu, setGhiChu] = useState("");

  useEffect(() => {
    Promise.all([
      db.collection("vuan").doc(vuAnId).get(),
      db.collection("bican").where("maVuAn", "==", vuAnId).get(),
    ]).then(([vuSnap, bcSnap]) => {
      if (!vuSnap.exists) { hd.setLoi("Không tìm thấy vụ án."); return; }
      setVuAn({ id: vuSnap.id, ...vuSnap.data() });
      setBiCanList(bcSnap.docs.map(d => ({ id: d.id, ...d.data() })));
    }).catch(err => { console.error(err); hd.setLoi("Lỗi khi tải dữ liệu vụ án: " + err.message); });
  }, [vuAnId]);

  if (!vuAn || !biCanList) {
    return (
      <KhungModalHanhDong tieuDe="Tách vụ án" rong>
        <div className="text-sm text-slate-400">Đang tải dữ liệu vụ án...</div>
        <div className="flex justify-end mt-4"><button onClick={onDong} className="px-4 py-2 text-sm rounded-lg text-red-600 hover:bg-red-50">Đóng</button></div>
      </KhungModalHanhDong>
    );
  }

  const doiTrangThaiBiCan = (id, gia) => setTrangThaiBiCan(s => ({ ...s, [id]: gia }));

  const idsChuyenHan = new Set(Object.keys(trangThaiBiCan).filter(id => trangThaiBiCan[id] === "chuyen_han"));
  const idsSaoChep = new Set(Object.keys(trangThaiBiCan).filter(id => trangThaiBiCan[id] === "sao_chep"));

  const luu = () => {
    if (!ngay) { hd.setLoi("Cần nhập ngày tách vụ."); return; }
    // Vụ 0 bị can (hoặc chưa chọn ai) vẫn tách được — tạo 1 vụ mới trống, dùng cho trường hợp
    // "hành vi chưa rõ đối tượng" cần tách ra theo dõi riêng trước khi xác định được bị can.
    if (biCanList.length > 0 && idsChuyenHan.size === 0 && idsSaoChep.size === 0) {
      hd.setLoi("Cần chọn ít nhất 1 bị can \"Chuyển hẳn\" hoặc \"Ở cả 2 vụ\" — hoặc để trống toàn bộ nếu vụ mới chưa xác định được bị can.");
      return;
    }

    hd.batDauXacNhanKy(async (kyId) => {
      const now = new Date();
      const nguoiThucHien = auth.currentUser?.email || "";
      const { maVuMoi, batch } = await tachVuAn({
        vuGoc: vuAn, biCanTachIds: idsChuyenHan, biCanSaoChepIds: idsSaoChep, biCanList,
        trangThaiVuMoi: "dang_giai_quyet", nguoiThucHien,
      });
      batch.set(db.collection("lichsuChuyenGiaiDoan").doc(), taoSuKien({
        maVuAn: vuAn.id, loaiSuKien: "tach_vu", vuTachRa: maVuMoi, lyDoTach: lyDo, denGiaiDoan: vuAn.coQuanThuLy,
        soQuyetDinh: soQuyetDinh.trim(),
        ngaySuKien: fromInputDate(ngay), kyThongKe: kyId, ghiChu, nguoiThucHien, thoiDiemGhi: now,
      }));
      await batch.commit();
      xoaBiCanCache(vuAn.id);
      onXong(maVuMoi);
    });
  };

  return (
    <KhungModalHanhDong tieuDe="Tách vụ án" rong>
      {hd.loi && <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-4">{hd.loi}</div>}
      {biCanList.length === 0 ? (
        <div className="bg-slate-50 border border-slate-200 text-slate-600 text-xs rounded-lg p-3 mb-3">
          Vụ này chưa có bị can nào — tách sẽ tạo 1 vụ mới trống (dùng khi có hành vi chưa xác
          định được đối tượng, cần theo dõi riêng).
        </div>
      ) : (
        <>
          <label className="text-xs text-slate-500 block mb-1">
            Chọn bị can cho vụ mới ("Ở cả 2 vụ" dùng khi 1 người có nhiều hành vi, chỉ tách riêng 1 hành vi)
          </label>
          <div className="mb-3">
            <ChonBiCan biCanList={biCanList} trangThai={trangThaiBiCan} onDoi={doiTrangThaiBiCan} nhanChuyenHan="Chuyển hẳn sang vụ mới" />
          </div>
        </>
      )}
      <label className="text-xs text-slate-500 block mb-1">Lý do tách</label>
      <select value={lyDo} onChange={e => setLyDo(e.target.value)} className={oInput + " mb-3"}>
        <option value="khac_toi_danh">Khác tội danh</option>
        <option value="khac">Khác</option>
      </select>
      <label className="text-xs text-slate-500 block mb-1">Ngày tách</label>
      <NhapNgay value={ngay} onChange={e => setNgay(e.target.value)} className={oInput + " mb-3"} />
      <label className="text-xs text-slate-500 block mb-1">Số quyết định tách vụ</label>
      <input value={soQuyetDinh} onChange={e => setSoQuyetDinh(e.target.value)} className={oInput + " mb-3"} />
      <label className="text-xs text-slate-500 block mb-1">Ghi chú</label>
      <textarea value={ghiChu} onChange={e => setGhiChu(e.target.value)} rows={2} className={oInput + " mb-4"} />
      <div className="flex justify-end gap-2">
        <button onClick={onDong} className="px-4 py-2 text-sm rounded-lg text-red-600 hover:bg-red-50">Huỷ</button>
        <button onClick={luu} disabled={hd.dangLuu || hd.hienModalKy}
                className="px-4 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium disabled:opacity-50">
          {hd.dangLuu ? <span className="flex items-center gap-1.5"><Spinner />Đang lưu...</span> : "Xác nhận"}
        </button>
      </div>
      <ModalXacNhanKy open={hd.hienModalKy} onHuy={hd.onHuyKy} onXacNhan={hd.onXacNhanKy} />
    </KhungModalHanhDong>
  );
}

function NhapVuModal({ vuAn, onDong, onXong }) {
  const hd = useHanhDongVuAn();
  const [tuKhoa, setTuKhoa] = useState("");
  const [ketQua, setKetQua] = useState([]);
  const [dichId, setDichId] = useState(null);
  const [dichTen, setDichTen] = useState("");
  const [ngay, setNgay] = useState("");
  const [soQuyetDinh, setSoQuyetDinh] = useState("");
  const [ghiChu, setGhiChu] = useState("");

  useEffect(() => {
    if (!tuKhoa.trim()) { setKetQua([]); return; }
    let active = true;
    const k = tuKhoa.trim().toLowerCase();
    db.collection("vuan").orderBy("ngayTao", "desc").limit(300).get().then(snap => {
      if (!active) return;
      const list = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(v => v.id !== vuAn.id && v.trangThai === "dang_giai_quyet")
        .filter(v => (hienThiMa(v) || "").toLowerCase().includes(k) || (v.tenVu || "").toLowerCase().includes(k))
        .slice(0, 10);
      setKetQua(list);
    });
    return () => { active = false; };
  }, [tuKhoa, vuAn.id]);

  const luu = () => {
    if (!dichId) { hd.setLoi("Cần chọn vụ đích để nhập vào."); return; }
    if (!ngay) { hd.setLoi("Cần nhập ngày nhập vụ."); return; }
    hd.batDauXacNhanKy(async (kyId) => {
      const now = new Date();
      const nguoiThucHien = auth.currentUser?.email || "";
      const [bcSnap, bcDichSnapTruoc] = await Promise.all([
        db.collection("bican").where("maVuAn", "==", vuAn.id).get(),
        db.collection("bican").where("maVuAn", "==", dichId).get(),
      ]);
      const bcDichTruoc = bcDichSnapTruoc.docs.map(d => ({ id: d.id, ref: d.ref, ...d.data() }));

      const batch = db.batch();
      // Nếu bị can nguồn từng bị "sao chép" lúc tách vụ (nhomBiCanId) và vụ đích đã có 1 bản ghi
      // cùng nhóm — đây chính là trường hợp "1 người, nhiều hành vi, từng tách ra 2 vụ, giờ nhập
      // lại": gộp tội danh vào bản ghi đã có ở vụ đích thay vì tạo bị can trùng, xoá bản ghi
      // nguồn. Không tìm thấy trùng thì chuyển vụ như bình thường.
      bcSnap.docs.forEach(d => {
        const bc = { id: d.id, ref: d.ref, ...d.data() };
        const trung = bc.nhomBiCanId ? bcDichTruoc.find(x => x.nhomBiCanId === bc.nhomBiCanId) : null;
        if (trung) {
          const toiDanhGop = [...new Set([...(trung.toiDanh || []), ...(bc.toiDanh || [])].filter(Boolean))];
          batch.update(trung.ref, { toiDanh: toiDanhGop });
          batch.delete(d.ref);
        } else {
          batch.update(d.ref, { maVuAn: dichId });
        }
      });
      batch.update(db.collection("vuan").doc(vuAn.id), {
        trangThai: "da_nhap", nhapVaoVu: dichId, ngayCapNhat: now, nguoiCapNhatCuoi: nguoiThucHien,
      });
      batch.set(db.collection("lichsuChuyenGiaiDoan").doc(), taoSuKien({
        maVuAn: vuAn.id, loaiSuKien: "nhap_vu", vuNhapVao: dichId, soQuyetDinh: soQuyetDinh.trim(),
        ngaySuKien: fromInputDate(ngay), kyThongKe: kyId, ghiChu, nguoiThucHien, thoiDiemGhi: now,
      }));
      // Ghi thêm 1 sự kiện phía vụ ĐÍCH — vụ nguồn tuy vẫn còn trong collection vuan (trangThai
      // "da_nhap", không xoá) nhưng lịch sử của vụ đích trước đây không có dấu vết gì về việc đã
      // nhận nhập vụ khác vào. Lưu sẵn mã vụ/tên vụ/KSV của vụ nguồn dạng chuỗi tại thời điểm
      // nhập (không phải ref) — để tra soát nhanh ngay trên lịch sử vụ đích mà không cần lần
      // ngược qua vuNhapVao, kể cả nếu sau này đổi tên/KSV của vụ nguồn.
      batch.set(db.collection("lichsuChuyenGiaiDoan").doc(), taoSuKien({
        maVuAn: dichId, loaiSuKien: "duoc_nhap_vu", vuNhapVao: vuAn.id, soQuyetDinh: soQuyetDinh.trim(),
        ghiChu: `Nhận nhập vụ ${hienThiMa(vuAn)} — "${vuAn.tenVu || "(chưa đặt tên)"}" (KSV: ${vuAn.ksvChinh || "—"}) vào vụ này.`,
        ngaySuKien: fromInputDate(ngay), kyThongKe: kyId, nguoiThucHien, thoiDiemGhi: now,
      }));
      await batch.commit();

      // Điều luật vụ đích cần tính lại sau khi có thêm bị can — đọc lại toàn bộ rồi cập nhật riêng.
      const bcDichSnap = await db.collection("bican").where("maVuAn", "==", dichId).get();
      const bcDichList = bcDichSnap.docs.map(d => d.data());
      await db.collection("vuan").doc(dichId).update({ dieuLuat: tinhDieuLuat(bcDichList) });

      onXong(dichId);
    });
  };

  return (
    <KhungModalHanhDong tieuDe="Nhập vụ án vào vụ khác" rong>
      {hd.loi && <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-4">{hd.loi}</div>}
      <label className="text-xs text-slate-500 block mb-1">Tìm vụ đích (theo mã vụ hoặc tên vụ)</label>
      <input value={tuKhoa} onChange={e => { setTuKhoa(e.target.value); setDichId(null); }} className={oInput + " mb-2"} />
      {ketQua.length > 0 && !dichId && (
        <div className="border border-slate-200 rounded-lg divide-y divide-slate-100 mb-3 max-h-40 overflow-auto">
          {ketQua.map(v => (
            <button key={v.id} onClick={() => { setDichId(v.id); setDichTen(v.tenVu); setTuKhoa(""); setKetQua([]); }}
                    className="w-full text-left px-3 py-2 text-sm hover:bg-slate-50">
              <div className="text-xs text-slate-400">{hienThiMa(v)}</div>
              <div>{v.tenVu}</div>
            </button>
          ))}
        </div>
      )}
      {dichId && (
        <div className="bg-indigo-50 border border-indigo-200 rounded-lg p-3 text-sm mb-3 flex items-center justify-between">
          <span>Nhập vào: <b>{dichTen}</b></span>
          <button onClick={() => setDichId(null)} className="text-xs text-indigo-600">Đổi</button>
        </div>
      )}
      <label className="text-xs text-slate-500 block mb-1">Ngày nhập vụ</label>
      <NhapNgay value={ngay} onChange={e => setNgay(e.target.value)} className={oInput + " mb-3"} />
      <label className="text-xs text-slate-500 block mb-1">Số quyết định nhập vụ</label>
      <input value={soQuyetDinh} onChange={e => setSoQuyetDinh(e.target.value)} className={oInput + " mb-3"} />
      <label className="text-xs text-slate-500 block mb-1">Ghi chú</label>
      <textarea value={ghiChu} onChange={e => setGhiChu(e.target.value)} rows={2} className={oInput + " mb-4"} />
      <div className="flex justify-end gap-2">
        <button onClick={onDong} className="px-4 py-2 text-sm rounded-lg text-red-600 hover:bg-red-50">Huỷ</button>
        <button onClick={luu} disabled={hd.dangLuu || hd.hienModalKy}
                className="px-4 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium disabled:opacity-50">
          {hd.dangLuu ? <span className="flex items-center gap-1.5"><Spinner />Đang lưu...</span> : "Xác nhận"}
        </button>
      </div>
      <ModalXacNhanKy open={hd.hienModalKy} onHuy={hd.onHuyKy} onXacNhan={hd.onXacNhanKy} />
    </KhungModalHanhDong>
  );
}

function ThemVuAnForm({ currentUser, onDong, onDaLuu }) {
  const dsCanBo = useDanhSachCanBo();
  const danhMucTD = useDanhMucToiDanh();
  const idRef = React.useRef(1);
  const [maNganhCap, setMaNganhCap] = useState("");
  const [tenVu, setTenVu] = useState("");
  const [tenVuDaSua, setTenVuDaSua] = useState(false);
  const [nguon, setNguon] = useState("an_khoi_to_moi");
  const [nguonChiTiet, setNguonChiTiet] = useState("");
  const [soQdKtva, setSoQdKtva] = useState("");
  const [ngayQdKtva, setNgayQdKtva] = useState("");
  const [hanDieuTra, setHanDieuTra] = useState("");
  const [ksvChinh, setKsvChinh] = useState("");
  const [ksvHoTro, setKsvHoTro] = useState("");
  const [dtvCbdt, setDtvCbdt] = useState("");
  const [donViThuLy, setDonViThuLy] = useState("");
  const [coQuanThuLy, setCoQuanThuLy] = useState("dieu_tra");
  const [vuanToiDanh, setVuanToiDanh] = useState([""]);
  const [vuanDieuLuat, setVuanDieuLuat] = useState([""]);
  const [mucDoNghiemTrong, setMucDoNghiemTrong] = useState("dac_biet_nghiem_trong");
  const [anDiem, setAnDiem] = useState(false);
  const [uyQuyenXetXu, setUyQuyenXetXu] = useState("");
  const [phienToaRutKN, setPhienToaRutKN] = useState(false);
  const [ghiChu, setGhiChu] = useState("");
  const [biCanRows, setBiCanRows] = useState([moiBiCan(0)]);

  // Nhập bổ sung án cũ: cho khai luôn hình thức giải quyết lúc tạo vụ, thay vì phải tạo "đang
  // giải quyết" rồi vào Hoàn thành vụ án sau — ẩn sau 1 toggle vì hiếm dùng (chỉ cần khi nhập lại
  // án cũ đã có kết quả), tránh làm dài form thêm cho luồng tạo án mới bình thường.
  const [capNhatKetQua, setCapNhatKetQua] = useState(false);
  const [trangThaiKetQua, setTrangThaiKetQua] = useState("da_xet_xu");
  const [ngayQuyetDinhKQ, setNgayQuyetDinhKQ] = useState("");
  const [soQuyetDinhKQ, setSoQuyetDinhKQ] = useState("");

  const [loi, setLoi] = useState("");
  const [hienModalKy, setHienModalKy] = useState(false);

  useEffect(() => {
    if (tenVuDaSua) return;
    const coTen = biCanRows.filter(bc => bc.hoTen.trim());
