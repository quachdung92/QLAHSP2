                <td className="border border-slate-800 p-2 align-top">{d.nguoiNhanThucTe || ""}</td>
              </tr>
            ))}
          </tbody>
        </table>
        <div className="mt-10 flex justify-center gap-2 print:hidden">
          <button onClick={onDong} className="px-4 py-2 text-sm rounded-lg text-red-600 hover:bg-red-50">Đóng</button>
          <button onClick={() => window.print()} className="px-4 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium">In</button>
        </div>
      </div>
    </div>
  );
  return ReactDOM.createPortal(noiDung, document.getElementById("qr-print-root"));
}

function GiaoNhanHoSoModule({ currentUser }) {
  const dsCanBo = useDanhSachCanBo();
  const [phien, setPhien] = useState(null);
  const [dsQuet, setDsQuet] = useState([]);
  const [maQuet, setMaQuet] = useState("");
  const [loiQuet, setLoiQuet] = useState("");
  const [dangXuLy, setDangXuLy] = useState(false);
  const [hienBienBan, setHienBienBan] = useState(false);
  const [hienTimThuCong, setHienTimThuCong] = useState(false);
  const [dsVuDangGQ, setDsVuDangGQ] = useState(null); // cache toàn bộ "đang giải quyết" — chỉ tải khi tìm tự do không chọn KSV
  const [dsTheoKsv, setDsTheoKsv] = useState({});     // cache riêng từng KSV đã từng chọn: { [ksvChinh]: [...] }
  const [dangTaiTim, setDangTaiTim] = useState(false);
  const [tuKhoaTim, setTuKhoaTim] = useState("");
  const [ksvTim, setKsvTim] = useState("tat_ca");
  const inputRef = React.useRef(null);

  // Không dùng orderBy kèm where ở đây để khỏi cần composite index mới — sắp xếp lại phía client.
  useEffect(() => {
    if (!phien) { setDsQuet([]); return; }
    return db.collection("lichsuChuyenGiaiDoan").where("phienGiaoNhanId", "==", phien.id).onSnapshot(
      snap => {
        const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        list.sort((a, b) => (b.thoiDiemGhi?.toMillis?.() || 0) - (a.thoiDiemGhi?.toMillis?.() || 0));
        setDsQuet(list);
      },
      err => console.error(err)
    );
  }, [phien?.id]);

  useEffect(() => {
    if (phien && phien.trangThai === "dang_mo") inputRef.current?.focus();
  }, [phien, dsQuet]);

  const batDauPhien = async (loaiGiaoDich) => {
    const now = new Date();
    const ref = await db.collection("phienGiaoNhan").add({
      loaiGiaoDich, nguoiThucHien: currentUser?.email || "",
      thoiDiemBatDau: now, trangThai: "dang_mo", thoiDiemLuu: null,
    });
    setPhien({ id: ref.id, loaiGiaoDich, trangThai: "dang_mo", thoiDiemBatDau: now });
  };

  // Dùng chung cho cả 2 đường vào: quét mã QR (biết trước id) và tìm thủ công (đã có sẵn cả
  // object vụ án từ kết quả tìm, khỏi phải đọc lại). "KSV" (lưu ở field nguoiGiao) / "ĐTV" (lưu
  // ở field nguoiNhan) chỉ để THỂ HIỆN hồ sơ của ai (lấy sẵn từ chính vụ án), không phải người
  // thực giao/nhận. Người thực tế cầm/ký nhận hồ sơ có thể khác (VD người khác đi nhận thay) —
  // ghi riêng ở nguoiNhanThucTe, để trống mặc định, điền tay khi cần.
  const ghiNhanVuVaoPhien = async (maVuAn, vuAn) => {
    const now = new Date();
    await db.collection("lichsuChuyenGiaiDoan").add(taoSuKien({
      maVuAn, loaiSuKien: "giao_nhan_ho_so", ngaySuKien: now, kyThongKe: null,
      nguoiThucHien: currentUser?.email || "", thoiDiemGhi: now,
      phienGiaoNhanId: phien.id, loaiGiaoDich: phien.loaiGiaoDich, tenVu: vuAn.tenVu || "",
      soQdKtva: vuAn.soQdKtva || "", ngayQdKtva: vuAn.ngayQdKtva || null,
      nguoiGiao: vuAn.ksvChinh || "", nguoiNhan: vuAn.dtvCbdt || "", nguoiNhanThucTe: "",
      ghiChu: `KSV: ${vuAn.ksvChinh || "—"} — ĐTV: ${vuAn.dtvCbdt || "—"}`,
    }));
  };

  const xuLyQuet = async (e) => {
    e.preventDefault();
    const ma = maQuet.trim();
    if (!ma || dangXuLy) return;
    setDangXuLy(true);
    setLoiQuet("");
    try {
      const vuDoc = await db.collection("vuan").doc(ma).get();
      if (!vuDoc.exists) {
        setLoiQuet(`Không tìm thấy vụ án có mã "${ma}".`);
        return;
      }
      await ghiNhanVuVaoPhien(ma, vuDoc.data());
    } catch (err) {
      console.error(err);
      setLoiQuet("Lỗi khi ghi nhận: " + err.message);
    } finally {
      setMaQuet("");
      setDangXuLy(false);
      inputRef.current?.focus();
    }
  };

  // Tìm thủ công — cho trường hợp không có mã QR trong tay. Trước đây tải 1 lần TOÀN BỘ vụ đang
  // giải quyết ngay lúc mở panel rồi lọc phía client — càng nhiều vụ đang thụ lý càng chậm/tốn
  // băng thông dù đa số lần tìm chỉ cần đúng 1 KSV. Nay tải theo 2 nhánh, đều LƯỜI (chỉ tải khi
  // thật sự cần, không tải ngay lúc mở panel):
  // (1) Đã chọn 1 KSV cụ thể → lọc thẳng tại Firestore theo trangThai+ksvChinh (cần composite
  //     index, xem firestore.indexes.json), cache riêng theo từng KSV trong `dsTheoKsv` để đổi
  //     qua lại giữa các KSV đã xem không phải tải lại.
  // (2) Không chọn KSV (tìm tự do theo tên vụ/tội danh/số QĐ...) → Firestore không lọc được kiểu
  //     "khớp 1 trong nhiều trường" nên vẫn phải tải về lọc phía client như cũ, nhưng CHỈ tải khi
  //     người dùng thật sự gõ từ khoá (không tải ngay lúc mở panel), cache trong `dsVuDangGQ`.
  const moTimThuCong = () => setHienTimThuCong(true);

  useEffect(() => {
    if (!hienTimThuCong || ksvTim === "tat_ca" || dsTheoKsv[ksvTim]) return;
    setDangTaiTim(true);
    db.collection("vuan").where("trangThai", "==", "dang_giai_quyet").where("ksvChinh", "==", ksvTim).get()
      .then(snap => setDsTheoKsv(m => ({ ...m, [ksvTim]: snap.docs.map(d => ({ id: d.id, ...d.data() })) })))
      .catch(err => { console.error(err); setDsTheoKsv(m => ({ ...m, [ksvTim]: [] })); })
      .finally(() => setDangTaiTim(false));
  }, [hienTimThuCong, ksvTim, dsTheoKsv]);

  useEffect(() => {
    if (!hienTimThuCong || ksvTim !== "tat_ca" || !tuKhoaTim.trim() || dsVuDangGQ !== null) return;
    setDangTaiTim(true);
    db.collection("vuan").where("trangThai", "==", "dang_giai_quyet").get()
      .then(snap => setDsVuDangGQ(snap.docs.map(d => ({ id: d.id, ...d.data() }))))
      .catch(err => { console.error(err); setDsVuDangGQ([]); })
      .finally(() => setDangTaiTim(false));
  }, [hienTimThuCong, ksvTim, tuKhoaTim, dsVuDangGQ]);

  // Danh sách KSV để chọn lấy thẳng từ module Cán bộ (đã tải sẵn qua useDanhSachCanBo ở đầu
  // component) thay vì suy ra từ dữ liệu vụ án đã tải — để dropdown này hiển thị được ngay cả
  // khi chưa tải vụ án nào (tránh vòng lặp "phải tải hết mới biết có những KSV nào để lọc theo").
  const dsKsvTim = useMemo(
    () => [...new Set(dsCanBo.filter(c => c.vaiTro === "ksv").map(c => c.hoTen).filter(Boolean))].sort(),
    [dsCanBo]
  );

  const khopTuKhoaTim = (v, k) =>
    (hienThiMa(v) || "").toLowerCase().includes(k)
    || (v.tenVu || "").toLowerCase().includes(k)
    || (v.dieuLuat || "").toLowerCase().includes(k)
    || (v.ksvChinh || "").toLowerCase().includes(k)
    || (v.soQdKtva || "").toLowerCase().includes(k);

  // Cho phép lọc riêng theo KSV (không bắt buộc gõ từ khoá kèm theo) — VD chọn 1 KSV để xem hết
  // hồ sơ đang giải quyết của người đó, khỏi phải nhớ gõ đúng tên.
  const ketQuaTimThuCong = useMemo(() => {
    const k = tuKhoaTim.trim().toLowerCase();
    if (ksvTim !== "tat_ca") {
      let rows = dsTheoKsv[ksvTim] || [];
      if (k) rows = rows.filter(v => khopTuKhoaTim(v, k));
      return rows.slice(0, 15);
    }
    if (!k || !dsVuDangGQ) return [];
    return dsVuDangGQ.filter(v => khopTuKhoaTim(v, k)).slice(0, 15);
  }, [dsTheoKsv, ksvTim, tuKhoaTim, dsVuDangGQ]);

  const chonVuThuCong = async (v) => {
    if (dangXuLy) return;
    setDangXuLy(true);
    setLoiQuet("");
    try {
      await ghiNhanVuVaoPhien(v.id, v);
      setTuKhoaTim("");
    } catch (err) {
      console.error(err);
      setLoiQuet("Lỗi khi ghi nhận: " + err.message);
    } finally {
      setDangXuLy(false);
    }
  };

  const suaNguoi = (id, patch) => db.collection("lichsuChuyenGiaiDoan").doc(id).update(patch).catch(err => console.error(err));
  const xoaDong = (id) => db.collection("lichsuChuyenGiaiDoan").doc(id).delete().catch(err => console.error(err));

  const luuPhien = async () => {
    const now = new Date();
    await db.collection("phienGiaoNhan").doc(phien.id).update({ trangThai: "da_luu", thoiDiemLuu: now });
    setPhien(p => ({ ...p, trangThai: "da_luu", thoiDiemLuu: now }));
  };

  if (!phien) {
    return (
      <div>
        <h2 className="text-lg font-semibold mb-4">Giao nhận hồ sơ</h2>
        <div className="text-sm text-slate-500 mb-4">Chọn loại giao dịch để bắt đầu 1 phiên quét mới.</div>
        <div className="flex gap-3">
          <button onClick={() => batDauPhien("giao")}
                  className="bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg px-5 py-3 text-sm font-medium">
            Bắt đầu phiên — Giao hồ sơ
          </button>
          <button onClick={() => batDauPhien("nhan")}
                  className="bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg px-5 py-3 text-sm font-medium">
            Bắt đầu phiên — Nhận hồ sơ
          </button>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <div>
          <h2 className="text-lg font-semibold">Giao nhận hồ sơ</h2>
          <div className="text-sm text-slate-500 mt-0.5 flex items-center gap-2">
            Phiên hiện tại:
            <Badge mau={phien.loaiGiaoDich === "giao" ? "bg-indigo-100 text-indigo-700" : "bg-emerald-100 text-emerald-700"}>
              {phien.loaiGiaoDich === "giao" ? "Giao hồ sơ" : "Nhận hồ sơ"}
            </Badge>
            {phien.trangThai === "da_luu" && <Badge mau="bg-slate-200 text-slate-600">Đã lưu</Badge>}
          </div>
        </div>
        <div className="flex gap-2">
          {phien.trangThai === "dang_mo" && (
            <button onClick={luuPhien} className="bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg px-4 py-2 text-sm font-medium">
              Lưu phiên
            </button>
          )}
          <button onClick={() => setHienBienBan(true)} disabled={dsQuet.length === 0}
                  className="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 rounded-lg px-4 py-2 text-sm font-medium disabled:opacity-50">
            In phiên
          </button>
          <button onClick={() => setPhien(null)} className="text-sm text-slate-500 hover:text-slate-700 px-2">Phiên mới</button>
        </div>
      </div>

      {phien.trangThai === "dang_mo" && (
        <form onSubmit={xuLyQuet} className="mb-2">
          {loiQuet && <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-2">{loiQuet}</div>}
          <input ref={inputRef} value={maQuet} onChange={e => setMaQuet(e.target.value)}
                 autoFocus placeholder="Quét mã QR vụ án vào đây..."
                 className="w-full border-2 border-indigo-300 rounded-lg px-4 py-3 text-base focus:border-indigo-500 focus:outline-none" />
        </form>
      )}

      {phien.trangThai === "dang_mo" && (
        <div className="mb-4">
          {!hienTimThuCong ? (
            <button onClick={moTimThuCong} className="text-xs text-indigo-600 hover:text-indigo-700 hover:underline">
              Không có mã QR? Tìm thủ công theo tên vụ / KSV / tội danh / số QĐ KTVA...
            </button>
          ) : (
            <div className="border border-slate-200 rounded-lg p-3 bg-slate-50/60">
              <div className="flex items-center justify-between mb-2">
                <div className="text-xs font-medium text-slate-600">Tìm thủ công (chỉ trong vụ đang giải quyết)</div>
                <button onClick={() => { setHienTimThuCong(false); setTuKhoaTim(""); setKsvTim("tat_ca"); }}
                        className="text-xs text-slate-400 hover:text-slate-600">Đóng</button>
              </div>
              <div className="flex gap-2 mb-2">
                <input value={tuKhoaTim} onChange={e => setTuKhoaTim(e.target.value)} autoFocus
                       placeholder="Gõ tên vụ, tên KSV, tội danh/điều luật, hoặc số QĐ KTVA..."
                       className="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm" />
                <select value={ksvTim} onChange={e => setKsvTim(e.target.value)}
                        className="border border-slate-300 rounded-lg px-2 py-2 text-sm bg-white">
                  <option value="tat_ca">Tất cả KSV</option>
                  {dsKsvTim.map(k => <option key={k} value={k}>{k}</option>)}
                </select>
              </div>
              {dangTaiTim && <div className="text-xs text-slate-400">Đang tải...</div>}
              {!dangTaiTim && (tuKhoaTim.trim() || ksvTim !== "tat_ca") && ketQuaTimThuCong.length === 0 && (
                <div className="text-xs text-slate-400">Không tìm thấy vụ nào khớp.</div>
              )}
              {ketQuaTimThuCong.length > 0 && (
                <div className="border border-slate-200 rounded-lg overflow-hidden bg-white max-h-64 overflow-y-auto">
                  {ketQuaTimThuCong.map(v => (
                    <button key={v.id} onClick={() => chonVuThuCong(v)} disabled={dangXuLy}
                            className="w-full text-left px-3 py-2 text-sm border-t border-slate-100 first:border-t-0 hover:bg-indigo-50 disabled:opacity-50">
                      <div className="font-medium text-slate-800">{v.tenVu || "(chưa đặt tên)"}</div>
                      <div className="text-xs text-slate-400 mt-0.5">
                        {hienThiMa(v)} — KSV: {v.ksvChinh || "—"} — {v.dieuLuat || "—"} — QĐ KTVA: {v.soQdKtva || "—"}
                      </div>
                    </button>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      )}

      <datalist id="ds-canbo-gnhs">{dsCanBo.map(c => <option key={c.id} value={c.hoTen} />)}</datalist>

      <div className="bg-white border border-slate-200 rounded-xl overflow-hidden">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 text-xs">
            <tr>
              <th className="text-left p-3 w-10">STT</th>
              <th className="text-left p-3 w-32">Mã vụ</th>
              <th className="text-left p-3">Tên vụ</th>
              <th className="text-left p-3">KSV</th>
              <th className="text-left p-3">ĐTV</th>
              <th className="text-left p-3">Người nhận thực tế</th>
              <th className="text-left p-3">Thời điểm</th>
              {phien.trangThai === "dang_mo" && <th className="text-left p-3"></th>}
            </tr>
          </thead>
          <tbody>
            {dsQuet.length === 0 && (
              <tr><td colSpan={8} className="p-4 text-slate-400 text-center">Chưa quét mã nào trong phiên này.</td></tr>
            )}
            {dsQuet.map((d, i) => (
              <DongGiaoNhan key={d.id} stt={dsQuet.length - i} dong={d} dsCanBo={dsCanBo}
                            khoaSua={phien.trangThai !== "dang_mo"} onSua={suaNguoi} onXoa={xoaDong} />
            ))}
          </tbody>
        </table>
      </div>
      <div className="text-xs text-slate-400 mt-3">{dsQuet.length} hồ sơ đã quét trong phiên này.</div>

      {hienBienBan && <BienBanGiaoNhanIn phien={phien} dsQuet={dsQuet} onDong={() => setHienBienBan(false)} />}
    </div>
  );
}

function ChartCotChong({ labels, datasets }) {
  const canvasRef = React.useRef(null);
  const chartRef = React.useRef(null);

  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: "bar",
      data: { labels, datasets },
      options: {
        responsive: true,
        scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } },
        plugins: { legend: { position: "bottom" } },
      },
    });
    return () => { chartRef.current && chartRef.current.destroy(); };
  }, [labels, datasets]);

  return <canvas ref={canvasRef} height="90"></canvas>;
}

function DashboardModule() {
  const [dem, setDem] = useState(null);
  const [canhBao, setCanhBao] = useState([]);
  const [kyList, setKyList] = useState([]);

  useEffect(() => {
    let huy = false;
    Promise.all(THU_TU_GIAI_DOAN.map(gd =>
      db.collection("vuan").where("coQuanThuLy", "==", gd).where("trangThai", "==", "dang_giai_quyet").get()
    )).then(res => {
      if (huy) return;
      const d = {};
      THU_TU_GIAI_DOAN.forEach((gd, i) => { d[gd] = res[i].size; });
      setDem(d);
    }).catch(err => console.error(err));
    return () => { huy = true; };
  }, []);

  useEffect(() => {
    return db.collection("vuan").where("coQuanThuLy", "==", "dieu_tra").where("trangThai", "==", "dang_giai_quyet")
      .onSnapshot(snap => {
        const list = snap.docs.map(d => ({ id: d.id, ...d.data() }))
          .filter(v => v.hanDieuTra)
          .map(v => ({ ...v, conLai: Math.ceil(((v.hanDieuTra.toDate ? v.hanDieuTra.toDate() : new Date(v.hanDieuTra)) - new Date()) / 86400000) }))
          .filter(v => v.conLai <= 15)
          .sort((a, b) => a.conLai - b.conLai);
        setCanhBao(list);
      }, err => console.error(err));
  }, []);

  useEffect(() => {
    return db.collection("kybaocao").orderBy("ngayBatDau", "asc").onSnapshot(
      snap => setKyList(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
      err => console.error(err)
    );
  }, []);

  const labels = kyList.map(k => k.tenKy);
  const datasets = THU_TU_GIAI_DOAN.map((gd, i) => ({
    label: NHAN_GIAI_DOAN[gd],
    data: kyList.map(k => k.tonCuoiKy ? (k.tonCuoiKy[gd] ?? 0) : (dem ? dem[gd] : 0)),
    backgroundColor: ["#6366f1", "#0ea5e9", "#f59e0b"][i],
  }));

  return (
    <div>
      <h2 className="text-lg font-semibold mb-4">Dashboard</h2>
      <div className="grid grid-cols-3 gap-4 mb-6">
        {THU_TU_GIAI_DOAN.map(gd => (
          <div key={gd} className="bg-white border border-slate-200 rounded-xl p-4">
            <div className="text-2xl font-semibold">{dem ? dem[gd] : "…"}</div>
            <div className="text-xs text-slate-500">Đang tồn — {NHAN_GIAI_DOAN[gd]}</div>
          </div>
        ))}
      </div>

      <div className="bg-white border border-slate-200 rounded-xl p-4 mb-6">
        <div className="text-sm font-medium text-slate-600 mb-3">Xu hướng tồn theo kỳ</div>
        {kyList.length === 0 ? (
          <div className="text-sm text-slate-400">Chưa có kỳ báo cáo nào để vẽ xu hướng.</div>
        ) : (
          <ChartCotChong labels={labels} datasets={datasets} />
        )}
      </div>

      <div className="bg-white border border-slate-200 rounded-xl p-4">
        <div className="text-sm font-medium text-slate-600 mb-3">Cảnh báo hạn điều tra sắp hết / đã quá hạn</div>
        {canhBao.length === 0 && <div className="text-sm text-slate-400">Không có vụ nào sắp/đã hết hạn điều tra.</div>}
        {canhBao.length > 0 && (
          <div className="space-y-1">
            {canhBao.map(v => (
              <div key={v.id} className="flex items-center justify-between text-sm py-1.5 border-b border-slate-50 last:border-0">
                <div><span className="text-xs text-slate-400 mr-2">{hienThiMa(v)}</span>{v.tenVu}</div>
                <div className={v.conLai < 0 ? "text-red-600 font-medium" : "text-amber-600 font-medium"}>
                  {v.conLai < 0 ? `Quá hạn ${-v.conLai} ngày` : `Còn ${v.conLai} ngày`}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function tenKyTuId(id, danhSachKy) {
  if (!id) return "— Không gán kỳ —";
  const k = danhSachKy.find(k => k.id === id);
  return k ? k.tenKy : "(kỳ đã xoá)";
}

// Sửa lại kỳ báo cáo đã gán cho 1 sự kiện log — cho phép chỉnh sau khi thao tác nghiệp vụ đã
// ghi, đúng theo nguyên tắc thiết kế "sửa được sau, có audit trail lichSuSuaKy" (mục 3, CLAUDE.md).
// Không dùng cho sự kiện giao_nhan_ho_so — loại đó cố ý không gán kỳ, không tính vào số liệu kỳ.
function SuaKyModal({ suKien, danhSachKy, onDong, onXong }) {
  const [kyChon, setKyChon] = useState(suKien.kyThongKe || "");
  const [lyDo, setLyDo] = useState("");
  const [dangLuu, setDangLuu] = useState(false);
  const [loi, setLoi] = useState("");
  const [daHieuAnhHuongChot, setDaHieuAnhHuongChot] = useState(false);

  const kyCuObj = danhSachKy.find(k => k.id === (suKien.kyThongKe || null)) || null;
  const kyMoiObj = danhSachKy.find(k => k.id === kyChon) || null;
  // Kỳ đã CHỐT có báo cáo đã lưu (baoCaoLuu) không tự cập nhật theo thay đổi kyThongKe của sự
  // kiện — sửa vào/ra 1 kỳ đã chốt sẽ làm số liệu đã lưu của kỳ đó (và cả kỳ kia) không còn khớp
  // log thật cho tới khi ai đó vào Kỳ báo cáo bấm "Tính lại số liệu" cho kỳ liên quan.
  const anhHuongKyDaChot = (kyCuObj && kyCuObj.trangThai === "da_chot") || (kyMoiObj && kyMoiObj.trangThai === "da_chot");

  const luu = async () => {
    const kyMoi = kyChon || null;
    const kyCu = suKien.kyThongKe || null;
    if (kyMoi === kyCu) { setLoi("Chưa đổi kỳ nào so với hiện tại."); return; }
    if (anhHuongKyDaChot && !daHieuAnhHuongChot) { setLoi("Cần xác nhận đã hiểu ảnh hưởng tới kỳ đã chốt ở trên."); return; }
    setDangLuu(true);
    try {
      const now = new Date();
      const nguoiThucHien = auth.currentUser?.email || "";
      await db.collection("lichsuChuyenGiaiDoan").doc(suKien.id).update({
        kyThongKe: kyMoi,
        lichSuSuaKy: firebase.firestore.FieldValue.arrayUnion({
          tuKy: kyCu, denKy: kyMoi, lyDo: lyDo.trim(), nguoiThucHien, thoiDiem: now,
        }),
      });
      onXong();
    } catch (err) {
      console.error(err);
      setLoi("Lỗi khi lưu: " + err.message);
      setDangLuu(false);
    }
  };

  return (
    <KhungModalHanhDong tieuDe="Sửa kỳ báo cáo cho sự kiện">
      {loi && <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-4">{loi}</div>}
      <div className="bg-slate-50 border border-slate-200 rounded-lg p-3 text-xs text-slate-600 mb-4">
        <div className="font-medium">{NHAN_SU_KIEN[suKien.loaiSuKien] || suKien.loaiSuKien}</div>
        <div className="text-slate-400 mt-0.5">{suKien.maVuAn} — {fmtDate(suKien.thoiDiemGhi)}</div>
      </div>
      <label className="text-xs text-slate-500 block mb-1">Kỳ báo cáo</label>
      <select value={kyChon} onChange={e => setKyChon(e.target.value)} className={oInput + " mb-3"}>
        <option value="">— Không gán kỳ —</option>
        {danhSachKy.map(k => (
          <option key={k.id} value={k.id}>{k.tenKy}{k.loai === "luu_tru" ? " [Lưu trữ]" : k.trangThai === "dang_mo" ? " (đang mở)" : ""}</option>
        ))}
      </select>
      {anhHuongKyDaChot && (
        <div className="bg-red-50 border border-red-200 rounded-lg p-3 text-xs text-red-700 mb-3">
          <div className="font-medium mb-1">⚠️ Ảnh hưởng tới kỳ đã chốt</div>
          <p className="mb-2">
            {kyCuObj?.trangThai === "da_chot" && kyMoiObj?.trangThai === "da_chot"
              ? `Cả kỳ "${kyCuObj.tenKy}" và kỳ "${kyMoiObj.tenKy}" đều đã chốt.`
              : kyCuObj?.trangThai === "da_chot"
                ? `Kỳ "${kyCuObj.tenKy}" (kỳ cũ) đã chốt.`
                : `Kỳ "${kyMoiObj.tenKy}" (kỳ mới) đã chốt.`}
            {" "}Báo cáo đã lưu cho kỳ đã chốt sẽ KHÔNG tự cập nhật theo thay đổi này — sau khi sửa,
            vào module <b>Kỳ báo cáo</b> bấm <b>"Tính lại số liệu"</b> cho (các) kỳ liên quan để số
            liệu báo cáo khớp lại với log thật.
          </p>
          <label className="flex items-center gap-2 text-red-800">
            <input type="checkbox" checked={daHieuAnhHuongChot} onChange={e => setDaHieuAnhHuongChot(e.target.checked)} />
            Tôi hiểu và vẫn muốn sửa
          </label>
        </div>
      )}
      <label className="text-xs text-slate-500 block mb-1">Lý do sửa (không bắt buộc)</label>
      <textarea value={lyDo} onChange={e => setLyDo(e.target.value)} rows={2} className={oInput + " mb-4"} />
      {suKien.lichSuSuaKy && suKien.lichSuSuaKy.length > 0 && (
        <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-800 mb-4 space-y-1">
          <div className="font-medium">Đã từng sửa kỳ:</div>
          {suKien.lichSuSuaKy.map((s, i) => (
            <div key={i}>
              {fmtDate(s.thoiDiem)}: {tenKyTuId(s.tuKy, danhSachKy)} → {tenKyTuId(s.denKy, danhSachKy)}
              {s.nguoiThucHien ? ` (${s.nguoiThucHien})` : ""}{s.lyDo ? ` — ${s.lyDo}` : ""}
            </div>
          ))}
        </div>
      )}
      <div className="flex justify-end gap-2">
        <button onClick={onDong} className="px-4 py-2 text-sm rounded-lg text-red-600 hover:bg-red-50">Huỷ</button>
        <button onClick={luu} disabled={dangLuu || (anhHuongKyDaChot && !daHieuAnhHuongChot)}
                className="px-4 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium disabled:opacity-50">
          {dangLuu ? "Đang lưu..." : "Lưu"}
        </button>
      </div>
    </KhungModalHanhDong>
  );
}

function NhatKyModule() {
  const [list, setList] = useState([]);
  const [dangTai, setDangTai] = useState(true);
  const [locLoai, setLocLoai] = useState("tat_ca");
  const [locKy, setLocKy] = useState("tat_ca");
  const [sortCot, setSortCot] = useState(null);
  const [sortChieu, setSortChieu] = useState("asc");
  const [danhSachKy, setDanhSachKy] = useState([]);
  const [dangSuaKy, setDangSuaKy] = useState(null);

  useEffect(() => {
    return db.collection("lichsuChuyenGiaiDoan").orderBy("thoiDiemGhi", "desc").limit(300).onSnapshot(
      snap => { setList(snap.docs.map(d => ({ id: d.id, ...d.data() }))); setDangTai(false); },
      err => { console.error(err); setDangTai(false); }
    );
  }, []);

  useEffect(() => {
    return db.collection("kybaocao").orderBy("ngayBatDau", "desc").onSnapshot(
      snap => setDanhSachKy(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
      err => console.error(err)
    );
  }, []);

  const kyTenTheoId = useMemo(() => {
    const m = {};
    danhSachKy.forEach(k => { m[k.id] = k.tenKy; });
    return m;
  }, [danhSachKy]);
  const kyMillisTheoId = useMemo(() => {
    const m = {};
    danhSachKy.forEach(k => { m[k.id] = k.ngayBatDau?.toMillis?.() ?? 0; });
    return m;
  }, [danhSachKy]);

  const filtered = useMemo(() => list.filter(ls => {
    if (locLoai !== "tat_ca" && ls.loaiSuKien !== locLoai) return false;
    if (locKy === "chua_gan") return !ls.kyThongKe;
    if (locKy !== "tat_ca" && ls.kyThongKe !== locKy) return false;
    return true;
  }), [list, locLoai, locKy]);

  const sorted = useMemo(() => {
    if (sortCot !== "ky") return filtered;
    const arr = [...filtered];
    arr.sort((a, b) => {
      const va = a.kyThongKe ? (kyMillisTheoId[a.kyThongKe] || 0) : -1;
      const vb = b.kyThongKe ? (kyMillisTheoId[b.kyThongKe] || 0) : -1;
      const cmp = va - vb;
      return sortChieu === "asc" ? cmp : -cmp;
    });
    return arr;
  }, [filtered, sortCot, sortChieu, kyMillisTheoId]);

  const bamSort = (cot) => {
    if (sortCot === cot) setSortChieu(c => c === "asc" ? "desc" : "asc");
    else { setSortCot(cot); setSortChieu("asc"); }
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <h2 className="text-lg font-semibold">Nhật ký thao tác</h2>
        <div className="flex gap-2">
          <select value={locKy} onChange={e => setLocKy(e.target.value)} className={oInput + " w-56"}>
            <option value="tat_ca">Tất cả kỳ</option>
            <option value="chua_gan">— Chưa gán kỳ —</option>
            {danhSachKy.map(k => <option key={k.id} value={k.id}>{k.tenKy}{k.loai === "luu_tru" ? " [Lưu trữ]" : k.trangThai === "dang_mo" ? " (đang mở)" : ""}</option>)}
          </select>
          <select value={locLoai} onChange={e => setLocLoai(e.target.value)} className={oInput + " w-56"}>
            <option value="tat_ca">Tất cả loại sự kiện</option>
            {Object.entries(NHAN_SU_KIEN).map(([k, l]) => <option key={k} value={k}>{l}</option>)}
          </select>
        </div>
      </div>
      {dangTai && <div className="text-sm text-slate-400">Đang tải...</div>}
      {!dangTai && sorted.length === 0 && <div className="text-sm text-slate-400">Không có sự kiện nào.</div>}
      {sorted.length > 0 && (
        <div className="bg-white border border-slate-200 rounded-xl overflow-hidden">
          <table className="w-full text-sm border-collapse">
            <thead className="bg-slate-50 text-slate-500 text-xs">
              <tr>
                <th className="text-left p-3">Thời điểm</th>
                <th className="text-left p-3">Mã vụ</th>
                <th className="text-left p-3">Loại sự kiện</th>
                <ThSort nhan="Kỳ" cot="ky" sortCot={sortCot} sortChieu={sortChieu} onBam={bamSort} />
                <th className="text-left p-3">Người thực hiện</th>
                <th className="text-left p-3">Ghi chú</th>
                <th className="text-right p-3"></th>
              </tr>
            </thead>
            <tbody>
              {sorted.map(ls => (
                <tr key={ls.id} className="border-t border-slate-100">
                  <td className="p-3 text-xs text-slate-500 whitespace-nowrap">{fmtDate(ls.thoiDiemGhi)}</td>
                  <td className="p-3 text-xs">{ls.maVuAn}</td>
                  <td className="p-3">{NHAN_SU_KIEN[ls.loaiSuKien] || ls.loaiSuKien}</td>
                  <td className="p-3 text-xs whitespace-nowrap">
                    {ls.kyThongKe ? (kyTenTheoId[ls.kyThongKe] || "(kỳ đã xoá)") : <span className="text-slate-400">—</span>}
                  </td>
                  <td className="p-3 text-xs text-slate-500">{ls.nguoiThucHien}</td>
                  <td className="p-3 text-xs text-slate-500">{ls.ghiChu}</td>
                  <td className="p-3 text-right whitespace-nowrap">
                    {ls.loaiSuKien !== "giao_nhan_ho_so" && (
                      <button onClick={() => setDangSuaKy(ls)} className="text-xs text-indigo-600 hover:text-indigo-700 font-medium">Sửa kỳ</button>
                    )}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      <div className="text-xs text-slate-400 mt-3">Hiển thị {sorted.length} sự kiện gần nhất (tối đa 300).</div>
      {dangSuaKy && (
        <SuaKyModal suKien={dangSuaKy} danhSachKy={danhSachKy} onDong={() => setDangSuaKy(null)} onXong={() => setDangSuaKy(null)} />
      )}
    </div>
  );
}

function ToiDanhForm({ toiDanh, maxThuTu, onDong, onXong }) {
  const [dieuLuat, setDieuLuat] = useState(toiDanh?.dieuLuat || "");
  const [tenToiDanh, setTenToiDanh] = useState(toiDanh?.tenToiDanh || "");
  const [blhsNam, setBlhsNam] = useState(toiDanh?.blhsNam || "2015_sd_2017");
  const [thuTu, setThuTu] = useState(toiDanh?.thuTuHienThi ?? maxThuTu + 1);
  const [dangLuu, setDangLuu] = useState(false);
  const [loi, setLoi] = useState("");

  async function luu() {
    if (!dieuLuat.trim()) { setLoi("Vui lòng nhập số điều luật."); return; }
    if (!tenToiDanh.trim()) { setLoi("Vui lòng nhập tên tội danh."); return; }
    setDangLuu(true); setLoi("");
    try {
      const data = {
        dieuLuat: dieuLuat.trim(),
        tenToiDanh: tenToiDanh.trim(),
        blhsNam,
        thuTuHienThi: Number(thuTu) || 0,
      };
      if (toiDanh) {
        await db.collection("danhMucToiDanh").doc(toiDanh.id).update(data);
      } else {
        await db.collection("danhMucToiDanh").add(data);
      }
      onXong();
    } catch (e) {
      setLoi("Lỗi khi lưu: " + e.message);
    } finally {
      setDangLuu(false);
    }
  }

  return (
    <KhungModalHanhDong tieu_de={toiDanh ? "Sửa điều luật" : "Thêm điều luật"} onDong={onDong}>
      {loi && <div className="text-xs text-red-600 bg-red-50 rounded p-2 mb-3">{loi}</div>}

             placeholder="VD: 123, 173, 256a" className={oInput + " mb-3 font-mono"} />
      <label className="text-xs text-slate-500 block mb-1">Tên tội danh <span className="text-red-500">*</span></label>
      <textarea value={tenToiDanh} onChange={e => setTenToiDanh(e.target.value)} rows={3}
                placeholder="Tội giết người..." className={oInput + " mb-3 resize-none"} />
      <label className="text-xs text-slate-500 block mb-1">BLHS năm</label>
      <select value={blhsNam} onChange={e => setBlhsNam(e.target.value)} className={oInput + " mb-3"}>
        <option value="2015_sd_2017">BLHS 2015 (sửa đổi 2017)</option>
        <option value="2015">BLHS 2015</option>
        <option value="1999">BLHS 1999</option>
      </select>
      <label className="text-xs text-slate-500 block mb-1">Thứ tự hiển thị</label>
      <input type="number" value={thuTu} onChange={e => setThuTu(e.target.value)} className={oInput + " mb-4"} />
      <div className="flex justify-end gap-2">
        <button onClick={onDong} className="px-4 py-2 text-sm rounded-lg text-red-600 hover:bg-red-50">Huỷ</button>
        <button onClick={luu} disabled={dangLuu}
                className="px-4 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium disabled:opacity-50">
          {dangLuu ? "Đang lưu..." : "Lưu"}
        </button>
      </div>
    </KhungModalHanhDong>
  );
}

function DanhMucToiDanhModule() {
  const [list, setList] = useState([]);
  const [dangTai, setDangTai] = useState(true);
  const [dangSua, setDangSua] = useState(null); // null | "moi" | object
  const [tuKhoa, setTuKhoa] = useState("");
  const [xoaId, setXoaId] = useState(null);
  const [locBlhs, setLocBlhs] = useState(""); // lọc theo blhsNam

  useEffect(() => {
    return db.collection("danhMucToiDanh").orderBy("thuTuHienThi", "asc").onSnapshot(
      snap => { setList(snap.docs.map(d => ({ id: d.id, ...d.data() }))); setDangTai(false); },
      err => { console.error(err); setDangTai(false); }
    );
  }, []);

  const listLoc = list.filter(t => {
    if (locBlhs && t.blhsNam !== locBlhs) return false;
    if (!tuKhoa) return true;
    const kw = tuKhoa.toLowerCase();
    return String(t.dieuLuat || "").toLowerCase().includes(kw)
        || (t.tenToiDanh || "").toLowerCase().includes(kw);
  });

  const maxThuTu = list.length > 0 ? Math.max(...list.map(t => t.thuTuHienThi || 0)) : 0;

  async function xoaToiDanh(id) {
    await db.collection("danhMucToiDanh").doc(id).delete();
    setXoaId(null);
  }

  return (
    <div className="h-full flex flex-col min-h-0">
      <div className="flex items-center justify-between mb-3 shrink-0">
        <div>
          <h2 className="text-lg font-semibold">Danh mục tội danh</h2>
          <p className="text-xs text-slate-400 mt-0.5">{list.length} điều luật · dùng để tính Biểu B10</p>
        </div>
        <button onClick={() => setDangSua("moi")}
                className="bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg px-4 py-2 text-sm font-medium shrink-0">
          + Thêm điều luật
        </button>
      </div>
      <div className="flex gap-2 mb-3 shrink-0">
        <input value={tuKhoa} onChange={e => setTuKhoa(e.target.value)}
               placeholder="Tìm theo số điều hoặc tên tội danh..."
               className={oInput + " flex-1"} />
        <select value={locBlhs} onChange={e => setLocBlhs(e.target.value)} className={oInput + " w-48 shrink-0"}>
          <option value="">Tất cả BLHS</option>
          <option value="2015_sd_2017">BLHS 2015 (SĐ 2017)</option>
          <option value="2015">BLHS 2015</option>
          <option value="1999">BLHS 1999</option>
        </select>
      </div>
      {dangTai && <div className="text-sm text-slate-400">Đang tải...</div>}
      {!dangTai && list.length === 0 && (
        <div className="text-sm text-slate-400 mt-2">
          Chưa có dữ liệu. Thêm từng dòng bằng nút "+ Thêm điều luật".
        </div>
      )}
      {listLoc.length > 0 && (
        <div className="flex-1 min-h-0 overflow-auto bg-white border border-slate-200 rounded-xl">
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-slate-500 text-xs sticky top-0 z-10">
              <tr>
                <th className="text-left p-3 w-10 text-slate-400">TT</th>
                <th className="text-left p-3 w-24">Số điều</th>
                <th className="text-left p-3">Tên tội danh</th>
                <th className="text-left p-3 w-44">BLHS năm</th>
                <th className="p-3 w-24"></th>
              </tr>
            </thead>
            <tbody>
              {listLoc.map((t, i) => (
                <tr key={t.id} className={`border-t border-slate-100 ${i % 2 === 0 ? "bg-white" : "bg-slate-50/60"}`}>
                  <td className="p-3 text-slate-400 text-xs text-center">{t.thuTuHienThi}</td>
                  <td className="p-3 font-mono font-semibold text-slate-800">{t.dieuLuat}</td>
                  <td className="p-3 text-slate-700 leading-snug">{t.tenToiDanh}</td>
                  <td className="p-3">
                    <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${
                      t.blhsNam === "1999"         ? "bg-amber-100 text-amber-700" :
                      t.blhsNam === "2015"         ? "bg-blue-100 text-blue-700"  :
                                                     "bg-green-100 text-green-700"}`}>
                      {NHAN_BLHS_NAM[t.blhsNam] || t.blhsNam || "—"}
                    </span>
                  </td>
                  <td className="p-3 text-right whitespace-nowrap">
                    <button onClick={() => setDangSua(t)}
                            className="text-xs text-indigo-600 hover:text-indigo-800 font-medium mr-3">Sửa</button>
                    <button onClick={() => setXoaId(t.id)}
                            className="text-xs text-red-500 hover:text-red-700 font-medium">Xoá</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      {listLoc.length === 0 && !dangTai && list.length > 0 && (
        <div className="text-sm text-slate-400 mt-2">Không tìm thấy kết quả phù hợp.</div>
      )}

      {dangSua !== null && (
        <ToiDanhForm
          toiDanh={dangSua === "moi" ? null : dangSua}
          maxThuTu={maxThuTu}
          onDong={() => setDangSua(null)}
          onXong={() => setDangSua(null)}
        />
      )}

      {xoaId && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
          <div className="bg-white rounded-xl shadow-lg p-6 w-80">
            <p className="text-sm font-medium text-slate-800 mb-1">Xoá điều luật này?</p>
            <p className="text-xs text-slate-500 mb-4">Không thể hoàn tác. Nếu điều luật đã được dùng trong vụ án, số liệu Biểu B10 sẽ không còn map được.</p>
            <div className="flex justify-end gap-2">
              <button onClick={() => setXoaId(null)}
                      className="px-4 py-2 text-sm rounded-lg text-slate-600 hover:bg-slate-100">Huỷ</button>
              <button onClick={() => xoaToiDanh(xoaId)}
                      className="px-4 py-2 text-sm rounded-lg bg-red-600 text-white hover:bg-red-700 font-medium">Xoá</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ====================================================================
// KHUNG CHÍNH (SIDEBAR + NỘI DUNG)
// ====================================================================
const MODULES = [
  { id: "list",        label: "Danh sách vụ án"   },
  { id: "dagiaiquyet", label: "Án đã giải quyết"  },
  { id: "giaonhan",    label: "Giao nhận hồ sơ"   },
  { id: "ky",          label: "Kỳ báo cáo"        },
  { id: "dashboard",   label: "Dashboard"          },
];

// CaiDatModule — gom Import Excel, Nhật ký thao tác, Cán bộ vào 1 chỗ để
// tránh người dùng bình thường vô tình chạm vào các thao tác quản trị.
function CaiDatModule() {
  const [subTab, setSubTab] = useState("log");
  const tabs = [
    { id: "log",     label: "Nhật ký thao tác"  },
    { id: "canbo",   label: "Cán bộ"             },
    { id: "danhmuc", label: "Danh mục tội danh"  },
    { id: "import",  label: "Import Excel"        },
  ];
  return (
    <div className="h-full flex flex-col min-h-0">
      <div className="flex gap-1 mb-6 bg-slate-100 rounded-lg p-1 w-fit shrink-0">
        {tabs.map(t => (
          <button key={t.id} onClick={() => setSubTab(t.id)}
            className={`px-4 py-2 text-sm rounded-md font-medium transition-colors
              ${subTab === t.id ? "bg-white text-slate-900 shadow-sm" : "text-slate-500 hover:text-slate-800"}`}>
            {t.label}
          </button>
        ))}
      </div>
      {subTab === "log"     && <NhatKyModule />}
      {subTab === "canbo"   && <CanBoModule />}
      {subTab === "danhmuc" && <DanhMucToiDanhModule />}
      {subTab === "import"  && <ImportExcelModule />}
    </div>
  );
}

// Trạng thái mạng của trình duyệt (navigator.onLine + sự kiện online/offline) — tín hiệu đơn
// giản, không 100% chính xác (có thể báo "online" dù mạng LAN/WiFi không thật sự ra được
// Internet) nhưng đủ dùng để báo người dùng biết app đang chạy off cache, kết hợp với cơ chế
// hàng đợi/đồng bộ lại có sẵn của Firestore persistence (bật ở thẻ <script> phía trên).
function useOnline() {
  const [online, setOnline] = useState(navigator.onLine);
  useEffect(() => {
    const baoOnline = () => { setOnline(true); addToast("Đã có mạng trở lại — đang đồng bộ dữ liệu..."); };
    const baoOffline = () => setOnline(false);
    window.addEventListener("online", baoOnline);
    window.addEventListener("offline", baoOffline);
    return () => {
      window.removeEventListener("online", baoOnline);
      window.removeEventListener("offline", baoOffline);
    };
  }, []);
  return online;
}

// `fixed` (không chiếm chỗ trong layout) để không phá vỡ khung h-screen/overflow-auto đã ghim
// cẩn thận ở AppShell — xem mục "Bố cục cuộn trang" trong CLAUDE.md.
function OfflineBanner() {
  const online = useOnline();
  if (online) return null;
  return (
    <div className="fixed top-0 inset-x-0 z-50 bg-amber-500 text-white text-sm text-center py-1.5 shadow px-4">
      ⚠ Mất kết nối mạng — vẫn xem/sửa được dữ liệu đã tải trước đó, thay đổi sẽ tự đồng bộ khi có
      mạng trở lại. Đừng đóng trình duyệt khi còn thay đổi chưa đồng bộ.
    </div>
  );
}

function AppShell({ user }) {
  const [tab, setTab] = useState("list");

  return (
    <div className="h-screen flex overflow-hidden">
      <OfflineBanner />
      <ToastContainer />
      <aside className="w-60 bg-slate-900 text-slate-300 flex flex-col shrink-0 overflow-y-auto">
        <div className="px-4 py-5 border-b border-slate-800">
          <div className="text-white font-semibold">QLVA</div>
          <div className="text-xs text-slate-500">Phòng 2 — VKSND Hà Nội</div>
        </div>
        <nav className="flex-1 py-2">
          {MODULES.map(m => (
            <button key={m.id} onClick={() => setTab(m.id)}
              className={`w-full text-left px-4 py-2.5 text-sm flex items-center justify-between
                ${tab === m.id ? "bg-indigo-600 text-white" : "hover:bg-slate-800"}`}>
              <span>{m.label}</span>
            </button>
          ))}
          <div className="mx-4 mt-3 mb-1 border-t border-slate-700" />
          <button onClick={() => setTab("setting")}
            className={`w-full text-left px-4 py-2.5 text-sm
              ${tab === "setting" ? "bg-indigo-600 text-white" : "text-slate-500 hover:bg-slate-800 hover:text-slate-300"}`}>
            Cài đặt
          </button>
        </nav>
        <div className="px-4 py-3 border-t border-slate-800 text-xs">
          <div className="text-slate-400 mb-2 truncate">{user.email}</div>
          <button onClick={() => auth.signOut()} className="text-slate-500 hover:text-slate-300">Đăng xuất</button>
        </div>
      </aside>
      <main className="flex-1 p-8 overflow-auto">
        {tab === "list"        && <DanhSachVuAnModule currentUser={user} />}
        {tab === "dagiaiquyet" && <AnDaGiaiQuyetModule />}
        {tab === "giaonhan"    && <GiaoNhanHoSoModule currentUser={user} />}
        {tab === "ky"          && <KyBaoCaoModule />}
        {tab === "dashboard"   && <DashboardModule />}
        {tab === "setting"     && <CaiDatModule />}
      </main>
    </div>
  );
}

function App() {
  const [user, setUser] = useState(undefined); // undefined = đang kiểm tra, null = chưa đăng nhập

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(u => setUser(u));
    return unsub;
  }, []);

  if (user === undefined) {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center gap-3 bg-slate-50">
        <div className="text-slate-700 font-bold text-xl tracking-wide">QLVA</div>
        <div className="text-slate-400 text-xs">Phòng 2 — VKSND Hà Nội</div>
        <Spinner cls="w-5 h-5 text-indigo-400 mt-2" />
      </div>
    );
  }
  if (user === null) return <LoginScreen />;
  return <AppShell user={user} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
