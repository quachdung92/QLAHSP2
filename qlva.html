        <select value={ksv} onChange={e => setKsv(e.target.value)} className="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-xs bg-white">
          <option value="tat_ca">Tất cả KSV</option>
          {dsKsv.map(k => <option key={k} value={k}>{k}</option>)}
        </select>
      </div>
      <div className="flex-1 overflow-auto">
        <table className="w-full text-sm border-collapse">
          <thead className="bg-slate-100 text-slate-500 text-xs sticky top-0 z-10">
            <tr>
              <ThSort nhan="Mã vụ" cot="maVu" sortCot={sortCot} sortChieu={sortChieu} onBam={bamSort} />
              <th className="text-left px-3 py-2 border-b border-slate-200 font-medium">Tên vụ / KSV</th>
              <th className="text-left px-3 py-2 border-b border-slate-200 font-medium">Bị can</th>
              <th className="text-left px-3 py-2 border-b border-slate-200 font-medium">Giai đoạn</th>
              <th className="text-left px-3 py-2 border-b border-slate-200 font-medium">Trạng thái</th>
              <th className="text-left px-3 py-2 border-b border-slate-200 font-medium">Kỳ mới</th>
              <th className="text-left px-3 py-2 border-b border-slate-200 font-medium">Kỳ giải quyết</th>
              <th className="text-left px-3 py-2 border-b border-slate-200 font-medium">Số QĐ KTVA</th>
              <ThSort nhan="Ngày KTVA" cot="ngayKtva" sortCot={sortCot} sortChieu={sortChieu} onBam={bamSort} />
              <ThSort nhan="Hạn ĐT" cot="hanDt" sortCot={sortCot} sortChieu={sortChieu} onBam={bamSort} />
              <th className="text-right px-2 py-2 border-b border-slate-200 font-medium"></th>
            </tr>
          </thead>
          <tbody>
            {dangTai && <tr><td colSpan={11} className="p-4 text-slate-400">Đang tải...</td></tr>}
            {!dangTai && sorted.length === 0 && (
              <tr><td colSpan={11} className="p-4 text-slate-400">Không có vụ án nào khớp.</td></tr>
            )}
            {sorted.map((v, i) => (
              <tr key={v.id} onClick={() => onSelect(v.id)}
                  className={`cursor-pointer border-b border-l-4 border-slate-100 ${
                    selectedId === v.id ? "bg-indigo-50 border-l-indigo-500"
                      : i % 2 === 0 ? "bg-white border-l-transparent hover:bg-slate-50" : "bg-slate-50/70 border-l-transparent hover:bg-slate-100"
                  }`}>
                <td className="px-3 py-2 text-xs text-slate-500 align-top whitespace-nowrap">{hienThiMa(v)}</td>
                <td className="px-3 py-2 align-top">
                  <div className="font-medium text-slate-800">{v.tenVu || "(chưa đặt tên)"}</div>
                  {v.ksvChinh && <div className="text-xs text-slate-400 mt-0.5">{v.ksvChinh}</div>}
                </td>
                <td className="px-3 py-2 align-top text-xs w-28 max-w-[7rem]">
                  {(() => {
                    const dsBiCan = biCanTheoVu[v.id] || [];
                    if (dsBiCan.length === 0) return <span className="text-slate-300">—</span>;
                    const daMoRong = moRongBiCan.has(v.id);
                    const hienThi = daMoRong ? dsBiCan : dsBiCan.slice(0, 1);
                    return (
                      <div>
                        {hienThi.map(bc => <div key={bc.id} className="text-slate-700 break-words">{bc.hoTen}</div>)}
                        {dsBiCan.length > 1 && (
                          <button onClick={e => { e.stopPropagation(); toggleMoRongBiCan(v.id); }}
                                  className="text-indigo-600 hover:text-indigo-700 font-medium mt-0.5 whitespace-nowrap">
                            {daMoRong ? "Thu gọn" : `+${dsBiCan.length - 1} bị can khác`}
                          </button>
                        )}
                      </div>
                    );
                  })()}
                </td>
                <td className="px-3 py-2 align-top"><Badge mau={MAU_GIAI_DOAN[v.coQuanThuLy]}>{NHAN_GIAI_DOAN[v.coQuanThuLy] || v.coQuanThuLy}</Badge></td>
                <td className="px-3 py-2 align-top"><Badge mau={MAU_TRANG_THAI[v.trangThai]}>{NHAN_TRANG_THAI[v.trangThai] || v.trangThai}</Badge></td>
                <td className="px-3 py-2 align-top text-xs whitespace-nowrap text-slate-600">{kyMoiTheoVu[v.id] || <span className="text-slate-300">—</span>}</td>
                <td className="px-3 py-2 align-top text-xs whitespace-nowrap text-slate-600">{kyGiaiQuyetTheoVu[v.id] || <span className="text-slate-300">—</span>}</td>
                <td className="px-3 py-2 align-top text-xs whitespace-nowrap text-slate-600">{v.soQdKtva || <span className="text-slate-300">—</span>}</td>
                <td className="px-3 py-2 align-top text-xs whitespace-nowrap text-slate-600">{fmtDate(v.ngayQdKtva)}</td>
                <td className={`px-3 py-2 align-top text-xs whitespace-nowrap ${mauCanhBaoHan(v.hanDieuTra)}`}>
                  {v.coQuanThuLy === "dieu_tra" ? fmtDate(v.hanDieuTra) : "—"}
                </td>
                <td className="px-2 py-2 align-top text-right">
                  <MenuHanhDongNhanh vuAn={v} onMoHanhDong={(vuAn, loai) => setHanhDongNhanh({ vuAn, loai })} />
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="px-3 py-2 border-t border-slate-100 text-xs text-slate-400 bg-slate-50/60">{sorted.length} / {list.length} vụ án</div>

      {hanhDongNhanh?.loai === "chuyen_giai_doan" && (
        <ChuyenGiaiDoanModal vuAn={hanhDongNhanh.vuAn} onDong={() => setHanhDongNhanh(null)} onXong={() => setHanhDongNhanh(null)} />
      )}
      {hanhDongNhanh?.loai === "hoan_thanh" && (
        <HoanThanhVuAnModal vuAnId={hanhDongNhanh.vuAn.id} onDong={() => setHanhDongNhanh(null)} onXong={() => setHanhDongNhanh(null)} />
      )}
    </div>
  );
}

function HangThongTin({ items }) {
  return (
    <tr className="border-b border-slate-100 last:border-b-0">
      {items.map(([nhan, giaTri], i) => (
        <React.Fragment key={i}>
          <td className="bg-slate-50 text-xs text-slate-500 px-3 py-2 whitespace-nowrap w-32 align-top border-r border-slate-100">{nhan}</td>
          <td className="px-3 py-2 text-slate-700 align-top">{giaTri || "—"}</td>
        </React.Fragment>
      ))}
    </tr>
  );
}

function NutHanhDong({ nhan, onClick }) {
  return (
    <button onClick={onClick}
            className="text-xs px-3 py-1.5 rounded-lg border border-indigo-200 text-indigo-600 hover:bg-indigo-50 font-medium">
      {nhan}
    </button>
  );
}

function KhoiQR({ noiDung, nhan }) {
  const containerRef = React.useRef(null);
  useEffect(() => {
    if (!containerRef.current) return;
    containerRef.current.innerHTML = "";
    new QRCode(containerRef.current, {
      text: noiDung, width: 480, height: 480,
      correctLevel: QRCode.CorrectLevel.M,
    });
  }, [noiDung]);

  return (
    <div className="flex flex-col items-center">
      <div ref={containerRef} className="[&>canvas]:w-full [&>canvas]:h-full [&>img]:w-full [&>img]:h-full"
           style={{ width: "5cm", height: "5cm" }}></div>
      <div className="mt-2 text-xs text-slate-400">{nhan}</div>
      <div className="text-sm font-mono">{noiDung}</div>
    </div>
  );
}

// Render qua portal vào #qr-print-root (ngoài #root) để khi in, ẩn #root đi mà không ẩn theo
// khung QR này — xem chú thích ở khối CSS @media print trong <head>.
function InQRModal({ vuAn, onDong }) {
  const noiDung = (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 print:bg-white overflow-auto">
      <div id="qr-in-a4" className="bg-white flex flex-col items-center justify-center"
           style={{ width: "210mm", minHeight: "297mm" }}>
        <div className="text-sm text-slate-400 mb-8 print:hidden">Xem trước trang in A4 — bấm "In" để in thật (khổ QR ~5x5cm).</div>
        <div className="flex items-center gap-10">
          {vuAn.maNganhCap && <KhoiQR noiDung={vuAn.maNganhCap} nhan="Mã ngành cấp" />}
          <KhoiQR noiDung={vuAn.maNoiSinh} nhan="Mã vụ án" />
        </div>
        <div className="mt-4 text-sm text-slate-500">{vuAn.tenVu}</div>
        <div className="mt-10 flex gap-2 print:hidden">
          <button onClick={onDong} className="px-4 py-2 text-sm rounded-lg text-slate-600 hover:bg-slate-100">Đóng</button>
          <button onClick={() => window.print()} className="px-4 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium">In</button>
        </div>
      </div>
    </div>
  );
  return ReactDOM.createPortal(noiDung, document.getElementById("qr-print-root"));
}

function ChiTietPanel({ vuAnId, onDoiSelected }) {
  const [vuAn, setVuAn] = useState(null);
  const [biCanList, setBiCanList] = useState([]);
  const [lichSu, setLichSu] = useState([]);
  const [modalMo, setModalMo] = useState(null);
  const [biCanDangSua, setBiCanDangSua] = useState(null);

  useEffect(() => {
    setModalMo(null);
    setBiCanDangSua(null);
    if (!vuAnId) { setVuAn(null); return; }
    return db.collection("vuan").doc(vuAnId).onSnapshot(doc => {
      setVuAn(doc.exists ? { id: doc.id, ...doc.data() } : null);
    });
  }, [vuAnId]);

  useEffect(() => {
    if (!vuAnId) { setBiCanList([]); return; }
    return db.collection("bican").where("maVuAn", "==", vuAnId).onSnapshot(
      snap => setBiCanList(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
      err => console.error(err)
    );
  }, [vuAnId]);

  useEffect(() => {
    if (!vuAnId) { setLichSu([]); return; }
    return db.collection("lichsuChuyenGiaiDoan").where("maVuAn", "==", vuAnId).orderBy("thoiDiemGhi", "desc").onSnapshot(
      snap => setLichSu(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
      err => console.error(err)
    );
  }, [vuAnId]);

  if (!vuAnId) {
    return (
      <div className="w-[420px] shrink-0 bg-white border border-slate-200 rounded-xl flex items-center justify-center text-slate-400 text-sm text-center px-4">
        Chọn 1 vụ án ở danh sách bên trái để xem chi tiết.
      </div>
    );
  }
  if (!vuAn) {
    return <div className="w-[420px] shrink-0 bg-white border border-slate-200 rounded-xl flex items-center justify-center text-slate-400 text-sm">Đang tải...</div>;
  }

  return (
    <div className="w-[420px] shrink-0 bg-white border border-slate-200 rounded-xl overflow-auto min-h-0">
      <div className="p-5 border-b border-slate-100">
        <div className="flex items-start justify-between gap-4">
          <div>
            <div className="text-xs text-slate-400 mb-1">{hienThiMa(vuAn)}</div>
            <div className="text-base font-semibold">{vuAn.tenVu || "(chưa đặt tên)"}</div>
          </div>
          <div className="flex gap-2 flex-wrap justify-end">
            {vuAn.trangThai === "dang_giai_quyet" && vuAn.coQuanThuLy !== "xet_xu" && (
              <NutHanhDong nhan="Chuyển giai đoạn" onClick={() => setModalMo("chuyen_giai_doan")} />
            )}
            {vuAn.trangThai === "dang_giai_quyet" && vuAn.coQuanThuLy !== "dieu_tra" && (
              <NutHanhDong nhan="Trả hồ sơ" onClick={() => setModalMo("tra_ho_so")} />
            )}
            {vuAn.trangThai === "dang_giai_quyet" && vuAn.coQuanThuLy === "dieu_tra" && (
              <NutHanhDong nhan="Gia hạn điều tra" onClick={() => setModalMo("gia_han")} />
            )}
            {vuAn.trangThai === "dang_giai_quyet" && (
              <NutHanhDong nhan="Hoàn thành vụ án" onClick={() => setModalMo("hoan_thanh")} />
            )}
            {vuAn.trangThai === "dang_giai_quyet" && biCanList.length >= 2 && (
              <NutHanhDong nhan="Tách vụ án" onClick={() => setModalMo("tach")} />
            )}
            {vuAn.trangThai === "dang_giai_quyet" && (
              <NutHanhDong nhan="Nhập vào vụ khác" onClick={() => setModalMo("nhap")} />
            )}
            {vuAn.trangThai === "tam_dinh_chi" && (
              <NutHanhDong nhan="Phục hồi" onClick={() => setModalMo("phuc_hoi")} />
            )}
            <NutHanhDong nhan="In mã QR" onClick={() => setModalMo("qr")} />
            <NutHanhDong nhan="Sửa thông tin" onClick={() => setModalMo("sua_thong_tin")} />
          </div>
        </div>
        <table className="w-full text-sm border border-slate-200 rounded-lg overflow-hidden mt-4">
          <tbody>
            <HangThongTin items={[["Giai đoạn", <Badge mau={MAU_GIAI_DOAN[vuAn.coQuanThuLy]}>{NHAN_GIAI_DOAN[vuAn.coQuanThuLy] || vuAn.coQuanThuLy}</Badge>]]} />
            <HangThongTin items={[["Trạng thái", <Badge mau={MAU_TRANG_THAI[vuAn.trangThai]}>{NHAN_TRANG_THAI[vuAn.trangThai] || vuAn.trangThai}</Badge>]]} />
            <HangThongTin items={[["Nguồn", NHAN_NGUON[vuAn.nguon] || vuAn.nguon]]} />
            <HangThongTin items={[["KSV chính", vuAn.ksvChinh]]} />
            <HangThongTin items={[["KSV hỗ trợ", (vuAn.ksvHoTro || []).join(", ")]]} />
            <HangThongTin items={[["ĐTV/CBĐT", vuAn.dtvCbdt]]} />
            <HangThongTin items={[["Đơn vị thụ lý", vuAn.donViThuLy]]} />
            <HangThongTin items={[["Điều luật", vuAn.dieuLuat]]} />
            <HangThongTin items={[["Số/ngày QĐ KTVA", `${vuAn.soQdKtva || "—"} — ${fmtDate(vuAn.ngayQdKtva)}`]]} />
            <HangThongTin items={[["Hạn điều tra", fmtDate(vuAn.hanDieuTra)]]} />

            <table className="w-full text-xs">
              <thead className="bg-slate-50 text-slate-500">
                <tr>
                  <th className="text-left p-2">Họ tên</th>
                  <th className="text-left p-2">Năm sinh</th>
                  <th className="text-left p-2">Tội danh</th>
                  <th className="text-left p-2">Biện pháp</th>
                  <th className="text-left p-2">Loại khởi tố</th>
                  <th className="text-left p-2"></th>
                </tr>
              </thead>
              <tbody>
                {biCanList.map((bc, i) => (
                  <tr key={bc.id} className={`border-t border-slate-100 ${i % 2 === 0 ? "bg-white" : "bg-slate-50/70"}`}>
                    <td className="p-2 font-medium text-slate-700">{bc.hoTen}</td>
                    <td className="p-2">{bc.namSinh || "—"}</td>
                    <td className="p-2">{(bc.toiDanh || []).filter(Boolean).join(", ") || "—"}</td>
                    <td className="p-2">
                      <Badge mau={bc.bienPhapNganChan === "giam" ? "bg-red-100 text-red-700" : "bg-slate-100 text-slate-600"}>
                        {bc.bienPhapNganChan === "giam" ? "Tạm giam" : "Tại ngoại"}
                      </Badge>
                    </td>
                    <td className="p-2">{bc.loaiKhoiTo === "bo_sung" ? "Bổ sung" : "Ban đầu"}</td>
                    <td className="p-2">
                      <button onClick={() => setBiCanDangSua(bc)} className="text-indigo-600 hover:text-indigo-700 font-medium">Sửa</button>

      <div className="p-5">
        <div className="text-sm font-medium text-slate-600 mb-2">Lịch sử</div>
        {lichSu.length === 0 && <div className="text-sm text-slate-400">Chưa có sự kiện nào.</div>}
        {lichSu.length > 0 && (
          <div className="border border-slate-200 rounded-lg overflow-hidden">
            <table className="w-full text-xs">
              <thead className="bg-slate-50 text-slate-500">
                <tr>
                  <th className="text-left p-2 w-24">Ngày</th>
                  <th className="text-left p-2">Sự kiện</th>
                  <th className="text-left p-2">Ghi chú</th>

              </thead>
              <tbody>
                {lichSu.map((ls, i) => (
                  <tr key={ls.id} className={`border-t border-slate-100 ${i % 2 === 0 ? "bg-white" : "bg-slate-50/70"}`}>
                    <td className="p-2 text-slate-400 whitespace-nowrap">{fmtDate(ls.ngaySuKien)}</td>
                    <td className="p-2"><Badge>{NHAN_SU_KIEN[ls.loaiSuKien] || ls.loaiSuKien}</Badge></td>
                    <td className="p-2 text-slate-500">{ls.ghiChu || "—"}</td>
                  </tr>

            </table>
          </div>

      {modalMo === "chuyen_giai_doan" && (
        <ChuyenGiaiDoanModal vuAn={vuAn} onDong={() => setModalMo(null)} onXong={() => setModalMo(null)} />
      )}
      {modalMo === "tra_ho_so" && (
        <TraHoSoModal vuAn={vuAn} onDong={() => setModalMo(null)} onXong={() => setModalMo(null)} />
      )}
      {modalMo === "gia_han" && (
        <GiaHanDieuTraModal vuAn={vuAn} onDong={() => setModalMo(null)} onXong={() => setModalMo(null)} />
      )}
      {modalMo === "phuc_hoi" && (
        <PhucHoiModal vuAn={vuAn} onDong={() => setModalMo(null)} onXong={() => setModalMo(null)} />
      )}
      {modalMo === "hoan_thanh" && (
        <HoanThanhVuAnModal vuAnId={vuAn.id} onDong={() => setModalMo(null)} onXong={() => setModalMo(null)} />
      )}
      {modalMo === "tach" && (
        <TachVuAnModal vuAnId={vuAn.id} onDong={() => setModalMo(null)}
                        onXong={(maVuMoi) => { setModalMo(null); onDoiSelected && onDoiSelected(maVuMoi); }} />
      )}
      {modalMo === "nhap" && (
        <NhapVuModal vuAn={vuAn} onDong={() => setModalMo(null)}
                     onXong={(dichId) => { setModalMo(null); onDoiSelected && onDoiSelected(dichId); }} />
      )}
      {modalMo === "qr" && <InQRModal vuAn={vuAn} onDong={() => setModalMo(null)} />}
      {modalMo === "sua_thong_tin" && (
        <SuaVuAnForm vuAn={vuAn} onDong={() => setModalMo(null)} onXong={() => setModalMo(null)} />
      )}
      {biCanDangSua && (
        <SuaBiCanForm biCan={biCanDangSua} vuAn={vuAn} onDong={() => setBiCanDangSua(null)} onXong={() => setBiCanDangSua(null)} />
      )}
    </div>
  );
}

async function xuatExcel(setDangXuat, setLoiXuat) {
  setDangXuat(true);
  setLoiXuat("");
  try {
    const [vuSnap, bcSnap, kySnap, logSnap] = await Promise.all([
      db.collection("vuan").get(), db.collection("bican").get(),
      db.collection("kybaocao").get(),
      db.collection("lichsuChuyenGiaiDoan").where("loaiSuKien", "in", ["khoi_to_vu", "hoan_thanh"]).get(),
    ]);
    const vuList = vuSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    const bcList = bcSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    const bcByVu = {};
    bcList.forEach(bc => { (bcByVu[bc.maVuAn] = bcByVu[bc.maVuAn] || []).push(bc); });
    const kyTenTheoId = Object.fromEntries(kySnap.docs.map(d => [d.id, d.data().tenKy]));
    const { kyMoi: kyMoiTheoVu, kyGiaiQuyet: kyGiaiQuyetTheoVu } = tinhKyTheoVuAn(logSnap.docs.map(d => d.data()), kyTenTheoId);

    const dsatHeader = ["Mã vụ", "Tên vụ", "Cơ quan đang thụ lý", "Trạng thái", "Số bị can",
      "KSV chính", "KSV hỗ trợ", "ĐTV/CBĐT", "Đơn vị thụ lý", "Điều luật",
      "Số QĐ KTVA", "Ngày QĐ KTVA", "Hạn điều tra", "Án điểm", "Nguồn", "Ghi chú",
      "Kỳ mới", "Kỳ giải quyết"];
    const dsatRows = vuList.map(v => [
      hienThiMa(v), v.tenVu, NHAN_GIAI_DOAN[v.coQuanThuLy] || v.coQuanThuLy, NHAN_TRANG_THAI[v.trangThai] || v.trangThai,
      (bcByVu[v.id] || []).length, v.ksvChinh, (v.ksvHoTro || []).join(", "), v.dtvCbdt, v.donViThuLy, v.dieuLuat,
      v.soQdKtva, fmtDate(v.ngayQdKtva), fmtDate(v.hanDieuTra), v.anDiem ? "x" : "", NHAN_NGUON[v.nguon] || v.nguon, v.ghiChu,
      kyMoiTheoVu[v.id] || "", kyGiaiQuyetTheoVu[v.id] || "",
    ]);

    const dsbctHeader = ["Mã vụ", "Họ tên bị can", "Năm sinh", "Giới tính", "Dân tộc", "Địa chỉ",
      "Tội danh", "Đảng viên", "Biện pháp ngăn chặn", "Hạn tạm giam", "Ngày khởi tố", "Loại khởi tố"];
    const dsbctRows = bcList.map(bc => [
      bc.maVuAn, bc.hoTen, bc.namSinh, bc.gioiTinh === "nu" ? "Nữ" : "Nam", bc.danToc, bc.diaChi,
      (bc.toiDanh || []).filter(Boolean).join("; "), bc.dangVien === "co" ? "x" : "",
      bc.bienPhapNganChan === "giam" ? "Tạm giam" : "Tại ngoại", fmtDate(bc.hanTamGiam),
      fmtDate(bc.ngayKhoiTo), bc.loaiKhoiTo === "bo_sung" ? "Bổ sung" : "Ban đầu",
    ]);

    const tongHopRows = THU_TU_GIAI_DOAN.map(gd => [
      NHAN_GIAI_DOAN[gd], vuList.filter(v => v.coQuanThuLy === gd && v.trangThai === "dang_giai_quyet").length,
    ]);

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([dsatHeader, ...dsatRows]), "DSAT");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([dsbctHeader, ...dsbctRows]), "DSBCT");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Giai đoạn", "Đang tồn"], ...tongHopRows]), "TỔNG HỢP");
    XLSX.writeFile(wb, `QLVA_xuat_${toInputDateNhanh(new Date())}.xlsx`);
  } catch (err) {
    console.error(err);
    setLoiXuat("Lỗi khi xuất Excel: " + err.message);
  } finally {
    setDangXuat(false);
  }
}
function toInputDateNhanh(d) {
  return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
}

// Đếm nhanh số vụ mới khởi tố / đã giải quyết trong kỳ báo cáo đang mở — dùng đúng nguồn sự thật
// là lichsuChuyenGiaiDoan (loaiSuKien khoi_to_vu / hoan_thanh) theo kyThongKe, không suy ra từ
// trạng thái hiện tại. Chỉ đếm tổng toàn hệ thống (không tách theo giai đoạn) để hiển thị gọn
// trên đầu Danh sách vụ án — muốn xem chi tiết theo giai đoạn thì vào module Kỳ báo cáo.
function ThongKeKyHienTai() {
  const [ky, setKy] = useState(undefined); // undefined = đang tải, null = không có kỳ đang mở
  const [soMoi, setSoMoi] = useState(null);
  const [soGiaiQuyet, setSoGiaiQuyet] = useState(null);

  useEffect(() => {
    let huy = false;
    db.collection("kybaocao").where("trangThai", "==", "dang_mo").limit(1).get()
      .then(async snap => {
        if (huy) return;
        if (snap.empty) { setKy(null); return; }
        const kyDoc = { id: snap.docs[0].id, ...snap.docs[0].data() };
        setKy(kyDoc);
        const [moiSnap, gqSnap] = await Promise.all([
          db.collection("lichsuChuyenGiaiDoan").where("kyThongKe", "==", kyDoc.id).where("loaiSuKien", "==", "khoi_to_vu").get(),
          db.collection("lichsuChuyenGiaiDoan").where("kyThongKe", "==", kyDoc.id).where("loaiSuKien", "==", "hoan_thanh").get(),
        ]);
        if (huy) return;
        setSoMoi(moiSnap.size);
        setSoGiaiQuyet(gqSnap.size);
      })
      .catch(err => console.error(err));
    return () => { huy = true; };
  }, []);

  if (ky === undefined) return null;
  if (ky === null) {
    return <div className="text-xs text-slate-400 mb-4">Chưa có kỳ báo cáo nào đang mở — vào module "Kỳ báo cáo" để mở kỳ mới.</div>;
  }

  return (
    <div className="flex items-center gap-2 text-sm mb-4">
      <span className="text-slate-500">Kỳ hiện tại <span className="font-medium text-slate-700">{ky.tenKy}</span>:</span>
      <span className="bg-indigo-50 text-indigo-700 rounded-lg px-3 py-1 font-medium">
        Mới trong kỳ: {soMoi === null ? "…" : soMoi}
      </span>
      <span className="bg-emerald-50 text-emerald-700 rounded-lg px-3 py-1 font-medium">
        Đã giải quyết trong kỳ: {soGiaiQuyet === null ? "…" : soGiaiQuyet}
      </span>
    </div>
  );
}

async function chotKyBaoCao(ky, ngayChot, nguoiChot) {
  const dems = await Promise.all(THU_TU_GIAI_DOAN.map(gd =>
    db.collection("vuan").where("coQuanThuLy", "==", gd).where("trangThai", "==", "dang_giai_quyet").get()
  ));
  const tonCuoiKy = {};
  THU_TU_GIAI_DOAN.forEach((gd, i) => { tonCuoiKy[gd] = dems[i].size; });
  await db.collection("kybaocao").doc(ky.id).update({
    trangThai: "da_chot", ngayChot, nguoiChot, thoiDiemChot: new Date(), tonCuoiKy,
  });
}

// Tính báo cáo chi tiết 1 kỳ theo từng giai đoạn — luôn tính từ log (lichsuChuyenGiaiDoan),
// không suy ra từ trạng thái hiện tại (đúng nguyên tắc "log là nguồn sự thật duy nhất").
// hoan_thanh không lưu tuGiaiDoan (chỉ hinhThucHoanThanh) nên dùng coQuanThuLy hiện tại của vụ
// làm proxy giai đoạn đã hoàn thành — hợp lệ vì hệ thống không đổi coQuanThuLy sau khi hoàn thành.
// Lấy vụ án hiện tại ứng với từng dòng log (dùng cho cả số liệu tổng hợp lẫn danh sách chi tiết
// khi xuất Excel — cùng 1 nguồn dữ liệu nên số dòng danh sách LUÔN khớp đúng số trên báo cáo).
async function vuAnTuLogDocs(logDocs) {
  const ds = [];
  for (const d of logDocs) {
    const l = d.data();
    const vuDoc = await db.collection("vuan").doc(l.maVuAn).get();
    if (vuDoc.exists) ds.push({ id: vuDoc.id, ...vuDoc.data(), _log: l });
  }
  return ds;
}

async function tinhBaoCaoKy(ky, kyTruoc) {
  const baoCao = {};
  for (const gd of THU_TU_GIAI_DOAN) {
    const tonDauKy = (kyTruoc && kyTruoc.tonCuoiKy) ? (kyTruoc.tonCuoiKy[gd] ?? 0) : 0;

    // "Mới" ở 1 giai đoạn gồm 4 nguồn, áp dụng THỐNG NHẤT cho cả 3 giai đoạn (trước đây cột Điều
    // tra được code riêng, thiếu hẳn "trả về từ giai đoạn sau" — tức viện trả hồ sơ điều tra bổ
    // sung — nên 1 vụ bị trả về Điều tra rồi giải quyết luôn trong kỳ sẽ bị tính "ra" ở Truy tố
    // mà không có "vào" tương ứng ở Điều tra, làm tồn cuối kỳ lệch):
    //  1. Khởi tố trực tiếp vào đúng giai đoạn này (denGiaiDoan trên sự kiện khoi_to_vu — vụ
    //     nhập tay/import có thể vào thẳng Truy tố/Xét xử, không nhất thiết bắt đầu từ Điều tra).
    //  2. Vụ tách ra từ vụ khác (tach_vu) xuất hiện ở đúng giai đoạn vụ gốc đang ở lúc tách —
    //     không phải vụ án mới thật nhưng vẫn là 1 bản ghi vuan mới, phải tính "vào" thì mới
    //     khớp với việc nó bị tính "ra" nếu giải quyết luôn trong kỳ.
    //  3. Chuyển đến từ giai đoạn trước (chuyen_giai_doan, luôn tiến 1 bước — không áp dụng cho
    //     Điều tra vì không có giai đoạn nào trước đó để chuyển tới).
    //  4. Trả về từ giai đoạn sau (tra_ho_so, luôn lùi 1 bước — CÓ áp dụng cho Điều tra: viện trả
    //     hồ sơ yêu cầu điều tra bổ sung).
    // Sự kiện khoi_to_vu/tach_vu tạo trước khi sửa công thức này không có denGiaiDoan (null) nên
    // sẽ không khớp where nào — cần backfill 1 lần cho dữ liệu cũ (xem ghi chú hạ tầng).
    const [khoiToTrucTiepSnap, tachVuSnap, chuyenDenSnap, traVeSnap] = await Promise.all([
      db.collection("lichsuChuyenGiaiDoan").where("kyThongKe", "==", ky.id).where("loaiSuKien", "==", "khoi_to_vu").where("denGiaiDoan", "==", gd).get(),
      db.collection("lichsuChuyenGiaiDoan").where("kyThongKe", "==", ky.id).where("loaiSuKien", "==", "tach_vu").where("denGiaiDoan", "==", gd).get(),
      db.collection("lichsuChuyenGiaiDoan").where("kyThongKe", "==", ky.id).where("loaiSuKien", "==", "chuyen_giai_doan").where("denGiaiDoan", "==", gd).get(),
      db.collection("lichsuChuyenGiaiDoan").where("kyThongKe", "==", ky.id).where("loaiSuKien", "==", "tra_ho_so").where("denGiaiDoan", "==", gd).get(),
    ]);

    const nguonDem = { an_khoi_to_moi: 0, tin_bao_khoi_to_len: 0, an_noi_khac_chuyen_den: 0, phuc_hoi_dieu_tra: 0 };
    const dsKhoiToTrucTiep = await vuAnTuLogDocs(khoiToTrucTiepSnap.docs);
    if (gd === "dieu_tra") {
      for (const v of dsKhoiToTrucTiep) { if (v.nguon in nguonDem) nguonDem[v.nguon]++; }
    }

    // "Khởi tạo trực tiếp" chỉ hiển thị riêng cho Truy tố/Xét xử — ở Điều tra, cùng nhóm sự kiện
    // khoi_to_vu đó ĐÃ được thể hiện qua 4 dòng nguồn (án khởi tố mới/tin báo/...) ở trên rồi,
    // hiện thêm 1 dòng tổng riêng sẽ trùng lặp số liệu (nguon vẫn cộng đủ vào soMoi.tong).
    const soMoi = {
      tong: khoiToTrucTiepSnap.size + tachVuSnap.size + chuyenDenSnap.size + traVeSnap.size,
      chuyenDenTu: chuyenDenSnap.size, traVeTu: traVeSnap.size, tachVu: tachVuSnap.size,
      ...(gd === "dieu_tra" ? nguonDem : { khoiTaoTrucTiep: khoiToTrucTiepSnap.size }),
    };

    const [chuyenDi, traDi, hoanThanhSnap, nhapVuSnap] = await Promise.all([
      db.collection("lichsuChuyenGiaiDoan").where("kyThongKe", "==", ky.id).where("loaiSuKien", "==", "chuyen_giai_doan").where("tuGiaiDoan", "==", gd).get(),
      db.collection("lichsuChuyenGiaiDoan").where("kyThongKe", "==", ky.id).where("loaiSuKien", "==", "tra_ho_so").where("tuGiaiDoan", "==", gd).get(),
      db.collection("lichsuChuyenGiaiDoan").where("kyThongKe", "==", ky.id).where("loaiSuKien", "==", "hoan_thanh").get(),
      db.collection("lichsuChuyenGiaiDoan").where("kyThongKe", "==", ky.id).where("loaiSuKien", "==", "nhap_vu").get(),
    ]);
    const hoanThanhTheoGD = { da_xet_xu: 0, chuyen_di: 0, tam_dinh_chi: 0, dinh_chi: 0, an_huy: 0 };
    const dsHoanThanhTheoGD = { da_xet_xu: [], chuyen_di: [], tam_dinh_chi: [], dinh_chi: [], an_huy: [] };
    for (const d of hoanThanhSnap.docs) {
      const l = d.data();
      const vuDoc = await db.collection("vuan").doc(l.maVuAn).get();
      if (vuDoc.exists && vuDoc.data().coQuanThuLy === gd) {
        hoanThanhTheoGD[l.hinhThucHoanThanh] = (hoanThanhTheoGD[l.hinhThucHoanThanh] || 0) + 1;
        dsHoanThanhTheoGD[l.hinhThucHoanThanh].push({ id: vuDoc.id, ...vuDoc.data(), _log: l });
      }
    }

    // Vụ bị nhập vào vụ khác (trangThai -> "da_nhap") cũng RA KHỎI "tồn" giống hoàn thành —
    // coQuanThuLy không đổi khi nhập vụ nên dùng làm proxy giống hoan_thanh (an toàn vì hệ
    // thống không đổi coQuanThuLy sau khi nhập). Thiếu khoản này thì tồn đầu kỳ + mới − giải
    // quyết sẽ KHÔNG khớp tồn cuối kỳ mỗi khi có nhập vụ trong kỳ (giống lỗi tách vụ đã sửa).
    let soNhapVu = 0;
    const dsNhapVu = [];
    for (const d of nhapVuSnap.docs) {
      const l = d.data();
      const vuDoc = await db.collection("vuan").doc(l.maVuAn).get();
      if (vuDoc.exists && vuDoc.data().coQuanThuLy === gd) {
        soNhapVu++;
        dsNhapVu.push({ id: vuDoc.id, ...vuDoc.data(), _log: l });
      }
    }

    let tonCuoiKy;
    if (ky.trangThai === "da_chot" && ky.tonCuoiKy) {
      tonCuoiKy = ky.tonCuoiKy[gd] ?? 0;
    } else {
      const hienTaiSnap = await db.collection("vuan").where("coQuanThuLy", "==", gd).where("trangThai", "==", "dang_giai_quyet").get();
      tonCuoiKy = hienTaiSnap.size;
    }

    const vuTonSnap = await db.collection("vuan").where("coQuanThuLy", "==", gd).where("trangThai", "==", "dang_giai_quyet").get();
    const dsTon = vuTonSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    let soBiCanTon = 0;
    for (const d of vuTonSnap.docs) {
      const bcSnap = await db.collection("bican").where("maVuAn", "==", d.id).get();
      soBiCanTon += bcSnap.size;
    }

    baoCao[gd] = {
      tonDauKy, soMoi, chuyenDi: chuyenDi.size, traDi: traDi.size, hoanThanhTheoGD, soNhapVu, tonCuoiKy,
      soVuTon: vuTonSnap.size, soBiCanTon,
      ds: {
        khoiToTrucTiep: dsKhoiToTrucTiep,
        tachVu: await vuAnTuLogDocs(tachVuSnap.docs),
        chuyenDen: await vuAnTuLogDocs(chuyenDenSnap.docs),
        traVe: await vuAnTuLogDocs(traVeSnap.docs),
        chuyenDi: await vuAnTuLogDocs(chuyenDi.docs),
        traDi: await vuAnTuLogDocs(traDi.docs),
        hoanThanh: dsHoanThanhTheoGD,
        nhapVu: dsNhapVu,
        tonHienTai: dsTon,
      },
    };
  }
  return baoCao;
}

// SheetJS bản CDN đang dùng (miễn phí) KHÔNG ghi được style (đã kiểm chứng — mở file .xlsx xuất
// ra ra thì cellXfs luôn rỗng dù có set cell.s). Báo cáo tháng cần wrap text mặc định cho dễ đọc
// nên dùng riêng ExcelJS (script CDN riêng, xem <head>) chỉ cho hàm này — phần Import/Xuất Excel
// khác trong app vẫn dùng XLSX (SheetJS) như cũ, không đụng tới.
const DO_RONG_COT_CHUNG = [16, 30, 16, 18, 30, 12, 26];
function themSheetDanhSach(wb, tenSheet, header, rows, doRongCot) {
  const sheet = wb.addWorksheet(tenSheet.slice(0, 31));
  sheet.columns = header.map((h, i) => ({ width: (doRongCot && doRongCot[i]) || 20 }));
  const hangTieuDe = sheet.addRow(header);
  hangTieuDe.eachCell(cell => {
    cell.font = { bold: true };
    cell.alignment = { wrapText: true, vertical: "top" };
    cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFE2E8F0" } };
  });
  for (const r of rows) {
    const hang = sheet.addRow(r);
    hang.eachCell(cell => { cell.alignment = { wrapText: true, vertical: "top" }; });
  }
  sheet.views = [{ state: "frozen", ySplit: 1 }];
  return sheet;
}

const DS_HEADER_CHUNG = ["Mã vụ", "Tên vụ", "Trạng thái hiện tại", "KSV chính", "Điều luật", "Ngày sự kiện", "Ghi chú"];
function hangDsVuAn(v) {
  return [
    hienThiMa(v), v.tenVu, NHAN_TRANG_THAI[v.trangThai] || v.trangThai,
    v.ksvChinh || "", v.dieuLuat || "", fmtDate(v._log?.ngaySuKien), v._log?.ghiChu || "",
  ];
}

// Xuất Excel báo cáo tháng nhiều sheet, dựng thẳng từ đúng object `baoCao` đã hiển thị trên màn
// hình (cùng 1 lần tính tinhBaoCaoKy, không tính lại) — đảm bảo số dòng từng sheet danh sách
// luôn khớp đúng số trên sheet "Tổng hợp báo cáo" và trên báo cáo đang xem. Mọi sheet đều bật
// wrap text + đóng băng dòng tiêu đề mặc định cho dễ nhìn.
async function xuatBaoCaoThangExcel(ky, baoCao) {
  const wb = new ExcelJS.Workbook();

  // ---- Sheet 1: Tổng hợp báo cáo (khớp đúng bảng hiển thị trên màn hình) ----
  const tongHopHang = [
    ["Tồn đầu kỳ", ...THU_TU_GIAI_DOAN.map(gd => baoCao[gd].tonDauKy)],
    ["Số mới", "", "", ""],
    ["— Án khởi tố mới", ...THU_TU_GIAI_DOAN.map(gd => baoCao[gd].soMoi.an_khoi_to_moi ?? 0)],
    ["— Tin báo khởi tố lên", ...THU_TU_GIAI_DOAN.map(gd => baoCao[gd].soMoi.tin_bao_khoi_to_len ?? 0)],
    ["— Án nơi khác chuyển đến", ...THU_TU_GIAI_DOAN.map(gd => baoCao[gd].soMoi.an_noi_khac_chuyen_den ?? 0)],
    ["— Phục hồi điều tra", ...THU_TU_GIAI_DOAN.map(gd => baoCao[gd].soMoi.phuc_hoi_dieu_tra ?? 0)],
    ["— Chuyển đến từ giai đoạn trước", ...THU_TU_GIAI_DOAN.map(gd => baoCao[gd].soMoi.chuyenDenTu)],
    ["— Trả về từ giai đoạn sau", ...THU_TU_GIAI_DOAN.map(gd => baoCao[gd].soMoi.traVeTu)],
    ["— Khởi tạo trực tiếp tại giai đoạn này", ...THU_TU_GIAI_DOAN.map(gd => baoCao[gd].soMoi.khoiTaoTrucTiep ?? 0)],
    ["— Vụ tách ra (tách trong kỳ này)", ...THU_TU_GIAI_DOAN.map(gd => baoCao[gd].soMoi.tachVu)],
    ["Tổng số mới", ...THU_TU_GIAI_DOAN.map(gd => baoCao[gd].soMoi.tong)],
    ["Đã giải quyết / ra khỏi giai đoạn", "", "", ""],
    ["— Chuyển giai đoạn (kết thúc giai đoạn này)", ...THU_TU_GIAI_DOAN.map(gd => baoCao[gd].chuyenDi)],
    ["— Trả hồ sơ (ra khỏi giai đoạn này)", ...THU_TU_GIAI_DOAN.map(gd => baoCao[gd].traDi)],
    ["— Đã xét xử", ...THU_TU_GIAI_DOAN.map(gd => baoCao[gd].hoanThanhTheoGD.da_xet_xu)],
    ["— Chuyển đi", ...THU_TU_GIAI_DOAN.map(gd => baoCao[gd].hoanThanhTheoGD.chuyen_di)],
    ["— Tạm đình chỉ", ...THU_TU_GIAI_DOAN.map(gd => baoCao[gd].hoanThanhTheoGD.tam_dinh_chi)],
    ["— Đình chỉ", ...THU_TU_GIAI_DOAN.map(gd => baoCao[gd].hoanThanhTheoGD.dinh_chi)],
    ["— Án huỷ", ...THU_TU_GIAI_DOAN.map(gd => baoCao[gd].hoanThanhTheoGD.an_huy)],
    ["— Nhập vào vụ khác", ...THU_TU_GIAI_DOAN.map(gd => baoCao[gd].soNhapVu)],
    ["Tồn cuối kỳ", ...THU_TU_GIAI_DOAN.map(gd => baoCao[gd].tonCuoiKy)],
    ["Số tồn hiện tại (tại thời điểm xuất)", "", "", ""],
    ["— Số vụ", ...THU_TU_GIAI_DOAN.map(gd => baoCao[gd].soVuTon)],
    ["— Số bị can", ...THU_TU_GIAI_DOAN.map(gd => baoCao[gd].soBiCanTon)],
  ];
  themSheetDanhSach(wb, "Tổng hợp báo cáo", ["", "Điều tra", "Truy tố", "Xét xử"], tongHopHang, [42, 12, 12, 12]);

  // ---- Sheet 2: Danh sách án mới (khởi tố mới thật tại Điều tra — khớp "Tổng án khởi tố mới") ----
  const dsAnMoiRows = baoCao.dieu_tra.ds.khoiToTrucTiep.map(v => [...hangDsVuAn(v), NHAN_NGUON[v.nguon] || v.nguon]);
  themSheetDanhSach(wb, "DS án mới", [...DS_HEADER_CHUNG, "Nguồn"], dsAnMoiRows, [...DO_RONG_COT_CHUNG, 20]);

  // ---- Sheet 3-4: Tòa/Viện trả hồ sơ điều tra bổ sung (DTBS) ----
  // "Tòa trả" = trả từ Xét xử về Truy tố (denGiaiDoan=truy_to) — "Viện trả" = trả từ Truy tố về
  // Điều tra (denGiaiDoan=dieu_tra). Lấy đúng từ soMoi.traVeTu của từng cột nên khớp báo cáo.
  themSheetDanhSach(wb, "DS toà trả DTBS", DS_HEADER_CHUNG, baoCao.truy_to.ds.traVe.map(hangDsVuAn), DO_RONG_COT_CHUNG);
  themSheetDanhSach(wb, "DS viện trả DTBS", DS_HEADER_CHUNG, baoCao.dieu_tra.ds.traVe.map(hangDsVuAn), DO_RONG_COT_CHUNG);

  // ---- Sheet 5-9: Danh sách theo từng hình thức giải quyết mới trong kỳ (gộp cả 3 giai đoạn) ----
  const tenSheetTheoHinhThuc = [
    ["da_xet_xu", "DS đã xét xử mới"], ["chuyen_di", "DS chuyển đi mới"],
    ["tam_dinh_chi", "DS tạm đình chỉ mới"], ["dinh_chi", "DS đình chỉ mới"], ["an_huy", "DS án huỷ mới"],
  ];
  for (const [hinhThuc, tenSheet] of tenSheetTheoHinhThuc) {
    const rows = THU_TU_GIAI_DOAN.flatMap(gd => baoCao[gd].ds.hoanThanh[hinhThuc]).map(hangDsVuAn);
    themSheetDanhSach(wb, tenSheet, DS_HEADER_CHUNG, rows, DO_RONG_COT_CHUNG);
  }

  // ---- Sheet: Danh sách nhập vào vụ khác (tra soát: vụ nguồn đã bị nhập vào mã vụ nào) ----
  const dsNhapVuRows = THU_TU_GIAI_DOAN.flatMap(gd => baoCao[gd].ds.nhapVu)
    .map(v => [...hangDsVuAn(v), v._log?.vuNhapVao || ""]);
  themSheetDanhSach(wb, "DS nhập vào vụ khác", [...DS_HEADER_CHUNG, "Mã vụ đích"], dsNhapVuRows, [...DO_RONG_COT_CHUNG, 20]);

  // ---- Sheet 10-12: Danh sách án tồn — TÁCH RIÊNG 1 sheet / giai đoạn (tại thời điểm xuất —
  // khớp "Số tồn hiện tại" của đúng giai đoạn đó, không gộp chung như trước) ----
  const headerTon = ["Mã vụ", "Tên vụ", "KSV chính", "Điều luật", "Hạn điều tra"];
  for (const gd of THU_TU_GIAI_DOAN) {
    const rows = baoCao[gd].ds.tonHienTai.map(v => [
      hienThiMa(v), v.tenVu, v.ksvChinh || "", v.dieuLuat || "", fmtDate(v.hanDieuTra),
    ]);
    themSheetDanhSach(wb, `DS án tồn ${NHAN_GIAI_DOAN[gd]}`, headerTon, rows, [16, 30, 18, 30, 14]);
  }

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `QLVA_BaoCao_${ky.tenKy.replace(/[\/\s]/g, "_")}_${toInputDateNhanh(new Date())}.xlsx`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function KyChiTietModal({ ky, kyTruoc, onDong }) {
  const [dangTai, setDangTai] = useState(true);
  const [baoCao, setBaoCao] = useState(null);
  const [loi, setLoi] = useState("");
  const [dangXuat, setDangXuat] = useState(false);
  const [loiXuat, setLoiXuat] = useState("");

  useEffect(() => {
    let huy = false;
    tinhBaoCaoKy(ky, kyTruoc)
      .then(bc => { if (!huy) { setBaoCao(bc); setDangTai(false); } })
      .catch(err => { console.error(err); if (!huy) { setLoi("Lỗi khi tính báo cáo: " + err.message); setDangTai(false); } });
    return () => { huy = true; };
  }, [ky.id]);

  const bamXuatExcel = async () => {
    setDangXuat(true);
    setLoiXuat("");
    try {
      await xuatBaoCaoThangExcel(ky, baoCao);
    } catch (err) {
      console.error(err);
      setLoiXuat("Lỗi khi xuất Excel: " + err.message);
    } finally {
      setDangXuat(false);
    }
  };

  return (
    <div className="fixed inset-0 bg-black/40 flex items-start justify-center z-40 overflow-auto py-8">
      <div className="bg-white rounded-xl shadow-lg w-[900px] max-w-[95vw] p-6">
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-lg font-semibold">Báo cáo kỳ "{ky.tenKy}"</h3>
          <div className="flex items-center gap-3">
            {loiXuat && <span className="text-xs text-red-600">{loiXuat}</span>}
            {baoCao && (
              <button onClick={bamXuatExcel} disabled={dangXuat}
                      className="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 rounded-lg px-3 py-1.5 text-xs font-medium disabled:opacity-50">
                {dangXuat ? "Đang xuất..." : "Xuất Excel báo cáo tháng"}

          </div>
        </div>
        {loi && <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-4">{loi}</div>}
        {dangTai && <div className="text-sm text-slate-400">Đang tính toán số liệu (có thể mất vài giây)...</div>}
        {baoCao && (
          <div className="border border-slate-200 rounded-lg overflow-hidden">
            <table className="w-full text-sm">
              <thead className="bg-slate-100 text-slate-600">
                <tr>
                  <th className="text-left p-2"></th>
                  {THU_TU_GIAI_DOAN.map(gd => <th key={gd} className="text-right p-2">{NHAN_GIAI_DOAN[gd]}</th>)}
                </tr>
              </thead>
              <tbody>
                <HangBaoCao nhan="Tồn đầu kỳ" data={baoCao} lay={b => b.tonDauKy} damNet />
                <HangBaoCaoTieuDe nhan="Số mới" />
                <HangBaoCao nhan="— Án khởi tố mới" data={baoCao} lay={b => b.soMoi.an_khoi_to_moi} />
                <HangBaoCao nhan="— Tin báo khởi tố lên" data={baoCao} lay={b => b.soMoi.tin_bao_khoi_to_len} />
                <HangBaoCao nhan="— Án nơi khác chuyển đến" data={baoCao} lay={b => b.soMoi.an_noi_khac_chuyen_den} />
                <HangBaoCao nhan="— Phục hồi điều tra" data={baoCao} lay={b => b.soMoi.phuc_hoi_dieu_tra} />
                <HangBaoCao nhan="— Chuyển đến từ giai đoạn trước" data={baoCao} lay={b => b.soMoi.chuyenDenTu} />
                <HangBaoCao nhan="— Trả về từ giai đoạn sau" data={baoCao} lay={b => b.soMoi.traVeTu} />
                <HangBaoCao nhan="— Khởi tạo trực tiếp tại giai đoạn này" data={baoCao} lay={b => b.soMoi.khoiTaoTrucTiep} />

                <HangBaoCao nhan="— Số bị can" data={baoCao} lay={b => b.soBiCanTon} />

        )}
        {!dangTai && ky.trangThai === "dang_mo" && (

          </div>
        )}
      </div>
    </div>
  );
}

// ====================================================================
function mauCanhBaoHan(han) {
  if (!han) return "";
  const d = han.toDate ? han.toDate() : new Date(han);
  if (isNaN(d)) return "";
  const conLai = Math.ceil((d - new Date()) / 86400000);
  if (conLai < 0) return "text-red-600 font-medium";
  if (conLai <= 15) return "text-amber-600 font-medium";
  return "";
}

// ====================================================================
// MODULE: ÁN ĐÃ GIẢI QUYẾT (theo từng hình thức hoàn thành cụ thể)
// ====================================================================
const TAB_DA_GIAI_QUYET = [
  ["da_xet_xu", "Đã xét xử"], ["chuyen_di", "Chuyển đi"], ["tam_dinh_chi", "Tạm đình chỉ"],
  ["dinh_chi", "Đình chỉ"], ["an_huy", "Án huỷ"],
];

function AnDaGiaiQuyetModule() {
  const [hinhThuc, setHinhThuc] = useState("da_xet_xu");
  const [list, setList] = useState([]);
  const [dangTai, setDangTai] = useState(true);

  useEffect(() => {
    setDangTai(true);
    let huy = false;
    const unsub = db.collection("vuan").where("trangThai", "==", hinhThuc).onSnapshot(
      async snap => {
        const rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        const voiNgay = await Promise.all(rows.map(async v => {
          const logSnap = await db.collection("lichsuChuyenGiaiDoan")
            .where("maVuAn", "==", v.id).where("loaiSuKien", "==", "hoan_thanh").limit(1).get();
          const ngayQuyetDinh = logSnap.empty ? null : logSnap.docs[0].data().ngaySuKien;
          return { ...v, ngayQuyetDinh };
        }));
        if (huy) return;
        voiNgay.sort((a, b) => (b.ngayQuyetDinh?.toMillis?.() || 0) - (a.ngayQuyetDinh?.toMillis?.() || 0));
        setList(voiNgay);
        setDangTai(false);
      },
      err => { console.error(err); setDangTai(false); }
    );
    return () => { huy = true; unsub(); };
  }, [hinhThuc]);

  return (
    <div>
      <h2 className="text-lg font-semibold mb-4">Án đã giải quyết</h2>
      <div className="flex gap-1 mb-4 w-fit bg-slate-100 rounded-lg p-1">
        {TAB_DA_GIAI_QUYET.map(([v, l]) => (
          <button key={v} onClick={() => setHinhThuc(v)}
                  className={`text-sm px-4 py-1.5 rounded-md ${hinhThuc === v ? "bg-white shadow text-slate-800" : "text-slate-500"}`}>
            {l}
          </button>
        ))}
      </div>

      {dangTai && <div className="text-sm text-slate-400">Đang tải...</div>}
      {!dangTai && list.length === 0 && <div className="text-sm text-slate-400">Chưa có vụ nào ở hình thức này.</div>}
      {list.length > 0 && (
        <div className="bg-white border border-slate-200 rounded-xl overflow-hidden">
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-slate-500 text-xs">
              <tr>
                <th className="text-left p-3">Mã vụ</th>
                <th className="text-left p-3">Tên vụ</th>
                <th className="text-left p-3">KSV chính</th>
                <th className="text-left p-3">Giai đoạn khi giải quyết</th>
                <th className="text-left p-3">Ngày quyết định</th>
                {hinhThuc === "chuyen_di" && <th className="text-left p-3">Nơi chuyển đến</th>}
              </tr>
            </thead>
            <tbody>
              {list.map((v, i) => (
                <tr key={v.id} className={`border-t border-slate-100 ${i % 2 === 0 ? "bg-white" : "bg-slate-50/70"} hover:bg-indigo-50/50`}>
                  <td className="p-3 text-xs text-slate-500 whitespace-nowrap">{hienThiMa(v)}</td>
                  <td className="p-3 font-medium text-slate-800">{v.tenVu}</td>
                  <td className="p-3">{v.ksvChinh || "—"}</td>
                  <td className="p-3"><Badge mau={MAU_GIAI_DOAN[v.coQuanThuLy]}>{NHAN_GIAI_DOAN[v.coQuanThuLy] || v.coQuanThuLy}</Badge></td>
                  <td className="p-3 text-xs">{fmtDate(v.ngayQuyetDinh)}</td>
                  {hinhThuc === "chuyen_di" && <td className="p-3 text-xs">{v.noiChuyenDen || "—"}</td>}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      <div className="text-xs text-slate-400 mt-3">{list.length} vụ ở hình thức "{NHAN_TRANG_THAI[hinhThuc]}". Vào "Danh sách vụ án" và tìm theo mã vụ để xem chi tiết/lịch sử đầy đủ.</div>
    </div>
  );
}

// ====================================================================
// MODULE: GIAO NHẬN HỒ SƠ
// Dùng với đầu đọc mã QR không dây (giả lập bàn phím — gõ chuỗi mã vụ + Enter). Không hỏi kỳ
// báo cáo (giống "Sửa thông tin" — đây là log hành chính lưu vết ai giữ hồ sơ, không phải sự
// kiện nghiệp vụ làm đổi giai đoạn/trạng thái, không ảnh hưởng số liệu báo cáo kỳ).
// ====================================================================
function fmtNgayGio(d) {
  if (!d) return "—";
  const dt = d.toDate ? d.toDate() : (d instanceof Date ? d : new Date(d));
  if (isNaN(dt)) return "—";
  return `${dt.toLocaleDateString("vi-VN")} ${dt.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" })}`;
}

function DongGiaoNhan({ stt, dong, dsCanBo, khoaSua, onSua, onXoa }) {
  const [dangSua, setDangSua] = useState(false);
  const [nguoiGiao, setNguoiGiao] = useState(dong.nguoiGiao || "");
  const [nguoiNhan, setNguoiNhan] = useState(dong.nguoiNhan || "");

  const luu = async () => {
    await onSua(dong.id, { nguoiGiao: nguoiGiao.trim(), nguoiNhan: nguoiNhan.trim() });
    setDangSua(false);
  };

  return (
    <tr className="border-t border-slate-100">
      <td className="p-3 text-slate-400">{stt}</td>
      <td className="p-3 text-xs text-slate-500 whitespace-nowrap">{dong.maVuAn}</td>
      <td className="p-3 font-medium text-slate-800">{dong.tenVu || "—"}</td>
      {dangSua ? (
        <>
          <td className="p-2"><input value={nguoiGiao} onChange={e => setNguoiGiao(e.target.value)} list="ds-canbo-gnhs" className={oInput} /></td>
          <td className="p-2"><input value={nguoiNhan} onChange={e => setNguoiNhan(e.target.value)} list="ds-canbo-gnhs" className={oInput} /></td>
        </>
      ) : (
        <>
          <td className="p-3">{dong.nguoiGiao || "—"}</td>
          <td className="p-3">{dong.nguoiNhan || "—"}</td>
        </>
      )}
      <td className="p-3 text-xs text-slate-400 whitespace-nowrap">{fmtNgayGio(dong.thoiDiemGhi)}</td>
      {!khoaSua && (
        <td className="p-3 whitespace-nowrap">
          {dangSua ? (
            <>
              <button onClick={luu} className="text-indigo-600 hover:text-indigo-700 font-medium mr-2">Lưu</button>
              <button onClick={() => setDangSua(false)} className="text-slate-400 hover:text-slate-600">Huỷ</button>
            </>
          ) : (
            <>
              <button onClick={() => setDangSua(true)} className="text-indigo-600 hover:text-indigo-700 font-medium mr-2">Sửa</button>
              <button onClick={() => onXoa(dong.id)} className="text-red-500 hover:text-red-700">Xoá</button>
            </>
          )}
        </td>
      )}
    </tr>
  );
}

function GiaoNhanHoSoModule({ currentUser }) {
  const dsCanBo = useDanhSachCanBo();
  const [phien, setPhien] = useState(null);
  const [dsQuet, setDsQuet] = useState([]);
  const [maQuet, setMaQuet] = useState("");
  const [loiQuet, setLoiQuet] = useState("");
  const [dangXuLy, setDangXuLy] = useState(false);
  const [hienBienBan, setHienBienBan] = useState(false);
  const inputRef = React.useRef(null);

  // Không dùng orderBy kèm where ở đây để khỏi cần composite index mới — sắp xếp lại phía client.
  useEffect(() => {
    if (!phien) { setDsQuet([]); return; }
    return db.collection("lichsuChuyenGiaiDoan").where("phienGiaoNhanId", "==", phien.id).onSnapshot(
      snap => {
        const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        list.sort((a, b) => (b.thoiDiemGhi?.toMillis?.() || 0) - (a.thoiDiemGhi?.toMillis?.() || 0));
        setDsQuet(list);
      },
      err => console.error(err)
    );
  }, [phien?.id]);

  useEffect(() => {
    if (phien && phien.trangThai === "dang_mo") inputRef.current?.focus();
  }, [phien, dsQuet]);

  const batDauPhien = async (loaiGiaoDich) => {
    const now = new Date();
    const ref = await db.collection("phienGiaoNhan").add({
      loaiGiaoDich, nguoiThucHien: currentUser?.email || "",
      thoiDiemBatDau: now, trangThai: "dang_mo", thoiDiemLuu: null,
    });
    setPhien({ id: ref.id, loaiGiaoDich, trangThai: "dang_mo", thoiDiemBatDau: now });
  };

  const xuLyQuet = async (e) => {
    e.preventDefault();
    const ma = maQuet.trim();
    if (!ma || dangXuLy) return;
    setDangXuLy(true);
    setLoiQuet("");
    try {
      const vuDoc = await db.collection("vuan").doc(ma).get();
      if (!vuDoc.exists) {
        setLoiQuet(`Không tìm thấy vụ án có mã "${ma}".`);
        return;
      }
      const vuAn = vuDoc.data();
      const nguoiGiaoMacDinh = vuAn.dtvCbdt || vuAn.ksvChinh || "";
      const nguoiNhanMacDinh = vuAn.ksvChinh || "";
      const now = new Date();
      await db.collection("lichsuChuyenGiaiDoan").add(taoSuKien({
        maVuAn: ma, loaiSuKien: "giao_nhan_ho_so", ngaySuKien: now, kyThongKe: null,
        nguoiThucHien: currentUser?.email || "", thoiDiemGhi: now,
        phienGiaoNhanId: phien.id, loaiGiaoDich: phien.loaiGiaoDich, tenVu: vuAn.tenVu || "",
        nguoiGiao: nguoiGiaoMacDinh, nguoiNhan: nguoiNhanMacDinh,
        ghiChu: phien.loaiGiaoDich === "giao" ? `Giao cho: ${nguoiNhanMacDinh || "—"}` : `Nhận từ: ${nguoiGiaoMacDinh || "—"}`,
      }));
    } catch (err) {
      console.error(err);
      setLoiQuet("Lỗi khi ghi nhận: " + err.message);
    } finally {
      setMaQuet("");
      setDangXuLy(false);
      inputRef.current?.focus();
    }
  };

  const suaNguoi = (id, patch) => db.collection("lichsuChuyenGiaiDoan").doc(id).update(patch).catch(err => console.error(err));
  const xoaDong = (id) => db.collection("lichsuChuyenGiaiDoan").doc(id).delete().catch(err => console.error(err));

  const luuPhien = async () => {
    const now = new Date();
    await db.collection("phienGiaoNhan").doc(phien.id).update({ trangThai: "da_luu", thoiDiemLuu: now });
    setPhien(p => ({ ...p, trangThai: "da_luu", thoiDiemLuu: now }));
  };

  if (!phien) {
    return (
      <div>
        <h2 className="text-lg font-semibold mb-4">Giao nhận hồ sơ</h2>
        <div className="text-sm text-slate-500 mb-4">Chọn loại giao dịch để bắt đầu 1 phiên quét mới.</div>
        <div className="flex gap-3">
          <button onClick={() => batDauPhien("giao")}
                  className="bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg px-5 py-3 text-sm font-medium">
            Bắt đầu phiên — Giao hồ sơ
          </button>
          <button onClick={() => batDauPhien("nhan")}
                  className="bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg px-5 py-3 text-sm font-medium">
            Bắt đầu phiên — Nhận hồ sơ
          </button>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <div>
          <h2 className="text-lg font-semibold">Giao nhận hồ sơ</h2>
          <div className="text-sm text-slate-500 mt-0.5 flex items-center gap-2">
            Phiên hiện tại:
            <Badge mau={phien.loaiGiaoDich === "giao" ? "bg-indigo-100 text-indigo-700" : "bg-emerald-100 text-emerald-700"}>
              {phien.loaiGiaoDich === "giao" ? "Giao hồ sơ" : "Nhận hồ sơ"}
            </Badge>
            {phien.trangThai === "da_luu" && <Badge mau="bg-slate-200 text-slate-600">Đã lưu</Badge>}
          </div>
        </div>
        <div className="flex gap-2">
          {phien.trangThai === "dang_mo" && (
            <button onClick={luuPhien} className="bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg px-4 py-2 text-sm font-medium">
              Lưu phiên
            </button>
          )}
          <button onClick={() => setHienBienBan(true)} disabled={dsQuet.length === 0}
                  className="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 rounded-lg px-4 py-2 text-sm font-medium disabled:opacity-50">
            In phiên
          </button>
          <button onClick={() => setPhien(null)} className="text-sm text-slate-500 hover:text-slate-700 px-2">Phiên mới</button>
        </div>
      </div>

      {phien.trangThai === "dang_mo" && (
        <form onSubmit={xuLyQuet} className="mb-4">
          {loiQuet && <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-2">{loiQuet}</div>}
          <input ref={inputRef} value={maQuet} onChange={e => setMaQuet(e.target.value)}
                 autoFocus placeholder="Quét mã QR vụ án vào đây..."
                 className="w-full border-2 border-indigo-300 rounded-lg px-4 py-3 text-base focus:border-indigo-500 focus:outline-none" />
        </form>
      )}

      <datalist id="ds-canbo-gnhs">{dsCanBo.map(c => <option key={c.id} value={c.hoTen} />)}</datalist>

      <div className="bg-white border border-slate-200 rounded-xl overflow-hidden">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 text-xs">
            <tr>
              <th className="text-left p-3 w-10">STT</th>
              <th className="text-left p-3">Mã vụ</th>
              <th className="text-left p-3">Tên vụ</th>
              <th className="text-left p-3">Người giao</th>
              <th className="text-left p-3">Người nhận</th>
              <th className="text-left p-3">Thời điểm</th>
              {phien.trangThai === "dang_mo" && <th className="text-left p-3"></th>}
            </tr>
          </thead>
          <tbody>
            {dsQuet.length === 0 && (
              <tr><td colSpan={7} className="p-4 text-slate-400 text-center">Chưa quét mã nào trong phiên này.</td></tr>
            )}
            {dsQuet.map((d, i) => (
              <DongGiaoNhan key={d.id} stt={dsQuet.length - i} dong={d} dsCanBo={dsCanBo}
                            khoaSua={phien.trangThai !== "dang_mo"} onSua={suaNguoi} onXoa={xoaDong} />
            ))}
          </tbody>
        </table>
      </div>
      <div className="text-xs text-slate-400 mt-3">{dsQuet.length} hồ sơ đã quét trong phiên này.</div>

      {hienBienBan && <BienBanGiaoNhanIn phien={phien} dsQuet={dsQuet} onDong={() => setHienBienBan(false)} />}
    </div>
  );
}

function ChartCotChong({ labels, datasets }) {
  const canvasRef = React.useRef(null);
  const chartRef = React.useRef(null);

  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: "bar",
      data: { labels, datasets },
      options: {
        responsive: true,
        scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } },
        plugins: { legend: { position: "bottom" } },
      },
    });
    return () => { chartRef.current && chartRef.current.destroy(); };
  }, [labels, datasets]);

  return <canvas ref={canvasRef} height="90"></canvas>;
}

function DashboardModule() {
  const [dem, setDem] = useState(null);
  const [canhBao, setCanhBao] = useState([]);
  const [kyList, setKyList] = useState([]);

  useEffect(() => {
    let huy = false;
    Promise.all(THU_TU_GIAI_DOAN.map(gd =>
      db.collection("vuan").where("coQuanThuLy", "==", gd).where("trangThai", "==", "dang_giai_quyet").get()
    )).then(res => {
      if (huy) return;
      const d = {};
      THU_TU_GIAI_DOAN.forEach((gd, i) => { d[gd] = res[i].size; });
      setDem(d);
    }).catch(err => console.error(err));
    return () => { huy = true; };
  }, []);

  useEffect(() => {
    return db.collection("vuan").where("coQuanThuLy", "==", "dieu_tra").where("trangThai", "==", "dang_giai_quyet")
      .onSnapshot(snap => {
        const list = snap.docs.map(d => ({ id: d.id, ...d.data() }))
          .filter(v => v.hanDieuTra)
          .map(v => ({ ...v, conLai: Math.ceil(((v.hanDieuTra.toDate ? v.hanDieuTra.toDate() : new Date(v.hanDieuTra)) - new Date()) / 86400000) }))
          .filter(v => v.conLai <= 15)
          .sort((a, b) => a.conLai - b.conLai);
        setCanhBao(list);
      }, err => console.error(err));
  }, []);

  useEffect(() => {
    return db.collection("kybaocao").orderBy("ngayBatDau", "asc").onSnapshot(
      snap => setKyList(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
      err => console.error(err)
    );
  }, []);

  const labels = kyList.map(k => k.tenKy);
  const datasets = THU_TU_GIAI_DOAN.map((gd, i) => ({
    label: NHAN_GIAI_DOAN[gd],
    data: kyList.map(k => k.tonCuoiKy ? (k.tonCuoiKy[gd] ?? 0) : (dem ? dem[gd] : 0)),
    backgroundColor: ["#6366f1", "#0ea5e9", "#f59e0b"][i],
  }));

  return (
    <div>
      <h2 className="text-lg font-semibold mb-4">Dashboard</h2>
      <div className="grid grid-cols-3 gap-4 mb-6">
        {THU_TU_GIAI_DOAN.map(gd => (
          <div key={gd} className="bg-white border border-slate-200 rounded-xl p-4">
            <div className="text-2xl font-semibold">{dem ? dem[gd] : "…"}</div>
            <div className="text-xs text-slate-500">Đang tồn — {NHAN_GIAI_DOAN[gd]}</div>
          </div>
        ))}
      </div>

      <div className="bg-white border border-slate-200 rounded-xl p-4 mb-6">
        <div className="text-sm font-medium text-slate-600 mb-3">Xu hướng tồn theo kỳ</div>
        {kyList.length === 0 ? (
          <div className="text-sm text-slate-400">Chưa có kỳ báo cáo nào để vẽ xu hướng.</div>
        ) : (
          <ChartCotChong labels={labels} datasets={datasets} />
        )}
      </div>

      <div className="bg-white border border-slate-200 rounded-xl p-4">
        <div className="text-sm font-medium text-slate-600 mb-3">Cảnh báo hạn điều tra sắp hết / đã quá hạn</div>
        {canhBao.length === 0 && <div className="text-sm text-slate-400">Không có vụ nào sắp/đã hết hạn điều tra.</div>}
        {canhBao.length > 0 && (
          <div className="space-y-1">
            {canhBao.map(v => (
              <div key={v.id} className="flex items-center justify-between text-sm py-1.5 border-b border-slate-50 last:border-0">
                <div><span className="text-xs text-slate-400 mr-2">{hienThiMa(v)}</span>{v.tenVu}</div>
                <div className={v.conLai < 0 ? "text-red-600 font-medium" : "text-amber-600 font-medium"}>
                  {v.conLai < 0 ? `Quá hạn ${-v.conLai} ngày` : `Còn ${v.conLai} ngày`}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ====================================================================
// MODULE: NHẬT KÝ THAO TÁC
// ====================================================================
function NhatKyModule() {
  const [list, setList] = useState([]);
  const [dangTai, setDangTai] = useState(true);
  const [locLoai, setLocLoai] = useState("tat_ca");

  useEffect(() => {
    return db.collection("lichsuChuyenGiaiDoan").orderBy("thoiDiemGhi", "desc").limit(300).onSnapshot(
      snap => { setList(snap.docs.map(d => ({ id: d.id, ...d.data() }))); setDangTai(false); },
      err => { console.error(err); setDangTai(false); }
    );
  }, []);

  const filtered = useMemo(() => locLoai === "tat_ca" ? list : list.filter(ls => ls.loaiSuKien === locLoai), [list, locLoai]);

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <h2 className="text-lg font-semibold">Nhật ký thao tác</h2>
        <select value={locLoai} onChange={e => setLocLoai(e.target.value)} className={oInput + " w-64"}>
          <option value="tat_ca">Tất cả loại sự kiện</option>
          {Object.entries(NHAN_SU_KIEN).map(([k, l]) => <option key={k} value={k}>{l}</option>)}
        </select>
      </div>
      {dangTai && <div className="text-sm text-slate-400">Đang tải...</div>}
      {!dangTai && filtered.length === 0 && <div className="text-sm text-slate-400">Không có sự kiện nào.</div>}
      {filtered.length > 0 && (
        <div className="bg-white border border-slate-200 rounded-xl overflow-hidden">
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-slate-500 text-xs">
              <tr>
                <th className="text-left p-3">Thời điểm</th>
                <th className="text-left p-3">Mã vụ</th>
                <th className="text-left p-3">Loại sự kiện</th>
                <th className="text-left p-3">Người thực hiện</th>
                <th className="text-left p-3">Ghi chú</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(ls => (
                <tr key={ls.id} className="border-t border-slate-100">
                  <td className="p-3 text-xs text-slate-500">{fmtDate(ls.thoiDiemGhi)}</td>
                  <td className="p-3 text-xs">{ls.maVuAn}</td>
                  <td className="p-3">{NHAN_SU_KIEN[ls.loaiSuKien] || ls.loaiSuKien}</td>
                  <td className="p-3 text-xs text-slate-500">{ls.nguoiThucHien}</td>
                  <td className="p-3 text-xs text-slate-500">{ls.ghiChu}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      <div className="text-xs text-slate-400 mt-3">Hiển thị {filtered.length} sự kiện gần nhất (tối đa 300).</div>
    </div>
  );
}

// ====================================================================
// MODULE: CÁN BỘ
// ====================================================================
function CanBoForm({ canBo, onDong, onXong }) {
  const [hoTen, setHoTen] = useState(canBo?.hoTen || "");
  const [vaiTro, setVaiTro] = useState(canBo?.vaiTro || "ksv");
  const [trangThai, setTrangThai] = useState(canBo?.trangThai || "dang_cong_tac");
  const [loi, setLoi] = useState("");
  const [dangLuu, setDangLuu] = useState(false);

  const luu = async () => {
    if (!hoTen.trim()) { setLoi("Cần nhập họ tên."); return; }
    setDangLuu(true);
    try {
      const data = { hoTen: hoTen.trim(), vaiTro, trangThai };
      if (canBo) await db.collection("canbo").doc(canBo.id).update(data);
      else await db.collection("canbo").add(data);
      onXong();
    } catch (err) {
      console.error(err);
      setLoi("Lỗi khi lưu: " + err.message);
      setDangLuu(false);
    }
  };

  return (
    <KhungModalHanhDong tieuDe={canBo ? "Sửa cán bộ" : "Thêm cán bộ"}>
      {loi && <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-4">{loi}</div>}
      <label className="text-xs text-slate-500 block mb-1">Họ tên</label>
      <input value={hoTen} onChange={e => setHoTen(e.target.value)} className={oInput + " mb-3"} />
      <label className="text-xs text-slate-500 block mb-1">Vai trò</label>
      <select value={vaiTro} onChange={e => setVaiTro(e.target.value)} className={oInput + " mb-3"}>
        <option value="ksv">Kiểm sát viên</option>
        <option value="dtv">Điều tra viên</option>
        <option value="can_bo_thong_ke">Cán bộ thống kê</option>
        <option value="khac">Khác</option>
      </select>
      <label className="text-xs text-slate-500 block mb-1">Trạng thái</label>
      <select value={trangThai} onChange={e => setTrangThai(e.target.value)} className={oInput + " mb-4"}>
        <option value="dang_cong_tac">Đang công tác</option>
        <option value="da_chuyen_don_vi">Đã chuyển đơn vị</option>
      </select>
      <div className="flex justify-end gap-2">
        <button onClick={onDong} className="px-4 py-2 text-sm rounded-lg text-slate-600 hover:bg-slate-100">Huỷ</button>
        <button onClick={luu} disabled={dangLuu}
                className="px-4 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium disabled:opacity-50">
          {dangLuu ? "Đang lưu..." : "Lưu"}
        </button>
      </div>
    </KhungModalHanhDong>
  );
}

function CanBoModule() {
  const [list, setList] = useState([]);
  const [dangTai, setDangTai] = useState(true);
  const [dangSua, setDangSua] = useState(null);

  useEffect(() => {
    return db.collection("canbo").orderBy("hoTen", "asc").onSnapshot(
      snap => { setList(snap.docs.map(d => ({ id: d.id, ...d.data() }))); setDangTai(false); },
      err => { console.error(err); setDangTai(false); }
    );
  }, []);

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <h2 className="text-lg font-semibold">Cán bộ</h2>
        <button onClick={() => setDangSua("moi")}
                className="bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg px-4 py-2 text-sm font-medium">
          + Thêm cán bộ
        </button>
      </div>
      {dangTai && <div className="text-sm text-slate-400">Đang tải...</div>}
      {!dangTai && list.length === 0 && <div className="text-sm text-slate-400">Chưa có cán bộ nào.</div>}
      {list.length > 0 && (
        <div className="bg-white border border-slate-200 rounded-xl overflow-hidden">
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-slate-500 text-xs">
              <tr>
                <th className="text-left p-3">Họ tên</th>
                <th className="text-left p-3">Vai trò</th>
                <th className="text-left p-3">Trạng thái</th>
                <th className="text-left p-3"></th>
              </tr>
            </thead>
            <tbody>
              {list.map((cb, i) => (
                <tr key={cb.id} className={`border-t border-slate-100 ${i % 2 === 0 ? "bg-white" : "bg-slate-50/70"}`}>
                  <td className="p-3 font-medium text-slate-800">{cb.hoTen}</td>
                  <td className="p-3">{NHAN_VAI_TRO[cb.vaiTro] || cb.vaiTro}</td>
                  <td className="p-3">
                    <Badge mau={cb.trangThai === "dang_cong_tac" ? "bg-green-100 text-green-700" : "bg-slate-200 text-slate-600"}>
                      {cb.trangThai === "dang_cong_tac" ? "Đang công tác" : "Đã chuyển đơn vị"}
                    </Badge>
                  </td>
                  <td className="p-3 text-right">
                    <button onClick={() => setDangSua(cb)} className="text-xs text-indigo-600 hover:text-indigo-700 font-medium">Sửa</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      {dangSua && (
        <CanBoForm canBo={dangSua === "moi" ? null : dangSua} onDong={() => setDangSua(null)} onXong={() => setDangSua(null)} />
      )}
    </div>
  );
}

// ====================================================================
// KHUNG CHÍNH (SIDEBAR + NỘI DUNG)
// ====================================================================
const MODULES = [
  { id: "import", label: "Import Excel", ready: true },
  { id: "list", label: "Danh sách vụ án", ready: true },
  { id: "dagiaiquyet", label: "Án đã giải quyết", ready: true },
  { id: "giaonhan", label: "Giao nhận hồ sơ", ready: true },
  { id: "ky", label: "Kỳ báo cáo", ready: true },
  { id: "dashboard", label: "Dashboard", ready: true },
  { id: "log", label: "Nhật ký thao tác", ready: true },
  { id: "canbo", label: "Cán bộ", ready: true },
];

function AppShell({ user }) {
  const [tab, setTab] = useState("import");

  return (
    <div className="h-screen flex overflow-hidden">
      <aside className="w-60 bg-slate-900 text-slate-300 flex flex-col shrink-0 overflow-y-auto">
        <div className="px-4 py-5 border-b border-slate-800">
          <div className="text-white font-semibold">QLVA</div>
          <div className="text-xs text-slate-500">Phòng 2 — VKSND Hà Nội</div>
        </div>
        <nav className="flex-1 py-2">
          {MODULES.map(m => (
            <button key={m.id} onClick={() => setTab(m.id)}
              className={`w-full text-left px-4 py-2.5 text-sm flex items-center justify-between
                ${tab === m.id ? "bg-indigo-600 text-white" : "hover:bg-slate-800"}`}>
              <span>{m.label}</span>
              {!m.ready && <span className="text-[10px] text-slate-500">sắp có</span>}
            </button>
          ))}
        </nav>
        <div className="px-4 py-3 border-t border-slate-800 text-xs">
          <div className="text-slate-400 mb-2 truncate">{user.email}</div>
          <button onClick={() => auth.signOut()} className="text-slate-500 hover:text-slate-300">Đăng xuất</button>
        </div>
      </aside>
      <main className="flex-1 p-8 overflow-auto">
        {tab === "import" && <ImportExcelModule />}
        {tab === "list" && <DanhSachVuAnModule currentUser={user} />}
        {tab === "dagiaiquyet" && <AnDaGiaiQuyetModule />}
        {tab === "giaonhan" && <GiaoNhanHoSoModule currentUser={user} />}
        {tab === "ky" && <KyBaoCaoModule />}
        {tab === "dashboard" && <DashboardModule />}
        {tab === "log" && <NhatKyModule />}
        {tab === "canbo" && <CanBoModule />}
      </main>
    </div>
  );
}

function App() {
  const [user, setUser] = useState(undefined); // undefined = đang kiểm tra, null = chưa đăng nhập

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(u => setUser(u));
    return unsub;
  }, []);

  if (user === undefined) {
    return <div className="min-h-screen flex items-center justify-center text-slate-400 text-sm">Đang tải...</div>;
  }
  if (user === null) return <LoginScreen />;
  return <AppShell user={user} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
