    setTenVu(coTen[0].hoTen.trim() + (coTen.length > 1 ? " và đồng phạm" : ""));
  }, [biCanRows, tenVuDaSua]);

  const themBiCan = () => {
    idRef.current += 1;
    setBiCanRows(rows => [...rows, moiBiCan(idRef.current)]);
  };
  const xoaBiCan = (id) => setBiCanRows(rows => rows.filter(r => r.id !== id));
  const suaBiCan = (id, patch) => setBiCanRows(rows => rows.map(r => r.id === id ? { ...r, ...patch } : r));
  const themToiDanh = (id) => setBiCanRows(rows => rows.map(r => r.id === id ? { ...r, toiDanh: [...r.toiDanh, ""], dieuLuatBC: [...(r.dieuLuatBC||[]), ""] } : r));
  const xoaToiDanh = (id, idx) => setBiCanRows(rows => rows.map(r => r.id === id ? { ...r, toiDanh: r.toiDanh.filter((_, i) => i !== idx), dieuLuatBC: (r.dieuLuatBC||[]).filter((_, i) => i !== idx) } : r));
  const suaToiDanhVaDieuLuat = (id, idx, ten, dl) => setBiCanRows(rows => rows.map(r => r.id !== id ? r : {
    ...r,
    toiDanh: r.toiDanh.map((t, i) => i === idx ? ten : t),
    dieuLuatBC: (r.dieuLuatBC||[]).map((c, i) => i === idx ? dl : c),
  }));

  const coBiCanHopLe = biCanRows.filter(r => r.hoTen.trim());

  const themTDVu = () => { setVuanToiDanh(a => [...a, ""]); setVuanDieuLuat(a => [...a, ""]); };
  const xoaTDVu = (i) => { setVuanToiDanh(a => a.filter((_, j) => j !== i)); setVuanDieuLuat(a => a.filter((_, j) => j !== i)); };
  const suaTDVu = (i, ten, dl) => {
    setVuanToiDanh(a => a.map((v, j) => j === i ? ten : v));
    setVuanDieuLuat(a => a.map((v, j) => j === i ? dl : v));
  };

  const onBamLuu = () => {
    if (!ngayQdKtva) { setLoi("Cần nhập ngày quyết định khởi tố vụ án (dùng để sinh mã vụ án)."); return; }
    if (!tenVu.trim()) { setLoi("Cần nhập tên vụ, hoặc thêm ít nhất 1 bị can để hệ thống tự đặt tên."); return; }
    if (capNhatKetQua && !ngayQuyetDinhKQ) { setLoi("Đã chọn vụ án có kết quả giải quyết thì cần nhập ngày giải quyết."); return; }
    setLoi("");
    setHienModalKy(true);
  };

  const onXacNhanKy = async (kyId) => {
    setHienModalKy(false);
    setDangLuu(true);
    try {
      const ngayQd = fromInputDate(ngayQdKtva);
      const maNoiSinh = await sinhMaVuAnMoi(ngayQd);
      const dieuLuatCuoi = coBiCanHopLe.length > 0
        ? tinhDieuLuat(biCanRows)
        : vuanToiDanh.filter(t => t.trim()).join("; ");
      const loaiKhoiToList = tinhLoaiKhoiTo(biCanRows);
      const nguoiThucHien = (currentUser && currentUser.email) || "";
      const now = new Date();

      const batch = db.batch();
      batch.set(db.collection("vuan").doc(maNoiSinh), {
        maNoiSinh, maNganhCap: maNganhCap.trim() || null, tenVu: tenVu.trim(),
        nguon, nguonChiTiet: nguon === "an_noi_khac_chuyen_den" ? nguonChiTiet.trim() : "",
        hanDieuTra: hanDieuTra ? fromInputDate(hanDieuTra) : null,
        soQdKtva: soQdKtva.trim(), ngayQdKtva: ngayQd,
        ksvChinh: ksvChinh.trim(), ksvHoTro: ksvHoTro.split(",").map(s => s.trim()).filter(Boolean),
        dtvCbdt: dtvCbdt.trim(), donViThuLy: donViThuLy.trim(),
        dieuLuat: dieuLuatCuoi,
        vuanToiDanh: coBiCanHopLe.length > 0 ? [] : vuanToiDanh.filter(t => t.trim()),
        vuanDieuLuat: coBiCanHopLe.length > 0 ? [] : vuanToiDanh.map((_, i) => vuanDieuLuat[i] || ""),
        coQuanThuLy, trangThai: capNhatKetQua ? trangThaiKetQua : "dang_giai_quyet",
        mucDoNghiemTrong,
        noiChuyenDen: "", nhapVaoVu: null, vuGoc: null, soDemTach: 0,
        anDiem, uyQuyenXetXu: uyQuyenXetXu.trim(), phienToaRutKN, ghiChu: ghiChu.trim(),
        ngayTao: now, nguoiTao: nguoiThucHien, ngayCapNhat: now, nguoiCapNhatCuoi: nguoiThucHien,
        ...(capNhatKetQua ? {
          ngayQuyetDinh: fromInputDate(ngayQuyetDinhKQ), kyHoanThanh: kyId,
          [fieldSoQuyetDinhTrenVuAn(trangThaiKetQua)]: soQuyetDinhKQ.trim(),
        } : {}),
      });

      batch.set(db.collection("lichsuChuyenGiaiDoan").doc(), {
        maVuAn: maNoiSinh, loaiSuKien: "khoi_to_vu", maBiCan: null,
        tuGiaiDoan: null, denGiaiDoan: coQuanThuLy, hanCu: null, hanMoi: null,
        hinhThucHoanThanh: null, vuTachRa: null, lyDoTach: null, vuNhapVao: null,
        ngaySuKien: ngayQd, kyThongKe: kyId, lichSuSuaKy: [], ghiChu: "",
        nguoiThucHien, thoiDiemGhi: now,
      });

      if (capNhatKetQua) {
        batch.set(db.collection("lichsuChuyenGiaiDoan").doc(), taoSuKien({
          maVuAn: maNoiSinh, loaiSuKien: "hoan_thanh", hinhThucHoanThanh: trangThaiKetQua,
          soQuyetDinh: soQuyetDinhKQ.trim(), ngaySuKien: fromInputDate(ngayQuyetDinhKQ),
          kyThongKe: kyId, ghiChu: "Nhập bổ sung án cũ đã có kết quả lúc tạo vụ án.",
          nguoiThucHien, thoiDiemGhi: now,
        }));
      }

      biCanRows.forEach((bc, i) => {
        if (!bc.hoTen.trim()) return;
        const bcRef = db.collection("bican").doc();
        const ngayKT = bc.ngayKhoiTo ? fromInputDate(bc.ngayKhoiTo) : null;
        const toiDanhSach = bc.toiDanh.map(s => s.trim()).filter(Boolean);
        const dieuLuatBCSach = toiDanhSach.map((_, ti) => (bc.dieuLuatBC || [])[ti] || "");
        batch.set(bcRef, {
          maVuAn: maNoiSinh, hoTen: bc.hoTen.trim(), namSinh: bc.namSinh ? Number(bc.namSinh) : null,
          gioiTinh: bc.gioiTinh, toiDanh: toiDanhSach.length ? toiDanhSach : [""],
          dieuLuatBC: dieuLuatBCSach.length ? dieuLuatBCSach : [""],
          dangVien: bc.dangVien, dangVienGiuChucVu: bc.dangVien === "co" ? !!bc.dangVienGiuChucVu : false,
          danToc: bc.danToc.trim() || "Kinh", quocTich: bc.quocTich.trim() || "Việt Nam",
          trinhDo: bc.trinhDo || "", taiPham: bc.taiPham || "khong",
          loaiBiCan: bc.loaiBiCan || "ca_nhan",
          tenPhapNhan: bc.loaiBiCan === "phap_nhan" ? bc.tenPhapNhan.trim() : "",
          maSoThue: bc.loaiBiCan === "phap_nhan" ? bc.maSoThue.trim() : "",
          diaChi: bc.diaChi.trim(), bienPhapNganChan: bc.bienPhapNganChan,
          hanTamGiam: bc.bienPhapNganChan === "giam" && bc.hanTamGiam ? fromInputDate(bc.hanTamGiam) : null,
          ngayKhoiTo: ngayKT, soQdKtBiCan: (bc.soQdKtBiCan || "").trim(),
          loaiKhoiTo: loaiKhoiToList[i], kyThongKeKhoiTo: kyId,
          ngayTao: now, nguoiTao: nguoiThucHien,
        });
        batch.set(db.collection("lichsuChuyenGiaiDoan").doc(), {
          maVuAn: maNoiSinh, loaiSuKien: "khoi_to_bican", maBiCan: bcRef.id,
          tuGiaiDoan: null, denGiaiDoan: null, hanCu: null, hanMoi: null,
          hinhThucHoanThanh: null, vuTachRa: null, lyDoTach: null, vuNhapVao: null,
          ngaySuKien: ngayKT || ngayQd, kyThongKe: kyId, lichSuSuaKy: [], ghiChu: "",
          nguoiThucHien, thoiDiemGhi: now,
        });
      });

      await batch.commit();
      addToast("Đã thêm vụ án");
      xoaBiCanCache(maNoiSinh);
      onDaLuu(maNoiSinh);
    } catch (err) {
      console.error(err);
      setLoi("Lỗi khi lưu: " + err.message);
      setDangLuu(false);
    }
  };

  return (
    <div className="fixed inset-0 bg-black/40 flex items-start justify-center z-40 overflow-auto py-8">
      <div className="bg-white rounded-xl shadow-lg w-[1400px] max-w-[97vw] p-6 flex flex-col max-h-[92vh]">
        <div className="flex items-center justify-between mb-4 shrink-0">
          <h3 className="text-lg font-semibold">Thêm vụ án mới</h3>
          <button onClick={onDong} className="text-red-400 hover:text-red-600 text-sm">Đóng ✕</button>
        </div>

        {loi && <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-4 shrink-0">{loi}</div>}

        <div className="flex-1 min-h-0 flex gap-4">
        <div className="w-[380px] shrink-0 overflow-y-auto pr-1">
        <div className="text-sm font-medium text-slate-600 mb-2">Thông tin vụ án</div>
        <div className="grid grid-cols-2 gap-3 mb-3">
          <Truong nhan="Mã ngành cấp (nếu có)">
            <input value={maNganhCap} onChange={e => setMaNganhCap(e.target.value)} className={oInput} placeholder="Chưa có thì để trống" />
          </Truong>
          <Truong nhan="Tên vụ" rong2>
            <input value={tenVu} onChange={e => { setTenVu(e.target.value); setTenVuDaSua(true); }} className={oInput} />
          </Truong>
          <Truong nhan="Cơ quan đang thụ lý">
            <select value={coQuanThuLy} onChange={e => setCoQuanThuLy(e.target.value)} className={oInput}>
              <option value="dieu_tra">Điều tra</option>
              <option value="truy_to">Truy tố</option>
              <option value="xet_xu">Xét xử</option>
            </select>
          </Truong>

          <Truong nhan="Nguồn">
            <select value={nguon} onChange={e => setNguon(e.target.value)} className={oInput}>
              <option value="an_khoi_to_moi">Án khởi tố mới</option>
              <option value="tin_bao_khoi_to_len">Tin báo khởi tố lên</option>
              <option value="an_noi_khac_chuyen_den">Án nơi khác chuyển đến</option>
              <option value="phuc_hoi_dieu_tra">Phục hồi điều tra</option>
            </select>
          </Truong>
          {nguon === "an_noi_khac_chuyen_den" && (
            <Truong nhan="Chi tiết nguồn">
              <input value={nguonChiTiet} onChange={e => setNguonChiTiet(e.target.value)} className={oInput} />
            </Truong>
          )}
          <Truong nhan="Số QĐ khởi tố VA">
            <input value={soQdKtva} onChange={e => setSoQdKtva(e.target.value)} className={oInput} />
          </Truong>
          <Truong nhan="Ngày QĐ khởi tố VA *">
            <NhapNgay value={ngayQdKtva} onChange={e => setNgayQdKtva(e.target.value)} className={oInput} />
          </Truong>

          <Truong nhan="Hạn điều tra">
            <NhapNgay value={hanDieuTra} onChange={e => setHanDieuTra(e.target.value)} className={oInput} />
          </Truong>
          <Truong nhan="KSV chính">
            <input value={ksvChinh} onChange={e => setKsvChinh(e.target.value)} list="ds-ksv" className={oInput} />
          </Truong>
          <Truong nhan="KSV hỗ trợ (cách nhau dấu phẩy)">
            <input value={ksvHoTro} onChange={e => setKsvHoTro(e.target.value)} list="ds-ksv" className={oInput} />
          </Truong>
          <Truong nhan="ĐTV / CBĐT">
            <input value={dtvCbdt} onChange={e => setDtvCbdt(e.target.value)} list="ds-dtv" className={oInput} />
          </Truong>
          <datalist id="ds-ksv">{dsCanBo.filter(c => c.vaiTro === "ksv").map(c => <option key={c.id} value={c.hoTen} />)}</datalist>
          <datalist id="ds-dtv">{dsCanBo.filter(c => c.vaiTro === "dtv").map(c => <option key={c.id} value={c.hoTen} />)}</datalist>

          <Truong nhan="Đơn vị thụ lý">
            <input value={donViThuLy} onChange={e => setDonViThuLy(e.target.value)} className={oInput} />
          </Truong>
          <Truong nhan="Điều luật / tội danh vụ án" rong2>
            {coBiCanHopLe.length > 0 ? (
              <input disabled value={tinhDieuLuat(biCanRows)} className={oInput + " bg-slate-50 text-slate-400"} />
            ) : (
              <div>
                <BlhsSelector />
                <div className="space-y-1">
                  {vuanToiDanh.map((t, i) => (
                    <div key={i} className="flex items-center gap-1">
                      <span className="text-[10px] w-14 shrink-0 text-slate-400">{i === 0 ? "Tội chính" : "Bổ sung"}</span>
                      <ToiDanhInput
                        ten={t}
                        dieuLuat={vuanDieuLuat[i] || ""}
                        onChange={({ten, dieuLuat}) => suaTDVu(i, ten, dieuLuat)}
                        danhMuc={danhMucTD}
                      />
                      {vuanToiDanh.length > 1 && (
                        <button type="button" onClick={() => xoaTDVu(i)} className="text-xs text-red-500 shrink-0">✕</button>
                      )}
                    </div>
                  ))}
                </div>
                <button type="button" onClick={themTDVu} className="text-xs text-indigo-600 hover:text-indigo-700 mt-1">+ Thêm tội danh</button>
              </div>
            )}
          </Truong>
          <Truong nhan="Mức độ nghiêm trọng">
            <select value={mucDoNghiemTrong} onChange={e => setMucDoNghiemTrong(e.target.value)} className={oInput}>
              {Object.entries(NHAN_MUC_DO_NGHIEM_TRONG).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
            </select>
          </Truong>
          <Truong nhan="Uỷ quyền xét xử">
            <input value={uyQuyenXetXu} onChange={e => setUyQuyenXetXu(e.target.value)} className={oInput} />
          </Truong>

          <label className="flex items-center gap-2 text-sm mt-5">
            <input type="checkbox" checked={anDiem} onChange={e => setAnDiem(e.target.checked)} /> Án điểm
          </label>
          <label className="flex items-center gap-2 text-sm mt-5">
            <input type="checkbox" checked={phienToaRutKN} onChange={e => setPhienToaRutKN(e.target.checked)} /> Phiên toà rút kinh nghiệm
          </label>
        </div>
        <Truong nhan="Ghi chú">
          <textarea value={ghiChu} onChange={e => setGhiChu(e.target.value)} rows={2} className={oInput} />
        </Truong>

        <div className="border border-amber-200 bg-amber-50 rounded-lg p-3 mt-3 mb-3">
          <label className="flex items-center gap-2 text-sm font-medium text-amber-800 cursor-pointer">
            <input type="checkbox" checked={capNhatKetQua} onChange={e => setCapNhatKetQua(e.target.checked)} />
            Vụ án đã có kết quả giải quyết (dùng khi nhập bổ sung án cũ)
          </label>
          {capNhatKetQua && (
            <div className="grid grid-cols-1 gap-3 mt-3">
              <Truong nhan="Hình thức giải quyết">
                <select value={trangThaiKetQua} onChange={e => setTrangThaiKetQua(e.target.value)} className={oInput}>
                  {TUY_CHON_HOAN_THANH.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                </select>
              </Truong>
              <Truong nhan="Ngày giải quyết *">
                <NhapNgay value={ngayQuyetDinhKQ} onChange={e => setNgayQuyetDinhKQ(e.target.value)} className={oInput} />
              </Truong>
              <Truong nhan={NHAN_SO_QUYET_DINH_HOAN_THANH[trangThaiKetQua]}>
                <input value={soQuyetDinhKQ} onChange={e => setSoQuyetDinhKQ(e.target.value)} className={oInput} />
              </Truong>
            </div>
          )}
        </div>
        </div>

        <div className="flex-1 min-w-0 flex flex-col overflow-y-auto">
        <div className="flex items-center justify-between mb-2 sticky top-0 bg-white z-10 pb-2">
          <div className="text-sm font-medium text-slate-600">Bị can ({biCanRows.length})</div>
          <button onClick={themBiCan} className="text-xs text-indigo-600 hover:text-indigo-700 font-medium">+ Thêm bị can</button>
        </div>

        <div className="space-y-3">
          {biCanRows.map((bc, idx) => (
            <div key={bc.id} className="border border-slate-200 rounded-lg p-3">
              <div className="flex items-center justify-between mb-2">
                <div className="text-xs font-medium text-slate-500">Bị can #{idx + 1}</div>
                {biCanRows.length > 1 && (
                  <button onClick={() => xoaBiCan(bc.id)} className="text-xs text-red-500 hover:text-red-700">Xoá</button>
                )}
              </div>
              <div className="grid grid-cols-4 gap-3">
                <Truong nhan="Họ tên">
                  <input value={bc.hoTen} onChange={e => suaBiCan(bc.id, { hoTen: e.target.value })} className={oInput} />
                </Truong>
                <Truong nhan="Năm sinh">
                  <input type="number" value={bc.namSinh} onChange={e => suaBiCan(bc.id, { namSinh: e.target.value })} className={oInput} />
                </Truong>
                <Truong nhan="Giới tính">
                  <select value={bc.gioiTinh} onChange={e => suaBiCan(bc.id, { gioiTinh: e.target.value })} className={oInput}>
                    <option value="nam">Nam</option><option value="nu">Nữ</option>
                  </select>
                </Truong>
                <Truong nhan="Dân tộc">
                  <input value={bc.danToc} onChange={e => suaBiCan(bc.id, { danToc: e.target.value })} className={oInput} />
                </Truong>

                <Truong nhan="Quốc tịch">
                  <input value={bc.quocTich||"Việt Nam"} onChange={e => suaBiCan(bc.id, { quocTich: e.target.value })} className={oInput} />
                </Truong>
                <Truong nhan="Trình độ">
                  <select value={bc.trinhDo||""} onChange={e => suaBiCan(bc.id, { trinhDo: e.target.value })} className={oInput}>
                    <option value="">— chưa rõ —</option>
                    {Object.entries(NHAN_TRINH_DO).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
                  </select>
                </Truong>
                <Truong nhan="Tái phạm">
                  <select value={bc.taiPham||"khong"} onChange={e => suaBiCan(bc.id, { taiPham: e.target.value })} className={oInput}>
                    {Object.entries(NHAN_TAI_PHAM).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
                  </select>
                </Truong>
                <Truong nhan="Loại bị can">
                  <select value={bc.loaiBiCan||"ca_nhan"} onChange={e => suaBiCan(bc.id, { loaiBiCan: e.target.value })} className={oInput}>
                    <option value="ca_nhan">Cá nhân</option><option value="phap_nhan">Pháp nhân</option>
                  </select>
                </Truong>

                {bc.loaiBiCan === "phap_nhan" && (<>
                  <Truong nhan="Tên pháp nhân" rong2>
                    <input value={bc.tenPhapNhan||""} onChange={e => suaBiCan(bc.id, { tenPhapNhan: e.target.value })} className={oInput} />
                  </Truong>
                  <Truong nhan="Mã số thuế">
                    <input value={bc.maSoThue||""} onChange={e => suaBiCan(bc.id, { maSoThue: e.target.value })} className={oInput} />
                  </Truong>
                </>)}

                <Truong nhan="Đảng viên">
                  <select value={bc.dangVien} onChange={e => suaBiCan(bc.id, { dangVien: e.target.value })} className={oInput}>
                    <option value="khong">Không</option><option value="co">Có</option>
                  </select>
                </Truong>
                {bc.dangVien === "co" && (
                  <Truong nhan="Giữ chức danh QL">
                    <label className="flex items-center gap-2 text-sm mt-1">
                      <input type="checkbox" checked={!!bc.dangVienGiuChucVu} onChange={e => suaBiCan(bc.id, { dangVienGiuChucVu: e.target.checked })} />
                      Có
                    </label>
                  </Truong>
                )}
                <Truong nhan="Biện pháp ngăn chặn">
                  <select value={bc.bienPhapNganChan} onChange={e => suaBiCan(bc.id, { bienPhapNganChan: e.target.value })} className={oInput}>
                    <option value="tai_ngoai">Tại ngoại</option><option value="giam">Tạm giam</option>
                  </select>
                </Truong>
                {bc.bienPhapNganChan === "giam" && (
                  <Truong nhan="Hạn tạm giam">
                    <NhapNgay value={bc.hanTamGiam} onChange={e => suaBiCan(bc.id, { hanTamGiam: e.target.value })} className={oInput} />
                  </Truong>
                )}
                <Truong nhan="Ngày khởi tố bị can">
                  <NhapNgay value={bc.ngayKhoiTo} onChange={e => suaBiCan(bc.id, { ngayKhoiTo: e.target.value })} className={oInput} />
                </Truong>
                <Truong nhan="Số QĐ khởi tố bị can">
                  <input value={bc.soQdKtBiCan||""} onChange={e => suaBiCan(bc.id, { soQdKtBiCan: e.target.value })} placeholder="VD: 15/QĐ-VKS" className={oInput} />
                </Truong>

                <Truong nhan="Địa chỉ" rong4>
                  <textarea value={bc.diaChi} onChange={e => suaBiCan(bc.id, { diaChi: e.target.value })}
                            rows={1} className={oInput + " resize-y"} style={{ minHeight: "36px" }} />
                </Truong>
              </div>

              <div className="mt-2">
                <BlhsSelector />
                <div className="text-xs text-slate-500 mb-1">Tội danh</div>
                <div className="space-y-1">
                  {bc.toiDanh.map((t, i) => (
                    <div key={i} className="flex items-center gap-1">
                      <span className="text-[10px] w-14 shrink-0 text-slate-400">{i === 0 ? "Tội chính" : "Bổ sung"}</span>
                      <ToiDanhInput
                        ten={t}
                        dieuLuat={(bc.dieuLuatBC||[])[i] || ""}
                        onChange={({ten, dieuLuat}) => suaToiDanhVaDieuLuat(bc.id, i, ten, dieuLuat)}
                        danhMuc={danhMucTD}
                      />
                      {bc.toiDanh.length > 1 && (
                        <button onClick={() => xoaToiDanh(bc.id, i)} className="text-xs text-red-500">✕</button>
                      )}
                    </div>
                  ))}
                </div>
                <button onClick={() => themToiDanh(bc.id)} className="text-xs text-indigo-600 hover:text-indigo-700 mt-1">+ Thêm tội danh</button>
              </div>
            </div>
          ))}
        </div>
        </div>
        </div>

        <div className="flex justify-end gap-2 mt-6 shrink-0">
          <button onClick={onDong} className="px-4 py-2 text-sm rounded-lg text-red-600 hover:bg-red-50">Huỷ</button>
          <button onClick={onBamLuu} disabled={dangLuu}
                  className="px-4 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium disabled:opacity-50">
            {dangLuu ? "Đang lưu..." : "Lưu vụ án"}
          </button>
        </div>
      </div>

      <ModalXacNhanKy open={hienModalKy} onHuy={() => setHienModalKy(false)} onXacNhan={onXacNhanKy} />
    </div>
  );
}

function MenuHanhDongNhanh({ vuAn, onMoHanhDong }) {
  const coTheChuyen = vuAn.trangThai === "dang_giai_quyet" && vuAn.coQuanThuLy !== "xet_xu";
  const coTheGiaiQuyet = vuAn.trangThai === "dang_giai_quyet";
  if (!coTheChuyen && !coTheGiaiQuyet) return <span className="text-slate-300">—</span>;

  return (
    <div className="flex flex-col gap-1 items-end w-24" onClick={e => e.stopPropagation()}>
      {coTheChuyen && (
        <button onClick={() => onMoHanhDong(vuAn, "chuyen_giai_doan")}
                className="text-[11px] px-2 py-1 rounded border border-indigo-200 text-indigo-600 hover:bg-indigo-50 font-medium w-full">
          Chuyển giai đoạn
        </button>
      )}
      {coTheGiaiQuyet && (
        <button onClick={() => onMoHanhDong(vuAn, "hoan_thanh")}
                className="text-[11px] px-2 py-1 rounded border border-emerald-200 text-emerald-700 hover:bg-emerald-50 font-medium w-full">
          Hoàn thành
        </button>
      )}
    </div>
  );
}

// Sửa các trường thông tin thường (không phải trạng thái/giai đoạn/điều luật — những trường đó
// chỉ đổi qua các hành động nghiệp vụ có ghi log). Không ghi log, không hỏi kỳ — đây là sửa lỗi
// nhập liệu, không phải 1 sự kiện nghiệp vụ.
function SuaVuAnForm({ vuAn, onDong, onXong }) {
  const dsCanBo = useDanhSachCanBo();
  const danhMucTD = useDanhMucToiDanh();
  // Vụ đã hoàn thành (mọi trạng thái trừ đang giải quyết) mới cho sửa ngày/số QĐ giải quyết —
  // đây là dữ liệu Án đã giải quyết cần, thường thiếu/sai do import cũ (xem cờ
  // ngayQuyetDinhUocTinh) hoặc do hoàn thành trước khi có field riêng cho từng hình thức.
  const laDaHoanThanh = vuAn.trangThai !== "dang_giai_quyet";
  const fieldSoQD = laDaHoanThanh ? fieldSoQuyetDinhTrenVuAn(vuAn.trangThai) : null;
  const [ngayQuyetDinh, setNgayQuyetDinh] = useState(toInputDate(vuAn.ngayQuyetDinh));
  const [soQuyetDinhGQ, setSoQuyetDinhGQ] = useState(fieldSoQD ? (vuAn[fieldSoQD] || "") : "");
  const [maNganhCap, setMaNganhCap] = useState(vuAn.maNganhCap || "");
  const [tenVu, setTenVu] = useState(vuAn.tenVu || "");
  const [nguon, setNguon] = useState(vuAn.nguon || "an_khoi_to_moi");
  const [nguonChiTiet, setNguonChiTiet] = useState(vuAn.nguonChiTiet || "");
  const [soQdKtva, setSoQdKtva] = useState(vuAn.soQdKtva || "");
  const [ngayQdKtva, setNgayQdKtva] = useState(toInputDate(vuAn.ngayQdKtva));
  const [hanDieuTra, setHanDieuTra] = useState(toInputDate(vuAn.hanDieuTra));
  const [ksvChinh, setKsvChinh] = useState(vuAn.ksvChinh || "");
  const [ksvHoTro, setKsvHoTro] = useState((vuAn.ksvHoTro || []).join(", "));
  const [dtvCbdt, setDtvCbdt] = useState(vuAn.dtvCbdt || "");
  const [donViThuLy, setDonViThuLy] = useState(vuAn.donViThuLy || "");
  const [uyQuyenXetXu, setUyQuyenXetXu] = useState(vuAn.uyQuyenXetXu || "");
  const [mucDoNghiemTrong, setMucDoNghiemTrong] = useState(vuAn.mucDoNghiemTrong || "dac_biet_nghiem_trong");
  const [anDiem, setAnDiem] = useState(!!vuAn.anDiem);
  const [phienToaRutKN, setPhienToaRutKN] = useState(!!vuAn.phienToaRutKN);
  const [ghiChu, setGhiChu] = useState(vuAn.ghiChu || "");
  // Khởi tạo từ vuanToiDanh mới (multi-entry) hoặc fallback split từ dieuLuat cũ
  const initVuanTD = (() => {
    if (vuAn.vuanToiDanh && vuAn.vuanToiDanh.length) return vuAn.vuanToiDanh;
    if (vuAn.dieuLuat) return vuAn.dieuLuat.split(";").map(s => s.trim()).filter(Boolean);
    return [""];
  })();
  const [vuanToiDanh, setVuanToiDanh] = useState(initVuanTD);
  const [vuanDieuLuat, setVuanDieuLuat] = useState(
    () => (vuAn.vuanDieuLuat && vuAn.vuanDieuLuat.length) ? vuAn.vuanDieuLuat : initVuanTD.map(() => "")
  );
  const [loi, setLoi] = useState("");
  const [dangLuu, setDangLuu] = useState(false);

  const themTDVu = () => { setVuanToiDanh(a => [...a, ""]); setVuanDieuLuat(a => [...a, ""]); };
  const xoaTDVu = (i) => { setVuanToiDanh(a => a.filter((_, j) => j !== i)); setVuanDieuLuat(a => a.filter((_, j) => j !== i)); };
  const suaTDVu = (i, ten, dl) => {
    setVuanToiDanh(a => a.map((v, j) => j === i ? ten : v));
    setVuanDieuLuat(a => a.map((v, j) => j === i ? dl : v));
  };

  const luu = async () => {
    if (!tenVu.trim()) { setLoi("Cần nhập tên vụ."); return; }
    if (!ngayQdKtva) { setLoi("Cần nhập ngày QĐ khởi tố VA."); return; }
    setDangLuu(true);
    try {
      const nguoiThucHien = auth.currentUser?.email || "";
      await db.collection("vuan").doc(vuAn.id).update({
        maNganhCap: maNganhCap.trim() || null, tenVu: tenVu.trim(),
        nguon, nguonChiTiet: nguon === "an_noi_khac_chuyen_den" ? nguonChiTiet.trim() : "",
        soQdKtva: soQdKtva.trim(), ngayQdKtva: fromInputDate(ngayQdKtva),
        hanDieuTra: hanDieuTra ? fromInputDate(hanDieuTra) : null,
        ksvChinh: ksvChinh.trim(), ksvHoTro: ksvHoTro.split(",").map(s => s.trim()).filter(Boolean),
        dtvCbdt: dtvCbdt.trim(), donViThuLy: donViThuLy.trim(), uyQuyenXetXu: uyQuyenXetXu.trim(),
        mucDoNghiemTrong,
        anDiem, phienToaRutKN, ghiChu: ghiChu.trim(),
        dieuLuat: vuanToiDanh.filter(t => t.trim()).join("; ") || null,
        vuanToiDanh: vuanToiDanh.filter(t => t.trim()),
        vuanDieuLuat: vuanToiDanh.map((_, i) => vuanDieuLuat[i] || ""),
        // Chỉ ghi ngày/số QĐ giải quyết khi vụ đã hoàn thành (mục "Án đã giải quyết") — vụ đang
        // giải quyết không có khối này trên form nên không đụng tới field ngayQuyetDinh của nó.
        ...(laDaHoanThanh ? {
          ngayQuyetDinh: ngayQuyetDinh ? fromInputDate(ngayQuyetDinh) : null,
          ...(fieldSoQD ? { [fieldSoQD]: soQuyetDinhGQ.trim() } : {}),
          // Người dùng vừa tự xác nhận/sửa ngày giải quyết thật — xoá cờ "ngày ước tính" (nếu có)
          // để Án đã giải quyết thôi tô đỏ cảnh báo dòng này.
          ngayQuyetDinhUocTinh: false,
        } : {}),
        ngayCapNhat: new Date(), nguoiCapNhatCuoi: nguoiThucHien,
      });
      addToast("Đã lưu thông tin vụ án");
      onXong();
    } catch (err) {
      console.error(err);
      setLoi("Lỗi khi lưu: " + err.message);
      setDangLuu(false);
    }
  };

  return (
    <div className="fixed inset-0 bg-black/40 flex items-start justify-center z-40 overflow-auto py-8">
      <div className="bg-white rounded-xl shadow-lg w-[900px] max-w-[95vw] p-6">
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-lg font-semibold">Sửa thông tin vụ án</h3>
          <button onClick={onDong} className="text-red-400 hover:text-red-600 text-sm">Đóng ✕</button>
        </div>
        <div className="bg-amber-50 border border-amber-200 text-amber-800 text-xs rounded-lg p-3 mb-4">
          Chỉ sửa thông tin thường (KSV, đơn vị, ghi chú...). Muốn đổi giai đoạn/trạng thái, dùng các nút hành động ở panel chi tiết.
        </div>
        {loi && <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-4">{loi}</div>}

        {laDaHoanThanh && (
          <div className="border border-slate-200 rounded-lg p-3 mb-3 bg-slate-50">
            <div className="text-xs text-slate-500 mb-2 font-medium">
              Thông tin giải quyết ({NHAN_TRANG_THAI[vuAn.trangThai] || vuAn.trangThai})
              {vuAn.ngayQuyetDinhUocTinh && (
                <span className="text-red-600 font-normal ml-1">
                  — ngày hiện đang là NGÀY ƯỚC TÍNH (do import thiếu dữ liệu), sửa lại ngày thật rồi Lưu để xoá cảnh báo.
                </span>
              )}
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Truong nhan="Ngày giải quyết">
                <NhapNgay value={ngayQuyetDinh} onChange={e => setNgayQuyetDinh(e.target.value)} className={oInput} />
              </Truong>
              <Truong nhan={NHAN_SO_QUYET_DINH_HOAN_THANH[vuAn.trangThai] || "Số QĐ giải quyết"}>
                <input value={soQuyetDinhGQ} onChange={e => setSoQuyetDinhGQ(e.target.value)} className={oInput} />
              </Truong>
            </div>
          </div>
        )}

        <div className="grid grid-cols-4 gap-3 mb-3">
          <Truong nhan="Mã ngành cấp (nếu có)">
            <input value={maNganhCap} onChange={e => setMaNganhCap(e.target.value)} className={oInput} />
          </Truong>
          <Truong nhan="Tên vụ" rong2>
            <input value={tenVu} onChange={e => setTenVu(e.target.value)} className={oInput} />
          </Truong>
          <Truong nhan="Nguồn">
            <select value={nguon} onChange={e => setNguon(e.target.value)} className={oInput}>
              <option value="an_khoi_to_moi">Án khởi tố mới</option>
              <option value="tin_bao_khoi_to_len">Tin báo khởi tố lên</option>
              <option value="an_noi_khac_chuyen_den">Án nơi khác chuyển đến</option>
              <option value="phuc_hoi_dieu_tra">Phục hồi điều tra</option>
            </select>
          </Truong>
          {nguon === "an_noi_khac_chuyen_den" && (
            <Truong nhan="Chi tiết nguồn">
              <input value={nguonChiTiet} onChange={e => setNguonChiTiet(e.target.value)} className={oInput} />
            </Truong>
          )}
          <Truong nhan="Số QĐ khởi tố VA">
            <input value={soQdKtva} onChange={e => setSoQdKtva(e.target.value)} className={oInput} />
          </Truong>
          <Truong nhan="Ngày QĐ khởi tố VA">
            <NhapNgay value={ngayQdKtva} onChange={e => setNgayQdKtva(e.target.value)} className={oInput} />
          </Truong>
          <Truong nhan="Hạn điều tra">
            <NhapNgay value={hanDieuTra} onChange={e => setHanDieuTra(e.target.value)} className={oInput} />
          </Truong>
          <Truong nhan="KSV chính">
            <input value={ksvChinh} onChange={e => setKsvChinh(e.target.value)} list="ds-ksv-sua" className={oInput} />
          </Truong>
          <Truong nhan="KSV hỗ trợ (cách nhau dấu phẩy)">
            <input value={ksvHoTro} onChange={e => setKsvHoTro(e.target.value)} list="ds-ksv-sua" className={oInput} />
          </Truong>
          <Truong nhan="ĐTV / CBĐT">
            <input value={dtvCbdt} onChange={e => setDtvCbdt(e.target.value)} list="ds-dtv-sua" className={oInput} />
          </Truong>
          <Truong nhan="Đơn vị thụ lý">
            <input value={donViThuLy} onChange={e => setDonViThuLy(e.target.value)} className={oInput} />
          </Truong>
          <Truong nhan="Mức độ nghiêm trọng">
            <select value={mucDoNghiemTrong} onChange={e => setMucDoNghiemTrong(e.target.value)} className={oInput}>
              {Object.entries(NHAN_MUC_DO_NGHIEM_TRONG).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
            </select>
          </Truong>
          <Truong nhan="Uỷ quyền xét xử">
            <input value={uyQuyenXetXu} onChange={e => setUyQuyenXetXu(e.target.value)} className={oInput} />
          </Truong>
          <label className="flex items-center gap-2 text-sm mt-5">
            <input type="checkbox" checked={anDiem} onChange={e => setAnDiem(e.target.checked)} /> Án điểm
          </label>
          <label className="flex items-center gap-2 text-sm mt-5">
            <input type="checkbox" checked={phienToaRutKN} onChange={e => setPhienToaRutKN(e.target.checked)} /> Phiên toà rút kinh nghiệm
          </label>
          <datalist id="ds-ksv-sua">{dsCanBo.filter(c => c.vaiTro === "ksv").map(c => <option key={c.id} value={c.hoTen} />)}</datalist>
          <datalist id="ds-dtv-sua">{dsCanBo.filter(c => c.vaiTro === "dtv").map(c => <option key={c.id} value={c.hoTen} />)}</datalist>
        </div>
        <div className="mb-3">
          <div className="text-xs text-slate-500 mb-1 font-medium">Điều luật / tội danh vụ án</div>
          <div className="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded px-2 py-1 mb-1.5">
            Ô số 1 (Tội chính) dùng tính thống kê. Nếu vụ đã có bị can, hệ thống tự tính lại từ bị can mỗi khi sửa bị can.
          </div>
          <BlhsSelector />
          <div className="space-y-1">
            {vuanToiDanh.map((t, i) => (
              <div key={i} className="flex items-center gap-1">
                <span className="text-[10px] w-14 shrink-0 text-slate-400">{i === 0 ? "Tội chính" : "Bổ sung"}</span>
                <ToiDanhInput
                  ten={t}
                  dieuLuat={vuanDieuLuat[i] || ""}
                  onChange={({ten, dieuLuat}) => suaTDVu(i, ten, dieuLuat)}
                  danhMuc={danhMucTD}
                />
                {vuanToiDanh.length > 1 && (
                  <button type="button" onClick={() => xoaTDVu(i)} className="text-xs text-red-500 shrink-0">✕</button>
                )}
              </div>
            ))}
          </div>
          <button type="button" onClick={themTDVu} className="text-xs text-indigo-600 hover:text-indigo-700 mt-1">+ Thêm tội danh</button>
        </div>
        <Truong nhan="Ghi chú">
          <textarea value={ghiChu} onChange={e => setGhiChu(e.target.value)} rows={2} className={oInput} />
        </Truong>

        <div className="flex justify-end gap-2 mt-6">
          <button onClick={onDong} className="px-4 py-2 text-sm rounded-lg text-red-600 hover:bg-red-50">Huỷ</button>
          <button onClick={luu} disabled={dangLuu}
                  className="px-4 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium disabled:opacity-50">
            {dangLuu ? "Đang lưu..." : "Lưu"}
          </button>
        </div>
      </div>
    </div>
  );
}

// Sửa 1 bị can — sau khi lưu, tính lại dieuLuat + loaiKhoiTo cho TOÀN BỘ bị can của vụ (vì
// ngayKhoiTo/toiDanh đổi có thể làm thay đổi ai là "ban đầu" và điều luật gộp cấp vụ).
function SuaBiCanForm({ biCan, vuAn, onDong, onXong }) {
  const danhMucTD = useDanhMucToiDanh();
  const [hoTen, setHoTen] = useState(biCan.hoTen || "");
  const [namSinh, setNamSinh] = useState(biCan.namSinh || "");
  const [gioiTinh, setGioiTinh] = useState(biCan.gioiTinh || "nam");
  const [danToc, setDanToc] = useState(biCan.danToc || "Kinh");
  const [quocTich, setQuocTich] = useState(biCan.quocTich || "Việt Nam");
  const [dangVien, setDangVien] = useState(biCan.dangVien || "khong");
  const [dangVienGiuChucVu, setDangVienGiuChucVu] = useState(!!biCan.dangVienGiuChucVu);
  const [trinhDo, setTrinhDo] = useState(biCan.trinhDo || "");
  const [taiPham, setTaiPham] = useState(biCan.taiPham || "khong");
  const [loaiBiCan, setLoaiBiCan] = useState(biCan.loaiBiCan || "ca_nhan");
  const [tenPhapNhan, setTenPhapNhan] = useState(biCan.tenPhapNhan || "");
  const [maSoThue, setMaSoThue] = useState(biCan.maSoThue || "");
  const [diaChi, setDiaChi] = useState(biCan.diaChi || "");
  const [bienPhapNganChan, setBienPhapNganChan] = useState(biCan.bienPhapNganChan || "tai_ngoai");
  const [hanTamGiam, setHanTamGiam] = useState(toInputDate(biCan.hanTamGiam));
  const [ngayKhoiTo, setNgayKhoiTo] = useState(toInputDate(biCan.ngayKhoiTo));
  const [toiDanh, setToiDanh] = useState(biCan.toiDanh && biCan.toiDanh.length ? biCan.toiDanh : [""]);
  const [dieuLuatBC, setDieuLuatBC] = useState(biCan.dieuLuatBC && biCan.dieuLuatBC.length ? biCan.dieuLuatBC : [""]);
  const [soQdKtBiCan, setSoQdKtBiCan] = useState(biCan.soQdKtBiCan || "");
  const [loi, setLoi] = useState("");
  const [dangLuu, setDangLuu] = useState(false);

  const themToiDanh = () => { setToiDanh(t => [...t, ""]); setDieuLuatBC(d => [...d, ""]); };
  const xoaToiDanh = (i) => { setToiDanh(t => t.filter((_, idx) => idx !== i)); setDieuLuatBC(d => d.filter((_, idx) => idx !== i)); };
  const suaToiDanhVaDieuLuat = (i, ten, dl) => {
    setToiDanh(t => t.map((x, idx) => idx === i ? ten : x));
    setDieuLuatBC(d => d.map((c, idx) => idx === i ? dl : c));
  };

  const luu = async () => {
    if (!hoTen.trim()) { setLoi("Cần nhập họ tên."); return; }
    setDangLuu(true);
    try {
      const toiDanhSach = toiDanh.map(s => s.trim()).filter(Boolean);
      const dieuLuatBCSach = toiDanhSach.map((_, i) => dieuLuatBC[i] || "");
      await db.collection("bican").doc(biCan.id).update({
        hoTen: hoTen.trim(), namSinh: namSinh ? Number(namSinh) : null, gioiTinh,
        danToc: danToc.trim() || "Kinh", quocTich: quocTich.trim() || "Việt Nam",
        dangVien, dangVienGiuChucVu: dangVien === "co" ? dangVienGiuChucVu : false,
        trinhDo: trinhDo || "", taiPham: taiPham || "khong",
        loaiBiCan: loaiBiCan || "ca_nhan",
        tenPhapNhan: loaiBiCan === "phap_nhan" ? tenPhapNhan.trim() : "",
        maSoThue: loaiBiCan === "phap_nhan" ? maSoThue.trim() : "",
        diaChi: diaChi.trim(), bienPhapNganChan,
        hanTamGiam: bienPhapNganChan === "giam" && hanTamGiam ? fromInputDate(hanTamGiam) : null,
        ngayKhoiTo: ngayKhoiTo ? fromInputDate(ngayKhoiTo) : null,
        soQdKtBiCan: soQdKtBiCan.trim(),
        toiDanh: toiDanhSach.length ? toiDanhSach : [""],
        dieuLuatBC: dieuLuatBCSach.length ? dieuLuatBCSach : [""],
      });

      // Tính lại dieuLuat + loaiKhoiTo cho cả vụ vì bị can này vừa đổi.
      const bcSnap = await db.collection("bican").where("maVuAn", "==", vuAn.id).get();
      const bcList = bcSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      const dieuLuatMoi = tinhDieuLuat(bcList);
      const loaiKhoiToMoi = tinhLoaiKhoiToTheoNgay(bcList.map(bc => bc.ngayKhoiTo ? (bc.ngayKhoiTo.toDate ? bc.ngayKhoiTo.toDate() : new Date(bc.ngayKhoiTo)) : null));
      const batch = db.batch();
      batch.update(db.collection("vuan").doc(vuAn.id), { dieuLuat: dieuLuatMoi });
      bcList.forEach((bc, i) => {
        if (bc.loaiKhoiTo !== loaiKhoiToMoi[i]) batch.update(db.collection("bican").doc(bc.id), { loaiKhoiTo: loaiKhoiToMoi[i] });
      });
      await batch.commit();
      addToast("Đã lưu thông tin bị can");
      xoaBiCanCache(vuAn.id);
      onXong();
    } catch (err) {
      console.error(err);
      setLoi("Lỗi khi lưu: " + err.message);
      setDangLuu(false);
    }
  };

  return (
    <KhungModalHanhDong tieuDe={`Sửa bị can: ${biCan.hoTen}`} rongnhat>
      {loi && <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-4">{loi}</div>}
      <div className="grid grid-cols-4 gap-3 mb-3">
        <Truong nhan="Họ tên"><input value={hoTen} onChange={e => setHoTen(e.target.value)} className={oInput} /></Truong>

// Thêm bị can mới vào vụ án đang tồn tại — tạo doc bican + log khoi_to_bican,
// cập nhật dieuLuat + loaiKhoiTo của toàn vụ, hỏi kỳ báo cáo trước khi ghi.
function ThemBiCanForm({ vuAn, onDong, onXong }) {
  const danhMucTD = useDanhMucToiDanh();
  const [hoTen, setHoTen] = useState("");

    setToiDanh(t => t.map((x, idx) => idx === i ? ten : x));

  const kiemTra = () => {
    if (!hoTen.trim()) { setLoi("Cần nhập họ tên."); return false; }

  const luuVoiKy = async (kyId) => {

      const now = firebase.firestore.FieldValue.serverTimestamp();
      const nguoiThucHien = auth.currentUser ? auth.currentUser.email : "";
      const toiDanhSach = toiDanh.map(s => s.trim()).filter(Boolean);
      const dieuLuatBCSach = toiDanhSach.map((_, ti) => (dieuLuatBC)[ti] || "");
      const ngayKT = ngayKhoiTo ? fromInputDate(ngayKhoiTo) : null;

      const bcRef = db.collection("bican").doc();
      const batch = db.batch();
      batch.set(bcRef, {
        maVuAn: vuAn.id, hoTen: hoTen.trim(), namSinh: namSinh ? Number(namSinh) : null,

        ngayKhoiTo: ngayKT, soQdKtBiCan: soQdKtBiCan.trim(),
        loaiKhoiTo: "bo_sung", ngayTao: now, nguoiTao: nguoiThucHien,
      });
      batch.set(db.collection("lichsuChuyenGiaiDoan").doc(), {
        maVuAn: vuAn.id, loaiSuKien: "khoi_to_bican", maBiCan: bcRef.id,
        tuGiaiDoan: null, denGiaiDoan: null, hanCu: null, hanMoi: null,
        hinhThucHoanThanh: null, vuTachRa: null, lyDoTach: null, vuNhapVao: null,
        ngaySuKien: ngayKT || null, kyThongKe: kyId || null, lichSuSuaKy: [], ghiChu: "",
        nguoiThucHien, thoiDiemGhi: now,
      });
      await batch.commit();

      // Tính lại dieuLuat + loaiKhoiTo cho cả vụ
      const bcSnap = await db.collection("bican").where("maVuAn", "==", vuAn.id).get();
      const bcList = bcSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      const dieuLuatMoi = tinhDieuLuat(bcList);
      const loaiKhoiToMoi = tinhLoaiKhoiToTheoNgay(bcList.map(bc => bc.ngayKhoiTo ? (bc.ngayKhoiTo.toDate ? bc.ngayKhoiTo.toDate() : new Date(bc.ngayKhoiTo)) : null));
      const batch2 = db.batch();
      batch2.update(db.collection("vuan").doc(vuAn.id), { dieuLuat: dieuLuatMoi });
      bcList.forEach((bc, i) => {
        if (bc.loaiKhoiTo !== loaiKhoiToMoi[i]) batch2.update(db.collection("bican").doc(bc.id), { loaiKhoiTo: loaiKhoiToMoi[i] });
      });
      await batch2.commit();
      xoaBiCanCache(vuAn.id);
      onXong();
    } catch (err) {
      console.error(err);
      setLoi("Lỗi khi lưu: " + err.message);
      setDangLuu(false);
    }
  };

  const handleLuu = () => {
    if (!kiemTra()) return;
    setHienModalKy(true);
  };

  return (
    <KhungModalHanhDong tieuDe="Thêm bị can" rongnhat>
      <ModalXacNhanKy open={hienModalKy} onHuy={() => setHienModalKy(false)} onXacNhan={luuVoiKy} />
      {loi && <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-4">{loi}</div>}
      <div className="grid grid-cols-4 gap-3 mb-3">
        <Truong nhan="Họ tên"><input value={hoTen} onChange={e => setHoTen(e.target.value)} className={oInput} /></Truong>
        <Truong nhan="Năm sinh"><input type="number" value={namSinh} onChange={e => setNamSinh(e.target.value)} className={oInput} /></Truong>
        <Truong nhan="Giới tính">
          <select value={gioiTinh} onChange={e => setGioiTinh(e.target.value)} className={oInput}>
            <option value="nam">Nam</option><option value="nu">Nữ</option>
          </select>
        </Truong>
        <Truong nhan="Dân tộc"><input value={danToc} onChange={e => setDanToc(e.target.value)} className={oInput} /></Truong>
        <Truong nhan="Quốc tịch"><input value={quocTich} onChange={e => setQuocTich(e.target.value)} className={oInput} /></Truong>
        <Truong nhan="Trình độ">
          <select value={trinhDo} onChange={e => setTrinhDo(e.target.value)} className={oInput}>
            <option value="">— chưa rõ —</option>
            {Object.entries(NHAN_TRINH_DO).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
          </select>
        </Truong>
        <Truong nhan="Tái phạm">
          <select value={taiPham} onChange={e => setTaiPham(e.target.value)} className={oInput}>
            {Object.entries(NHAN_TAI_PHAM).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
          </select>
        </Truong>
        <Truong nhan="Loại bị can">
          <select value={loaiBiCan} onChange={e => setLoaiBiCan(e.target.value)} className={oInput}>
            <option value="ca_nhan">Cá nhân</option><option value="phap_nhan">Pháp nhân</option>
          </select>
        </Truong>
        {loaiBiCan === "phap_nhan" && (<>
          <Truong nhan="Tên pháp nhân" rong2>
            <input value={tenPhapNhan} onChange={e => setTenPhapNhan(e.target.value)} className={oInput} />
          </Truong>
          <Truong nhan="Mã số thuế">
            <input value={maSoThue} onChange={e => setMaSoThue(e.target.value)} className={oInput} />
          </Truong>
        </>)}
        <Truong nhan="Đảng viên">
          <select value={dangVien} onChange={e => setDangVien(e.target.value)} className={oInput}>
            <option value="khong">Không</option><option value="co">Có</option>
          </select>
        </Truong>
        {dangVien === "co" && (
          <Truong nhan="Giữ chức danh QL">
            <label className="flex items-center gap-2 text-sm mt-1">
              <input type="checkbox" checked={dangVienGiuChucVu} onChange={e => setDangVienGiuChucVu(e.target.checked)} />
              Có
            </label>
          </Truong>
        )}
        <Truong nhan="Biện pháp ngăn chặn">
          <select value={bienPhapNganChan} onChange={e => setBienPhapNganChan(e.target.value)} className={oInput}>
            <option value="tai_ngoai">Tại ngoại</option><option value="giam">Tạm giam</option>
          </select>
        </Truong>
        {bienPhapNganChan === "giam" && (
          <Truong nhan="Hạn tạm giam"><NhapNgay value={hanTamGiam} onChange={e => setHanTamGiam(e.target.value)} className={oInput} /></Truong>
        )}
        <Truong nhan="Ngày khởi tố bị can"><NhapNgay value={ngayKhoiTo} onChange={e => setNgayKhoiTo(e.target.value)} className={oInput} /></Truong>
        <Truong nhan="Số QĐ khởi tố bị can"><input value={soQdKtBiCan} onChange={e => setSoQdKtBiCan(e.target.value)} placeholder="VD: 15/QĐ-VKS" className={oInput} /></Truong>
        <Truong nhan="Địa chỉ" rong4>

function OKy({ suKien, kyTenTheoId, onSua }) {
  if (!suKien) return <span className="text-slate-300">—</span>;
  const ten = suKien.kyThongKe ? (kyTenTheoId[suKien.kyThongKe] || "(kỳ đã xoá)") : "— Chưa gán kỳ —";
  return (
    <button onClick={e => { e.stopPropagation(); onSua(suKien); }}
            className="text-indigo-600 hover:text-indigo-700 hover:underline text-left">

  useEffect(() => {
    const unsub = db.collection("lichsuChuyenGiaiDoan")
      .where("loaiSuKien", "in", ["khoi_to_vu", "hoan_thanh", "chuyen_giai_doan", "tra_ho_so"]).onSnapshot(
      snap => setLogKyEvents(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
      err => console.error(err)
    );
    return unsub;
  }, []);

  const kyTenTheoId = useMemo(() => Object.fromEntries(kyBaoCaoList.map(k => [k.id, k.tenKy])), [kyBaoCaoList]);
  const kyBaoCaoListSorted = useMemo(
    () => [...kyBaoCaoList].sort((a, b) => (b.ngayBatDau?.toMillis?.() ?? 0) - (a.ngayBatDau?.toMillis?.() ?? 0)),
    [kyBaoCaoList]
  );
  const { suKienMoi, suKienHoanThanh, suKienVaoTruyTo, suKienVaoXetXu, suKienTraVeDieuTra } = useMemo(
    () => timSuKienKyTheoVuAn(logKyEvents), [logKyEvents]
  );
  const [dangSuaKy, setDangSuaKy] = useState(null);

  const [cotAn, setCotAn] = useState(() => {
    try {
      const luu = localStorage.getItem(KHOA_LUU_COT_AN);
      return luu ? new Set(JSON.parse(luu)) : new Set();
    } catch { return new Set(); }
  });
  useEffect(() => {
    try { localStorage.setItem(KHOA_LUU_COT_AN, JSON.stringify([...cotAn])); } catch {}
  }, [cotAn]);
  const toggleCot = (key) => setCotAn(s => {
    const moi = new Set(s);
    moi.has(key) ? moi.delete(key) : moi.add(key);
    return moi;
  });
  const soCotHien = 3 + DS_COT_TUY_CHON.length - cotAn.size;

  const biCanTheoVu = useMemo(() => {
    const map = {};
    for (const bc of biCanAll) {
      (map[bc.maVuAn] = map[bc.maVuAn] || []).push(bc);
    }
    return map;
  }, [biCanAll]);

  const toggleMoRongBiCan = (id) => setMoRongBiCan(s => {
    const moi = new Set(s);
    moi.has(id) ? moi.delete(id) : moi.add(id);
    return moi;
  });

  const dsKsv = useMemo(() => [...new Set(list.map(v => v.ksvChinh).filter(Boolean))], [list]);

  const filtered = useMemo(() => list.filter(v => {
    if (chiDangGiaiQuyet && v.trangThai !== "dang_giai_quyet") return false;
    if (giaiDoan !== "tat_ca" && v.coQuanThuLy !== giaiDoan) return false;
    if (ksv !== "tat_ca" && v.ksvChinh !== ksv) return false;
    if (tuKhoa.trim()) {
      const k = tuKhoa.trim().toLowerCase();
      const dsBiCan = biCanTheoVu[v.id] || [];
      const hit = (hienThiMa(v) || "").toLowerCase().includes(k)
        || (v.tenVu || "").toLowerCase().includes(k)
        || (v.dieuLuat || "").toLowerCase().includes(k)
        || (v.soQdKtva || "").toLowerCase().includes(k)
        || dsBiCan.some(bc => (bc.hoTen || "").toLowerCase().includes(k));
      if (!hit) return false;
    }
    return true;
  }), [list, chiDangGiaiQuyet, giaiDoan, ksv, tuKhoa, biCanTheoVu]);

  // Sắp xếp theo cột (bấm tiêu đề) — chỉ áp dụng cho cột có giá trị so sánh rõ ràng
  // (mã vụ/ngày). Không sort theo "Kỳ mới"/"Kỳ giải quyết" vì đó là chuỗi hiển thị dạng
  // "Tháng N/YYYY", sắp xếp theo chuỗi sẽ sai thứ tự thời gian (VD "Tháng 10" < "Tháng 2").
  const layGiaTriSort = (v, cot) => {
    if (cot === "maVu") return hienThiMa(v) || "";
    if (cot === "ngayKtva") return v.ngayQdKtva?.toMillis?.() ?? 0;
    if (cot === "hanDt") return v.hanDieuTra?.toMillis?.() ?? 0;
    return "";
  };
  const sorted = useMemo(() => {
    if (!sortCot) return filtered;
    const arr = [...filtered];
    arr.sort((a, b) => {
      const va = layGiaTriSort(a, sortCot), vb = layGiaTriSort(b, sortCot);
      const cmp = typeof va === "string" ? va.localeCompare(vb) : va - vb;
      return sortChieu === "asc" ? cmp : -cmp;
    });
    return arr;
  }, [filtered, sortCot, sortChieu]);

  const bamSort = (cot) => {
    if (sortCot === cot) setSortChieu(c => c === "asc" ? "desc" : "asc");
    else { setSortCot(cot); setSortChieu("asc"); }
  };

  return (
    <div className="flex-1 min-w-0 bg-white border border-slate-200 rounded-xl flex flex-col min-h-0">
      <div className="p-3 border-b border-slate-100 space-y-2 bg-slate-50/60">
        <input value={tuKhoa} onChange={e => setTuKhoa(e.target.value)} placeholder="Tìm theo mã vụ, tên vụ, điều luật, số QĐ KTVA hoặc tên bị can..."
               className="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm bg-white" />
        <div className="flex items-center justify-between gap-2">
          <div className="flex gap-1 w-fit bg-slate-200 rounded-lg p-1">
            {[[true, "Đang giải quyết"], [false, "Tất cả"]].map(([v, l]) => (
              <button key={String(v)} onClick={() => setChiDangGiaiQuyet(v)}
                      className={`text-xs px-3 py-1 rounded-md font-medium ${chiDangGiaiQuyet === v ? "bg-white shadow text-slate-800" : "text-slate-500 hover:text-slate-700"}`}>
                {l}
              </button>
            ))}
          </div>
          <ChonCotHienThi cotAn={cotAn} onDoi={toggleCot} />
        </div>
        <div className="flex gap-1">
          {[["tat_ca", "Tất cả"], ["dieu_tra", "Điều tra"], ["truy_to", "Truy tố"], ["xet_xu", "Xét xử"]].map(([v, l]) => (
            <button key={v} onClick={() => setGiaiDoan(v)}
                    className={`flex-1 text-xs rounded-lg py-1.5 font-medium ${giaiDoan === v ? "bg-indigo-600 text-white" : "bg-white border border-slate-200 text-slate-600 hover:bg-slate-100"}`}>
              {l}
            </button>
          ))}
        </div>
        <select value={ksv} onChange={e => setKsv(e.target.value)} className="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-xs bg-white">
          <option value="tat_ca">Tất cả KSV</option>
          {dsKsv.map(k => <option key={k} value={k}>{k}</option>)}
        </select>
      </div>
      <div className="flex-1 overflow-auto">
        <table className="w-full text-sm border-collapse">
          <thead className="bg-slate-100 text-slate-500 text-xs sticky top-0 z-10">
            <tr>
              <ThSort nhan="Mã vụ" cot="maVu" sortCot={sortCot} sortChieu={sortChieu} onBam={bamSort} />
              <th className="text-left px-3 py-2 border-b border-slate-200 font-medium">Tên vụ / KSV</th>
              {!cotAn.has("biCan") && <th className="text-left px-3 py-2 border-b border-slate-200 font-medium">Bị can</th>}
              {!cotAn.has("giaiDoan") && <th className="text-left px-3 py-2 border-b border-slate-200 font-medium">Giai đoạn</th>}
              {!cotAn.has("trangThai") && <th className="text-left px-3 py-2 border-b border-slate-200 font-medium">Trạng thái</th>}
              {!cotAn.has("kyMoi") && <th className="text-left px-3 py-2 border-b border-slate-200 font-medium">Kỳ mới</th>}
              {!cotAn.has("kyTruyTo") && <th className="text-left px-3 py-2 border-b border-slate-200 font-medium">Kỳ vào Truy tố</th>}
              {!cotAn.has("kyXetXu") && <th className="text-left px-3 py-2 border-b border-slate-200 font-medium">Kỳ chuyển Xét xử</th>}
              {!cotAn.has("kyGiaiQuyet") && <th className="text-left px-3 py-2 border-b border-slate-200 font-medium">Kỳ giải quyết</th>}
              {!cotAn.has("soQdKtva") && <th className="text-left px-3 py-2 border-b border-slate-200 font-medium">Số QĐ KTVA</th>}
              {!cotAn.has("ngayKtva") && <ThSort nhan="Ngày KTVA" cot="ngayKtva" sortCot={sortCot} sortChieu={sortChieu} onBam={bamSort} />}
              {!cotAn.has("hanDt") && <ThSort nhan="Hạn ĐT" cot="hanDt" sortCot={sortCot} sortChieu={sortChieu} onBam={bamSort} />}
              <th className="text-right px-2 py-2 border-b border-slate-200 font-medium"></th>
            </tr>
          </thead>
          <tbody>
            {dangTai && Array(6).fill(0).map((_, i) => (
              <tr key={`sk${i}`} className="animate-pulse border-b border-slate-100">
                <td className="px-3 py-3"><div className="h-3 bg-slate-100 rounded w-24" /></td>
                <td className="px-3 py-3"><div className="h-3 bg-slate-100 rounded" style={{width:`${55+i*7}%`}} /></td>
                <td colSpan={soCotHien - 2} className="px-3 py-3">
                  <div className="h-3 bg-slate-100 rounded w-16" />
                </td>
              </tr>
            ))}
            {!dangTai && sorted.length === 0 && (
              <tr><td colSpan={soCotHien} className="p-4 text-slate-400">Không có vụ án nào khớp.</td></tr>
            )}
            {sorted.map((v, i) => (
              <tr key={v.id} onClick={() => onSelect(v.id)}
                  className={`cursor-pointer border-b border-l-4 border-slate-100 ${
                    selectedId === v.id ? "bg-indigo-50 border-l-indigo-500"
                      : i % 2 === 0 ? "bg-white border-l-transparent hover:bg-slate-50" : "bg-slate-50/70 border-l-transparent hover:bg-slate-100"
                  }`}>
                <td className="px-3 py-2 text-xs text-slate-500 align-top whitespace-nowrap">{hienThiMa(v)}</td>
                <td className="px-3 py-2 align-top">
                  <div className="font-medium text-slate-800">{v.tenVu || "(chưa đặt tên)"}</div>
                  {v.ksvChinh && <div className="text-xs text-slate-400 mt-0.5">{v.ksvChinh}</div>}
                </td>
                {!cotAn.has("biCan") && (
                  <td className="px-3 py-2 align-top text-xs w-28 max-w-[7rem]">
                    {(() => {
                      const dsBiCan = biCanTheoVu[v.id] || [];
                      if (dsBiCan.length === 0) return <span className="text-slate-300">—</span>;
                      const daMoRong = moRongBiCan.has(v.id);
                      const hienThi = daMoRong ? dsBiCan : dsBiCan.slice(0, 1);
                      return (
                        <div>
                          {hienThi.map(bc => <div key={bc.id} className="text-slate-700 break-words">{bc.hoTen}</div>)}
                          {dsBiCan.length > 1 && (
                            <button onClick={e => { e.stopPropagation(); toggleMoRongBiCan(v.id); }}
                                    className="text-indigo-600 hover:text-indigo-700 font-medium mt-0.5 whitespace-nowrap">
                              {daMoRong ? "Thu gọn" : `+${dsBiCan.length - 1} bị can khác`}
                            </button>
                          )}
                        </div>
                      );
                    })()}
                  </td>
                )}
                {!cotAn.has("giaiDoan") && (
                  <td className="px-3 py-2 align-top"><Badge mau={MAU_GIAI_DOAN[v.coQuanThuLy]}>{NHAN_GIAI_DOAN[v.coQuanThuLy] || v.coQuanThuLy}</Badge></td>
                )}
                {!cotAn.has("trangThai") && (
                  <td className="px-3 py-2 align-top"><Badge mau={MAU_TRANG_THAI[v.trangThai]}>{NHAN_TRANG_THAI[v.trangThai] || v.trangThai}</Badge></td>
                )}
                {!cotAn.has("kyMoi") && (
                  <td className="px-3 py-2 align-top text-xs whitespace-nowrap text-slate-600">
                    <OKy suKien={suKienMoi[v.id]} kyTenTheoId={kyTenTheoId} onSua={setDangSuaKy} />
                    {suKienTraVeDieuTra[v.id] && (
                      <button onClick={e => { e.stopPropagation(); setDangSuaKy(suKienTraVeDieuTra[v.id]); }}
                              className="block mt-0.5 text-[11px] text-amber-600 hover:text-amber-700 hover:underline text-left">
                        ↩ Trả bổ sung: {suKienTraVeDieuTra[v.id].kyThongKe ? (kyTenTheoId[suKienTraVeDieuTra[v.id].kyThongKe] || "(kỳ đã xoá)") : "— Chưa gán kỳ —"}
                      </button>
                    )}
                  </td>
                )}
                {!cotAn.has("kyTruyTo") && (
                  <td className="px-3 py-2 align-top text-xs whitespace-nowrap text-slate-600">
                    <OKy suKien={suKienVaoTruyTo[v.id]} kyTenTheoId={kyTenTheoId} onSua={setDangSuaKy} />
                    {suKienVaoTruyTo[v.id]?.loaiSuKien === "tra_ho_so" && (
                      <div className="mt-0.5 text-[11px] text-amber-600">↩ Trả bổ sung</div>
                    )}
                  </td>
                )}
                {!cotAn.has("kyXetXu") && (
                  <td className="px-3 py-2 align-top text-xs whitespace-nowrap text-slate-600">
                    <OKy suKien={suKienVaoXetXu[v.id]} kyTenTheoId={kyTenTheoId} onSua={setDangSuaKy} />
                  </td>
                )}
                {!cotAn.has("kyGiaiQuyet") && (
                  <td className="px-3 py-2 align-top text-xs whitespace-nowrap text-slate-600">
                    <OKy suKien={suKienHoanThanh[v.id]} kyTenTheoId={kyTenTheoId} onSua={setDangSuaKy} />
                  </td>
                )}
                {!cotAn.has("soQdKtva") && (
                  <td className="px-3 py-2 align-top text-xs whitespace-nowrap text-slate-600">{v.soQdKtva || <span className="text-slate-300">—</span>}</td>
                )}
                {!cotAn.has("ngayKtva") && (
                  <td className="px-3 py-2 align-top text-xs whitespace-nowrap text-slate-600">{fmtDate(v.ngayQdKtva)}</td>
                )}
                {!cotAn.has("hanDt") && (
                  <td className={`px-3 py-2 align-top text-xs whitespace-nowrap ${mauCanhBaoHan(v.hanDieuTra)}`}>
                    {v.coQuanThuLy === "dieu_tra" ? fmtDate(v.hanDieuTra) : "—"}
                  </td>
                )}
                <td className="px-2 py-2 align-top text-right">
                  <MenuHanhDongNhanh vuAn={v} onMoHanhDong={(vuAn, loai) => setHanhDongNhanh({ vuAn, loai })} />
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="px-3 py-2 border-t border-slate-100 text-xs text-slate-400 bg-slate-50/60">{sorted.length} / {list.length} vụ án</div>

      {hanhDongNhanh?.loai === "chuyen_giai_doan" && (
        <ChuyenGiaiDoanModal vuAn={hanhDongNhanh.vuAn} onDong={() => setHanhDongNhanh(null)} onXong={() => setHanhDongNhanh(null)} />
      )}
      {hanhDongNhanh?.loai === "hoan_thanh" && (
        <HoanThanhVuAnModal vuAnId={hanhDongNhanh.vuAn.id} onDong={() => setHanhDongNhanh(null)} onXong={() => setHanhDongNhanh(null)} />
      )}
      {dangSuaKy && (
        <SuaKyModal suKien={dangSuaKy} danhSachKy={kyBaoCaoListSorted} onDong={() => setDangSuaKy(null)} onXong={() => setDangSuaKy(null)} />
      )}
    </div>
  );
}

function HangThongTin({ items }) {
  return (
    <tr className="border-b border-slate-100 last:border-b-0">
      {items.map(([nhan, giaTri], i) => (
        <React.Fragment key={i}>
          <td className="bg-slate-50 text-xs text-slate-500 px-3 py-2 whitespace-nowrap w-32 align-top border-r border-slate-100">{nhan}</td>
          <td className="px-3 py-2 text-slate-700 align-top">{giaTri || "—"}</td>
        </React.Fragment>
      ))}
    </tr>
  );
}

function NutHanhDong({ nhan, onClick }) {
  return (
    <button onClick={onClick}
            className="text-xs px-3 py-1.5 rounded-lg border border-indigo-200 text-indigo-600 hover:bg-indigo-50 font-medium">
      {nhan}
    </button>
  );
}

function KhoiQR({ noiDung, nhan }) {
  const containerRef = React.useRef(null);
  useEffect(() => {
    if (!containerRef.current) return;
    containerRef.current.innerHTML = "";
    new QRCode(containerRef.current, {
      text: noiDung, width: 480, height: 480,
      correctLevel: QRCode.CorrectLevel.M,
    });
  }, [noiDung]);

  return (
    <div className="flex flex-col items-center">
      <div ref={containerRef} className="[&>canvas]:w-full [&>canvas]:h-full [&>img]:w-full [&>img]:h-full"
           style={{ width: "5cm", height: "5cm" }}></div>
      <div className="mt-2 text-xs text-slate-400">{nhan}</div>
      <div className="text-sm font-mono">{noiDung}</div>
    </div>
  );
}

// Render qua portal vào #qr-print-root (ngoài #root) để khi in, ẩn #root đi mà không ẩn theo
// khung QR này — xem chú thích ở khối CSS @media print trong <head>.
function InQRModal({ vuAn, onDong }) {
  const noiDung = (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 print:bg-white overflow-auto">
      <div id="qr-in-a4" className="bg-white flex flex-col items-center justify-center"
           style={{ width: "210mm", minHeight: "297mm" }}>
        <div className="text-sm text-slate-400 mb-8 print:hidden">Xem trước trang in A4 — bấm "In" để in thật (khổ QR ~5x5cm).</div>
        <div className="flex items-center gap-10">
          {vuAn.maNganhCap && <KhoiQR noiDung={vuAn.maNganhCap} nhan="Mã ngành cấp" />}
          <KhoiQR noiDung={vuAn.maNoiSinh} nhan="Mã vụ án" />
        </div>
        <div className="mt-4 text-sm text-slate-500">{vuAn.tenVu}</div>
        <div className="mt-10 flex gap-2 print:hidden">
          <button onClick={onDong} className="px-4 py-2 text-sm rounded-lg text-red-600 hover:bg-red-50">Đóng</button>
          <button onClick={() => window.print()} className="px-4 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium">In</button>
        </div>
      </div>
    </div>
  );
  return ReactDOM.createPortal(noiDung, document.getElementById("qr-print-root"));
}

const SO_BI_CAN_MAC_DINH = 10;

function ChiTietPanel({ vuAnId, onDoiSelected }) {
  const [vuAn, setVuAn] = useState(null);
  const [biCanList, setBiCanList] = useState([]);
  const [lichSu, setLichSu] = useState([]);
  const [modalMo, setModalMo] = useState(null);
  const [biCanDangSua, setBiCanDangSua] = useState(null);
  const [hienThemBiCan, setHienThemBiCan] = useState(false);
  const [timBiCan, setTimBiCan] = useState("");
  const [xemHetBiCan, setXemHetBiCan] = useState(false);

  useEffect(() => {
    setModalMo(null);
    setBiCanDangSua(null);
    setHienThemBiCan(false);
    setTimBiCan("");
    setXemHetBiCan(false);
    if (!vuAnId) { setVuAn(null); return; }
    return db.collection("vuan").doc(vuAnId).onSnapshot(doc => {
      setVuAn(doc.exists ? { id: doc.id, ...doc.data() } : null);
    });
  }, [vuAnId]);

  useEffect(() => {
    if (!vuAnId) { setBiCanList([]); return; }
    return db.collection("bican").where("maVuAn", "==", vuAnId).onSnapshot(
      snap => setBiCanList(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
      err => console.error(err)
    );
  }, [vuAnId]);

  useEffect(() => {
    if (!vuAnId) { setLichSu([]); return; }
    return db.collection("lichsuChuyenGiaiDoan").where("maVuAn", "==", vuAnId).orderBy("thoiDiemGhi", "desc").onSnapshot(
      snap => setLichSu(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
      err => console.error(err)
    );
  }, [vuAnId]);

  if (!vuAnId) {
    return (
      <div className="w-[420px] shrink-0 bg-white border border-slate-200 rounded-xl flex items-center justify-center text-slate-400 text-sm text-center px-4">
        Chọn 1 vụ án ở danh sách bên trái để xem chi tiết.
      </div>
    );
  }
  if (!vuAn) {
    return <div className="w-[420px] shrink-0 bg-white border border-slate-200 rounded-xl flex items-center justify-center text-slate-400 text-sm">Đang tải...</div>;
  }

  return (
    <div className="w-[420px] shrink-0 bg-white border border-slate-200 rounded-xl overflow-auto min-h-0">
      <div className="p-5 border-b border-slate-100">
        <div className="flex items-start justify-between gap-4">
          <div>
            <div className="text-xs text-slate-400 mb-1">{hienThiMa(vuAn)}</div>
            <div className="text-base font-semibold">{vuAn.tenVu || "(chưa đặt tên)"}</div>
          </div>
          <div className="flex gap-2 flex-wrap justify-end">
            {vuAn.trangThai === "dang_giai_quyet" && vuAn.coQuanThuLy !== "xet_xu" && (
              <NutHanhDong nhan="Chuyển giai đoạn" onClick={() => setModalMo("chuyen_giai_doan")} />
            )}
            {vuAn.trangThai === "dang_giai_quyet" && vuAn.coQuanThuLy !== "dieu_tra" && (
              <NutHanhDong nhan="Trả hồ sơ" onClick={() => setModalMo("tra_ho_so")} />
            )}
            {vuAn.trangThai === "dang_giai_quyet" && vuAn.coQuanThuLy === "dieu_tra" && (
              <NutHanhDong nhan="Gia hạn điều tra" onClick={() => setModalMo("gia_han")} />
            )}
            {vuAn.trangThai === "dang_giai_quyet" && (
              <NutHanhDong nhan="Hoàn thành vụ án" onClick={() => setModalMo("hoan_thanh")} />
            )}
            {vuAn.trangThai === "dang_giai_quyet" && (
              <NutHanhDong nhan="Tách vụ án" onClick={() => setModalMo("tach")} />
            )}
            {vuAn.trangThai === "dang_giai_quyet" && (
              <NutHanhDong nhan="Nhập vào vụ khác" onClick={() => setModalMo("nhap")} />
            )}
            {vuAn.trangThai === "tam_dinh_chi" && (

// Xóa vĩnh viễn 1 vụ án + toàn bộ bị can + lịch sử liên quan — hành động HIẾM DÙNG, chỉ để sửa
// sai sót tạo nhầm (VD double-click tạo trùng, nhập liệu hoàn toàn sai), KHÔNG phải luồng nghiệp
// vụ bình thường (Hoàn thành/Trả hồ sơ/Tách vụ đã có sẵn cho các trường hợp hợp lệ khác). Bắt gõ
// lại đúng mã vụ để xác nhận (giống xoá branch/repo trên GitHub) vì không có cách hoàn tác. Chặn
// hẳn nếu đã có vụ TÁCH RA từ vụ này còn tồn tại — xóa vụ gốc trong khi vụ con vẫn còn sẽ để lại
// dữ liệu mồ côi khó truy vết nguồn gốc. Không tự động cập nhật `baoCaoLuu` của kỳ đã chốt (giống
// mọi thao tác sửa dữ liệu thuộc kỳ đã chốt khác) — chỉ cảnh báo, người dùng tự chạy lại "Tính lại
// số liệu" ở Kỳ báo cáo nếu cần.
function XoaVuAnModal({ vuAn, biCanList, lichSu, onDong, onXong }) {
  const [dangKiemTra, setDangKiemTra] = useState(true);
  const [coVuCon, setCoVuCon] = useState(null); // null = chưa biết; mảng vụ đã tách ra còn tồn tại
  const [xacNhan, setXacNhan] = useState("");
  const [dangXoa, setDangXoa] = useState(false);
  const [loi, setLoi] = useState("");

  const maHienThi = hienThiMa(vuAn) || vuAn.id;

  useEffect(() => {
    let huy = false;
    setDangKiemTra(true);
    db.collection("vuan").where("vuGoc", "==", vuAn.id).get()
      .then(snap => { if (!huy) setCoVuCon(snap.docs.map(d => ({ id: d.id, ...d.data() }))); })
      .catch(err => { if (!huy) setLoi("Lỗi khi kiểm tra liên kết: " + err.message); })
      .finally(() => { if (!huy) setDangKiemTra(false); });
    return () => { huy = true; };
  }, [vuAn.id]);

  const coTheXoa = !dangKiemTra && coVuCon && coVuCon.length === 0;
  const xacNhanDung = xacNhan.trim().toLowerCase() === maHienThi.trim().toLowerCase();

  const xoa = async () => {
    if (!xacNhanDung) return;
    setDangXoa(true);
    setLoi("");
    try {
      const [bcSnap, logSnap] = await Promise.all([
        db.collection("bican").where("maVuAn", "==", vuAn.id).get(),
        db.collection("lichsuChuyenGiaiDoan").where("maVuAn", "==", vuAn.id).get(),
      ]);
      const refs = [
        ...bcSnap.docs.map(d => d.ref),
        ...logSnap.docs.map(d => d.ref),
        db.collection("vuan").doc(vuAn.id),
      ];
      for (let i = 0; i < refs.length; i += 400) {
        const batch = db.batch();
        refs.slice(i, i + 400).forEach(ref => batch.delete(ref));
        await batch.commit();
      }
      addToast("Đã xóa vụ án");
      onXong();
    } catch (err) {
      console.error(err);
      setLoi("Lỗi khi xóa: " + err.message);
      setDangXoa(false);
    }
  };

  return (
    <KhungModalHanhDong tieuDe="Xóa vụ án">
      <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-4">
        Thao tác này xóa VĨNH VIỄN, không thể hoàn tác: vụ án <b>{maHienThi}</b>, toàn bộ{" "}
        <b>{biCanList.length} bị can</b> và <b>{lichSu.length} sự kiện lịch sử</b> liên quan. Nếu vụ
        đã được tính vào 1 kỳ báo cáo đã chốt, số liệu đã lưu của kỳ đó sẽ KHÔNG tự cập nhật — vào
        "Kỳ báo cáo" bấm "Tính lại số liệu" cho kỳ liên quan sau khi xóa.
      </div>

      {dangKiemTra && <div className="text-sm text-slate-400 mb-4">Đang kiểm tra liên kết với vụ án khác...</div>}

      {!dangKiemTra && coVuCon && coVuCon.length > 0 && (
        <div className="bg-amber-50 border border-amber-200 text-amber-800 text-sm rounded-lg p-3 mb-4">
          Không thể xóa — có {coVuCon.length} vụ án đã được TÁCH RA từ vụ này, vẫn còn tồn tại:{" "}
          {coVuCon.map(v => hienThiMa(v) || v.id).join(", ")}. Cần xử lý các vụ đó trước (nhập lại
          hoặc chấp nhận giữ nguyên) rồi mới xóa được vụ gốc.
        </div>
      )}

      {loi && <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-4">{loi}</div>}

      {coTheXoa && (
        <>
          <label className="text-xs text-slate-500 block mb-1">
            Gõ lại chính xác mã vụ <b>{maHienThi}</b> để xác nhận:
          </label>
          <input value={xacNhan} onChange={e => setXacNhan(e.target.value)} className={oInput + " mb-4"} autoFocus />
        </>
      )}

      <div className="flex justify-end gap-2">
        <button onClick={onDong} disabled={dangXoa} className="px-4 py-2 text-sm rounded-lg text-slate-600 hover:bg-slate-50 disabled:opacity-50">
          {coTheXoa ? "Huỷ" : "Đóng"}
        </button>
        {coTheXoa && (
          <button onClick={xoa} disabled={!xacNhanDung || dangXoa}
                  className="px-4 py-2 text-sm rounded-lg bg-red-600 hover:bg-red-700 text-white font-medium disabled:opacity-50">
            {dangXoa ? "Đang xóa..." : "Xóa vĩnh viễn"}
          </button>
        )}
      </div>
    </KhungModalHanhDong>
  );
}

async function xuatExcel(setDangXuat, setLoiXuat) {
  setDangXuat(true);
  setLoiXuat("");
  try {
    const [vuSnap, bcSnap, kySnap, logSnap] = await Promise.all([
      db.collection("vuan").get(), db.collection("bican").get(),
      db.collection("kybaocao").get(),
      db.collection("lichsuChuyenGiaiDoan").where("loaiSuKien", "in", ["khoi_to_vu", "hoan_thanh"]).get(),
    ]);
    const vuList = vuSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    const bcList = bcSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    const bcByVu = {};
    bcList.forEach(bc => { (bcByVu[bc.maVuAn] = bcByVu[bc.maVuAn] || []).push(bc); });
    const kyTenTheoId = Object.fromEntries(kySnap.docs.map(d => [d.id, d.data().tenKy]));
    const { kyMoi: kyMoiTheoVu, kyGiaiQuyet: kyGiaiQuyetTheoVu } = tinhKyTheoVuAn(logSnap.docs.map(d => d.data()), kyTenTheoId);

    const vuById = Object.fromEntries(vuList.map(v => [v.id, v]));

    // Flat: 1 dòng/bị can — thông tin vụ cha lặp lại cùng dòng với bị can
    // Vụ 0 BC → 1 dòng với cột BC để trống; vụ N BC → N dòng giống nhau phần vụ, khác phần BC
    // Dùng PivotTable/Filter trực tiếp trên sheet này để thống kê theo mọi chiều
    const flatHeader = [
      // Vụ án
      "Mã nội sinh", "Mã ngành cấp", "Tên vụ", "Giai đoạn", "Trạng thái",
      "KSV chính", "KSV hỗ trợ", "ĐTV/CBĐT", "Đơn vị thụ lý", "Uỷ quyền xét xử",
      "Điều luật", "Số QĐ KTVA", "Ngày QĐ KTVA", "Hạn điều tra",
      "Án điểm", "Phiên toà rút KN", "Nguồn", "Kỳ mới", "Kỳ giải quyết", "Ghi chú",
      // Bị can
      "STT BC", "Họ tên BC", "Năm sinh", "Giới tính", "Dân tộc", "Địa chỉ",
      "Tội danh BC", "Đảng viên", "Biện pháp", "Hạn tạm giam", "Ngày KT BC", "Loại KT",
    ];
    const flatRows_xl = [];
    for (const v of vuList) {
      const vuCols = [
        v.maNoiSinh||"", v.maNganhCap||"", v.tenVu,
        NHAN_GIAI_DOAN[v.coQuanThuLy]||v.coQuanThuLy, NHAN_TRANG_THAI[v.trangThai]||v.trangThai,
        v.ksvChinh||"", (v.ksvHoTro||[]).join(", "), v.dtvCbdt||"", v.donViThuLy||"", v.uyQuyenXetXu||"",
        v.dieuLuat||"", v.soQdKtva||"", fmtDate(v.ngayQdKtva), fmtDate(v.hanDieuTra),
        v.anDiem?"x":"", v.phienToaRutKN?"x":"", NHAN_NGUON[v.nguon]||v.nguon||"",
        kyMoiTheoVu[v.id]||"", kyGiaiQuyetTheoVu[v.id]||"", v.ghiChu||"",
      ];
      const bcArr = bcByVu[v.id] || [];
      if (bcArr.length === 0) {
        flatRows_xl.push([...vuCols, "", "(Chưa có BC)", "", "", "", "", "", "", "", "", ""]);
      } else {
        bcArr.forEach((bc, i) => flatRows_xl.push([
          ...vuCols, i+1, bc.hoTen, bc.namSinh||"",
          bc.gioiTinh==="nu"?"Nữ":"Nam", bc.danToc||"", bc.diaChi||"",
          (bc.toiDanh||[]).filter(Boolean).join("; ")||"",
          bc.dangVien==="co"?"x":"",
          bc.bienPhapNganChan==="giam"?"Tạm giam":"Tại ngoại",
          fmtDate(bc.hanTamGiam), fmtDate(bc.ngayKhoiTo),
          bc.loaiKhoiTo==="bo_sung"?"Bổ sung":"Ban đầu",
        ]));
      }
    }

    const tongHopRows = THU_TU_GIAI_DOAN.map(gd => [
      NHAN_GIAI_DOAN[gd], vuList.filter(v => v.coQuanThuLy === gd && v.trangThai === "dang_giai_quyet").length,
    ]);

    // === Thống kê tội danh (toàn bộ dữ liệu — theo tội chính của từng bị can) ===
    const tkTD = {};
    for (const bc of bcList) {
      const vu = vuById[bc.maVuAn];
      if (!vu) continue;
      const td = (bc.toiDanh || [])[0] || vu.dieuLuat || "(Chưa xác định)";
      if (!tkTD[td]) tkTD[td] = { vuGQ: new Set(), bcGQ: 0, vuTon: new Set(), bcTon: 0, tgTon: 0, tnTon: 0, vuAll: new Set(), bcAll: 0 };
      const s = tkTD[td];
      s.vuAll.add(bc.maVuAn); s.bcAll++;
      if (vu.trangThai === "dang_giai_quyet") {
        s.vuTon.add(bc.maVuAn); s.bcTon++;
        bc.bienPhapNganChan === "giam" ? s.tgTon++ : s.tnTon++;
      } else { s.vuGQ.add(bc.maVuAn); s.bcGQ++; }
    }
    const tkTDHeader = ["Tội danh", "Vụ tồn hiện tại", "BC tồn", "Tạm giam", "Tại ngoại", "Vụ đã GQ", "BC đã GQ", "Tổng vụ", "Tổng BC"];
    const tkTDRows = Object.entries(tkTD)
      .sort((a, b) => b[1].bcAll - a[1].bcAll)
      .map(([td, s]) => [td, s.vuTon.size, s.bcTon, s.tgTon, s.tnTon, s.vuGQ.size, s.bcGQ, s.vuAll.size, s.bcAll]);

    // === Thống kê KSV (theo vụ đang giải quyết / đã giải quyết) ===
    const tkKSV = {};
    for (const v of vuList) {
      const ksv = v.ksvChinh || "(Chưa có KSV)";
      if (!tkKSV[ksv]) tkKSV[ksv] = { vuTon: 0, bcTon: 0, tgTon: 0, vuGQ: 0, bcGQ: 0 };
      const s = tkKSV[ksv];
      const bc_v = bcByVu[v.id] || [];
      if (v.trangThai === "dang_giai_quyet") {
        s.vuTon++; s.bcTon += bc_v.length;
        s.tgTon += bc_v.filter(bc => bc.bienPhapNganChan === "giam").length;
      } else { s.vuGQ++; s.bcGQ += bc_v.length; }
    }
    const tkKSVHeader = ["KSV", "Vụ đang GQ", "BC đang GQ", "Tạm giam", "Vụ đã GQ", "BC đã GQ", "Tổng vụ phụ trách"];
    const tkKSVRows = Object.entries(tkKSV)
      .sort((a, b) => b[1].vuTon - a[1].vuTon)
      .map(([ksv, s]) => [ksv, s.vuTon, s.bcTon, s.tgTon, s.vuGQ, s.bcGQ, s.vuTon + s.vuGQ]);

    // === DS tạm giam (sắp xếp theo hạn tạm giam tăng dần — hết hạn sớm lên đầu) ===
    const homNay = new Date(); homNay.setHours(0, 0, 0, 0);
    const tgHeader = ["Mã vụ", "Tên vụ", "Giai đoạn", "KSV chính", "Họ tên BC", "Năm sinh", "Tội danh", "Hạn tạm giam", "Còn lại (ngày)"];
    const tgRows = bcList
      .filter(bc => bc.bienPhapNganChan === "giam")
      .map(bc => {
        const vu = vuById[bc.maVuAn] || {};
        const dt = bc.hanTamGiam ? (bc.hanTamGiam.toDate ? bc.hanTamGiam.toDate() : new Date(bc.hanTamGiam)) : null;
        const conLai = dt ? Math.ceil((dt - homNay) / 86400000) : null;
        return {
          row: [hienThiMa(vu) || bc.maVuAn, vu.tenVu || "", NHAN_GIAI_DOAN[vu.coQuanThuLy] || "",
            vu.ksvChinh || "", bc.hoTen, bc.namSinh, (bc.toiDanh || [])[0] || "",
            fmtDate(bc.hanTamGiam), conLai !== null ? conLai : ""],
          dt: dt || new Date(9999, 0, 1),
        };
      })
      .sort((a, b) => a.dt - b.dt)
      .map(x => x.row);

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([flatHeader, ...flatRows_xl]), "Danh sách");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([tkTDHeader, ...tkTDRows]), "TK tội danh");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([tkKSVHeader, ...tkKSVRows]), "TK KSV");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([tgHeader, ...tgRows]), "DS tạm giam");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Giai đoạn", "Đang tồn"], ...tongHopRows]), "TỔNG HỢP");
    XLSX.writeFile(wb, `QLVA_xuat_${toInputDateNhanh(new Date())}.xlsx`);
  } catch (err) {
    console.error(err);
    setLoiXuat("Lỗi khi xuất Excel: " + err.message);
  } finally {
    setDangXuat(false);
  }
}
function toInputDateNhanh(d) {
  return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
}

  useEffect(() => {
    let huy = false;
    db.collection("kybaocao").where("trangThai", "==", "dang_mo").limit(1).get()

        if (snap.empty) { setKy(null); return; }
        const kyDoc = { id: snap.docs[0].id, ...snap.docs[0].data() };

        ]);
        if (huy) return;
