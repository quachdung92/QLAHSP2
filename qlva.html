// Bật cache offline (Firestore SDK tự dùng IndexedDB nội bộ) — cho phép app tiếp tục đọc dữ
// liệu đã tải trước đó và xếp hàng các thay đổi (set/update/delete) khi mất mạng giữa chừng,
// tự đồng bộ lại khi có mạng trở lại. `synchronizeTabs: true` để nhiều tab cùng trình duyệt
// dùng chung 1 cache thay vì chỉ tab mở đầu tiên có persistence. Đây KHÔNG phải chế độ hoạt động
// hoàn toàn không cần Internet — lần mở đầu tiên (và mỗi lần tải lại trang) vẫn cần mạng để tải
// các thư viện CDN (React/Babel/Firebase SDK...) và đăng nhập; chỉ giúp app không "đứng hình"/mất
// dữ liệu khi mạng chập chờn TRONG lúc đang dùng.
db.enablePersistence({ synchronizeTabs: true }).catch(err => {
  if (err.code === "failed-precondition") {
    console.warn("Offline persistence: không bật được (hiếm gặp với synchronizeTabs:true).", err);
  } else if (err.code === "unimplemented") {
    console.warn("Trình duyệt này không hỗ trợ lưu cache offline (IndexedDB) — app vẫn chạy bình thường khi có mạng.");
  } else {
    console.error("Lỗi bật offline persistence:", err);
  }
});

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

// ====================================================================
// TIỆN ÍCH DÙNG CHUNG
// ====================================================================

// Excel lưu ngày dạng số serial hoặc Date object hoặc text "dd/mm/yyyy" —
// hàm này cố gắng chuẩn hoá về đối tượng Date, trả về null nếu không đọc được.
function parseExcelDate(v) {
  if (v == null || v === "") return null;
  if (v instanceof Date) return v;
  if (typeof v === "number") {
    // Excel serial date -> JS Date (mốc 1899-12-30)
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    return isNaN(d) ? null : d;
  }
  if (typeof v === "string") {
    const m = v.match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/);
    if (m) {
      let [, dd, mm, yy] = m;
      yy = yy.length === 2 ? "20" + yy : yy;
      const d = new Date(+yy, +mm - 1, +dd);
      return isNaN(d) ? null : d;
    }
  }
  return null;
}

// Ô nhập ngày — luôn hiển thị dd/MM/yyyy, không phụ thuộc locale hệ điều hành/trình duyệt.
// Tương thích 100% với <input type="date">: value/onChange dùng chuỗi "yyyy-MM-dd" (hoặc "").
function NhapNgay({ value, onChange, className, ...props }) {
  const toStr = (v) => {
    if (!v || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return "";
    const [y, m, d] = v.split("-");
    return `${d}/${m}/${y}`;
  };
  const [raw, setRaw] = useState(() => toStr(value));
  const fokusRef = useRef(false);
  const pickerRef = useRef(null);
  useEffect(() => { if (!fokusRef.current) setRaw(toStr(value)); }, [value]);
  const parse = (s) => {
    if (!s) return "";
    s = s.trim();
    let m;
    // 8 chữ số liền: DDMMYYYY
    m = s.match(/^(\d{2})(\d{2})(\d{4})$/);
    if (m) return `${m[3]}-${m[2]}-${m[1]}`;
    // 6 chữ số liền: DDMMYY → 20YY
    m = s.match(/^(\d{2})(\d{2})(\d{2})$/);
    if (m) return `20${m[3]}-${m[2]}-${m[1]}`;
    // Có dấu phân cách, năm đầy đủ: D/M/YYYY hoặc D.M.YYYY hoặc D-M-YYYY
    m = s.match(/^(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{4})$/);
    if (m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
    // Có dấu phân cách, năm ngắn: D/M/YY → 20YY
    m = s.match(/^(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{2})$/);
    if (m) return `20${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
    return null;
  };
  const handleChange = (e) => {
    const s = e.target.value;
    setRaw(s);
    const p = parse(s);
    if (p !== null) onChange?.({ target: { value: p } });
  };
  const handleBlur = () => {
    fokusRef.current = false;
    const p = parse(raw) ?? "";
    setRaw(toStr(p));
    onChange?.({ target: { value: p } });
  };
  const handlePicker = (e) => {
    const p = e.target.value; // yyyy-mm-dd
    if (p) { setRaw(toStr(p)); onChange?.({ target: { value: p } }); }
  };
  return (
    <span className="relative inline-flex items-center w-full">
      <input type="text" value={raw} onChange={handleChange}
        onFocus={() => { fokusRef.current = true; }}
        onBlur={handleBlur} placeholder="ddmmyy hoặc dd/mm/yyyy"
        className={`${className || ""} pr-7`} {...props} />
      <input type="date" ref={pickerRef} value={value || ""} onChange={handlePicker}
        tabIndex={-1}
        className="absolute right-0 opacity-0 w-7 h-full cursor-pointer" />
      <span className="absolute right-1.5 pointer-events-none text-slate-400 text-sm leading-none">📅</span>
    </span>
  );
}

function fmtDate(d) {
  if (!d) return "—";
  const dt = d.toDate ? d.toDate() : (d instanceof Date ? d : new Date(d));
  if (isNaN(dt)) return "—";
  return `${String(dt.getDate()).padStart(2,"0")}/${String(dt.getMonth()+1).padStart(2,"0")}/${dt.getFullYear()}`;
}

function fromInputDate(s) {
  if (!s) return null;
  const [y, m, dd] = s.split("-").map(Number);
  return new Date(y, m - 1, dd);
}

function toInputDate(d) {
  if (!d) return "";
  const dt = d.toDate ? d.toDate() : (d instanceof Date ? d : new Date(d));
  if (isNaN(dt)) return "";
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
}

function hienThiMa(vuAn) {
  return vuAn.maNganhCap || vuAn.maNoiSinh;
}

// ── Cache bị can theo phiên (session) ────────────────────────────────────────
// Tránh query Firestore lặp lại cho cùng 1 vụ khi xem báo cáo nhiều lần.
// Key = maVuAn, value = { soBiCan, toiDanhChinh }.
// Gọi xoaBiCanCache(maVuAn) sau bất kỳ thao tác tạo/sửa bị can để dữ liệu
// cũ không bị dùng lại.
const _biCanCache = {};
function xoaBiCanCache(maVuAn) { delete _biCanCache[maVuAn]; }

async function layBiCanInfo(maVuAn) {
  if (_biCanCache[maVuAn]) return _biCanCache[maVuAn];
  const bcSnap = await db.collection("bican").where("maVuAn", "==", maVuAn).get();
  const toiDanhChinh = bcSnap.docs.length > 0 ? (bcSnap.docs[0].data().toiDanh?.[0] || "") : "";
  const info = { soBiCan: bcSnap.size, toiDanhChinh };
  _biCanCache[maVuAn] = info;
  return info;
}

// Batch-read toàn bộ bị can cho nhiều vụ án — 1 "in" query / 30 vụ thay vì N query riêng lẻ.
// Trả { maVuAn: [bcData, ...] }. Đồng thời cập nhật _biCanCache cho những vụ chưa có.
async function batchLayBiCanList(maVuAnList) {
  if (!maVuAnList.length) return {};
  const result = {};
  const chunks = [];
  for (let i = 0; i < maVuAnList.length; i += 30) chunks.push(maVuAnList.slice(i, i + 30));
  const snaps = await Promise.all(chunks.map(ids =>
    db.collection("bican").where("maVuAn", "in", ids).get()
  ));
  snaps.flatMap(s => s.docs).forEach(doc => {
    const bc = { id: doc.id, ...doc.data() };
    if (!result[bc.maVuAn]) result[bc.maVuAn] = [];
    result[bc.maVuAn].push(bc);
  });
  for (const id of maVuAnList) {
    if (!_biCanCache[id]) {
      const bcList = result[id] || [];
      _biCanCache[id] = { soBiCan: bcList.length, toiDanhChinh: bcList[0]?.toiDanh?.[0] || "" };
    }
  }
  return result;
}

// Batch version của layBiCanInfo — trả { maVuAn: { soBiCan, toiDanhChinh } }, dùng cache phiên.
async function batchLayBiCanInfo(maVuAnList) {
  if (!maVuAnList.length) return {};
  const result = {};
  const toFetch = maVuAnList.filter(id => !_biCanCache[id]);
  maVuAnList.filter(id => _biCanCache[id]).forEach(id => { result[id] = _biCanCache[id]; });
  if (toFetch.length) {
    await batchLayBiCanList(toFetch);
    toFetch.forEach(id => { result[id] = _biCanCache[id] || { soBiCan: 0, toiDanhChinh: "" }; });
  }
  return result;
}
// ─────────────────────────────────────────────────────────────────────────────
// TOAST — thông báo ngắn tự biến mất, không chặn thao tác người dùng.
// Dùng: addToast("Nội dung") hoặc addToast("Lỗi gì đó", "error")
let _addToast = null;
function addToast(msg, type = "success") { _addToast?.({ id: Date.now() + Math.random(), msg, type }); }

function ToastContainer() {
  const [toasts, setToasts] = useState([]);
  useEffect(() => {
    _addToast = (t) => {
      setToasts(p => [...p, t]);
      setTimeout(() => setToasts(p => p.filter(x => x.id !== t.id)), 3200);
    };
    return () => { _addToast = null; };
  }, []);
  if (!toasts.length) return null;
  const cls = { success: "bg-emerald-600", error: "bg-red-600", warn: "bg-amber-500" };
  const ico = { success: "✓", error: "✕", warn: "⚠" };
  return ReactDOM.createPortal(
    <div className="fixed bottom-5 right-5 z-[9999] flex flex-col-reverse gap-2 pointer-events-none">
      {toasts.map(t => (
        <div key={t.id} className={`${cls[t.type] || cls.success} text-white text-sm font-medium px-4 py-2.5 rounded-xl shadow-lg flex items-center gap-2`}>
          <span className="shrink-0">{ico[t.type] || ico.success}</span>
          <span>{t.msg}</span>
        </div>
      ))}
    </div>,
    document.body
  );
}

// Spinner nhỏ dùng trong button khi đang lưu
function Spinner({ cls = "w-3.5 h-3.5" }) {
  return <span className={`${cls} inline-block rounded-full border-2 border-current border-t-transparent animate-spin`} />;
}

// ─────────────────────────────────────────────────────────────────────────────

function pad4(n) {
  return String(n).padStart(4, "0");
}

// Sinh mã vụ án mới qua transaction trên boDemMaVu/{YYMM} (theo ngày QĐ KTVA) —
// tránh trùng số khi nhiều người tạo vụ án cùng lúc.
async function sinhMaVuAnMoi(ngayQdKtva) {
  const d = ngayQdKtva instanceof Date && !isNaN(ngayQdKtva) ? ngayQdKtva : new Date();
  const yymm = String(d.getFullYear()).slice(-2) + String(d.getMonth() + 1).padStart(2, "0");
  const counterRef = db.collection("boDemMaVu").doc(yymm);
  const seq = await db.runTransaction(async (tx) => {
    const snap = await tx.get(counterRef);
    const next = (snap.exists ? (snap.data().soHienTai || 0) : 0) + 1;
    tx.set(counterRef, { soHienTai: next }, { merge: true });
    return next;
  });
  return `QLVA_E01.53_${yymm}_${pad4(seq)}`;
}

function tinhDieuLuat(biCanRows) {
  const all = biCanRows.flatMap(bc => (bc.toiDanh || []).map(s => s.trim()).filter(Boolean));
  return [...new Set(all)].join("; ");
}

function tinhTenVu(biCanList) {
  const coTen = biCanList.filter(bc => bc.hoTen && bc.hoTen.trim());
  if (coTen.length === 0) return "";
  return coTen[0].hoTen.trim() + (coTen.length > 1 ? " và đồng phạm" : "");
}

// loaiKhoiTo: "ban_dau" cho bị can có ngayKhoiTo sớm nhất trong vụ, còn lại "bo_sung".
// Nhận thẳng mảng Date|null (song song với danh sách bị can) — dùng khi đã có Date sẵn (đọc từ Firestore).
function tinhLoaiKhoiToTheoNgay(ngayList) {
  const coNgay = ngayList.filter(Boolean);
  if (coNgay.length === 0) return ngayList.map(() => "ban_dau");
  const minTime = Math.min(...coNgay.map(d => d.getTime()));
  return ngayList.map(d => (d && d.getTime() === minTime) ? "ban_dau" : "bo_sung");
}
// Biến thể nhận biCanRows dạng form (ngayKhoiTo là chuỗi input-date) — dùng lúc tạo vụ mới.
function tinhLoaiKhoiTo(biCanRows) {
  return tinhLoaiKhoiToTheoNgay(biCanRows.map(bc => bc.ngayKhoiTo ? fromInputDate(bc.ngayKhoiTo) : null));
}

const NHAN_GIAI_DOAN = { dieu_tra: "Điều tra", truy_to: "Truy tố", xet_xu: "Xét xử" };
const NHAN_TRANG_THAI = {
  dang_giai_quyet: "Đang giải quyết", da_xet_xu: "Đã xét xử", an_huy: "Án huỷ",
  chuyen_di: "Chuyển đi", tam_dinh_chi: "Tạm đình chỉ", dinh_chi: "Đình chỉ",
  da_nhap: "Đã nhập vào vụ khác",
};
const NHAN_NGUON = {
  an_khoi_to_moi: "Án khởi tố mới", tin_bao_khoi_to_len: "Tin báo khởi tố lên",
  an_noi_khac_chuyen_den: "Án nơi khác chuyển đến", phuc_hoi_dieu_tra: "Phục hồi điều tra",
};
const NHAN_SU_KIEN = {
  khoi_to_vu: "Khởi tố vụ", khoi_to_bican: "Khởi tố bị can", chuyen_giai_doan: "Chuyển giai đoạn",
  tra_ho_so: "Trả hồ sơ", gia_han_dieu_tra: "Gia hạn điều tra", phuc_hoi: "Phục hồi",
  ket_luan_dieu_tra: "Kết luận điều tra", ket_luan_dieu_tra_bo_sung: "Kết luận điều tra bổ sung",
  cao_trang: "Cáo trạng", cao_trang_bo_sung: "Cáo trạng bổ sung", hoan_thanh: "Hoàn thành",
  tach_vu: "Tách vụ", nhap_vu: "Nhập vụ", duoc_nhap_vu: "Nhận nhập vụ",
  giao_nhan_ho_so: "Giao nhận hồ sơ",
};

const MAU_GIAI_DOAN = { dieu_tra: "bg-blue-100 text-blue-700", truy_to: "bg-purple-100 text-purple-700", xet_xu: "bg-emerald-100 text-emerald-700" };
const MAU_TRANG_THAI = {
  dang_giai_quyet: "bg-green-100 text-green-700", da_xet_xu: "bg-blue-100 text-blue-700", an_huy: "bg-red-100 text-red-700",
  chuyen_di: "bg-slate-200 text-slate-600", tam_dinh_chi: "bg-amber-100 text-amber-700", dinh_chi: "bg-red-100 text-red-700",
  da_nhap: "bg-slate-200 text-slate-600",
};
function Badge({ mau, children }) {
  return <span className={`text-xs px-2 py-0.5 rounded font-medium whitespace-nowrap ${mau || "bg-slate-100 text-slate-600"}`}>{children}</span>;
}

// Tiêu đề cột bấm được để sort tăng/giảm — dùng chung cho các bảng danh sách vụ án.
function ThSort({ nhan, cot, sortCot, sortChieu, onBam }) {
  const dangChon = sortCot === cot;
  return (
    <th className="text-left px-3 py-2 border-b border-slate-200 font-medium cursor-pointer select-none hover:text-slate-700"
        onClick={() => onBam(cot)}>
      {nhan}{dangChon && <span className="ml-0.5">{sortChieu === "asc" ? "▲" : "▼"}</span>}
    </th>
  );
}

const THU_TU_GIAI_DOAN = ["dieu_tra", "truy_to", "xet_xu"];
function giaiDoanKeTiep(gd) {
  const i = THU_TU_GIAI_DOAN.indexOf(gd);
  return i >= 0 && i < THU_TU_GIAI_DOAN.length - 1 ? THU_TU_GIAI_DOAN[i + 1] : null;
}
function giaiDoanTruoc(gd) {
  const i = THU_TU_GIAI_DOAN.indexOf(gd);
  return i > 0 ? THU_TU_GIAI_DOAN[i - 1] : null;
}

// Điền sẵn các field mặc định (null) của 1 dòng log — mỗi nơi ghi log chỉ cần
// truyền phần khác mặc định, tránh lặp lại 14 field mỗi lần.
// Tính "kỳ mới" (kỳ của sự kiện khoi_to_vu) và "kỳ giải quyết" (kỳ của sự kiện hoan_thanh gần
// nhất — vụ có thể phục hồi rồi giải quyết lại nên có thể có nhiều lần) cho từng vụ án, dùng
// chung cho cột hiển thị ở Danh sách vụ án và khi xuất Excel. Vụ tách ra từ vụ khác không có
// sự kiện khoi_to_vu riêng (đúng theo thiết kế — không tính là vụ mới), nên sẽ không có "kỳ mới".
function tinhKyTheoVuAn(logEvents, kyTenTheoId) {
  const kyMoi = {};
  const hoanThanhGanNhat = {};
  for (const l of logEvents) {
    if (l.loaiSuKien === "khoi_to_vu") {
      kyMoi[l.maVuAn] = kyTenTheoId[l.kyThongKe] || null;
    } else if (l.loaiSuKien === "hoan_thanh") {
      const t = l.thoiDiemGhi?.toMillis ? l.thoiDiemGhi.toMillis() : 0;
      if (!hoanThanhGanNhat[l.maVuAn] || t > hoanThanhGanNhat[l.maVuAn].t) {
        hoanThanhGanNhat[l.maVuAn] = { t, kyThongKe: l.kyThongKe };
      }
    }
  }
  const kyGiaiQuyet = {};
  Object.entries(hoanThanhGanNhat).forEach(([maVuAn, v]) => { kyGiaiQuyet[maVuAn] = kyTenTheoId[v.kyThongKe] || null; });
  return { kyMoi, kyGiaiQuyet };
}

// Giống tinhKyTheoVuAn ở trên nhưng trả về CHÍNH sự kiện log (kèm id) thay vì chuỗi tên kỳ —
// dùng cho các chỗ cần bấm vào kỳ để sửa lại (SuaKyModal cần suKien.id để biết sửa đúng dòng
// nào). Thêm "sự kiện chuyển giai đoạn" (kỳ kết thúc điều tra/chuyển truy tố, kỳ chuyển xét xử)
// vì đây cũng là mốc tính vào số liệu báo cáo kỳ (VD: tháng 8 có 3 vụ kết thúc điều tra, tháng 9
// có 2 vụ chuyển toà) — chỉ giữ sự kiện GẦN NHẤT mỗi loại/mỗi vụ vì 1 vụ có thể bị trả hồ sơ rồi
// chuyển giai đoạn lại nhiều lần.
// "Vào Truy tố" tính GỘP cả 2 đường: chuyển giai đoạn tới (viện nhận từ điều tra) VÀ trả hồ sơ
// tới (toà trả hồ sơ về truy tố) — vụ đang ở Truy tố có thể do 1 trong 2 lý do này, chỉ giữ sự
// kiện gần nhất; nơi gọi tự phân biệt "trả bổ sung" hay không qua suKien.loaiSuKien === "tra_ho_so".
// "Trả về Điều tra" là trường hợp riêng (giai đoạn Điều tra chỉ vào được qua khởi tố mới hoặc bị
// trả hồ sơ — không có "chuyển giai đoạn tới" vì Điều tra là giai đoạn đầu).
function timSuKienKyTheoVuAn(logEvents) {
  const moiLoai = () => ({});
  const suKienMoi = moiLoai(), suKienHoanThanh = moiLoai(), suKienVaoTruyTo = moiLoai(),
        suKienVaoXetXu = moiLoai(), suKienTraVeDieuTra = moiLoai();
  const layMillis = l => l.thoiDiemGhi?.toMillis ? l.thoiDiemGhi.toMillis() : 0;
  const giuGanNhat = (map, l) => {
    const cu = map[l.maVuAn];
    if (!cu || layMillis(l) > layMillis(cu)) map[l.maVuAn] = l;
  };
  for (const l of logEvents) {
    if (l.loaiSuKien === "khoi_to_vu") suKienMoi[l.maVuAn] = l;
    else if (l.loaiSuKien === "hoan_thanh") giuGanNhat(suKienHoanThanh, l);
    else if ((l.loaiSuKien === "chuyen_giai_doan" || l.loaiSuKien === "tra_ho_so") && l.denGiaiDoan === "truy_to") giuGanNhat(suKienVaoTruyTo, l);
    else if (l.loaiSuKien === "chuyen_giai_doan" && l.denGiaiDoan === "xet_xu") giuGanNhat(suKienVaoXetXu, l);
    else if (l.loaiSuKien === "tra_ho_so" && l.denGiaiDoan === "dieu_tra") giuGanNhat(suKienTraVeDieuTra, l);
  }
  return { suKienMoi, suKienHoanThanh, suKienVaoTruyTo, suKienVaoXetXu, suKienTraVeDieuTra };
}

function taoSuKien(overrides) {
  return {
    maVuAn: null, loaiSuKien: null, maBiCan: null,
    tuGiaiDoan: null, denGiaiDoan: null, hanCu: null, hanMoi: null,
    hinhThucHoanThanh: null, vuTachRa: null, lyDoTach: null, vuNhapVao: null,
    soQuyetDinh: "", // số QĐ/kết luận/cáo trạng/bản án... gắn với thao tác này, nếu có
    ngaySuKien: new Date(), kyThongKe: null, lichSuSuaKy: [], ghiChu: "",
    nguoiThucHien: "", thoiDiemGhi: new Date(),
    ...overrides,
  };
}

// Tách 1 phần bị can của vuGoc ra vụ mới — dùng chung cho luồng "Hoàn thành vụ án"
// (khi TĐC/ĐC chỉ áp dụng 1 phần bị can) và luồng "Tách vụ án" thủ công.
// Trả về batch CHƯA commit để nơi gọi ghi thêm log rồi tự commit.
// biCanTachIds: bị can CHUYỂN HẲN sang vụ mới (biến mất khỏi vụ gốc — hành vi cũ khi tách).
// biCanSaoChepIds: bị can SAO CHÉP sang vụ mới (giữ nguyên ở CẢ 2 vụ) — dùng cho trường hợp 1
// bị can có nhiều hành vi, 1 hành vi tách ra xử lý độc lập nhưng người đó vẫn còn hành vi khác ở
// vụ gốc. Bản sao được gắn `nhomBiCanId` trỏ về đúng 1 định danh chung với bản gốc — để khi
// NHẬP VỤ lại sau này, hệ thống nhận ra 2 bản ghi bican đó là CÙNG 1 người thay vì tạo trùng
// (xem NhapVuModal). Cả 2 tham số đều optional Set, mặc định rỗng — vụ 0 bị can vẫn tách được
// (tạo 1 vụ mới trống, dùng cho "hành vi chưa rõ đối tượng").
async function tachVuAn({ vuGoc, biCanTachIds, biCanSaoChepIds, biCanList, trangThaiVuMoi, nguoiThucHien }) {
  const idsChuyenHan = biCanTachIds || new Set();
  const idsSaoChep = biCanSaoChepIds || new Set();

  const refGoc = db.collection("vuan").doc(vuGoc.id);
  const maVuMoi = await db.runTransaction(async (tx) => {
    const snap = await tx.get(refGoc);
    const soMoi = (snap.data().soDemTach || 0) + 1;
    tx.update(refGoc, { soDemTach: soMoi });
    return `${vuGoc.id}_${soMoi}`;
  });

  const biCanChuyenHan = biCanList.filter(bc => idsChuyenHan.has(bc.id));
  const biCanSaoChep = biCanList.filter(bc => idsSaoChep.has(bc.id));
  const biCanVuMoi = [...biCanChuyenHan, ...biCanSaoChep]; // để tính tên vụ/điều luật của vụ MỚI
  const biCanConLaiGoc = biCanList.filter(bc => !idsChuyenHan.has(bc.id)); // sao chép vẫn ở lại gốc
  const now = new Date();

  const batch = db.batch();
  batch.set(db.collection("vuan").doc(maVuMoi), {
    maNoiSinh: maVuMoi, maNganhCap: null,
    tenVu: tinhTenVu(biCanVuMoi) || vuGoc.tenVu,
    nguon: vuGoc.nguon, nguonChiTiet: vuGoc.nguonChiTiet || "",
    hanDieuTra: vuGoc.hanDieuTra || null, soQdKtva: vuGoc.soQdKtva || "", ngayQdKtva: vuGoc.ngayQdKtva || null,
    ksvChinh: vuGoc.ksvChinh || "", ksvHoTro: vuGoc.ksvHoTro || [], dtvCbdt: vuGoc.dtvCbdt || "",
    donViThuLy: vuGoc.donViThuLy || "", dieuLuat: tinhDieuLuat(biCanVuMoi),
    coQuanThuLy: vuGoc.coQuanThuLy, trangThai: trangThaiVuMoi,
    noiChuyenDen: "", nhapVaoVu: null, vuGoc: vuGoc.id, soDemTach: 0,
    anDiem: vuGoc.anDiem || false, uyQuyenXetXu: vuGoc.uyQuyenXetXu || "", phienToaRutKN: vuGoc.phienToaRutKN || false,
    ghiChu: "", ngayTao: now, nguoiTao: nguoiThucHien, ngayCapNhat: now, nguoiCapNhatCuoi: nguoiThucHien,
  });
  biCanChuyenHan.forEach(bc => batch.update(db.collection("bican").doc(bc.id), { maVuAn: maVuMoi }));
  biCanSaoChep.forEach(bc => {
    const nhomId = bc.nhomBiCanId || bc.id; // lần đầu sao chép: lấy chính ID bản gốc làm định danh nhóm
    const { id, ...bcData } = bc;
    batch.set(db.collection("bican").doc(), { ...bcData, maVuAn: maVuMoi, nhomBiCanId: nhomId });
    if (!bc.nhomBiCanId) batch.update(db.collection("bican").doc(bc.id), { nhomBiCanId: nhomId });
  });
  batch.update(refGoc, {
    dieuLuat: tinhDieuLuat(biCanConLaiGoc), tenVu: tinhTenVu(biCanConLaiGoc) || vuGoc.tenVu,
    ngayCapNhat: now, nguoiCapNhatCuoi: nguoiThucHien,
  });
  return { maVuMoi, batch, now };
}

// Hook dùng chung cho mọi modal thao tác nghiệp vụ: gom bước "điền form" -> "xác nhận kỳ"
// -> "ghi vào Firestore", tránh lặp lại state loading/lỗi ở từng modal.
function useHanhDongVuAn() {
  const [hienModalKy, setHienModalKy] = useState(false);
  const [dangLuu, setDangLuu] = useState(false);
  const [loi, setLoi] = useState("");
  const thucThiRef = React.useRef(null);
  const onThanhCongRef = React.useRef(null);

  const batDauXacNhanKy = (thucThi, onThanhCong) => {
    thucThiRef.current = thucThi;
    onThanhCongRef.current = onThanhCong || null;
    setLoi("");
    setHienModalKy(true);
  };
  const onXacNhanKy = async (kyId) => {
    setHienModalKy(false);
    setDangLuu(true);
    try {
      const ketQua = await thucThiRef.current(kyId);
      addToast(onThanhCongRef.current?.msg || "Đã lưu thành công");
      onThanhCongRef.current?.fn?.(ketQua);
    } catch (err) {
      console.error(err);
      setLoi("Lỗi khi lưu: " + err.message);
      addToast("Lỗi khi lưu: " + err.message, "error");
    } finally {
      setDangLuu(false);
    }
  };
  return { hienModalKy, dangLuu, loi, setLoi, batDauXacNhanKy, onXacNhanKy, onHuyKy: () => setHienModalKy(false) };
}

// Tính nhóm tuổi cho Biểu B10 — dùng năm sinh và năm QĐ KTVA (tính gần đúng, không cần tháng).
function tinhNhomTuoi(namSinh, namKTVA) {
  if (!namSinh || !namKTVA) return null;
  const tuoi = Number(namKTVA) - Number(namSinh);
  if (tuoi >= 14 && tuoi < 16) return "14_16";
  if (tuoi >= 16 && tuoi < 18) return "16_18";
  if (tuoi >= 18 && tuoi <= 30) return "18_30";
  if (tuoi > 30 && tuoi <= 70) return "30_70";
  if (tuoi > 70) return ">70";
  return null;
}

// Hook danh mục tội danh — dùng chung trong form BC + tinhBieu10.
function useDanhMucToiDanh() {
  // Mặc định dùng mảng inline; nếu Firebase đã seed thì dùng Firebase (có thể đã chỉnh sửa)
  const [danhMuc, setDanhMuc] = useState(DANH_MUC_TOI_DANH_MAM);
  useEffect(() => {
    return db.collection("danhMucToiDanh").orderBy("thuTuHienThi", "asc").onSnapshot(
      snap => { if (snap.docs.length > 0) setDanhMuc(snap.docs.map(d => ({ id: d.id, ...d.data() }))); },
      err => console.error(err)
    );
  }, []);
  return danhMuc;
}

// Lấy / lưu bộ luật mặc định (BLHS 2025 hoặc 1999) từ localStorage.
function useBlhsMacDinh() {
  const [blhs, setBlhs] = useState(() => {
    const v = localStorage.getItem("qlva_blhsMacDinh") || "2025";
    // migrate "2015" → "2025" (cùng 1 bộ luật, chỉ đổi tên phiên bản)
    return v === "2015" ? "2025" : v;
  });
  const set = (v) => { localStorage.setItem("qlva_blhsMacDinh", v); setBlhs(v); };
  return [blhs, set];
}

// Input điều luật với custom dropdown — hỗ trợ tìm theo SỐ (gõ "173") lẫn theo TÊN tội danh.
// Hiển thị kết quả của blhsMacDinh trước, rồi bộ luật còn lại sau.
// Combobox tội danh tích hợp — 1 ô duy nhất, tìm kiếm theo số điều (173) hoặc tên tội.
// onChange({ ten, dieuLuat }) — khi chọn từ danh mục, cả tên + điều luật được điền vào state cha.
// Khi gõ tay (không chọn), chỉ cập nhật ten, dieuLuat = "".
// Badge nhỏ "Đ.173/15" hiện khi đã gán điều luật từ danh mục.
function ToiDanhInput({ ten, dieuLuat, onChange, danhMuc }) {
  const [blhsMacDinh] = useBlhsMacDinh();
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);
  // Đánh dấu khi người dùng click chọn 1 item trong dropdown để onBlur không override
  const clickedItemRef = useRef(false);

  useEffect(() => {
    if (!open) return;
    const fn = e => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", fn);
    return () => document.removeEventListener("mousedown", fn);
  }, [open]);

  const filtered = useMemo(() => {
    const s = (ten || "").trim().toLowerCase();
    const isNum = /^\d+$/.test(s);
    let arr = danhMuc;
    if (s) {
      arr = danhMuc.filter(d =>
        isNum
          ? d.dieuLuat.match(new RegExp(`\\b${s}\\b`))
          : d.tenToiDanh.toLowerCase().includes(s) || d.dieuLuat.toLowerCase().includes(s)
      );
    }
    const truoc = arr.filter(d => d.namBLHS === blhsMacDinh);
    const sau   = arr.filter(d => d.namBLHS !== blhsMacDinh);
    return [...truoc, ...sau].slice(0, 40);
  }, [ten, danhMuc, blhsMacDinh]);

  const chon = (d) => { onChange({ ten: d.tenToiDanh, dieuLuat: d.dieuLuat }); setOpen(false); };
  const xoa  = (e) => { e.stopPropagation(); onChange({ ten: "", dieuLuat: "" }); setOpen(false); };

  // Khi blur mà chưa chọn từ dropdown: thử khớp tự động
  // - Nếu user gõ số thuần (VD "173") → tìm điều luật khớp duy nhất → tự điền tên + ref
  // - Nếu user gõ đúng tên tội danh → tự liên kết dieuLuat ref tương ứng
  // Ưu tiên bộ luật đang chọn làm mặc định; không đụng nếu dieuLuat đã được gán (user đã chọn)
  const handleBlur = () => {
    setOpen(false);
    if (clickedItemRef.current) { clickedItemRef.current = false; return; }
    if (dieuLuat) return; // đã có ref rõ ràng, không override
    const s = (ten || "").trim();
    if (!s) return;
    const isNum = /^\d+[a-zA-Z]?$/.test(s);
    let matches;
    if (isNum) {
      matches = danhMuc.filter(d => {
        const m = d.dieuLuat.match(/Điều\s+(\d+[a-zA-Z]*)/i);
        return m && m[1].toLowerCase() === s.toLowerCase();
      });
    } else {
      matches = danhMuc.filter(d => d.tenToiDanh.toLowerCase() === s.toLowerCase());
    }
    if (matches.length >= 1) {
      const hit = matches.find(d => d.namBLHS === blhsMacDinh) || matches[0];
      onChange({ ten: hit.tenToiDanh, dieuLuat: hit.dieuLuat });
    }
  };

  const dlBadge = (() => {
    if (!dieuLuat) return null;
    const m = dieuLuat.match(/Điều (\d+[a-zA-Z]*) BLHS (\d{4})/);
    return m ? `Đ.${m[1]}/${m[2].slice(2)}` : null;
  })();

  return (
    <div ref={wrapRef} className="relative flex-1 min-w-0">
      <div className="flex items-center gap-1">
        <input
          value={ten || ""}
          onChange={e => { onChange({ ten: e.target.value, dieuLuat: "" }); setOpen(true); }}
          onFocus={() => setOpen(true)}
          onBlur={handleBlur}
          placeholder="Gõ số điều (173) hoặc tên tội…"
          className={oInput + " flex-1"}
        />
        {dlBadge && (
          <span className="text-[10px] font-mono text-indigo-600 bg-indigo-50 border border-indigo-200 rounded px-1.5 py-0.5 shrink-0 whitespace-nowrap" title={dieuLuat}>
            {dlBadge}
          </span>
        )}
        {(ten || dieuLuat) && (
          <button onMouseDown={xoa} className="text-slate-400 hover:text-red-500 text-xs shrink-0 px-0.5">✕</button>
        )}
      </div>
      {open && filtered.length > 0 && (
        <div className="absolute z-50 left-0 w-[480px] max-h-52 overflow-y-auto bg-white border border-slate-300 rounded-lg shadow-xl mt-0.5 text-xs">
          <div className="grid grid-cols-[56px_1fr_64px] gap-0 px-3 py-1 bg-slate-50 text-[10px] text-slate-400 border-b border-slate-200 font-medium sticky top-0">
            <span>Số điều</span><span>Tên tội</span><span className="text-right">Bộ luật</span>
          </div>
          {filtered.map(d => (
            <div key={d.id} onMouseDown={() => { clickedItemRef.current = true; chon(d); }}
                 className={`px-3 py-1.5 cursor-pointer hover:bg-indigo-50 grid grid-cols-[56px_1fr_64px] gap-1 items-baseline ${d.namBLHS !== blhsMacDinh ? "opacity-55" : ""}`}>
              <span className="font-mono text-indigo-700 shrink-0">{d.soDieu || d.dieuLuat.match(/\d+[a-zA-Z]*/)?.[0]}</span>
              <span className="text-slate-700 truncate">{d.tenToiDanh}</span>
              <span className="text-[10px] text-slate-400 text-right shrink-0">{d.namBLHS}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// Nút chọn bộ luật mặc định cho ToiDanhInput — hiện ở đầu phần tội danh trong form BC.
function BlhsSelector() {
  const [blhs, setBlhs] = useBlhsMacDinh();
  return (
    <div className="flex items-center gap-1 mb-1.5">
      <span className="text-[10px] text-slate-400">Bộ luật mặc định:</span>
      {[["2025","BLHS 2025 (hiện hành)"],["1999","BLHS 1999"]].map(([v, lbl]) => (
        <button key={v} onClick={() => setBlhs(v)}
                className={`text-[10px] px-2 py-0.5 rounded border ${blhs === v ? "bg-indigo-600 text-white border-indigo-600" : "border-slate-300 text-slate-600 hover:bg-slate-50"}`}>
          {lbl}
        </button>
      ))}
    </div>
  );
}

  const [ds, setDs] = useState([]);

    return db.collection("canbo").where("trangThai", "==", "dang_cong_tac").onSnapshot(
      snap => setDs(snap.docs.map(d => ({ id: d.id, ...d.data() }))),

// trangThai: { [bcId]: "o_lai" | "chuyen_han" | "sao_chep" }. "sao_chep" = bị can này có nhiều
// hành vi — giữ nguyên ở vụ gốc, đồng thời tạo 1 bản sao ở vụ mới (liên kết qua nhomBiCanId, xem
// tachVuAn) — hiếm dùng, chỉ khi 1 người có hành vi cần tách xử lý độc lập nhưng vẫn còn hành vi
// khác ở vụ gốc.
function ChonBiCan({ biCanList, trangThai, onDoi, nhanO, nhanChuyenHan }) {
  const NUT = [
    ["o_lai", nhanO || "Ở lại vụ gốc", "bg-slate-600"],
    ["chuyen_han", nhanChuyenHan || "Chuyển hẳn", "bg-indigo-600"],
    ["sao_chep", "Ở cả 2 vụ", "bg-amber-600"],
  ];
  return (
    <div className="border border-slate-200 rounded-lg divide-y divide-slate-100 max-h-64 overflow-auto">
      {biCanList.map(bc => {
        const gt = trangThai[bc.id] || "o_lai";
        return (
          <div key={bc.id} className="px-3 py-2 text-sm">
            <div className="flex items-center justify-between mb-1.5">
              <span className="font-medium">{bc.hoTen}</span>
              <span className="text-xs text-slate-400">{(bc.toiDanh || []).filter(Boolean).join(", ")}</span>
            </div>
            <div className="flex gap-1">
              {NUT.map(([gia, nhan, mauChon]) => (
                <button key={gia} type="button" onClick={() => onDoi(bc.id, gia)}
                        className={`text-xs px-2 py-1 rounded font-medium ${gt === gia ? `${mauChon} text-white` : "bg-slate-100 text-slate-500 hover:bg-slate-200"}`}>
                  {nhan}
                </button>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

  };

  return (

        <input value={email} onChange={e=>setEmail(e.target.value)}
               className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mb-4"
               placeholder="ten@vksnd.gov.vn" />
        <label className="text-xs text-slate-500 block mb-1">Mật khẩu</label>

// Với vụ án đã import trước đây mà chưa có dòng nhật ký nào (khoi_to_vu/khoi_to_bican...),
// dựng 1 dòng khoi_to_vu + 1 dòng khoi_to_bican/bị can theo thông tin hiện có. KHÔNG dựng lại
// được các lần gia hạn/trả hồ sơ trước khi import — dữ liệu đó không còn vết tích trong Excel gốc.
// An toàn chạy nhiều lần: vụ đã có ít nhất 1 dòng log sẽ tự bỏ qua.
async function dungLaiLichSu(onTienDo) {
  const vuSnap = await db.collection("vuan").get();
  const vuList = vuSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  let daDung = 0, boQua = 0;
  let batch = db.batch();
  let opsInBatch = 0;
  const now = new Date();
  const ghiChuKhoiPhuc = "Khôi phục từ dữ liệu import Excel — không có lịch sử chi tiết trước thời điểm import.";

  for (let i = 0; i < vuList.length; i++) {
    const v = vuList[i];
    const coLogSnap = await db.collection("lichsuChuyenGiaiDoan").where("maVuAn", "==", v.id).limit(1).get();
    if (!coLogSnap.empty) {
      boQua++;
      onTienDo(i + 1, vuList.length, daDung, boQua);
      continue;
    }

    const ngaySuKienVu = v.ngayQdKtva || v.ngayTao || now;
    batch.set(db.collection("lichsuChuyenGiaiDoan").doc(), taoSuKien({
      maVuAn: v.id, loaiSuKien: "khoi_to_vu", ngaySuKien: ngaySuKienVu, kyThongKe: null,
      denGiaiDoan: v.coQuanThuLy, ghiChu: ghiChuKhoiPhuc, nguoiThucHien: "he_thong", thoiDiemGhi: now,
    }));
    opsInBatch++;

    const bcSnap = await db.collection("bican").where("maVuAn", "==", v.id).get();
    bcSnap.docs.forEach(bd => {
      const bc = bd.data();
      batch.set(db.collection("lichsuChuyenGiaiDoan").doc(), taoSuKien({
        maVuAn: v.id, loaiSuKien: "khoi_to_bican", maBiCan: bd.id,
        ngaySuKien: bc.ngayKhoiTo || ngaySuKienVu, kyThongKe: null,
        ghiChu: ghiChuKhoiPhuc, nguoiThucHien: "he_thong", thoiDiemGhi: now,
      }));
      opsInBatch++;
    });

    daDung++;
    if (opsInBatch >= 400) { await batch.commit(); batch = db.batch(); opsInBatch = 0; }
    onTienDo(i + 1, vuList.length, daDung, boQua);
  }
  if (opsInBatch > 0) await batch.commit();
  return { daDung, boQua, tong: vuList.length };
}

function SeedDanhMucTool() {
  const [trangThai, setTrangThai] = useState("idle"); // idle | checking | seeding | done | error
  const [thongBao, setThongBao] = useState("");
  const [soHienCo, setSoHienCo] = useState(null);

  const kiemTra = async () => {
    setTrangThai("checking"); setThongBao("");
    try {
      const snap = await db.collection("danhMucToiDanh").limit(1).get();
      const dem = (await db.collection("danhMucToiDanh").get()).size;
      setSoHienCo(dem);
      setTrangThai("idle");
      if (dem === 0) setThongBao(`Collection trống — sẵn sàng seed ${DANH_MUC_TOI_DANH_MAM.length} tội danh.`);
      else setThongBao(`Đã có ${dem} tội danh. Seed lại sẽ ghi đè (idempotent, không tạo trùng).`);
    } catch (err) { setThongBao("Lỗi: " + err.message); setTrangThai("error"); }
  };

  const seed = async () => {
    setTrangThai("seeding"); setThongBao("Đang ghi...");
    try {
      // Firestore batch tối đa 500 write/batch
      const BATCH_SIZE = 400;
      let count = 0;
      for (let i = 0; i < DANH_MUC_TOI_DANH_MAM.length; i += BATCH_SIZE) {
        const chunk = DANH_MUC_TOI_DANH_MAM.slice(i, i + BATCH_SIZE);
        const batch = db.batch();
        chunk.forEach(e => {
          const ref = db.collection("danhMucToiDanh").doc(e.id);
          batch.set(ref, { soDieu: e.soDieu, tenToiDanh: e.tenToiDanh, dieuLuat: e.dieuLuat, thuTuHienThi: e.thuTuHienThi, namBLHS: e.namBLHS });
        });
        await batch.commit();
        count += chunk.length;
        setThongBao(`Đã ghi ${count}/${DANH_MUC_TOI_DANH_MAM.length}...`);
      }
      setTrangThai("done");
      setThongBao(`Hoàn thành! Đã seed ${count} tội danh vào collection danhMucToiDanh.`);
    } catch (err) { setThongBao("Lỗi: " + err.message); setTrangThai("error"); }
  };

  return (
    <div className="bg-white border border-slate-200 rounded-xl p-5 mb-6">
      <h3 className="font-semibold text-slate-800 mb-1">Seed danh mục tội danh (BLHS 2025 + BLHS 1999)</h3>
      <p className="text-xs text-slate-500 mb-3">
        Ghi {DANH_MUC_TOI_DANH_MAM.length} tội danh vào collection <code>danhMucToiDanh</code> (314 tội BLHS 2025 +
        272 tội BLHS 1999). Idempotent — chạy lại chỉ ghi đè, không tạo trùng.
        Mỗi doc có 3 trường chính: <code>soDieu</code>, <code>tenToiDanh</code>, <code>namBLHS</code>.
      </p>
      {thongBao && (
        <div className={`text-sm rounded p-2 mb-3 ${trangThai === "error" ? "bg-red-50 text-red-700" : trangThai === "done" ? "bg-green-50 text-green-700" : "bg-blue-50 text-blue-700"}`}>
          {thongBao}
        </div>
      )}
      <div className="flex gap-2">
        <button onClick={kiemTra} disabled={trangThai === "checking" || trangThai === "seeding"}
                className="px-3 py-1.5 text-sm rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-50 disabled:opacity-50">
          Kiểm tra
        </button>
        <button onClick={seed} disabled={trangThai === "seeding"}
                className="px-3 py-1.5 text-sm rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 disabled:opacity-50">
          {trangThai === "seeding" ? "Đang seed..." : "Seed ngay"}
        </button>
      </div>
    </div>
  );
}

// Chuẩn hóa tội danh + điều luật cho toàn bộ bị can:
// 1. toiDanh[i] là số thuần ("173") → tra ngược theo số điều → ghi đúng tên + dieuLuatBC ref
// 2. toiDanh[i] là tên đầy đủ, dieuLuatBC[i] trống → tra theo tên → điền dieuLuatBC ref
// Chỉ đụng vào ô còn thiếu dieuLuatBC — không override ô đã có ref rõ ràng.
function BackfillDieuLuatBCTool() {
  const [state, setState] = useState("idle");
  const [info, setInfo] = useState("");

  const run = async () => {
    setState("loading"); setInfo("Đang tải dữ liệu...");
    try {
      const [dmSnap, bcSnap] = await Promise.all([
        db.collection("danhMucToiDanh").get(),
        db.collection("bican").get(),
      ]);

      // Lookup theo tên tội danh (lowercase), ưu tiên BLHS 2015
      const dmByTen = {};
      // Lookup theo số điều (lowercase, VD "173", "134a"), ưu tiên BLHS 2015
      const dmByDieu = {};
      dmSnap.docs.forEach(d => {
        const data = d.data();
        const keyTen = (data.tenToiDanh || "").toLowerCase();
        if (!dmByTen[keyTen] || data.namBLHS === "2015") dmByTen[keyTen] = data;
        const mDieu = (data.dieuLuat || "").match(/Điều\s+(\d+[a-zA-Z]*)/i);
        if (mDieu) {
          const keyDieu = mDieu[1].toLowerCase();
          if (!dmByDieu[keyDieu] || data.namBLHS === "2015") dmByDieu[keyDieu] = data;
        }
      });

      let soCapNhat = 0, soBo = 0, soLoi = 0;
      const BATCH_SIZE = 400;
      let batch = db.batch(); let batchCount = 0;

      for (const doc of bcSnap.docs) {
        const bc = doc.data();
        const toiDanh = [...(bc.toiDanh || [""])];
        const dieuLuatBC = [...(bc.dieuLuatBC || [])];
        let changed = false;

        for (let i = 0; i < toiDanh.length; i++) {
          const t = (toiDanh[i] || "").trim();
          const dl = (dieuLuatBC[i] || "").trim();
          if (dl) continue; // đã có ref, bỏ qua

          if (/^\d+[a-zA-Z]?$/.test(t)) {
            // Chỉ có số điều → tra ngược để lấy cả tên lẫn ref
            const hit = dmByDieu[t.toLowerCase()];
            if (hit) { toiDanh[i] = hit.tenToiDanh; dieuLuatBC[i] = hit.dieuLuat; changed = true; }
          } else if (t) {
            // Tên tội danh nhưng thiếu dieuLuatBC → điền ref
            const hit = dmByTen[t.toLowerCase()];
            if (hit) { dieuLuatBC[i] = hit.dieuLuat; changed = true; }
          }
        }

        if (!changed) { soBo++; continue; }
        batch.update(doc.ref, { toiDanh, dieuLuatBC });
        soCapNhat++; batchCount++;
        if (batchCount >= BATCH_SIZE) { await batch.commit(); batch = db.batch(); batchCount = 0; }
      }
      if (batchCount > 0) await batch.commit();

      setState("done");
      setInfo(`Đã chuẩn hóa ${soCapNhat} bị can. Bỏ qua ${soBo} (đã đầy đủ hoặc không khớp danh mục).`);
    } catch (err) { setState("error"); setInfo("Lỗi: " + err.message); }
  };

  return (
    <div className="bg-white border border-slate-200 rounded-xl p-5 mb-6">
      <h3 className="font-semibold text-slate-800 mb-1">Chuẩn hóa tội danh / điều luật bị can</h3>
      <p className="text-xs text-slate-500 mb-3">
        Sửa dữ liệu tội danh nhập sai định dạng: nếu ô tội danh chỉ chứa số điều (VD "173") thì tự tra danh mục
        để điền đúng tên ("Tội trộm cắp tài sản") + điều luật ref ("Điều 173 BLHS 2015"); nếu tên đã đúng nhưng
        chưa có điều luật ref thì điền ref. Cần <strong>seed danh mục BLHS trước</strong>.
        An toàn khi chạy lại nhiều lần — chỉ đụng vào ô còn thiếu.
      </p>
      {info && (
        <div className={`text-sm rounded p-2 mb-3 ${state === "error" ? "bg-red-50 text-red-700" : state === "done" ? "bg-green-50 text-green-700" : "bg-blue-50 text-blue-700"}`}>
          {info}
        </div>
      )}
      <button onClick={run} disabled={state === "loading"}
              className="px-3 py-1.5 text-sm rounded-lg bg-amber-500 hover:bg-amber-600 text-white disabled:opacity-50">
        {state === "loading" ? "Đang chạy..." : "Chạy chuẩn hóa"}
      </button>
    </div>
  );
}

// Backfill ngayQuyetDinh + kyHoanThanh cho các vụ đã giải quyết tạo trước khi có index này.
// Idempotent: vụ đã có ngayQuyetDinh sẽ bị bỏ qua.
function BackfillNgayQuyetDinhTool() {
  const [state, setState] = useState("idle");
  const [info, setInfo] = useState("");

  const run = async () => {
    setState("loading"); setInfo("Đang tải...");
    try {
      const TRANG_THAI_HOAN_THANH = ["da_xet_xu", "chuyen_di", "tam_dinh_chi", "dinh_chi", "an_huy", "da_nhap"];
      // Lấy tất cả vụ đã giải quyết còn thiếu index
      const snaps = await Promise.all(
        TRANG_THAI_HOAN_THANH.map(tt => db.collection("vuan").where("trangThai", "==", tt).get())
      );
      const canBackfill = snaps.flatMap(s => s.docs)
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(v => !v.ngayQuyetDinh);

      if (canBackfill.length === 0) {
        setState("done"); setInfo("Tất cả vụ đã có index — không cần cập nhật."); return;
      }
      setInfo(`Cần cập nhật ${canBackfill.length} vụ. Đang lấy sự kiện...`);

      // Lấy tất cả sự kiện hoan_thanh & nhap_vu trong 1 query
      const logSnap = await db.collection("lichsuChuyenGiaiDoan")
        .where("loaiSuKien", "in", ["hoan_thanh", "nhap_vu"]).get();
      const eventMap = {};
      logSnap.docs.forEach(d => {
        const ev = d.data();
        if (!eventMap[ev.maVuAn] || (ev.ngaySuKien || "") > (eventMap[ev.maVuAn].ngaySuKien || "")) {
          eventMap[ev.maVuAn] = { ngaySuKien: ev.ngaySuKien, kyThongKe: ev.kyThongKe };
        }
      });

      let updated = 0, skipped = 0;
      let batch = db.batch(); let cnt = 0;
      for (const v of canBackfill) {
        const ev = eventMap[v.id];
        if (!ev?.ngaySuKien) { skipped++; continue; }
        batch.update(db.collection("vuan").doc(v.id), {
          ngayQuyetDinh: ev.ngaySuKien, kyHoanThanh: ev.kyThongKe ?? null,
        });
        updated++; cnt++;
        if (cnt >= 400) { await batch.commit(); batch = db.batch(); cnt = 0; }
      }
      if (cnt > 0) await batch.commit();
      setState("done");
      setInfo(`Đã cập nhật ${updated} vụ. Bỏ qua ${skipped} vụ (không tìm thấy sự kiện hoàn thành).`);
    } catch (err) { setState("error"); setInfo("Lỗi: " + err.message); }
  };

  return (
    <div className="bg-white border border-slate-200 rounded-xl p-5 mb-6">
      <h3 className="font-semibold text-slate-800 mb-1">Cập nhật index Án đã giải quyết</h3>
      <p className="text-xs text-slate-500 mb-3">
        Điền sẵn <code>ngayQuyetDinh</code> và <code>kyHoanThanh</code> vào các vụ đã giải quyết tạo
        trước khi có tính năng này — để module "Án đã giải quyết" mở ra ngay, không cần query log.
        Chạy 1 lần là đủ. An toàn khi chạy lại — chỉ đụng vào vụ còn thiếu field.
      </p>
      {info && (
        <div className={`text-sm rounded p-2 mb-3 ${state === "error" ? "bg-red-50 text-red-700" : state === "done" ? "bg-green-50 text-green-700" : "bg-blue-50 text-blue-700"}`}>
          {info}
        </div>
      )}
      <button onClick={run} disabled={state === "loading"}
              className="px-3 py-1.5 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white disabled:opacity-50">
        {state === "loading" ? "Đang chạy..." : "Cập nhật index"}
      </button>
    </div>
  );
}

// Sửa loaiKhoiTo bị ghi sai bởi bug cũ ở ImportExcelModule (hardcode "khoi_to_moi" — giá trị
// KHÔNG HỢP LỆ, đã sửa code 2026-07-13 để bắt import mới tính đúng, nhưng bị can đã import TRƯỚC
// lúc sửa vẫn còn giá trị sai trong Firestore). Biểu B10 lọc bị can === "ban_dau" mới tính vào
// khối nhân khẩu học (C7-C24...), nên vụ nào dính bug này sẽ bị B10 đếm thiếu ÂM THẦM ở khối đó
// dù số vụ/BC tổng vẫn đúng — cùng loại lỗi vừa phát hiện lại ở seed-tool.html (xem đó để hiểu
// triệu chứng). Chạy 1 lần: gom bị can theo vụ, tính lại ĐÚNG bằng chính hàm
// tinhLoaiKhoiToTheoNgay app dùng mỗi khi thêm/sửa bị can (MIN ngayKhoiTo trong vụ = "ban_dau",
// còn lại "bo_sung"), chỉ ghi đè khi giá trị tính ra khác giá trị đang lưu — an toàn chạy lại
// nhiều lần (idempotent). Vì vuPrimaryDL (dùng ở TK tội danh + TaiTaoTonTheoTDTool) chọn bị can
// "ban_dau" làm tội danh chính của vụ, sửa xong nên chạy lại TaiTaoTonTheoTDTool nếu số liệu tồn
// theo tội danh của kỳ cũ có vụ bị ảnh hưởng.
function BackfillLoaiKhoiToTool() {
  const [state, setState] = useState("idle");
  const [info, setInfo] = useState("");

  const run = async () => {
    setState("loading"); setInfo("Đang tải dữ liệu...");
    try {
      const bcSnap = await db.collection("bican").get();
      const theoVu = new Map();
      bcSnap.docs.forEach(doc => {
        const bc = doc.data();
        if (!theoVu.has(bc.maVuAn)) theoVu.set(bc.maVuAn, []);
        theoVu.get(bc.maVuAn).push({ id: doc.id, ref: doc.ref, data: bc });
      });

      let soCapNhat = 0, soVuAnhHuong = 0;
      const BATCH_SIZE = 400;
      let batch = db.batch(); let batchCount = 0;
      const commitNeu = async () => { if (batchCount >= BATCH_SIZE) { await batch.commit(); batch = db.batch(); batchCount = 0; } };

      for (const [, bcList] of theoVu) {
        const ngayList = bcList.map(bc => {
          const nk = bc.data.ngayKhoiTo;
          return nk ? (nk.toDate ? nk.toDate() : new Date(nk)) : null;
        });
        const dungList = tinhLoaiKhoiToTheoNgay(ngayList);
        let vuBiSua = false;
        bcList.forEach((bc, i) => {
          if (bc.data.loaiKhoiTo !== dungList[i]) {
            batch.update(bc.ref, { loaiKhoiTo: dungList[i] });
            soCapNhat++; batchCount++; vuBiSua = true;
          }
        });
        if (vuBiSua) soVuAnhHuong++;
        await commitNeu();
      }
      if (batchCount > 0) await batch.commit();

      setState("done");
      setInfo(soCapNhat === 0
        ? "Không có bị can nào sai — dữ liệu đã đúng."
        : `Đã sửa loaiKhoiTo cho ${soCapNhat} bị can thuộc ${soVuAnhHuong} vụ. Nếu các vụ này thuộc kỳ đã chốt, ` +
          `chạy lại "Sửa lại tồn cuối kỳ theo tội danh (Biểu B10)" bên dưới để số tồn theo tội danh khớp lại.`);
    } catch (err) { setState("error"); setInfo("Lỗi: " + err.message); }
  };

  return (
    <div className="bg-white border border-slate-200 rounded-xl p-5 mb-6">
      <h3 className="font-semibold text-slate-800 mb-1">Sửa lại "Ban đầu/Bổ sung" của bị can (loaiKhoiTo)</h3>
      <p className="text-xs text-slate-500 mb-3">
        Sửa bị can bị bug cũ ghi sai "loaiKhoiTo" (bug ở Import Excel trước 2026-07-13, hoặc ở seed-tool.html) —
        khiến Biểu B10 đếm thiếu ở khối nhân khẩu học (tuổi, trình độ, dân tộc...) dù số vụ/bị can tổng vẫn đúng.
        Tính lại theo đúng quy tắc app dùng (bị can có ngày khởi tố sớm nhất trong vụ = "Ban đầu").
        An toàn khi chạy lại nhiều lần.
      </p>
      {info && (
        <div className={`text-sm rounded p-2 mb-3 ${state === "error" ? "bg-red-50 text-red-700" : state === "done" ? "bg-green-50 text-green-700" : "bg-blue-50 text-blue-700"}`}>
          {info}
        </div>
      )}
      <button onClick={run} disabled={state === "loading"}
              className="px-3 py-1.5 text-sm rounded-lg bg-amber-500 hover:bg-amber-600 text-white disabled:opacity-50">
        {state === "loading" ? "Đang chạy..." : "Chạy sửa lại"}
      </button>
    </div>
  );
}
