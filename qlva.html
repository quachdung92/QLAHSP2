// ====================================================================
// MODULE: KỲ BÁO CÁO
// ====================================================================
// Helper: snapshot tồn hiện tại theo điều luật × giai đoạn — dùng chung cho chotKyBaoCao
// và tinhLaiBaoCaoLuu. Kết quả: { tonCuoiKy, tonCuoiBiCan, tonCuoiKyTheoTD }.
// tonCuoiBiCan: tổng số bị can thực tế (0 cho vụ chưa có BC) theo giai đoạn.
async function tinhSnapTonTheoTD() {
  const [dems, dmSnap] = await Promise.all([
    Promise.all(THU_TU_GIAI_DOAN.map(gd =>
      db.collection("vuan").where("coQuanThuLy", "==", gd).where("trangThai", "==", "dang_giai_quyet").get()
    )),
    db.collection("danhMucToiDanh").get(),
  ]);
  const tonCuoiKy = {};
  const tonCuoiBiCan = {};
  THU_TU_GIAI_DOAN.forEach((gd, i) => { tonCuoiKy[gd] = dems[i].size; tonCuoiBiCan[gd] = 0; });

  const dmByTenChot = new Map();
  dmSnap.docs.forEach(d => {
    const data = d.data();
    const key = (data.tenToiDanh || "").toLowerCase();
    if (!dmByTenChot.has(key) || data.namBLHS === "2015") dmByTenChot.set(key, data.dieuLuat);
  });
  const normDK = (bc) =>
    bc.dieuLuatBC?.[0] ||
    dmByTenChot.get((bc.toiDanh?.[0] || "").toLowerCase()) ||
    bc.toiDanh?.[0] ||
    "(chưa xác định)";

  // Batch-load toàn bộ bị can 1 lần — thay thế sequential await trong vòng lặp lồng nhau
  const allVuIds = dems.flatMap(snap => snap.docs.map(d => d.id));
  const bicanByVuAn = await batchLayBiCanList(allVuIds);
  const tonCuoiKyTheoTD = {};
  for (let gi = 0; gi < THU_TU_GIAI_DOAN.length; gi++) {
    const gd = THU_TU_GIAI_DOAN[gi];
    for (const vuDoc of dems[gi].docs) {
      const vu = vuDoc.data();
      const bcList = bicanByVuAn[vuDoc.id] || [];
      tonCuoiBiCan[gd] += bcList.length;
      if (bcList.length === 0) {
        // Vụ 0 BC: tội danh chính = dieuLuat[0]
        const dieuLuatKey = (vu.dieuLuat || "").split(";")[0].trim() || "(chưa xác định)";
        if (!tonCuoiKyTheoTD[dieuLuatKey]) tonCuoiKyTheoTD[dieuLuatKey] = {};
        if (!tonCuoiKyTheoTD[dieuLuatKey][gd]) tonCuoiKyTheoTD[dieuLuatKey][gd] = { vuAn: 0, biCan: 0 };
        tonCuoiKyTheoTD[dieuLuatKey][gd].vuAn++;
      } else {
        // Vụ: vuAn chỉ đếm vào tội danh CHÍNH (BC ban_dau hoặc BC đầu tiên)
        const bcChinh = bcList.find(bc => bc.loaiKhoiTo === "ban_dau") || bcList[0];
        const dkChinh = normDK(bcChinh);
        if (!tonCuoiKyTheoTD[dkChinh]) tonCuoiKyTheoTD[dkChinh] = {};
        if (!tonCuoiKyTheoTD[dkChinh][gd]) tonCuoiKyTheoTD[dkChinh][gd] = { vuAn: 0, biCan: 0 };
        tonCuoiKyTheoTD[dkChinh][gd].vuAn++;
        // BC: mỗi BC đếm dưới tội danh của chính nó
        for (const bc of bcList) {
          const dk = normDK(bc);
          if (!tonCuoiKyTheoTD[dk]) tonCuoiKyTheoTD[dk] = {};
          if (!tonCuoiKyTheoTD[dk][gd]) tonCuoiKyTheoTD[dk][gd] = { vuAn: 0, biCan: 0 };
          tonCuoiKyTheoTD[dk][gd].biCan++;
        }
      }
    }
  }
  return { tonCuoiKy, tonCuoiBiCan, tonCuoiKyTheoTD };
}

async function chotKyBaoCao(ky, kyTruoc, ngayChot, nguoiChot) {
  const { tonCuoiKy, tonCuoiBiCan, tonCuoiKyTheoTD } = await tinhSnapTonTheoTD();
  const baoCaoTuLog = await tinhBaoCaoKyTuLog({ ...ky, trangThai: "da_chot", tonCuoiKy }, kyTruoc);
  await db.collection("kybaocao").doc(ky.id).update({
    trangThai: "da_chot", ngayChot, nguoiChot, thoiDiemChot: new Date(),
    tonCuoiKy, tonCuoiBiCan, tonCuoiKyTheoTD,
    baoCaoLuu: tachBaoCaoLuu(baoCaoTuLog),
  });
}

// Tính báo cáo chi tiết 1 kỳ theo từng giai đoạn — luôn tính từ log (lichsuChuyenGiaiDoan),
// không suy ra từ trạng thái hiện tại (đúng nguyên tắc "log là nguồn sự thật duy nhất").
// hoan_thanh không lưu tuGiaiDoan (chỉ hinhThucHoanThanh) nên dùng coQuanThuLy hiện tại của vụ
// làm proxy giai đoạn đã hoàn thành — hợp lệ vì hệ thống không đổi coQuanThuLy sau khi hoàn thành.
// Lấy vụ án hiện tại ứng với từng dòng log (dùng cho cả số liệu tổng hợp lẫn danh sách chi tiết
// khi xuất Excel — cùng 1 nguồn dữ liệu nên số dòng danh sách LUÔN khớp đúng số trên báo cáo).
// Tất cả query vuan + bican chạy song song (Promise.all); bị can dùng cache phiên
async function vuAnTuLogDocs(logDocs) {
  if (!logDocs.length) return [];
  const maVuAnList = [...new Set(logDocs.map(d => d.data().maVuAn))];
  // Batch-read vuan + bican song song — ceil(N/30)*2 queries thay vì N*2 queries riêng lẻ
  const vuanChunks = [];
  for (let i = 0; i < maVuAnList.length; i += 30) vuanChunks.push(maVuAnList.slice(i, i + 30));
  const [vuanSnaps, bicanMap] = await Promise.all([
    Promise.all(vuanChunks.map(ids =>
      db.collection("vuan").where(firebase.firestore.FieldPath.documentId(), "in", ids).get()
    )),
    batchLayBiCanInfo(maVuAnList),
  ]);
  const vuanMap = {};
  vuanSnaps.forEach(snap => snap.docs.forEach(d => { vuanMap[d.id] = { id: d.id, ...d.data() }; }));
  return logDocs.map(d => {
    const l = d.data();
    const vu = vuanMap[l.maVuAn];
    if (!vu) return null;
    const bcInfo = bicanMap[l.maVuAn] || { soBiCan: 0, toiDanhChinh: "" };
    return { ...vu, _log: l, _soBiCan: bcInfo.soBiCan, _toiDanhChinh: bcInfo.toiDanhChinh };
  }).filter(Boolean);
}

// Tính đầy đủ (luôn quét lichsuChuyenGiaiDoan) — TỐN NHIỀU query, chỉ nên gọi khi thật sự cần
// (lúc chốt kỳ, hoặc bấm "Tính lại số liệu"). Xem tinhBaoCaoKy bên dưới — đó mới là hàm nên gọi
// ở nơi hiển thị, vì nó dùng lại kết quả đã lưu (baoCaoLuu) cho kỳ đã chốt thay vì tính lại mỗi
// lần bấm xem, như yêu cầu người dùng 2026-07-11.
async function tinhBaoCaoKyTuLog(ky, kyTruoc) {
  const baoCao = {};
  for (const gd of THU_TU_GIAI_DOAN) {
    // Guard backward compat: data cũ lưu tonCuoiKy[gd] = {soVu: N, soBiCan: M},
    // data mới lưu tonCuoiKy[gd] = N (số nguyên), tonCuoiBiCan[gd] = M.
    const rawTon = kyTruoc?.tonCuoiKy?.[gd];
    const tonDauKy = typeof rawTon === "number" ? rawTon : (rawTon?.soVu ?? 0);
    const rawBiCan = kyTruoc?.tonCuoiBiCan?.[gd];
    const tonDauBiCan = typeof rawBiCan === "number" ? rawBiCan
      : (rawBiCan?.soBiCan ?? rawTon?.soBiCan ?? 0);

    // "Mới" ở 1 giai đoạn gồm 4 nguồn, áp dụng THỐNG NHẤT cho cả 3 giai đoạn (trước đây cột Điều
    // tra được code riêng, thiếu hẳn "trả về từ giai đoạn sau" — tức viện trả hồ sơ điều tra bổ
    // sung — nên 1 vụ bị trả về Điều tra rồi giải quyết luôn trong kỳ sẽ bị tính "ra" ở Truy tố
    // mà không có "vào" tương ứng ở Điều tra, làm tồn cuối kỳ lệch):
    //  1. Khởi tố trực tiếp vào đúng giai đoạn này (denGiaiDoan trên sự kiện khoi_to_vu — vụ
    //     nhập tay/import có thể vào thẳng Truy tố/Xét xử, không nhất thiết bắt đầu từ Điều tra).
    //  2. Vụ tách ra từ vụ khác (tach_vu) xuất hiện ở đúng giai đoạn vụ gốc đang ở lúc tách —
    //     không phải vụ án mới thật nhưng vẫn là 1 bản ghi vuan mới, phải tính "vào" thì mới
    //     khớp với việc nó bị tính "ra" nếu giải quyết luôn trong kỳ.
    //  3. Chuyển đến từ giai đoạn trước (chuyen_giai_doan, luôn tiến 1 bước — không áp dụng cho
    //     Điều tra vì không có giai đoạn nào trước đó để chuyển tới).
    //  4. Trả về từ giai đoạn sau (tra_ho_so, luôn lùi 1 bước — CÓ áp dụng cho Điều tra: viện trả
    //     hồ sơ yêu cầu điều tra bổ sung).
    // Sự kiện khoi_to_vu/tach_vu tạo trước khi sửa công thức này không có denGiaiDoan (null) nên
    // sẽ không khớp where nào — cần backfill 1 lần cho dữ liệu cũ (xem ghi chú hạ tầng).
    const [khoiToTrucTiepSnap, tachVuSnap, chuyenDenSnap, traVeSnap] = await Promise.all([
      db.collection("lichsuChuyenGiaiDoan").where("kyThongKe", "==", ky.id).where("loaiSuKien", "==", "khoi_to_vu").where("denGiaiDoan", "==", gd).get(),
      db.collection("lichsuChuyenGiaiDoan").where("kyThongKe", "==", ky.id).where("loaiSuKien", "==", "tach_vu").where("denGiaiDoan", "==", gd).get(),
      db.collection("lichsuChuyenGiaiDoan").where("kyThongKe", "==", ky.id).where("loaiSuKien", "==", "chuyen_giai_doan").where("denGiaiDoan", "==", gd).get(),
      db.collection("lichsuChuyenGiaiDoan").where("kyThongKe", "==", ky.id).where("loaiSuKien", "==", "tra_ho_so").where("denGiaiDoan", "==", gd).get(),
    ]);

    const nguonDem = { an_khoi_to_moi: 0, tin_bao_khoi_to_len: 0, an_noi_khac_chuyen_den: 0, phuc_hoi_dieu_tra: 0 };
    const dsKhoiToTrucTiep = await vuAnTuLogDocs(khoiToTrucTiepSnap.docs);
    if (gd === "dieu_tra") {
      for (const v of dsKhoiToTrucTiep) { if (v.nguon in nguonDem) nguonDem[v.nguon]++; }
    }

    // "Khởi tạo trực tiếp" chỉ hiển thị riêng cho Truy tố/Xét xử — ở Điều tra, cùng nhóm sự kiện
    // khoi_to_vu đó ĐÃ được thể hiện qua 4 dòng nguồn (án khởi tố mới/tin báo/...) ở trên rồi,
    // hiện thêm 1 dòng tổng riêng sẽ trùng lặp số liệu (nguon vẫn cộng đủ vào soMoi.tong).
    const soMoi = {
      tong: khoiToTrucTiepSnap.size + tachVuSnap.size + chuyenDenSnap.size + traVeSnap.size,
      chuyenDenTu: chuyenDenSnap.size, traVeTu: traVeSnap.size, tachVu: tachVuSnap.size,
      ...(gd === "dieu_tra" ? nguonDem : { khoiTaoTrucTiep: khoiToTrucTiepSnap.size }),
    };

    const [chuyenDi, traDi, hoanThanhSnap, nhapVuSnap] = await Promise.all([
      db.collection("lichsuChuyenGiaiDoan").where("kyThongKe", "==", ky.id).where("loaiSuKien", "==", "chuyen_giai_doan").where("tuGiaiDoan", "==", gd).get(),
      db.collection("lichsuChuyenGiaiDoan").where("kyThongKe", "==", ky.id).where("loaiSuKien", "==", "tra_ho_so").where("tuGiaiDoan", "==", gd).get(),
      db.collection("lichsuChuyenGiaiDoan").where("kyThongKe", "==", ky.id).where("loaiSuKien", "==", "hoan_thanh").get(),
      db.collection("lichsuChuyenGiaiDoan").where("kyThongKe", "==", ky.id).where("loaiSuKien", "==", "nhap_vu").get(),
    ]);
    const hoanThanhTheoGD = { da_xet_xu: 0, chuyen_di: 0, tam_dinh_chi: 0, dinh_chi: 0, an_huy: 0 };
    const dsHoanThanhTheoGD = { da_xet_xu: [], chuyen_di: [], tam_dinh_chi: [], dinh_chi: [], an_huy: [] };
    await Promise.all(hoanThanhSnap.docs.map(async d => {
      const l = d.data();
      const [vuDoc, bcInfo] = await Promise.all([
        db.collection("vuan").doc(l.maVuAn).get(),
        layBiCanInfo(l.maVuAn),
      ]);
      if (!vuDoc.exists || vuDoc.data().coQuanThuLy !== gd) return;
      const entry = { id: vuDoc.id, ...vuDoc.data(), _log: l, _soBiCan: bcInfo.soBiCan, _toiDanhChinh: bcInfo.toiDanhChinh };
      hoanThanhTheoGD[l.hinhThucHoanThanh] = (hoanThanhTheoGD[l.hinhThucHoanThanh] || 0) + 1;
      dsHoanThanhTheoGD[l.hinhThucHoanThanh].push(entry);
    }));

    // Vụ bị nhập vào vụ khác (trangThai -> "da_nhap") cũng RA KHỎI "tồn" giống hoàn thành —
    // coQuanThuLy không đổi khi nhập vụ nên dùng làm proxy giống hoan_thanh (an toàn vì hệ
    // thống không đổi coQuanThuLy sau khi nhập). Thiếu khoản này thì tồn đầu kỳ + mới − giải
    // quyết sẽ KHÔNG khớp tồn cuối kỳ mỗi khi có nhập vụ trong kỳ (giống lỗi tách vụ đã sửa).
    let soNhapVu = 0;
    const dsNhapVu = [];
    await Promise.all(nhapVuSnap.docs.map(async d => {
      const l = d.data();
      const [vuDoc, bcInfo] = await Promise.all([
        db.collection("vuan").doc(l.maVuAn).get(),
        layBiCanInfo(l.maVuAn),
      ]);
      if (!vuDoc.exists || vuDoc.data().coQuanThuLy !== gd) return;
      soNhapVu++;
      dsNhapVu.push({ id: vuDoc.id, ...vuDoc.data(), _log: l, _soBiCan: bcInfo.soBiCan, _toiDanhChinh: bcInfo.toiDanhChinh });
    }));

    let tonCuoiKy;
    if (ky.trangThai === "da_chot" && ky.tonCuoiKy) {
      tonCuoiKy = ky.tonCuoiKy[gd] ?? 0;
    } else {
      const hienTaiSnap = await db.collection("vuan").where("coQuanThuLy", "==", gd).where("trangThai", "==", "dang_giai_quyet").get();
      tonCuoiKy = hienTaiSnap.size;
    }

    const { soVuTon, soBiCanTon, dsTon } = await tinhTonHienTaiTheoGD(gd);

    baoCao[gd] = {
      tonDauKy, tonDauBiCan, soMoi, chuyenDi: chuyenDi.size, traDi: traDi.size,
      hoanThanhTheoGD, soNhapVu, tonCuoiKy, tonCuoiBiCanKy: soBiCanTon,
      soVuTon, soBiCanTon,
      ds: {
        khoiToTrucTiep: dsKhoiToTrucTiep,
        tachVu: await vuAnTuLogDocs(tachVuSnap.docs),
        chuyenDen: await vuAnTuLogDocs(chuyenDenSnap.docs),
        traVe: await vuAnTuLogDocs(traVeSnap.docs),
        chuyenDi: await vuAnTuLogDocs(chuyenDi.docs),
        traDi: await vuAnTuLogDocs(traDi.docs),
        hoanThanh: dsHoanThanhTheoGD,
        nhapVu: dsNhapVu,
        tonHienTai: dsTon,
      },
    };
  }
  return baoCao;
}

// Chỉ tính "số tồn hiện tại" (soVuTon/soBiCanTon/dsTon) — phần LUÔN phải live dù kỳ đã chốt hay
// chưa (nhãn UI ghi rõ "tại thời điểm xem"), tách riêng để tái dùng khi đọc từ baoCaoLuu.
async function tinhTonHienTaiTheoGD(gd) {
  const vuTonSnap = await db.collection("vuan").where("coQuanThuLy", "==", gd).where("trangThai", "==", "dang_giai_quyet").get();
  const dsTon = await Promise.all(vuTonSnap.docs.map(async d => {
    const bcInfo = await layBiCanInfo(d.id);
    return { id: d.id, ...d.data(), _soBiCan: bcInfo.soBiCan, _toiDanhChinh: bcInfo.toiDanhChinh };
  }));
  const soBiCanTon = dsTon.reduce((s, v) => s + v._soBiCan, 0);
  return { soVuTon: vuTonSnap.size, soBiCanTon, dsTon };
}

// Tách phần "đông cứng" (không đổi sau khi kỳ đã chốt, trừ khi bấm "Tính lại số liệu") ra khỏi
// phần "tồn hiện tại" (luôn live) — dùng khi lưu baoCaoLuu lúc chốt/tính lại.
function tachBaoCaoLuu(baoCaoTuLog) {
  const baoCaoLuu = {};
  for (const gd of THU_TU_GIAI_DOAN) {
    const { soVuTon, soBiCanTon, ds, ...phanConLai } = baoCaoTuLog[gd];
    const { tonHienTai, ...dsConLai } = ds;
    baoCaoLuu[gd] = { ...phanConLai, ds: dsConLai };
  }
  return baoCaoLuu;
}

// Hàm nên gọi ở nơi hiển thị báo cáo (KyChiTietModal) — kỳ ĐÃ CHỐT và đã có baoCaoLuu thì dùng
// lại luôn, không quét lại lichsuChuyenGiaiDoan mỗi lần bấm xem (tinhBaoCaoKyTuLog tốn hàng chục
// query + đọc từng doc vuan một cho mỗi dòng danh sách, người dùng yêu cầu 2026-07-11 vì bấm vào
// xem lại phải chờ tính toán lại từ đầu mỗi lần). Chỉ phần "tồn hiện tại" là luôn tính lại vì bản
// chất nó biến động theo thời gian, không thuộc riêng về kỳ nào. Kỳ đang mở luôn tính trực tiếp
// vì số liệu còn thay đổi. Kỳ đã chốt nhưng chưa có baoCaoLuu (chốt trước khi có tính năng này)
// vẫn tự tính đầy đủ như cũ — không bắt buộc chạy backfill riêng.
async function tinhBaoCaoKy(ky, kyTruoc) {
  if (ky.trangThai === "da_chot" && ky.baoCaoLuu) {
    const baoCao = {};
    for (const gd of THU_TU_GIAI_DOAN) {
      const { soVuTon, soBiCanTon, dsTon } = await tinhTonHienTaiTheoGD(gd);
      baoCao[gd] = {
        ...ky.baoCaoLuu[gd],
        soVuTon, soBiCanTon,
        tonDauBiCan: (v => typeof v === "number" ? v : 0)(kyTruoc?.tonCuoiBiCan?.[gd]),
        tonCuoiBiCanKy: (v => typeof v === "number" ? v : soBiCanTon)(ky.tonCuoiBiCan?.[gd]),
        ds: { ...ky.baoCaoLuu[gd].ds, tonHienTai: dsTon },
      };
    }
    return baoCao;
  }
  return tinhBaoCaoKyTuLog(ky, kyTruoc);
}

// Tính lại & lưu baoCaoLuu cho 1 kỳ ĐÃ CHỐT — dùng khi sự kiện thuộc kỳ này bị "Sửa kỳ" sau khi
// đã chốt, số liệu đã lưu cần đồng bộ lại (xem cảnh báo ở SuaKyModal). KHÔNG đụng tới tonCuoiKy/
// tonCuoiBiCan/tonCuoiKyTheoTD (số "Còn" đã chốt là mốc cố định dùng làm tồn đầu kỳ cho kỳ sau —
// đây là trạng thái vuan thật LÚC CHỐT, độc lập với việc gán kyThongKe của từng sự kiện nên
// "Sửa kỳ" không làm sai số này, chỉ làm sai các dòng "số mới"/"đã giải quyết" đếm theo kyThongKe).
// Bug đã sửa (2026-07-13): trước đây hàm này GHI ĐÈ tonCuoiKyTheoTD/tonCuoiBiCan bằng
// tinhSnapTonTheoTD() — hàm đó luôn query LIVE trạng thái vuan HIỆN TẠI (đúng lúc gọi), không
// biết gì về thời điểm chốt LỊCH SỬ của kỳ đang tính lại. Chốt lần đầu qua chotKyBaoCao() gọi hàm
// này ĐÚNG (thời điểm chốt = thời điểm gọi, live = lịch sử). Nhưng "Tính lại số liệu" có thể chạy
// rất lâu sau khi kỳ đã đóng (khi có Sửa kỳ tác động tới kỳ cũ) — lúc đó live vuan đã trôi xa so
// với lúc kỳ đó thực sự chốt, nên ghi đè làm tonCuoiKyTheoTD của kỳ CŨ biến thành ảnh chụp HIỆN
// TẠI. Hậu quả: Biểu B10 (tinhBieu10) đọc "tồn kỳ trước" từ kyTruoc.tonCuoiKyTheoTD — nếu kyTruoc
// vừa bị "Tính lại" gần đây, cột "tồn kỳ trước" trên B10 trùng y hệt "tồn kỳ này" (đều phản ánh
// live hiện tại) dù 2 kỳ cách nhau cả tháng. Không có cách nào tái tạo ĐÚNG ảnh chụp lịch sử tại
// đây (muốn đúng phải replay log tới đúng thời điểm chốt của kỳ đó — chưa làm, xem ghi chú ở
// CLAUDE.md nếu cần bổ sung) — nên đơn giản là ĐỪNG ĐỤNG vào các field ảnh chụp này nữa, để trống
// (0 tồn trước ở B10) còn an toàn hơn hiện số sai mà trông như đúng.
async function tinhLaiBaoCaoLuu(ky, kyTruoc) {
  const baoCaoTuLog = await tinhBaoCaoKyTuLog(ky, kyTruoc);
  await db.collection("kybaocao").doc(ky.id).update({
    baoCaoLuu: tachBaoCaoLuu(baoCaoTuLog),
    thoiDiemTinhLai: new Date(),
  });
}

const SO_MOI_TRUONG_TONG = [
  "an_khoi_to_moi", "tin_bao_khoi_to_len", "an_noi_khac_chuyen_den", "phuc_hoi_dieu_tra",
  "chuyenDenTu", "traVeTu", "khoiTaoTrucTiep", "tachVu", "tong",
];
const HOAN_THANH_TRUONG_TONG = ["da_xet_xu", "chuyen_di", "tam_dinh_chi", "dinh_chi", "an_huy"];

// Gộp báo cáo nhiều kỳ liên tiếp thành 1 báo cáo tổng hợp (VD tích đủ 12 tháng ra báo cáo năm) —
// gọi lại tinhBaoCaoKy cho TỪNG kỳ nên kỳ nào đã chốt (có baoCaoLuu) sẽ dùng lại số đã lưu, không
// phải quét lại log — nhờ vậy tổng hợp cả năm cũng nhanh. "Tồn đầu kỳ" lấy từ kỳ SỚM NHẤT được
// chọn, "Tồn cuối kỳ" lấy từ kỳ MUỘN NHẤT — chỉ đúng nghĩa "tổng hợp theo khoảng thời gian" nếu
// các kỳ chọn liên tiếp nhau, không bị hở kỳ nào ở giữa (không ép buộc bằng code, để UI tự nhắc).
// dsKyChonThoDai: mảng { ky, kyTruoc } đã sắp xếp XƯA -> MỚI.
async function tinhBaoCaoTongHopNhieuKy(dsKyChonThoDai) {
  const baoCaoTungKy = await Promise.all(dsKyChonThoDai.map(({ ky, kyTruoc }) => tinhBaoCaoKy(ky, kyTruoc)));
  const gop = {};
  for (const gd of THU_TU_GIAI_DOAN) {
    const soMoi = Object.fromEntries(SO_MOI_TRUONG_TONG.map(k => [k, 0]));
    const hoanThanhTheoGD = Object.fromEntries(HOAN_THANH_TRUONG_TONG.map(k => [k, 0]));
    let chuyenDi = 0, traDi = 0, soNhapVu = 0;
    const ds = {
      khoiToTrucTiep: [], tachVu: [], chuyenDen: [], traVe: [], chuyenDi: [], traDi: [], nhapVu: [],
      hoanThanh: Object.fromEntries(HOAN_THANH_TRUONG_TONG.map(k => [k, []])),
    };
    for (const bc of baoCaoTungKy) {
      const b = bc[gd];
      for (const k of SO_MOI_TRUONG_TONG) soMoi[k] += b.soMoi[k] || 0;
      for (const k of HOAN_THANH_TRUONG_TONG) hoanThanhTheoGD[k] += b.hoanThanhTheoGD[k] || 0;
      chuyenDi += b.chuyenDi; traDi += b.traDi; soNhapVu += b.soNhapVu;
      ds.khoiToTrucTiep.push(...b.ds.khoiToTrucTiep);
      ds.tachVu.push(...b.ds.tachVu);
      ds.chuyenDen.push(...b.ds.chuyenDen);
      ds.traVe.push(...b.ds.traVe);
      ds.chuyenDi.push(...b.ds.chuyenDi);
      ds.traDi.push(...b.ds.traDi);
      ds.nhapVu.push(...b.ds.nhapVu);
      for (const k of HOAN_THANH_TRUONG_TONG) ds.hoanThanh[k].push(...b.ds.hoanThanh[k]);
    }
    const dauKy = baoCaoTungKy[0][gd];
    const cuoiKy = baoCaoTungKy[baoCaoTungKy.length - 1][gd];
    gop[gd] = {
      tonDauKy: dauKy.tonDauKy, tonCuoiKy: cuoiKy.tonCuoiKy,
      soMoi, chuyenDi, traDi, hoanThanhTheoGD, soNhapVu,
      soVuTon: cuoiKy.soVuTon, soBiCanTon: cuoiKy.soBiCanTon,
      ds: { ...ds, tonHienTai: cuoiKy.ds.tonHienTai },
    };
  }
  return gop;
}

function HangBaoCaoTieuDe({ nhan }) {
  return <tr className="bg-slate-50"><td colSpan={4} className="p-2 text-xs font-semibold text-slate-500">{nhan}</td></tr>;
}

// Modal xem/sửa chi tiết 1 vụ án (dùng ở lv3 từ báo cáo kỳ)
function ChiTietVuAnModal({ vuAnId, onDong }) {
  const [vuAn, setVuAn] = useState(null);
  const [biCanList, setBiCanList] = useState([]);
  const [lichSu, setLichSu] = useState([]);
  const [editMode, setEditMode] = useState(false);
  const [ed, setEd] = useState({});          // editData — tên ngắn để dùng inline
  const [hienModalKy, setHienModalKy] = useState(false);
  const [dangLuu, setDangLuu] = useState(false);
  const [loi, setLoi] = useState("");
  const dsCanBo = useDanhSachCanBo();

  useEffect(() => {
    if (!vuAnId) return;
    const u1 = db.collection("vuan").doc(vuAnId).onSnapshot(doc => {
      setVuAn(doc.exists ? { id: doc.id, ...doc.data() } : null);
    });
    const u2 = db.collection("bican").where("maVuAn", "==", vuAnId).onSnapshot(
      snap => setBiCanList(snap.docs.map(d => ({ id: d.id, ...d.data() })))
    );
    const u3 = db.collection("lichsuChuyenGiaiDoan").where("maVuAn", "==", vuAnId)
      .orderBy("thoiDiemGhi", "desc").onSnapshot(
        snap => setLichSu(snap.docs.map(d => ({ id: d.id, ...d.data() })))
      );
    return () => { u1(); u2(); u3(); };
  }, [vuAnId]);

  function batDauSua() {
    if (!vuAn) return;
    setEd({
      maNganhCap: vuAn.maNganhCap || "",
      tenVu: vuAn.tenVu || "",
      nguon: vuAn.nguon || "an_khoi_to_moi",
      nguonChiTiet: vuAn.nguonChiTiet || "",
      soQdKtva: vuAn.soQdKtva || "",
      ngayQdKtva: toInputDate(vuAn.ngayQdKtva),
      hanDieuTra: toInputDate(vuAn.hanDieuTra),
      ksvChinh: vuAn.ksvChinh || "",
      ksvHoTro: (vuAn.ksvHoTro || []).join(", "),
      dtvCbdt: vuAn.dtvCbdt || "",
      donViThuLy: vuAn.donViThuLy || "",
      uyQuyenXetXu: vuAn.uyQuyenXetXu || "",
      anDiem: !!vuAn.anDiem,
      phienToaRutKN: !!vuAn.phienToaRutKN,
      dieuLuat: vuAn.dieuLuat || "",
      ghiChu: vuAn.ghiChu || "",
    });
    setLoi("");
    setEditMode(true);
  }

  function huyEdit() { setEditMode(false); setEd({}); setLoi(""); }

  const set = (f, v) => setEd(p => ({ ...p, [f]: v }));

  async function onXacNhanKy(kyId) {
    setHienModalKy(false);
    setDangLuu(true);
    try {
      if (!ed.tenVu.trim()) throw new Error("Cần nhập tên vụ.");
      if (!ed.ngayQdKtva) throw new Error("Cần nhập ngày QĐ khởi tố VA.");
      const updates = {
        maNganhCap: ed.maNganhCap.trim() || null,
        tenVu: ed.tenVu.trim(),
        nguon: ed.nguon,
        nguonChiTiet: ed.nguon === "an_noi_khac_chuyen_den" ? ed.nguonChiTiet.trim() : "",
        soQdKtva: ed.soQdKtva.trim(),
        ngayQdKtva: fromInputDate(ed.ngayQdKtva),
        hanDieuTra: ed.hanDieuTra ? fromInputDate(ed.hanDieuTra) : null,
        ksvChinh: ed.ksvChinh.trim(),
        ksvHoTro: ed.ksvHoTro.split(",").map(s => s.trim()).filter(Boolean),
        dtvCbdt: ed.dtvCbdt.trim(),
        donViThuLy: ed.donViThuLy.trim(),
        uyQuyenXetXu: ed.uyQuyenXetXu.trim(),
        anDiem: ed.anDiem,
        phienToaRutKN: ed.phienToaRutKN,
        ghiChu: ed.ghiChu.trim(),
        ngayCapNhat: new Date(),
        nguoiCapNhatCuoi: auth.currentUser?.email || "",
      };
      if (biCanList.length === 0) updates.dieuLuat = ed.dieuLuat.trim();
      await db.collection("vuan").doc(vuAnId).update(updates);
      await db.collection("lichsuChuyenGiaiDoan").add({
        maVuAn: vuAnId, loaiSuKien: "sua_thong_tin",
        thoiDiemGhi: firebase.firestore.FieldValue.serverTimestamp(),
        ngaySuKien: new Date().toISOString().slice(0, 10),
        kyThongKe: kyId, ghiChu: "Cập nhật thông tin vụ án",
        nguoiThucHien: auth.currentUser?.email || "",
        lichSuSuaKy: [], soQuyetDinh: "",
      });
      // Tính lại baoCaoLuu nếu kỳ đã chốt (nguon ảnh hưởng phân loại soMoi)
      try {
        const kyDoc = await db.collection("kybaocao").doc(kyId).get();
        if (kyDoc.exists && kyDoc.data().trangThai === "da_chot") {
          const ky = { id: kyDoc.id, ...kyDoc.data() };
          const allSnap = await db.collection("kybaocao").orderBy("ngayBatDau").get();
          const sorted = allSnap.docs.map(d => ({ id: d.id, ...d.data() }));
          const idx = sorted.findIndex(k => k.id === kyId);
          const kyTruoc = idx > 0 ? sorted[idx - 1] : null;
          await tinhLaiBaoCaoLuu(ky, kyTruoc);
        }
      } catch (e) { console.warn("Không tính lại được baoCaoLuu:", e); }
      addToast("Đã lưu thay đổi");
      setEditMode(false);
      setEd({});
    } catch (err) {
      setLoi("Lỗi: " + err.message);
    } finally {
      setDangLuu(false);
    }
  }

  // Phần form edit — dùng lại oInput và Truong giống SuaVuAnForm
  const FormSua = () => (
    <div className="p-5 border-b border-slate-100">
      <div className="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 mb-3">
        Chỉ sửa thông tin thường. Muốn đổi giai đoạn/trạng thái dùng các nút hành động ở Danh sách vụ án.
      </div>
      <div className="grid grid-cols-2 gap-3">
        <Truong nhan="Mã ngành cấp (nếu có)">
          <input value={ed.maNganhCap} onChange={e => set("maNganhCap", e.target.value)} className={oInput} />
        </Truong>
        <Truong nhan="Tên vụ">
          <input value={ed.tenVu} onChange={e => set("tenVu", e.target.value)} className={oInput} />
        </Truong>
        <Truong nhan="Nguồn">
          <select value={ed.nguon} onChange={e => set("nguon", e.target.value)} className={oInput}>
            <option value="an_khoi_to_moi">Án khởi tố mới</option>
            <option value="tin_bao_khoi_to_len">Tin báo khởi tố lên</option>
            <option value="an_noi_khac_chuyen_den">Án nơi khác chuyển đến</option>
            <option value="phuc_hoi_dieu_tra">Phục hồi điều tra</option>
          </select>
        </Truong>
        {ed.nguon === "an_noi_khac_chuyen_den" && (
          <Truong nhan="Chi tiết nguồn">
            <input value={ed.nguonChiTiet} onChange={e => set("nguonChiTiet", e.target.value)} className={oInput} />
          </Truong>
        )}
        <Truong nhan="Số QĐ khởi tố VA">
          <input value={ed.soQdKtva} onChange={e => set("soQdKtva", e.target.value)} className={oInput} />
        </Truong>
        <Truong nhan="Ngày QĐ khởi tố VA">
          <NhapNgay value={ed.ngayQdKtva} onChange={e => set("ngayQdKtva", e.target.value)} className={oInput} />
        </Truong>
        <Truong nhan="Hạn điều tra">
          <NhapNgay value={ed.hanDieuTra} onChange={e => set("hanDieuTra", e.target.value)} className={oInput} />
        </Truong>
        <Truong nhan="KSV chính">
          <input value={ed.ksvChinh} onChange={e => set("ksvChinh", e.target.value)} list="dl-ksv-ctvam" className={oInput} />
        </Truong>
        <Truong nhan="KSV hỗ trợ (cách nhau dấu phẩy)">
          <input value={ed.ksvHoTro} onChange={e => set("ksvHoTro", e.target.value)} list="dl-ksv-ctvam" className={oInput} />
        </Truong>
        <Truong nhan="ĐTV / CBĐT">
          <input value={ed.dtvCbdt} onChange={e => set("dtvCbdt", e.target.value)} list="dl-dtv-ctvam" className={oInput} />
        </Truong>
        <Truong nhan="Đơn vị thụ lý">
          <input value={ed.donViThuLy} onChange={e => set("donViThuLy", e.target.value)} className={oInput} />
        </Truong>
        <Truong nhan="Uỷ quyền xét xử">
          <input value={ed.uyQuyenXetXu} onChange={e => set("uyQuyenXetXu", e.target.value)} className={oInput} />
        </Truong>
        {biCanList.length === 0 && (
          <Truong nhan="Điều luật">
            <input value={ed.dieuLuat} onChange={e => set("dieuLuat", e.target.value)} className={oInput} />
          </Truong>
        )}
        <div className="flex items-center gap-4 mt-1">
          <label className="flex items-center gap-2 text-sm">
            <input type="checkbox" checked={ed.anDiem} onChange={e => set("anDiem", e.target.checked)} /> Án điểm
          </label>
          <label className="flex items-center gap-2 text-sm">
            <input type="checkbox" checked={ed.phienToaRutKN} onChange={e => set("phienToaRutKN", e.target.checked)} /> Phiên toà rút kinh nghiệm
          </label>
        </div>
        <datalist id="dl-ksv-ctvam">{dsCanBo.filter(c => c.vaiTro === "ksv").map(c => <option key={c.id} value={c.hoTen} />)}</datalist>
        <datalist id="dl-dtv-ctvam">{dsCanBo.filter(c => c.vaiTro === "dtv").map(c => <option key={c.id} value={c.hoTen} />)}</datalist>
      </div>
      <div className="mt-3">
        <Truong nhan="Ghi chú">
          <textarea rows={2} value={ed.ghiChu} onChange={e => set("ghiChu", e.target.value)} className={oInput} />
        </Truong>
      </div>
    </div>
  );

  return (<>
    <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
      <div className="bg-white rounded-xl shadow-xl w-[720px] max-w-[96vw] max-h-[90vh] flex flex-col">
        {/* Header */}
        <div className="flex items-center justify-between px-5 py-4 border-b border-slate-200 shrink-0 gap-2">
          <div className="flex-1 min-w-0">
            {vuAn && <div className="text-xs text-slate-400 mb-0.5">{hienThiMa(vuAn)}</div>}
            <div className="text-base font-semibold truncate">{vuAn?.tenVu || "Đang tải..."}</div>
          </div>
          <div className="flex items-center gap-2 shrink-0">
            {vuAn && !editMode && (
              <button onClick={batDauSua} className="px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-50 hover:bg-indigo-100 text-indigo-700">✏️ Sửa</button>
            )}
            {editMode && (<>
              <button onClick={huyEdit} className="px-3 py-1.5 rounded-lg text-xs font-medium text-red-600 hover:bg-red-50">Huỷ</button>
              <button onClick={() => { setLoi(""); setHienModalKy(true); }} disabled={dangLuu}
                      className="px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 hover:bg-indigo-700 text-white disabled:opacity-50">
                {dangLuu ? "Đang lưu..." : "Lưu thay đổi"}
              </button>
            </>)}
            <button onClick={onDong} className="text-red-400 hover:text-red-600 text-sm font-medium">Đóng ✕</button>
          </div>
        </div>
        {loi && <div className="px-5 py-1.5 bg-red-50 border-b border-red-200 text-xs text-red-700">{loi}</div>}
        {!vuAn ? (
          <div className="flex-1 flex items-center justify-center text-slate-400 text-sm">Đang tải...</div>
        ) : (
          <div className="overflow-y-auto flex-1">
            {/* Thông tin: chế độ xem hoặc sửa */}
            {editMode ? <FormSua /> : (
              <div className="p-5 border-b border-slate-100">
                <table className="w-full text-sm border border-slate-200 rounded-lg overflow-hidden">
                  <tbody>
                    <HangThongTin items={[["Giai đoạn", <Badge mau={MAU_GIAI_DOAN[vuAn.coQuanThuLy]}>{NHAN_GIAI_DOAN[vuAn.coQuanThuLy]}</Badge>]]} />
                    <HangThongTin items={[["Trạng thái", <Badge mau={MAU_TRANG_THAI[vuAn.trangThai]}>{NHAN_TRANG_THAI[vuAn.trangThai]}</Badge>]]} />
                    <HangThongTin items={[["Nguồn", NHAN_NGUON[vuAn.nguon] || vuAn.nguon]]} />
                    {vuAn.nguonChiTiet && <HangThongTin items={[["Chi tiết nguồn", vuAn.nguonChiTiet]]} />}
                    <HangThongTin items={[["KSV chính", vuAn.ksvChinh || "—"]]} />
                    <HangThongTin items={[["KSV hỗ trợ", (vuAn.ksvHoTro || []).join(", ") || "—"]]} />
                    <HangThongTin items={[["ĐTV/CBĐT", vuAn.dtvCbdt || "—"]]} />
                    <HangThongTin items={[["Điều luật", vuAn.dieuLuat || "—"]]} />
                    <HangThongTin items={[["Số QĐ KTVA", vuAn.soQdKtva || "—"]]} />
                    <HangThongTin items={[["Ngày QĐ KTVA", fmtDate(vuAn.ngayQdKtva)]]} />
                    <HangThongTin items={[["Hạn điều tra", fmtDate(vuAn.hanDieuTra)]]} />
                    <HangThongTin items={[["Đơn vị thụ lý", vuAn.donViThuLy || "—"]]} />
                    <HangThongTin items={[["Uỷ quyền xét xử", vuAn.uyQuyenXetXu || "—"]]} />
                    {(vuAn.anDiem || vuAn.phienToaRutKN) && (
                      <HangThongTin items={[["Đặc điểm", [vuAn.anDiem && "Án điểm", vuAn.phienToaRutKN && "Phiên toà rút KN"].filter(Boolean).join(", ")]]} />
                    )}
                    <HangThongTin items={[["Ghi chú", vuAn.ghiChu || "—"]]} />
                  </tbody>
                </table>
              </div>
            )}
            {/* Bị can */}
            <div className="p-5 border-b border-slate-100">
              <div className="text-sm font-medium text-slate-600 mb-2">Bị can ({biCanList.length})</div>
              {biCanList.length === 0 ? (
                <div className="text-sm text-slate-400">Chưa có bị can nào.</div>
              ) : (
                <div className="border border-slate-200 rounded-lg overflow-hidden">
                  <table className="w-full text-xs">
                    <thead className="bg-slate-50 text-slate-500">
                      <tr>
                        <th className="text-left p-2">Họ tên</th>
                        <th className="text-left p-2">Năm sinh</th>
                        <th className="text-left p-2">Tội danh</th>
                        <th className="text-left p-2">Biện pháp</th>
                      </tr>
                    </thead>
                    <tbody>
                      {biCanList.map((bc, i) => (
                        <tr key={bc.id} className={`border-t border-slate-100 ${i % 2 === 0 ? "bg-white" : "bg-slate-50/70"}`}>
                          <td className="p-2 font-medium text-slate-700">{bc.hoTen}</td>
                          <td className="p-2">{bc.namSinh || "—"}</td>
                          <td className="p-2">{(bc.toiDanh || []).filter(Boolean).join(", ") || "—"}</td>

                            <Badge mau={bc.bienPhapNganChan === "giam" ? "bg-red-100 text-red-700" : "bg-slate-100 text-slate-600"}>
                              {bc.bienPhapNganChan === "giam" ? "Tạm giam" : "Tại ngoại"}
                            </Badge>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
            {/* Lịch sử */}
            <div className="p-5">
              <div className="text-sm font-medium text-slate-600 mb-2">Lịch sử</div>
              {lichSu.length === 0 ? (
                <div className="text-sm text-slate-400">Chưa có sự kiện nào.</div>
              ) : (
                <div className="border border-slate-200 rounded-lg overflow-hidden">
                  <table className="w-full text-xs">
                    <thead className="bg-slate-50 text-slate-500">
                      <tr>
                        <th className="text-left p-2 w-24">Ngày</th>
                        <th className="text-left p-2">Sự kiện</th>
                        <th className="text-left p-2">Số QĐ</th>
                        <th className="text-left p-2">Ghi chú</th>
                      </tr>
                    </thead>
                    <tbody>
                      {lichSu.map((ls, i) => (
                        <tr key={ls.id} className={`border-t border-slate-100 ${i % 2 === 0 ? "bg-white" : "bg-slate-50/70"}`}>
                          <td className="p-2 text-slate-400 whitespace-nowrap">{fmtDate(ls.ngaySuKien)}</td>
                          <td className="p-2"><Badge>{NHAN_SU_KIEN[ls.loaiSuKien] || ls.loaiSuKien}</Badge></td>
                          <td className="p-2 text-slate-500 whitespace-nowrap">{ls.soQuyetDinh || "—"}</td>
                          <td className="p-2 text-slate-500">{ls.ghiChu || "—"}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          </div>
        )}
      </div>
    </div>
    <ModalXacNhanKy open={hienModalKy} onXacNhan={onXacNhanKy} onHuy={() => setHienModalKy(false)} />
  </>);
}

// Modal chi tiết số liệu: nhóm theo tội danh (lv1) → từng vụ cụ thể (lv2)
// dsList đã có _soBiCan và _toiDanhChinh từ lúc tính báo cáo — không fetch thêm
function ChiTietSoLieuModal({ nhan, dsList, onDong }) {
  const [moNhom, setMoNhom] = useState({});
  const [xemVuAnId, setXemVuAnId] = useState(null);

  const nhomTheoToiDanh = React.useMemo(() => {
    const m = {};
    for (const v of dsList) {
      const td = v._toiDanhChinh || "(Chưa có tội danh)";
      if (!m[td]) m[td] = [];
      m[td].push(v);
    }
    return Object.entries(m).sort((a, b) => b[1].length - a[1].length);
  }, [dsList]);

  const tongBC = dsList.reduce((s, v) => s + (v._soBiCan || 0), 0);

  return (<>
    <KhungModalHanhDong tieuDe="Chi tiết số liệu">
      <div className="text-sm font-semibold text-slate-700 mb-1">{nhan}</div>
      <div className="text-xs text-slate-500 mb-4">
        <span className="font-medium text-slate-700">{dsList.length} vụ</span>
        {" / "}
        <span className="font-medium text-orange-500">{tongBC} bị can</span>
      </div>
      <div className="space-y-2 max-h-[400px] overflow-y-auto mb-4">
        {nhomTheoToiDanh.map(([td, vuList]) => {
          const bcNhom = vuList.reduce((s, v) => s + (v._soBiCan || 0), 0);
          const daMo = !!moNhom[td];
          return (
            <div key={td} className="border border-slate-200 rounded-lg overflow-hidden">
              <button
                className="w-full flex items-center justify-between p-2 bg-slate-50 hover:bg-slate-100 text-left"
                onClick={() => setMoNhom(s => ({ ...s, [td]: !s[td] }))}>
                <span className="text-sm font-medium text-slate-700 truncate pr-2">{td || "—"}</span>
                <span className="text-xs shrink-0">
                  <span className="text-slate-600">{vuList.length} vụ</span>
                  {" / "}
                  <span className="text-orange-500 font-medium">{bcNhom} BC</span>
                  {" "}{daMo ? "▲" : "▼"}
                </span>
              </button>
              {daMo && (
                <div className="divide-y divide-slate-100">
                  {vuList.map(v => (
                    <button key={v.id} className="w-full px-3 py-2 text-left hover:bg-indigo-50 transition-colors"
                            onClick={() => setXemVuAnId(v.id)}>
                      <div className="text-xs font-medium text-indigo-700 hover:underline">{hienThiMa(v)} — {v.tenVu || "—"}</div>
                      <div className="text-xs text-slate-500 mt-0.5">
                        KSV: {v.ksvChinh || "—"} · <span className="text-orange-500">{v._soBiCan || 0} BC</span>
                        {v._log?.ngaySuKien ? ` · ${fmtDate(v._log.ngaySuKien)}` : ""}
                        {v._log?.soQuyetDinh ? ` · Số QĐ: ${v._log.soQuyetDinh}` : ""}
                      </div>
                    </button>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
      <div className="flex justify-end">
        <button onClick={onDong} className="px-4 py-2 text-sm rounded-lg bg-red-50 hover:bg-red-100 text-red-600">Đóng</button>
      </div>
    </KhungModalHanhDong>
    {xemVuAnId && <ChiTietVuAnModal vuAnId={xemVuAnId} onDong={() => setXemVuAnId(null)} />}
  </>);
}

// HangBaoCao: hiển thị "X vụ / Y BC" khi có ds hoặc layBiCan, bấm mở ChiTietSoLieuModal
function HangBaoCao({ nhan, data, lay, layDs, layBiCan, damNet, onMoChiTiet }) {
  return (
    <tr className={`border-t border-slate-100 ${damNet ? "font-semibold bg-indigo-50/40" : ""}`}>
      <td className="p-2 text-slate-600">{nhan}</td>
      {THU_TU_GIAI_DOAN.map(gd => {
        const val = lay(data[gd]) ?? 0;
        const ds = layDs ? layDs(data[gd]) : null;
        // layBiCan: truyền số BC trực tiếp (VD tồn đầu/cuối kỳ — không có ds nhưng có BC snapshot)
        const soBC = layBiCan
          ? (layBiCan(data[gd]) ?? null)
          : (ds ? ds.reduce((s, v) => s + (v._soBiCan || 0), 0) : null);
        const coThe = !layBiCan && ds && ds.length > 0 && onMoChiTiet;
        return (
          <td key={gd} className="p-2 text-right tabular-nums">
            {coThe ? (
              <button className="text-indigo-700 hover:underline w-full text-right" onClick={() => onMoChiTiet(`${nhan} — ${NHAN_GIAI_DOAN[gd]}`, ds)}>
                {val} vụ
                {soBC !== null && <span className="text-orange-500 font-normal"> / {soBC} BC</span>}
              </button>
            ) : layBiCan && soBC !== null ? (
              <span>{val} vụ<span className="text-orange-500 font-normal"> / {soBC} BC</span></span>
            ) : soBC !== null && ds && ds.length > 0 ? (
              <span>{val} vụ<span className="text-orange-500"> / {soBC} BC</span></span>
            ) : (
              <span>{val}</span>
            )}
          </td>
        );
      })}
    </tr>
  );
}

// Bảng báo cáo chi tiết theo giai đoạn — dùng chung cho báo cáo 1 kỳ (KyChiTietModal) VÀ báo
// cáo tổng hợp nhiều kỳ (TongHopNhieuKyModal). Bấm vào ô số → mở chi tiết vụ theo tội danh.

  const H = ({ nhan, lay, layDs, damNet }) => (
    <HangBaoCao
      nhan={nhan} data={baoCao} lay={lay} layDs={layDs} damNet={damNet}
      onMoChiTiet={layDs ? (nhanGD, ds) => setChiTiet({ nhan: nhanGD, ds }) : null}
    />
  );

  return (
    <>
      <div className="border border-slate-200 rounded-lg overflow-hidden">
        <table className="w-full text-sm">
          <thead className="bg-slate-100 text-slate-600">
            <tr>
              <th className="text-left p-2"></th>
              {THU_TU_GIAI_DOAN.map(gd => <th key={gd} className="text-right p-2">{NHAN_GIAI_DOAN[gd]}</th>)}
            </tr>
          </thead>
          <tbody>
            <H nhan="Tồn đầu kỳ" lay={b => b.tonDauKy} layBiCan={b => b.tonDauBiCan} damNet />
            <HangBaoCaoTieuDe nhan="Số mới" />
            <H nhan="— Án khởi tố mới"
              lay={b => b.soMoi.an_khoi_to_moi}
              layDs={b => b.ds?.khoiToTrucTiep?.filter(v => v.nguon === "an_khoi_to_moi")} />
            <H nhan="— Tin báo khởi tố lên"
              lay={b => b.soMoi.tin_bao_khoi_to_len}

            <H nhan="— Trả hồ sơ (ra khỏi giai đoạn này)" lay={b => b.traDi} layDs={b => b.ds?.traDi} />

            <H nhan="— Tạm đình chỉ" lay={b => b.hoanThanhTheoGD.tam_dinh_chi} layDs={b => b.ds?.hoanThanh?.tam_dinh_chi} />
            <H nhan="— Đình chỉ" lay={b => b.hoanThanhTheoGD.dinh_chi} layDs={b => b.ds?.hoanThanh?.dinh_chi} />
            <H nhan="— Án huỷ" lay={b => b.hoanThanhTheoGD.an_huy} layDs={b => b.ds?.hoanThanh?.an_huy} />
            <H nhan="— Nhập vào vụ khác" lay={b => b.soNhapVu} layDs={b => b.ds?.nhapVu} />
            <H nhan="Tồn cuối kỳ" lay={b => b.tonCuoiKy} layBiCan={b => b.tonCuoiBiCanKy} damNet />
            <HangBaoCaoTieuDe nhan="Số tồn hiện tại (tại thời điểm xem)" />
            <H nhan="— Số vụ" lay={b => b.soVuTon} layDs={b => b.ds?.tonHienTai} />
            <H nhan="— Số bị can" lay={b => b.soBiCanTon} />
          </tbody>
        </table>
      </div>
      {chiTiet && (
        <ChiTietSoLieuModal nhan={chiTiet.nhan} dsList={chiTiet.ds} onDong={() => setChiTiet(null)} />
      )}
    </>
  );
}

// Helper: gom tất cả vụ IDs có mặt trong 1 object báo cáo kỳ
function collectVuIdsFromBaoCao(baoCao) {
  const ids = new Set();
  for (const gd of THU_TU_GIAI_DOAN) {
    const d = baoCao[gd]?.ds || {};
    ["khoiToTrucTiep","tachVu","chuyenDen","traVe","chuyenDi","traDi","nhapVu","tonHienTai"]
      .forEach(k => (d[k] || []).forEach(v => ids.add(v.id)));
    for (const ht of HOAN_THANH_TRUONG_TONG) (d.hoanThanh?.[ht] || []).forEach(v => ids.add(v.id));
  }
  return [...ids];
}

// Helper: fetch bị can theo danh sách vụ IDs, chia batch 30 (giới hạn Firestore "in")
async function fetchBiCanTheoVuIds(vuIds) {
  if (!vuIds.length) return {};
  const all = [];
  for (let i = 0; i < vuIds.length; i += 30) {
    const snap = await db.collection("bican").where("maVuAn", "in", vuIds.slice(i, i + 30)).get();
    snap.docs.forEach(d => all.push({ id: d.id, ...d.data() }));
  }
  const byVu = {};
  all.forEach(bc => { (byVu[bc.maVuAn] = byVu[bc.maVuAn] || []).push(bc); });
  return byVu;
}

// Helper: fetch kỳ thống kê THẬT của riêng từng bị can (từ sự kiện log khoi_to_bican, KHÔNG
// phải field loaiKhoiTo — bị can bổ sung thêm sau vào 1 vụ cũ có kỳ khởi tố khác hẳn kỳ của vụ,
// và log là nguồn sự thật duy nhất, đúng nguyên tắc thiết kế #1). Trả về Map<maBiCan, kyId>.
// Chia batch 30 giống fetchBiCanTheoVuIds; lọc loaiSuKien phía client để khỏi cần thêm composite
// index (đã có sẵn index maVuAn + thoiDiemGhi, không có index cho maVuAn + loaiSuKien).
async function fetchKyKhoiToBiCan(vuIds) {
  const map = new Map();
  if (!vuIds.length) return map;
  for (let i = 0; i < vuIds.length; i += 30) {
    const snap = await db.collection("lichsuChuyenGiaiDoan")
      .where("maVuAn", "in", vuIds.slice(i, i + 30)).get();
    snap.docs.forEach(d => {
      const e = d.data();
      if (e.loaiSuKien === "khoi_to_bican" && e.maBiCan) map.set(e.maBiCan, e.kyThongKe || null);
    });
  }
  return map;
}

// SheetJS bản CDN đang dùng (miễn phí) KHÔNG ghi được style (đã kiểm chứng — mở file .xlsx xuất
// ra ra thì cellXfs luôn rỗng dù có set cell.s). Báo cáo tháng cần wrap text mặc định cho dễ đọc
// nên dùng riêng ExcelJS (script CDN riêng, xem <head>) chỉ cho hàm này — phần Import/Xuất Excel
// khác trong app vẫn dùng XLSX (SheetJS) như cũ, không đụng tới.
const DO_RONG_COT_CHUNG = [16, 30, 14, 7, 28, 18, 18, 26, 12, 28];
// iColNhom: chỉ số cột dùng làm khoá nhóm (VD 0 = Mã vụ) — khi giá trị đổi → đổi màu nền.
// Dùng cho các sheet flat có nhiều dòng bị can/vụ xen kẽ, giúp dễ phân biệt từng vụ.
function themSheetDanhSach(wb, tenSheet, header, rows, doRongCot, iColNhom = -1) {
  const sheet = wb.addWorksheet(tenSheet.slice(0, 31));
  sheet.columns = header.map((h, i) => ({ width: (doRongCot && doRongCot[i]) || 20 }));
  const hangTieuDe = sheet.addRow(header);
  hangTieuDe.eachCell(cell => {
    cell.font = { bold: true };
    cell.alignment = { wrapText: true, vertical: "top" };
    cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFE2E8F0" } };
  });
  let bandIdx = 0;
  let prevKey = undefined;
  // Xen kẽ 2 màu: trắng (band 0) và xanh nhạt (band 1)
  const BAND_FILL = [null, { type: "pattern", pattern: "solid", fgColor: { argb: "FFE8F4FD" } }];
  for (const r of rows) {
    if (iColNhom >= 0) {
      const key = r[iColNhom];
      if (prevKey !== undefined && key !== prevKey) bandIdx = 1 - bandIdx;
      prevKey = key;
    }
    const hang = sheet.addRow(r);
    hang.eachCell(cell => {
      cell.alignment = { wrapText: true, vertical: "top" };
      if (iColNhom >= 0 && BAND_FILL[bandIdx]) cell.fill = BAND_FILL[bandIdx];
    });
  }
  sheet.views = [{ state: "frozen", ySplit: 1 }];
  return sheet;
}

// Tính Biểu B10 từ baoCao + biCanByVu + danh mục tội danh.
// Trả về { rows, canhBao, vuChuaDL } — rows đã sắp xếp theo thuTuHienThi, đã bỏ dòng toàn 0.
// Mỗi row: { D, tenToiDanh, thuTu, vals[] } (88 giá trị số, xem B10_HEADER).
// vuChuaDL: { dieu_tra, truy_to, xet_xu } — mảng vụ trong tồn hiện tại chưa xác định được điều luật
// (nguyên nhân gây lệch âm giữa B10 và báo cáo). Lệch dương = đúng thiết kế (1 vụ nhiều tội).
// canhBao: chỉ cảnh báo khi có vụ chưa có điều luật (lệch âm thực sự), không cảnh báo lệch dương.
function tinhBieu10(ky, kyTruoc, baoCao, biCanByVu, danhMuc, bcKyKhoiToMap = new Map(), kyIdSetTrongBaoCao = null) {
  // Mặc định (không truyền) = báo cáo 1 kỳ, coi "trong kỳ này" = đúng ky.id. Báo cáo tổng hợp
  // nhiều kỳ (TongHopNhieuKyModal) truyền set đầy đủ id các kỳ đã gộp — xem xuatBaoCaoThangExcel.
  const _kyIdSet = kyIdSetTrongBaoCao || new Set([ky.id]);
  const namKy = ky.ngayBatDau
    ? new Date(ky.ngayBatDau.seconds ? ky.ngayBatDau.seconds * 1000 : ky.ngayBatDau).getFullYear()
    : new Date().getFullYear();

  // Lookup ngược: tên tội danh (lowercase) → mã điều luật — dùng khi bc.dieuLuatBC chưa điền
  const danhMucByTen = new Map(danhMuc.map(d => [d.tenToiDanh.toLowerCase(), d.dieuLuat]));

  // Chuẩn hóa key điều luật: alias "BLHS 2015" → "BLHS 2025" (cùng 1 bộ luật, chỉ đổi phiên bản hợp nhất)
  // để dữ liệu cũ (dieuLuatBC = "Điều 173 BLHS 2015") và dữ liệu mới ("...BLHS 2025") cùng nhóm B10.
  const normDL = (dl) => (dl || "").replace(/\bBLHS\s+2015\b/g, "BLHS 2025");

  // Normalize tonCuoiKyTheoTD của kỳ trước: key cũ có thể là tên tội danh thay vì code chuẩn
  const tonTD_truocRaw = kyTruoc?.tonCuoiKyTheoTD || {};
  const tonTD_truoc = {};
  for (const [k, v] of Object.entries(tonTD_truocRaw)) {
    const normKey = normDL(danhMucByTen.get(k.toLowerCase()) || k);
    tonTD_truoc[normKey] = v;
  }

  // tonCuoiKyTheoTD của kỳ hiện tại — dùng cho "Tồn kỳ này" khi kỳ đã chốt (snapshot đúng thời điểm
  // chốt). Nếu chưa có (kỳ đang mở hoặc chưa chạy tinhLaiBaoCaoLuu) thì dùng live tonHienTai.
  const kyTonTD_raw = ky.tonCuoiKyTheoTD || null;
  const kyTonTD = kyTonTD_raw ? {} : null;
  if (kyTonTD_raw) {
    for (const [k, v] of Object.entries(kyTonTD_raw)) {
      const normKey = normDL(danhMucByTen.get(k.toLowerCase()) || k);
      kyTonTD[normKey] = v;
    }
  }

  // Lấy key điều luật của bị can:
  //   1. dieuLuatBC[0] nếu có (code chuẩn, VD "Điều 173 BLHS 2025" hoặc legacy "...BLHS 2015")
  //   2. Tra ngược tên tội danh trong catalog → lấy code chuẩn
  //   3. Fallback: dùng thẳng toiDanh[0] làm key (tên tội danh)
  const getDL = (bc) => normDL(
    bc.dieuLuatBC?.[0] ||
    danhMucByTen.get((bc.toiDanh?.[0] || "").toLowerCase()) ||
    bc.toiDanh?.[0] ||
    ""
  );

  // Chuẩn hoá 1 tên/code từ vuan.dieuLuat sang key chuẩn (giống getDL nhưng cho chuỗi tên)
  const normTen = (nm) => normDL(danhMucByTen.get(nm.toLowerCase()) || nm);

  // Điều luật CHÍNH của vụ: BC ban_dau (hoặc BC đầu tiên nếu không có), vụ 0 BC lấy dieuLuat[0].
  // Mỗi vụ chỉ đếm 1 lần duy nhất dưới đúng tội danh chính → tổng cột B10 = đúng tổng danh sách.
  const vuPrimaryDL = (vu) => {
    const bcs = biCanByVu[vu.id] || [];
    if (!bcs.length) return normTen((vu.dieuLuat || "").split(";")[0].trim()) || "";
    const bcChinh = bcs.find(bc => bc.loaiKhoiTo === "ban_dau") || bcs[0];
    return getDL(bcChinh);
  };
  const vuCoD = (vuArr, D) => vuArr.filter(vu => vuPrimaryDL(vu) === D);

  // BC trong vụ với getDL(bc)==D, kèm _namKTVA của vụ đó
  const bcCoD = (vuArr, D) => {
    const result = [];
    for (const vu of vuArr) {
      const nk = vu.ngayQdKtva
        ? new Date(vu.ngayQdKtva.seconds ? vu.ngayQdKtva.seconds * 1000 : vu.ngayQdKtva).getFullYear()
        : namKy;
      for (const bc of (biCanByVu[vu.id] || [])) {
        if (getDL(bc) === D) result.push({ ...bc, _namKTVA: nk });
      }
    }
    return result;
  };

  const demTuoi = (bcArr, nhom) =>
    bcArr.filter(bc => bc.loaiBiCan !== "phap_nhan" && tinhNhomTuoi(bc.namSinh, bc._namKTVA) === nhom).length;
  const demField = (bcArr, field, val) =>
    bcArr.filter(bc => bc.loaiBiCan !== "phap_nhan" && bc[field] === val).length;

  // Gom tất cả điều luật xuất hiện
  const tatCaDieuLuat = new Set(danhMuc.map(d => d.dieuLuat));
  Object.keys(tonTD_truoc).forEach(d => { if (d) tatCaDieuLuat.add(d); });
  if (kyTonTD) Object.keys(kyTonTD).forEach(d => { if (d) tatCaDieuLuat.add(d); });
  for (const gd of THU_TU_GIAI_DOAN) {
    const d = baoCao[gd].ds;
    const allVu = [
      ...(d.khoiToTrucTiep || []), ...(d.tachVu || []), ...(d.chuyenDen || []), ...(d.traVe || []),
      ...(d.tonHienTai || []), ...(d.chuyenDi || []), ...(d.traDi || []), ...(d.nhapVu || []),
      ...Object.values(d.hoanThanh || {}).flat(),
    ];
    for (const vu of allVu) {
      const bcs = biCanByVu[vu.id] || [];
      if (bcs.length === 0) {
        // Vụ 0 BC: thu thập từ vuan.dieuLuat (tên tội danh), normalize sang code nếu có trong catalog
        (vu.dieuLuat || "").split(";").forEach(nm => {
          const k = normTen(nm.trim()); if (k) tatCaDieuLuat.add(k);
        });
      } else {
        for (const bc of bcs) { const dl = getDL(bc); if (dl) tatCaDieuLuat.add(dl); }
      }
    }
  }

  // Cũng normalize các key từ tonTD_truoc — cũ có thể lưu tên thay vì code
  const tatCaDieuLuatChuan = new Set();
  for (const k of tatCaDieuLuat) {
    tatCaDieuLuatChuan.add(danhMucByTen.get(k.toLowerCase()) || k);
  }

  const danhMucMap = Object.fromEntries(danhMuc.map(d => [d.dieuLuat, d]));
  const rows = [];

  for (const D of tatCaDieuLuatChuan) {
    if (!D) continue;
    const dm = danhMucMap[D];
    const thuTu = dm?.thuTuHienThi ?? 10000;

    const dt = baoCao.dieu_tra.ds, tt = baoCao.truy_to.ds, xx = baoCao.xet_xu.ds;
    const dt_moi = [...(dt.khoiToTrucTiep||[]),...(dt.tachVu||[]),...(dt.chuyenDen||[]),...(dt.traVe||[])];
    const tt_moi = [...(tt.khoiToTrucTiep||[]),...(tt.tachVu||[]),...(tt.chuyenDen||[]),...(tt.traVe||[])];
    const xx_moi = [...(xx.khoiToTrucTiep||[]),...(xx.tachVu||[]),...(xx.chuyenDen||[]),...(xx.traVe||[])];

    // ── Tồn kỳ trước / kỳ này ──
    // Tồn kỳ này: dùng snapshot kyTonTD khi đã chốt (đúng thời điểm), fallback live tonHienTai
    const dt_tp_vu = tonTD_truoc[D]?.dieu_tra?.vuAn ?? 0;
    const dt_tp_bc = tonTD_truoc[D]?.dieu_tra?.biCan ?? 0;
    const dt_tn_vu = kyTonTD ? (kyTonTD[D]?.dieu_tra?.vuAn ?? 0) : vuCoD(dt.tonHienTai || [], D).length;
    const dt_tn_bc = kyTonTD ? (kyTonTD[D]?.dieu_tra?.biCan ?? 0) : bcCoD(dt.tonHienTai || [], D).length;
    const tt_tp_vu = tonTD_truoc[D]?.truy_to?.vuAn ?? 0;
    const tt_tp_bc = tonTD_truoc[D]?.truy_to?.biCan ?? 0;
    const tt_tn_vu = kyTonTD ? (kyTonTD[D]?.truy_to?.vuAn ?? 0) : vuCoD(tt.tonHienTai || [], D).length;
    const tt_tn_bc = kyTonTD ? (kyTonTD[D]?.truy_to?.biCan ?? 0) : bcCoD(tt.tonHienTai || [], D).length;
    const xx_tp_vu = tonTD_truoc[D]?.xet_xu?.vuAn ?? 0;
    const xx_tp_bc = tonTD_truoc[D]?.xet_xu?.biCan ?? 0;
    const xx_tn_vu = kyTonTD ? (kyTonTD[D]?.xet_xu?.vuAn ?? 0) : vuCoD(xx.tonHienTai || [], D).length;
    const xx_tn_bc = kyTonTD ? (kyTonTD[D]?.xet_xu?.biCan ?? 0) : bcCoD(xx.tonHienTai || [], D).length;

    // ── Điều tra ──
    const dt_moiBc = bcCoD(dt_moi, D);
    const dt_nhapBc = bcCoD(dt.nhapVu || [], D);
    const dt_cdNoiBc = bcCoD(dt.hoanThanh?.chuyen_di || [], D);
    const dt_ahBc = bcCoD(dt.hoanThanh?.an_huy || [], D);
    const C3  = dt_tp_vu + vuCoD(dt_moi, D).length - vuCoD(dt.nhapVu || [], D).length - vuCoD(dt.hoanThanh?.chuyen_di || [], D).length - vuCoD(dt.hoanThanh?.an_huy || [], D).length;
    const C4  = dt_tp_bc + dt_moiBc.length - dt_nhapBc.length - dt_cdNoiBc.length - dt_ahBc.length;
    const C5  = dt_moiBc.filter(bc => bc.loaiBiCan === "phap_nhan").length;

    // C7-C24: KHÔNG dùng loaiKhoiTo (ban_dau/bo_sung) nữa — bị can đi theo vụ nên "vụ mới" (C6)
    // đã đếm đúng theo kỳ của chính vụ rồi; ở đây chỉ cần đếm ĐÚNG bị can nào thật sự mới khởi tố
    // TRONG KỲ NÀY, dùng thẳng kỳ thống kê của chính sự kiện khoi_to_bican (bcKyKhoiToMap) — vì
    // bị can chỉ phát sinh (thêm mới) ở giai đoạn Điều tra, và hệ thống đã hỏi kỳ ngay lúc thêm.
    // Bị can bổ sung vào kỳ SAU (khi vụ đã cũ) sẽ KHÔNG bị đếm nhầm vào kỳ vụ mới khởi tố nữa.
    const dt_ktBcMoiKy = bcCoD(dt.khoiToTrucTiep || [], D).filter(bc => _kyIdSet.has(bcKyKhoiToMap.get(bc.id)));
    const C6  = vuCoD(dt.khoiToTrucTiep || [], D).length;
    const C7  = dt_ktBcMoiKy.length;
    const C8  = dt_ktBcMoiKy.filter(bc => bc.loaiBiCan === "phap_nhan").length;
    const C9  = demTuoi(dt_ktBcMoiKy, "14_16");
    const C10 = demTuoi(dt_ktBcMoiKy, "16_18");
    const C11 = demTuoi(dt_ktBcMoiKy, "18_30");
    const C12 = demTuoi(dt_ktBcMoiKy, "30_70");
    const C13 = demTuoi(dt_ktBcMoiKy, ">70");
    const C14 = demField(dt_ktBcMoiKy, "trinhDo", "khong_biet_chu");
    const C15 = demField(dt_ktBcMoiKy, "trinhDo", "tieu_hoc");
    const C16 = demField(dt_ktBcMoiKy, "trinhDo", "thcs");
    const C17 = demField(dt_ktBcMoiKy, "trinhDo", "thpt");
    const C18 = demField(dt_ktBcMoiKy, "trinhDo", "dh_tro_len");
    const C19 = demField(dt_ktBcMoiKy, "gioiTinh", "nu");
    const C20 = dt_ktBcMoiKy.filter(bc => bc.loaiBiCan !== "phap_nhan" && bc.danToc !== "Kinh").length;
    const C21 = demField(dt_ktBcMoiKy, "dangVien", "co");
    const C22 = dt_ktBcMoiKy.filter(bc => bc.loaiBiCan !== "phap_nhan" && bc.dangVienGiuChucVu).length;
    const C23 = dt_ktBcMoiKy.filter(bc => bc.loaiBiCan !== "phap_nhan" && bc.quocTich && bc.quocTich !== "Việt Nam").length;
    const C24 = dt_ktBcMoiKy.filter(bc => bc.loaiBiCan !== "phap_nhan" && bc.taiPham && bc.taiPham !== "khong").length;

    const dt_dnttBc = bcCoD(dt.chuyenDi || [], D);
    const C25 = vuCoD(dt.chuyenDi || [], D).length;
    const C26 = dt_dnttBc.length;
    const C27 = dt_dnttBc.filter(bc => bc.loaiBiCan === "phap_nhan").length;

    const dt_dcBc = bcCoD(dt.hoanThanh?.dinh_chi || [], D);
    const C28 = vuCoD(dt.hoanThanh?.dinh_chi || [], D).length;
    const C29 = dt_dcBc.length;
    const C30 = dt_dcBc.filter(bc => bc.loaiBiCan === "phap_nhan").length;
    const C31 = vuCoD(dt.hoanThanh?.tam_dinh_chi || [], D).length;
    const C32 = bcCoD(dt.hoanThanh?.tam_dinh_chi || [], D).length;

    // ── Truy tố ──
    const tt_moiBc = bcCoD(tt_moi, D);
    const tt_nhapBc = bcCoD(tt.nhapVu || [], D);
    const tt_cdNoiBc = bcCoD(tt.hoanThanh?.chuyen_di || [], D);
    const tt_ahBc = bcCoD(tt.hoanThanh?.an_huy || [], D);
    const C33 = tt_tp_vu + vuCoD(tt_moi, D).length - vuCoD(tt.nhapVu || [], D).length - vuCoD(tt.hoanThanh?.chuyen_di || [], D).length - vuCoD(tt.hoanThanh?.an_huy || [], D).length;
    const C34 = tt_tp_bc + tt_moiBc.length - tt_nhapBc.length - tt_cdNoiBc.length - tt_ahBc.length;
    const C35 = tt_moiBc.filter(bc => bc.loaiBiCan === "phap_nhan").length;

    const tt_truToBc = bcCoD(tt.chuyenDi || [], D);
    const tt_truToVu = vuCoD(tt.chuyenDi || [], D);
    const C36 = tt_truToVu.length;
    const C37 = tt_truToBc.length;
    const C38 = tt_truToBc.filter(bc => bc.loaiBiCan === "phap_nhan").length;
    const mdn = (muc) => tt_truToVu.filter(v => (v.mucDoNghiemTrong || "dac_biet_nghiem_trong") === muc).length;
    const C39 = mdn("it_nghiem_trong");
    const C40 = mdn("nghiem_trong");
    const C41 = mdn("rat_nghiem_trong");
    const C42 = mdn("dac_biet_nghiem_trong");
    const C43 = demTuoi(tt_truToBc, "14_16");
    const C44 = demTuoi(tt_truToBc, "16_18");
    const C45 = demTuoi(tt_truToBc, "18_30");
    const C46 = demTuoi(tt_truToBc, "30_70");
    const C47 = demTuoi(tt_truToBc, ">70");
    const C48 = demField(tt_truToBc, "gioiTinh", "nu");
    const C49 = tt_truToBc.filter(bc => bc.loaiBiCan !== "phap_nhan" && bc.danToc !== "Kinh").length;
    const C50 = demField(tt_truToBc, "dangVien", "co");
    const C51 = tt_truToBc.filter(bc => bc.loaiBiCan !== "phap_nhan" && bc.dangVienGiuChucVu).length;
    const C52 = tt_truToBc.filter(bc => bc.loaiBiCan !== "phap_nhan" && bc.quocTich && bc.quocTich !== "Việt Nam").length;

    const tt_dcBc = bcCoD(tt.hoanThanh?.dinh_chi || [], D);
    const C53 = vuCoD(tt.hoanThanh?.dinh_chi || [], D).length;
    const C54 = tt_dcBc.length;
    const C55 = tt_dcBc.filter(bc => bc.loaiBiCan === "phap_nhan").length;
    const C56 = vuCoD(tt.hoanThanh?.tam_dinh_chi || [], D).length;
    const C57 = bcCoD(tt.hoanThanh?.tam_dinh_chi || [], D).length;

    const tt_traDiBc = bcCoD(tt.traDi || [], D);
    const C58 = vuCoD(tt.traDi || [], D).length;
    const C59 = tt_traDiBc.length;

    // ── Xét xử ──
    const xx_moiBc = bcCoD(xx_moi, D);
    const xx_nhapBc = bcCoD(xx.nhapVu || [], D);
    const xx_cdNoiBc = bcCoD(xx.hoanThanh?.chuyen_di || [], D);
    const xx_ahBc = bcCoD(xx.hoanThanh?.an_huy || [], D);
    const C60 = xx_tp_vu + vuCoD(xx_moi, D).length - vuCoD(xx.nhapVu || [], D).length - vuCoD(xx.hoanThanh?.chuyen_di || [], D).length - vuCoD(xx.hoanThanh?.an_huy || [], D).length;
    const C61 = xx_tp_bc + xx_moiBc.length - xx_nhapBc.length - xx_cdNoiBc.length - xx_ahBc.length;
    const C62 = xx_moiBc.filter(bc => bc.loaiBiCan === "phap_nhan").length;

    const xx_xxBc = bcCoD(xx.hoanThanh?.da_xet_xu || [], D);
    const C63 = vuCoD(xx.hoanThanh?.da_xet_xu || [], D).length;
    const C64 = xx_xxBc.length;
    const C65 = xx_xxBc.filter(bc => bc.loaiBiCan === "phap_nhan").length;

    const xx_dcBc = bcCoD(xx.hoanThanh?.dinh_chi || [], D);
    const C66 = vuCoD(xx.hoanThanh?.dinh_chi || [], D).length;
    const C67 = xx_dcBc.length;
    const C68 = xx_dcBc.filter(bc => bc.loaiBiCan === "phap_nhan").length;
    const C69 = vuCoD(xx.hoanThanh?.tam_dinh_chi || [], D).length;
    const C70 = bcCoD(xx.hoanThanh?.tam_dinh_chi || [], D).length;

    const xx_traDiBc = bcCoD(xx.traDi || [], D);
    const C71 = vuCoD(xx.traDi || [], D).length;
    const C72 = xx_traDiBc.length;

    // vals[]: [ĐT 4 phụ + 30 B10], [TT 4 phụ + 27 B10], [XX 4 phụ + 13 B10] + [án huỷ 6] = 88 giá trị
    // Vị trí tonNay_vu: ĐT=2, TT=36, XX=70 (tham chiếu nội bộ, không dịch chuyển khi thêm cuối)
    const dt_ah_vu = vuCoD(dt.hoanThanh?.an_huy || [], D).length;
    const tt_ah_vu = vuCoD(tt.hoanThanh?.an_huy || [], D).length;
    const xx_ah_vu = vuCoD(xx.hoanThanh?.an_huy || [], D).length;
    const vals = [
      dt_tp_vu, dt_tp_bc, dt_tn_vu, dt_tn_bc,
      C3, C4, C5, C6, C7, C8,
      C9,C10,C11,C12,C13, C14,C15,C16,C17,C18,
      C19,C20,C21,C22,C23,C24, C25,C26,C27, C28,C29,C30, C31,C32,
      tt_tp_vu, tt_tp_bc, tt_tn_vu, tt_tn_bc,
      C33,C34,C35, C36,C37,C38, C39,C40,C41,C42,
      C43,C44,C45,C46,C47, C48,C49,C50,C51,C52, C53,C54,C55, C56,C57, C58,C59,
      xx_tp_vu, xx_tp_bc, xx_tn_vu, xx_tn_bc,
      C60,C61,C62, C63,C64,C65, C66,C67,C68, C69,C70, C71,C72,
      // Án huỷ (vals 82-87) — thêm cuối để không dịch index cũ
      dt_ah_vu, dt_ahBc.length, tt_ah_vu, tt_ahBc.length, xx_ah_vu, xx_ahBc.length,
    ];

    if (vals.every(v => !v)) continue;
    rows.push({ D, tenToiDanh: dm?.tenToiDanh || D, thuTu, vals });
  }

  rows.sort((a, b) => a.thuTu - b.thuTu);

  // ── Chẩn đoán: tìm vụ trong tồn hiện tại không xác định được điều luật ──
  // Đây là nguyên nhân gây lệch ÂM (B10 < thực tế). Lệch DƯƠNG là đúng thiết kế: 1 vụ nhiều tội
  // danh → 1 vụ đếm vào nhiều dòng điều luật khác nhau → tổng B10 > số vụ thực (không phải lỗi).
  const vuChuaDL = {};
  for (const gd of THU_TU_GIAI_DOAN) {
    const vuList = baoCao[gd].ds?.tonHienTai || [];
    vuChuaDL[gd] = vuList.filter(vu => {
      const bcs = biCanByVu[vu.id] || [];
      if (bcs.length === 0) return !normTen((vu.dieuLuat || "").trim());
      return bcs.every(bc => !getDL(bc));
    });
  }

  // Cảnh báo: chỉ khi có vụ thực sự thiếu điều luật (lệch âm). Không cảnh báo lệch dương.
  const IDX_TON_NAY_VU = { dieu_tra: 2, truy_to: 36, xet_xu: 70 };
  const canhBao = [];
  for (const gd of THU_TU_GIAI_DOAN) {
    const idx = IDX_TON_NAY_VU[gd];
    const tongTheoTD = rows.reduce((s, r) => s + (r.vals[idx] || 0), 0);
    const tonThucTe = kyTonTD
      ? (ky.tonCuoiKy?.[gd] ?? baoCao[gd].soVuTon ?? 0)
      : (baoCao[gd].soVuTon ?? baoCao[gd].tonCuoiKy ?? 0);
    const soChuaDL = vuChuaDL[gd].length;
    if (soChuaDL > 0) {
      const dsMa = vuChuaDL[gd]
        .map(v => `${hienThiMa(v)} — ${v.tenVu || "(chưa đặt tên)"}`)
        .join(" | ");
      canhBao.push(`${NHAN_GIAI_DOAN[gd]}: ${soChuaDL} vụ chưa xác định được điều luật → không đếm vào B10 (tổng B10=${tongTheoTD}, thực tế=${tonThucTe}): ${dsMa}`);
    } else if (tongTheoTD < tonThucTe) {
      // Lệch âm nhưng không tìm được vụ cụ thể nào — dữ liệu bất thường
      canhBao.push(`${NHAN_GIAI_DOAN[gd]}: B10 tổng tồn=${tongTheoTD} < thực tế=${tonThucTe} — kiểm tra lại dữ liệu`);
    }
    // Lệch dương (tongTheoTD > tonThucTe): đúng thiết kế, không cảnh báo
  }

  return { rows, canhBao, vuChuaDL };
}

// Tính lại ĐÚNG tonCuoiKyTheoTD/tonCuoiBiCan cho TẤT CẢ kỳ đã chốt, theo thứ tự thời gian, từ
// log — dùng để SỬA DỮ LIỆU đã bị ghi sai bởi bug cũ của tinhLaiBaoCaoLuu (từng ghi đè
// tonCuoiKyTheoTD bằng ảnh chụp LIVE hiện tại thay vì lịch sử — đã sửa code, nhưng dữ liệu ghi
// sai từ trước không tự phục hồi, xem ghi chú ở tinhLaiBaoCaoLuu). KHÔNG dùng lại kiểu "chụp ảnh
// live" nữa — nguyên lý đúng: tonCuoiKyTheoTD[K] = tonCuoiKyTheoTD[K-1] (đã tính đúng ở bước
// trước, kỳ đầu tiên coi như 0) + số mới theo tội danh trong kỳ K − số đã giải quyết theo tội
// danh trong kỳ K. Cả 2 vế lấy từ tinhBaoCaoKyTuLog(K, ...).ds — hàm đó lọc đúng theo
// kyThongKe==K.id, không đụng gì tới tonCuoiKyTheoTD nên tái dùng an toàn, không lặp lại lỗi cũ.
// Đối chiếu tổng theo giai đoạn với tonCuoiKy (field KHÔNG BAO GIỜ bị ghi đè, dùng làm neo tin
// cậy tuyệt đối) sau mỗi kỳ — lệch (do vụ có kyThongKe=null từ "Dựng lại lịch sử", hoặc dữ liệu
// cũ khác) thì gom phần chênh vào tội danh "(chưa xác định — chênh lệch dữ liệu cũ)" để TỔNG luôn
// khớp con số tin cậy, thay vì âm thầm sai lệch không dấu vết.
async function taiTaoTonCuoiKyTheoTDTatCa(onTienDo) {
  const snap = await db.collection("kybaocao").orderBy("ngayBatDau", "asc").get();
  const dsKyChot = snap.docs.map(d => ({ id: d.id, ...d.data() }))
    .filter(k => k.loai !== "luu_tru" && k.trangThai === "da_chot");

  const danhMucSnap = await db.collection("danhMucToiDanh").get();
  const danhMuc = danhMucSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  const danhMucByTen = new Map(danhMuc.map(d => [d.tenToiDanh.toLowerCase(), d.dieuLuat]));
  const normDL = (dl) => (dl || "").replace(/\bBLHS\s+2015\b/g, "BLHS 2025");
  const getDL = (bc) => normDL(
    bc.dieuLuatBC?.[0] || danhMucByTen.get((bc.toiDanh?.[0] || "").toLowerCase()) || bc.toiDanh?.[0] || ""
  );
  const normTen = (nm) => normDL(danhMucByTen.get(nm.toLowerCase()) || nm);
  const KEY_CHUA_XD = "(chưa xác định — chênh lệch dữ liệu cũ)";

  const themVao = (map, D, gd, vuId, soBiCan) => {
    if (!map[D]) map[D] = {};
    if (!map[D][gd]) map[D][gd] = { vuSet: new Set(), biCan: 0 };
    map[D][gd].vuSet.add(vuId);
    map[D][gd].biCan += soBiCan;
  };
  // Gom 1 danh sách vụ (mới hoặc giải quyết trong kỳ) vào map theo tội danh CHÍNH:
  // - Vụ 0 BC: dùng dieuLuat[0] (tội danh chính của vụ)
  // - Vụ có BC: vụ đếm vào tội danh của BC ban_dau (hoặc BC đầu tiên), mỗi BC đếm biCan riêng
  // Mỗi vụ chỉ xuất hiện 1 lần trong map → tổng khớp đúng với số vụ trong danh sách
  const gomTheoTD = (map, dsVu, gd, biCanByVu) => {
    for (const vu of dsVu) {
      const bcs = biCanByVu[vu.id] || [];
      if (bcs.length === 0) {
        // Vụ 0 BC: chỉ dùng dieuLuat[0] (tội danh chính)
        const tenChinh = (vu.dieuLuat || "").split(";")[0].trim();
        themVao(map, normTen(tenChinh) || KEY_CHUA_XD, gd, vu.id, 0);
      } else {
        // Vụ: chỉ đếm vào tội danh CHÍNH (BC ban_dau hoặc BC đầu tiên)
        const bcChinh = bcs.find(bc => bc.loaiKhoiTo === "ban_dau") || bcs[0];
        const dChinh = getDL(bcChinh) || KEY_CHUA_XD;
        themVao(map, dChinh, gd, vu.id, 0); // vuSet.add vu.id, biCan += 0
        // BC: mỗi BC đếm biCan dưới tội danh của chính nó
        for (const bc of bcs) {
          const D = getDL(bc) || KEY_CHUA_XD;
          if (!map[D]) map[D] = {};
          if (!map[D][gd]) map[D][gd] = { vuSet: new Set(), biCan: 0 };
          map[D][gd].biCan += 1;
        }
      }
    }
  };
  const layDem = (map, D, gd) => {
    const o = map[D]?.[gd];
    return o ? { vuAn: o.vuSet.size, biCan: o.biCan } : { vuAn: 0, biCan: 0 };
  };

  let tonTruoc = {}; // { [D]: { [gd]: { vuAn, biCan } } } — đã tính đúng của kỳ liền trước
  const ketQua = [];

  for (let i = 0; i < dsKyChot.length; i++) {
    const ky = dsKyChot[i];
    const baoCao = await tinhBaoCaoKyTuLog(ky, dsKyChot[i - 1] || null);
    const vuIds = collectVuIdsFromBaoCao(baoCao);
    const biCanByVu = await fetchBiCanTheoVuIds(vuIds);

    const tonMoiMap = {}, tonRaMap = {};
    for (const gd of THU_TU_GIAI_DOAN) {
      const d = baoCao[gd].ds;
      const moiList = [...(d.khoiToTrucTiep||[]), ...(d.tachVu||[]), ...(d.chuyenDen||[]), ...(d.traVe||[])];
      const raList = [
        ...(d.chuyenDi||[]), ...(d.traDi||[]), ...(d.nhapVu||[]),
        ...HOAN_THANH_TRUONG_TONG.flatMap(ht => d.hoanThanh?.[ht] || []),
      ];
      gomTheoTD(tonMoiMap, moiList, gd, biCanByVu);
      gomTheoTD(tonRaMap, raList, gd, biCanByVu);
    }

    const tonMoiNay = {};
    const canhBaoKy = [];
    const tatCaD = new Set([...Object.keys(tonTruoc), ...Object.keys(tonMoiMap), ...Object.keys(tonRaMap)]);
    for (const D of tatCaD) {
      const hang = {};
      for (const gd of THU_TU_GIAI_DOAN) {
        const truoc = tonTruoc[D]?.[gd] || { vuAn: 0, biCan: 0 };
        const moi = layDem(tonMoiMap, D, gd);
        const ra = layDem(tonRaMap, D, gd);
        let vuAn = truoc.vuAn + moi.vuAn - ra.vuAn;
        let biCan = truoc.biCan + moi.biCan - ra.biCan;
        if (vuAn < 0 || biCan < 0) {
          canhBaoKy.push(`"${D}" (${NHAN_GIAI_DOAN[gd]}) tính ra âm (vụ=${vuAn}, BC=${biCan}) — đã chặn về 0, kiểm tra lại dữ liệu cũ nếu cần.`);
          vuAn = Math.max(0, vuAn); biCan = Math.max(0, biCan);
        }
        if (vuAn > 0 || biCan > 0) hang[gd] = { vuAn, biCan };
      }
      if (Object.keys(hang).length > 0) tonMoiNay[D] = hang;
    }

    // Đối chiếu với tonCuoiKy (neo tin cậy, chưa từng bị ghi sai) — lệch thì gom vào tội danh
    // "(chưa xác định)" cho từng giai đoạn để tổng luôn khớp con số tin cậy này.
    for (const gd of THU_TU_GIAI_DOAN) {
      const tongTheoTD = Object.values(tonMoiNay).reduce((s, hang) => s + (hang[gd]?.vuAn || 0), 0);
      const thatSu = ky.tonCuoiKy?.[gd] ?? 0;
      const lech = thatSu - tongTheoTD;
      if (lech !== 0) {
        if (!tonMoiNay[KEY_CHUA_XD]) tonMoiNay[KEY_CHUA_XD] = {};
        const hienCo = tonMoiNay[KEY_CHUA_XD][gd] || { vuAn: 0, biCan: 0 };
        tonMoiNay[KEY_CHUA_XD][gd] = { vuAn: Math.max(0, hienCo.vuAn + lech), biCan: hienCo.biCan };
        canhBaoKy.push(`${NHAN_GIAI_DOAN[gd]}: lệch ${lech} vụ so với tonCuoiKy đã chốt (đáng tin) — đã gộp vào "${KEY_CHUA_XD}".`);
      }
    }

    const tonCuoiBiCanMoi = {};
    THU_TU_GIAI_DOAN.forEach(gd => {
      tonCuoiBiCanMoi[gd] = Object.values(tonMoiNay).reduce((s, hang) => s + (hang[gd]?.biCan || 0), 0);
    });

    await db.collection("kybaocao").doc(ky.id).update({
      tonCuoiKyTheoTD: tonMoiNay, tonCuoiBiCan: tonCuoiBiCanMoi,
    });
    ketQua.push({ ky: ky.tenKy, canhBao: canhBaoKy });
    tonTruoc = tonMoiNay;
    onTienDo?.(i + 1, dsKyChot.length, ky.tenKy);
  }
  return { tongSoKy: dsKyChot.length, ketQua };
}

const B10_HEADER_CHI_TIET = [
  "Điều luật","Tội danh",
  "Vụ","BC","Vụ","BC",
  "Vụ (C3)","BC (C4)","PN (C5)",
  "Vụ (C6)","BC-BĐ (C7)","PN (C8)",
  "14-16 (C9)","16-18 (C10)","18-30 (C11)","30-70 (C12)",">70 (C13)",
  "Khg biết chữ","Tiểu học","THCS","THPT","ĐH+ (C14-18)",
  "Nữ (C19)","DTTS (C20)","ĐV (C21)","ĐV-CQ (C22)","NN (C23)","Tái phạm (C24)",
  "Vụ (C25)","BC (C26)","PN (C27)",
  "Vụ (C28)","BC (C29)","PN (C30)",
  "Vụ (C31)","BC (C32)",

  "Ít NT (C39)","NT (C40)","Rất NT (C41)","ĐB NT (C42)",

  "Vụ (C60)","BC (C61)","PN (C62)",

  "Vụ (C66)","BC (C67)","PN (C68)",
  "Vụ (C69)","BC (C70)",
